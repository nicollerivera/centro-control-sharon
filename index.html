/* ============================================================
   TURNOS Y CHOQUES
   La funcion central del proyecto (D25): Bitacora te avisa y te muestra
   que tendrias que mover, pero nunca te lo impide (D16).
============================================================ */

/* Que tan de verdad te bloquea un bloque. No todo lo que esta en tu dia te
   impide trabajar: la U la puedes ver grabada y a Joel lo recogen si no estas. */
const FLEX = {
  firme:    { label:'No se mueve',        corto:'firme',    nota:'Esto sí te bloquea.' },
  saltable: { label:'La puedo ver después', corto:'saltable', nota:'Se puede ver grabado o recuperar.' },
  cubrible: { label:'Alguien lo cubre',   corto:'cubrible', nota:'Si no estás, alguien más lo hace.' }
};
function flexDe(b){ return (b && FLEX[b.flex]) ? b.flex : 'firme'; }

/* Los tres lugares, con sus reglas distintas (D23). */
const LUGARES = {
  infinity:{ nombre:'Infinity',       ini:'I', sub:'Horario variable · paga lunes',   entra:'', sale:'',      traslado:60 },
  asignar:{  nombre:'Asignar',        ini:'A', sub:'8 h · hotel variable · por corte', entra:'', sale:'',     traslado:90 },
  movistar:{ nombre:'Movistar Arena', ini:'M', sub:'15:00 — 00:00 · horario parejo',   entra:'15:00', sale:'00:00', traslado:120 }
};

/* Los cuatro cortes de nomina de Asignar, de la cartelera que mando Sharon.
   Con el hotel del turno, Bitacora ya sabe que dia le pagan. */
const CORTES_ASIGNAR = [
  { grupo:'01', cortes:[{desde:26, hasta:10, pago:15}, {desde:11, hasta:25, pago:30}],
    hoteles:['Corferias','Estelares','Colsubsidio','JW Marriot','Dann 93'] },
  { grupo:'02', cortes:[{desde:1, hasta:15, pago:20}, {desde:16, hasta:30, pago:5}],
    hoteles:['Grupo GHL','Habitel','Movich','Dann 19','Dann 103'] },
  { grupo:'03', cortes:[{desde:1, hasta:15, pago:15}, {desde:16, hasta:30, pago:30}],
    hoteles:['Metrotel','Grupo NH','Temporales'] },
  { grupo:'04', cortes:[{desde:23, hasta:10, pago:15}, {desde:11, hasta:22, pago:30}],
    hoteles:['Hyatt','W Marriot'] }
];
const HOTELES_ASIGNAR = CORTES_ASIGNAR.flatMap(g=>g.hoteles).sort((a,b)=>a.localeCompare(b,'es'));

function grupoDeHotel(hotel){ return CORTES_ASIGNAR.find(g=>g.hoteles.includes(hotel)) || null; }

function ultimoDiaDelMes(anio,mes){ return new Date(anio, mes+1, 0).getDate(); }

/* De la fecha del turno y el hotel sale el dia de pago. Los cortes que
   arrancan a fin de mes (26 al 10, 23 al 10) se pagan el mes siguiente. */
function pagoDeTurno(fechaStr, hotel){
  const g = grupoDeHotel(hotel); if(!g) return null;
  const d = parseDate(fechaStr), dia = d.getDate();
  for(const c of g.cortes){
    const cruzaMes = c.desde > c.hasta;
    const dentro = cruzaMes ? (dia>=c.desde || dia<=c.hasta) : (dia>=c.desde && dia<=c.hasta);
    if(!dentro) continue;
    let anio=d.getFullYear(), mes=d.getMonth();
    // si el corte cruza el mes y estamos en la punta de arriba, el pago cae el mes que viene
    if(cruzaMes && dia>=c.desde) mes++;
    // el corte 16 al 30 del grupo 02 se paga el 05 del mes siguiente
    else if(!cruzaMes && c.pago < c.desde) mes++;
    const f = new Date(anio, mes, Math.min(c.pago, ultimoDiaDelMes(anio,mes)));
    return { fecha: fmtDate(f), corte: c.desde+' al '+c.hasta, grupo: g.grupo };
  }
  return null;
}

function minutosDe(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60 + (m||0);
}
/* Un turno que sale a medianoche termina despues de entrar, no antes. */
function finEnMinutos(entra, sale){
  const a = minutosDe(entra), b = minutosDe(sale);
  if(a===null || b===null) return null;
  return b <= a ? b + 1440 : b;
}

/* Todo lo que ya ocupa ese dia: eventos con hora, rutinas del dia y otros turnos. */
function bloquesDelDia(fecha, exceptoTurnoId){
  const d = parseDate(fecha), dow = d.getDay();
  const out = [];
  DATA.events.forEach(e=>{
    if(e.date!==fecha || !e.start || e.status==='hecho') return;
    if(e.linkedType==='turno' && e.linkedId===exceptoTurnoId) return;
    if(e.cat==='nexxa' && e.noVoy) return;        // si no vas, no te ocupa el tiempo (D129)
    out.push({ titulo:e.title, desde:minutosDe(e.start), hasta: e.end ? finEnMinutos(e.start, e.end) : minutosDe(e.start), fuente:'evento', flex:flexDe(e), ref:e });
  });
  (DATA.routines||[]).forEach(r=>{
    if(!r.days || !r.days.includes(dow) || !r.start) return;
    out.push({ titulo:r.title, desde:minutosDe(r.start), hasta:finEnMinutos(r.start, r.end||r.start), fuente:'rutina', flex:flexDe(r), ref:r });
  });
  return out.filter(b=>b.desde!==null && b.hasta!==null);
}

/* El corazon: choque directo, o choque porque el traslado no te da (D70, D95). */
function detectarChoques(turno){
  const desde = minutosDe(turno.entra), hasta = finEnMinutos(turno.entra, turno.sale);
  if(desde===null || hasta===null) return [];
  const traslado = Number(turno.trasladoMin || LUGARES[turno.lugar]?.traslado || 0);
  const choques = [];
  bloquesDelDia(turno.fecha, turno.id).forEach(b=>{
    const grado = flexDe(b) === 'firme' ? 'duro' : 'blando';
    if(b.desde < hasta && desde < b.hasta){
      choques.push({ tipo:'directo', grado, bloque:b });
    } else if(b.hasta <= desde && desde - b.hasta < traslado){
      choques.push({ tipo:'traslado', grado, bloque:b, faltan: traslado - (desde - b.hasta) });
    } else if(hasta <= b.desde && b.desde - hasta < traslado){
      choques.push({ tipo:'traslado-despues', grado, bloque:b, faltan: traslado - (b.desde - hasta) });
    }
  });
  return choques;
}
function choquesDuros(t){ return detectarChoques(t).filter(c=>c.grado==='duro'); }

function hhmm(min){
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function duracionLarga(min){
  const h = Math.floor(min/60), m = min%60;
  return h ? (h + ' h' + (m ? ' ' + m : '')) : (m + ' min');
}
/* "1 h libre" y no "1 h libres". */
function libres(min){
  return duracionLarga(min) + (min === 60 ? ' libre' : ' libres');
}

  removeLinkedEvent('turno', t.id);
  const ev = addLinkedEvent('trabajo', turnoTitulo(t), t.fecha, t.entra, t.sale, 'turno', t.id);
  if(ev){ ev.tentativo = !t.confirmado; ev.amount = t.estimado || 0; ev.type = 'ingreso'; }
  saveData(); renderAll();
}
function borrarTurno(id){
  DATA.turnos = DATA.turnos.filter(t=>t.id!==id);
  removeLinkedEvent('turno', id);
  saveData(); renderAll();
}

/* La pantalla de choque. Muestra que se cruza y que tendria que mover,
   y deja aceptarlo igual: Bitacora no decide por ella (D16). */
function mostrarChoque(t, choques){
  const l = LUGARES[t.lugar];
  const traslado = Number(t.trasladoMin || l.traslado || 0);
  const desde = minutosDe(t.entra), hasta = finEnMinutos(t.entra, t.sale);
  const duros = choques.filter(c=>c.grado==='duro');
  const blandos = choques.filter(c=>c.grado!=='duro');

  const frase = c => {
    if(c.tipo==='directo') return `Se cruza con <b>${esc(c.bloque.titulo)}</b>, de ${hhmm(c.bloque.desde)} a ${hhmm(c.bloque.hasta)}.`;
    if(c.tipo==='traslado') return `Con ${duracionLarga(traslado)} de traslado no alcanzas: <b>${esc(c.bloque.titulo)}</b> termina ${hhmm(c.bloque.hasta)} y te faltan ${duracionLarga(c.faltan)}.`;
    return `Al salir no alcanzas a llegar a <b>${esc(c.bloque.titulo)}</b>, que empieza ${hhmm(c.bloque.desde)}: te faltan ${duracionLarga(c.faltan)}.`;
  };

  const opciones = duros.map(c=>({
    que: 'Soltar ' + c.bloque.titulo,
    por: hhmm(c.bloque.desde) + '–' + hhmm(c.bloque.hasta) + (c.bloque.fuente==='rutina' ? ' · se repite cada semana' : '')
  }));
  const masTarde = Math.max(...duros.map(c=> c.bloque.hasta + traslado));
  if(isFinite(masTarde) && masTarde > desde && masTarde < hasta){
    const dia = masTarde >= 1440 ? ' del día siguiente' : '';
    opciones.push({ que:'Pedir entrar más tarde', por: l.nombre + ' · llegarías ' + hhmm(masTarde) + dia });
  }

  openSheet(`
    <h3>${esc(turnoTitulo(t))}</h3>
    <div class="helptext" style="margin:-4px 0 12px;">${niceDate(t.fecha)} · ${t.entra} — ${t.sale}${t.confirmado?'':' <span class="tentativo">sin confirmar</span>'}</div>
    <div class="choque-head">⚠ Se cruza con ${duros.length===1?'una cosa':duros.length+' cosas'}</div>
    <div class="choque-box">${duros.map(c=>`<p>${frase(c)}</p>`).join('')}</div>
    ${blandos.length ? `
      <div class="choque-head suave" style="margin-top:16px;">Además, pero se acomoda</div>
      <div class="choque-box suave">${blandos.map(c=>`<p>${frase(c)} <span class="porque-suave">${esc(FLEX[flexDe(c.bloque)].nota)}</span></p>`).join('')}</div>` : ''}
    <div class="section-title" style="margin-top:20px;">Qué tendrías que mover o soltar</div>
    ${opciones.map(o=>`<div class="opcion"><div class="qué">${esc(o.que)}</div><div class="porqué">${esc(o.por)}</div></div>`).join('')}
    <p class="nota-suave">Bitácora no decide por ti. Puedes aceptarlo igual.</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="ch_volver">Volver</button>
      <button class="btn btn-primary" id="ch_igual">Aceptar igual</button>
    </div>
  `);
  document.getElementById('ch_volver').onclick = ()=> pintarTurnoModal();
  document.getElementById('ch_igual').onclick = ()=>{ guardarTurno(t); closeSheet(); };
}

/* Los turnos que vienen. */
function renderTurnos(){
  const caja = document.getElementById('turnosBody');
  if(!caja) return;
  const hoy = todayStr();
  const proximos = DATA.turnos.filter(t=>t.fecha>=hoy).sort((a,b)=> a.fecha===b.fecha ? (a.entra||'').localeCompare(b.entra||'') : a.fecha.localeCompare(b.fecha));
  if(!proximos.length){
    caja.innerHTML = '<div class="empty-card">Sin turnos cargados. Tócale a + Turno apenas te avisen.</div>';
    return;
  }
  caja.innerHTML = proximos.map(t=>{
    const pago = (t.lugar==='asignar' && t.hotel) ? pagoDeTurno(t.fecha, t.hotel) : null;
    const todos = detectarChoques(t);
    const duros = todos.filter(c=>c.grado==='duro').length;
    const blandos = todos.length - duros;
    const meta = [niceDate(t.fecha), t.entra + '–' + t.sale];
    if(pago) meta.push('te pagan el ' + niceDateShort(pago.fecha));

      <div style="font-weight:600;">${esc(turnoTitulo(t))}${t.confirmado?'':'<span class="tentativo">sin confirmar</span>'}</div>
      <div class="helptext" style="margin:3px 0 0;">${esc(meta.join(' · '))}</div>
      ${duros ? `<div class="helptext" style="margin:5px 0 0; color:var(--urgent); font-weight:600;">⚠ se cruza con ${duros===1?'algo':duros+' cosas'} de ese día</div>` : ''}
      ${blandos ? `<div class="helptext" style="margin:5px 0 0; color:var(--ambar); font-weight:600;">se cruza con ${blandos===1?'algo':blandos+' cosas'} que se acomodan</div>` : ''}
    </div>`;
  }).join('');
  caja.querySelectorAll('.turno-card').forEach(c=>{
    c.onclick = ()=> openTurnoModal(DATA.turnos.find(t=>t.id===c.dataset.turno));
  });
}

/* ============================================================
   AVISOS
   Son cuatro, y se explican en la pantalla para que sepa exactamente
   que va a recibir antes de decir que si (D45, D46, D49, D07).
============================================================ */
const PUSH_URL = '/api/push';

function soportaAvisos(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function b64aBytes(base64){
  const relleno = '='.repeat((4 - base64.length % 4) % 4);
  const limpio = (base64 + relleno).replace(/-/g, '+').replace(/_/g, '/');
  const crudo = atob(limpio);
  return Uint8Array.from([...crudo].map(c => c.charCodeAt(0)));
}
async function pushRequest(method, body){
  const headers = { 'Content-Type':'application/json' };
  const pass = lsGet(PASS_KEY);
  if(pass) headers['x-app-password'] = pass;
  const res = await fetch(PUSH_URL, { method, headers, cache:'no-store', body: body ? JSON.stringify(body) : undefined });
  if(!res.ok){
    let detalle=''; try{ detalle = (await res.json()).error || ''; }catch(e){}
    throw new Error(detalle || ('HTTP '+res.status));
  }
  return res.json();
}
async function suscripcionActual(){
  if(!soportaAvisos()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? await reg.pushManager.getSubscription() : null;
}

async function renderAvisos(){
  const caja = document.getElementById('avisosBox');
  if(!caja) return;

  const explicacion = `
    <div class="helptext" style="margin:0 0 10px;">Estos son todos los que existen. Los tres primeros llegan el día antes:</div>
    <ol class="lista-avisos">
      <li>Una entrega de la universidad que se acerca</li>
      <li>Un pago o una cuota por vencer</li>
      <li>Un hueco libre con un pendiente que cabe</li>
      <li>Una clase, justo antes de empezar, y los exámenes del día</li>
    </ol>
    <div class="helptext">Nunca de recoger a Joel ni de entrar o salir de un turno. Nada entre las 11 de la noche y las 6 de la mañana, ni en noches de turno. Máximo 8 en un día.</div>`;

  if(!soportaAvisos()){
    caja.innerHTML = `<div class="card">${explicacion}
      <div class="helptext" style="color:var(--ambar); font-weight:600; margin-top:10px;">Este navegador no los soporta. En el celular, instala Bitácora desde el menú de Chrome y ábrela desde el ícono.</div></div>`;
    return;
  }

  const permiso = Notification.permission;
  const sub = await suscripcionActual();
  let estado, accion;

  if(permiso === 'denied'){
    estado = `<div class="helptext" style="color:var(--urgent); font-weight:600;">Los bloqueaste. Para volver a activarlos toca el candado de la barra de direcciones y permite las notificaciones.</div>`;
    accion = '';
  } else if(sub){
    estado = `<div class="helptext" style="color:var(--done); font-weight:600;">✓ Activados en este dispositivo.</div>`;
    accion = `<button class="small-btn" id="avisosProbar">Mandarme uno de prueba</button>
              <button class="small-btn" id="avisosQuitar" style="color:var(--urgent);">Desactivar</button>`;
  } else {
    estado = `<div class="helptext">Apagados. No te llega nada.</div>`;
    accion = `<button class="btn btn-primary" style="margin-top:4px;" id="avisosPrender">Activar los avisos</button>`;
  }

  caja.innerHTML = `<div class="card">${explicacion}<div style="margin-top:12px;">${estado}</div>
    <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">${accion}</div></div>`;

  const prender = document.getElementById('avisosPrender');
  if(prender) prender.onclick = activarAvisos;
  const quitar = document.getElementById('avisosQuitar');
  if(quitar) quitar.onclick = desactivarAvisos;
  const probar = document.getElementById('avisosProbar');
  if(probar) probar.onclick = async ()=>{
    const reg = await navigator.serviceWorker.getRegistration();
    reg.showNotification('Bitácora', {
      body: 'Así se van a ver. Este es el único que te mando yo.',
      icon: '/icons/icono-192.png', badge: '/icons/icono-192.png', tag: 'bitacora-prueba'
    });
  };
}

async function activarAvisos(){
  const btn = document.getElementById('avisosPrender');
  if(btn){ btn.disabled = true; btn.textContent = 'Un momento…'; }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){ renderAvisos(); return; }

    const { publicKey } = await pushRequest('GET');
    if(!publicKey) throw new Error('Al proyecto le faltan las llaves VAPID en Vercel.');

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64aBytes(publicKey)
    });
    await pushRequest('POST', { subscription: sub.toJSON() });
    renderAvisos();
  }catch(err){
    alert('No se pudieron activar: ' + err.message);
    renderAvisos();
  }
}

async function desactivarAvisos(){
  try{
    const sub = await suscripcionActual();
    if(sub){
      await pushRequest('POST', { subscription: sub.toJSON(), quitar: true }).catch(()=>{});
      await sub.unsubscribe();
    }
  }catch(err){ /* si falla el servidor, igual se quita del navegador */ }
  renderAvisos();
}

/* Al tocar un aviso, la app abre donde toca. */
function engancharAvisos(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', (ev)=>{
      if(ev.data?.tipo === 'ir' && views.includes(ev.data.a)) showView(ev.data.a);
    });
  }
  try{
    const ir = new URLSearchParams(location.search).get('ir');
    if(ir && views.includes(ir)){
      showView(ir);
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
}

/* ============================================================
   PLATA
   Orden de la pantalla, tal cual lo pediste (D112): cuanto tienes ahora,
   cuanto vas a recibir y cuando, y como vas contra el presupuesto.
============================================================ */

/* Las ocho que elegiste, mas Otros para que ningun gasto te deje atascada (D98). */
const CATEGORIAS_GASTO = ['Transporte','Comida fuera','Casa y servicios','Salud','Ropa y cuidado personal','Salidas y ocio','Datos y celular','Herramientas y cursos','Otros'];

function tasaUSD(){ return Number(DATA.plata.tasaUSD) || null; }

/* La plata no esta toda en el mismo lado: hay efectivo en la mano y hay plata
   en Nequi y en Daviplata. Cada lugar tiene su propio numero, lo declara ella
   igual que antes (D99) y arriba se ve la suma. */
const BOLSILLOS_BASE = ['Efectivo','Nequi','Daviplata','Tarjeta'];
function bolsillos(){
  const P = DATA.plata;
  if(!Array.isArray(P.bolsillos) || !P.bolsillos.length){
    P.bolsillos = BOLSILLOS_BASE.map(nombre=>({ id:uid(), nombre, saldo:null, fecha:'' }));
    /* el saldo unico que tenia antes no se pierde: arranca como efectivo y ella lo corrige */
    if(P.saldo!==null && P.saldo!==''){ P.bolsillos[0].saldo = Number(P.saldo); P.bolsillos[0].fecha = P.saldoFecha || todayStr(); }
  }
  return P.bolsillos;
}
function bolsillosPuestos(){ return bolsillos().filter(b=>b.saldo!==null && b.saldo!==''); }
/* la suma de lo que declaro. null si no ha puesto ninguno todavia */
function saldoTotal(){
  const puestos = bolsillosPuestos();
  return puestos.length ? puestos.reduce((a,b)=>a+Number(b.saldo), 0) : null;
}
/* la fecha del numero mas viejo: es la que manda para el "hace X dias" (D122) */
function saldoFecha(){
  const fechas = bolsillosPuestos().map(b=>b.fecha).filter(Boolean).sort();
  return fechas[0] || '';
}
/* un paso de plata si mueve los numeros: no es adivinar nada, ella dijo de
   donde a donde. Un lugar sin numero puesto se queda sin numero. */
function moverEntreBolsillos(de, a, monto){
  const tocar = (nombre, signo)=>{
    const b = bolsillos().find(x=>x.nombre===nombre);
    if(!b || b.saldo===null || b.saldo==='') return;
    b.saldo = Number(b.saldo) + signo*Number(monto);
    b.fecha = todayStr();
  };
  if(de && de!==a) tocar(de, -1);
  if(a && a!==de) tocar(a, +1);
}
/* Un gasto sale de algun lado y un ingreso entra a alguno: antes todo caia en
   el monton y le tocaba corregir Nequi a mano. Ahora el movimiento dice de
   donde salio o a donde entro, y ese numero se mueve solo. "Sin tocar saldos"
   sigue estando, para lo que no quiere que cuente. */
const SIN_BOLSILLO = '—';
function aplicarABolsillo(nombre, delta){
  if(!nombre || nombre===SIN_BOLSILLO) return;
  const b = bolsillos().find(x=>x.nombre===nombre);
  if(!b || b.saldo===null || b.saldo==='') return;   // un lugar sin numero puesto se queda sin numero
  b.saldo = Number(b.saldo) + Number(delta);
  b.fecha = todayStr();
}
/* De donde sale o a donde entra cada tipo: +1 entra, -1 sale, 0 no toca nada. */
function signoDelTipo(tipo){
  if(tipo==='ingreso' || tipo==='prestamo_recibido') return 1;
  if(tipo==='gasto' || tipo==='pago' || tipo==='prestamo_dado') return -1;
  return 0;
}
/* El de siempre: el ultimo que uso, y si no, el primero con numero puesto. */
function bolsilloPorDefecto(){
  const guardado = DATA.plata.ultimoBolsillo;
  if(guardado && bolsillos().some(b=>b.nombre===guardado)) return guardado;
  const puesto = bolsillosPuestos()[0];
  return puesto ? puesto.nombre : (bolsillos()[0] ? bolsillos()[0].nombre : SIN_BOLSILLO);
}
function selectBolsillo(id, elegido){
  return `<select id="${id}">${bolsillos().map(b=>`<option value="${esc(b.nombre)}" ${elegido===b.nombre?'selected':''}>${esc(b.nombre)}</option>`).join('')}<option value="${SIN_BOLSILLO}" ${elegido===SIN_BOLSILLO?'selected':''}>Sin tocar saldos</option></select>`;
}

function enPesos(monto, moneda){
  if(moneda!=='USD') return Number(monto)||0;
  const t = tasaUSD();
  return t ? Math.round(Number(monto)*t) : null;
}
function montoConMoneda(monto, moneda, montoCOP){
  if(moneda!=='USD') return money(monto);
  const etiqueta = 'US$' + Number(monto).toLocaleString('es-CO');
  if(Number(montoCOP)>0) return etiqueta + ' · ' + money(montoCOP);
  const pesos = enPesos(monto, moneda);
  return etiqueta + (pesos!==null ? ' · ' + money(pesos) : ' · falta la tasa');
}
/* Si escribio lo que le descontaron, de ahi sale la tasa real de ese cobro. */
function tasaImplicita(x){
  if(x.moneda!=='USD' || !Number(x.montoCOP) || !Number(x.monto)) return null;
  return Math.round(Number(x.montoCOP) / Number(x.monto));
}
function haceCuanto(fecha){
  if(!fecha) return 'nunca';
  const d = daysBetween(fecha, todayStr());
  if(d<=0) return 'hoy';
  if(d===1) return 'ayer';
  return 'hace ' + d + ' días';
}

/* Cuando te pagan un turno. Asignar sale del corte del hotel; Infinity
   paga el lunes siguiente; Movistar todavia no esta definido (D23, D37). */
function fechaDePagoTurno(t){
  if(t.lugar==='asignar' && t.hotel){ const p = pagoDeTurno(t.fecha, t.hotel); return p ? p.fecha : null; }
  if(t.lugar==='infinity'){
    const d = parseDate(t.fecha);
    const faltan = (8 - d.getDay()) % 7 || 7;      // el lunes que viene
    return fmtDate(addDays(d, faltan));
  }
  return null;
}
function porRecibir(){
  const hoy = todayStr();
  return DATA.turnos
    .filter(t=>Number(t.estimado)>0 && !t.cobrado)
    .map(t=>({ turno:t, fecha:fechaDePagoTurno(t), monto:Number(t.estimado) }))
    .filter(x=> !x.fecha || x.fecha>=hoy)
    .sort((a,b)=> (a.fecha||'9999').localeCompare(b.fecha||'9999'));
}

/* Un cobro que vuelve cada mes: el proximo que viene. Si ya lo pago este
   mes, el proximo es el del mes que sigue. */
function pagadoEsteMes(sus, mes){
  return (sus.pagados||[]).includes(mes || todayStr().slice(0,7));
}
function proximoCobro(sus){
  const hoy = new Date(), dia = Number(sus.dia);
  if(!dia) return null;
  const arma = (anio, mes) => new Date(anio, mes, Math.min(dia, ultimoDiaDelMes(anio, mes)));
  let f = arma(hoy.getFullYear(), hoy.getMonth());
  if(fmtDate(f) < todayStr() || pagadoEsteMes(sus, fmtDate(f).slice(0,7))){
    f = arma(hoy.getFullYear(), hoy.getMonth()+1);
  }
  return fmtDate(f);
}

/* Lo de Jerson no es un numero quieto: si a veces le prestas tu, se descuenta. */
function saldoDeuda(d){
  const movs = (d.movs||[]).reduce((a,m)=> a + (m.sentido==='abono' ? -Number(m.monto) : Number(m.monto)), 0);
  return Number(d.monto) + movs;
}

function gastosDelMes(){
  const mes = todayStr().slice(0,7);
  const out = {};
  DATA.events.filter(e=>e.cat==='finanzas' && e.type==='gasto' && e.date.startsWith(mes)).forEach(e=>{
    const c = e.categoria || 'Otros';
    out[c] = (out[c]||0) + Number(e.amount||0);
  });
  return out;
}

/* Registrar plata no es agendar algo: aca no se pregunta ni horario ni
   repeticion ni de que area es. Solo lo que hace falta para que quede bien
   clasificado (D113). */
const TIPOS_MOV = {
  gasto:            'Gasto',
  ingreso:          'Ingreso',
  traslado:         'Paso de plata (de un lado a otro)',
  pago:             'Pago pendiente',
  prestamo_dado:    'Le presté a alguien',
  prestamo_recibido:'Me prestaron'
};

function openMovimientoModal(existente){
  if(existente && existente._nuevo){ const pre = existente; existente = null; delete pre._nuevo; return openMovimientoModalCon(pre); }
  return openMovimientoModalCon(null, existente);
}
/* Anotar un almuerzo no puede costar ocho preguntas: el + ya dijo que era un
   gasto, la fecha es hoy y la plata sale de donde salio la vez pasada. Asi que
   arriba queda lo unico que cambia siempre — cuanto, de que y de donde — y lo
   demas (el titulo, otra fecha, dolares, la nota) vive detras de "Mas detalles",
   que se abre solo cuando esta corrigiendo algo ya anotado. */
function openMovimientoModalCon(pre, existente){
  const e = existente || pre || { id:null, cat:'finanzas', type:'gasto', amount:'', moneda:'COP',
    categoria:'Otros', persona:'', title:'', date:todayStr(), notes:'', status:'hecho' };
  if(!e.bolsillo && signoDelTipo(e.type)) e.bolsillo = bolsilloPorDefecto();
  let verDetalles = !!existente;

  function pintar(){
    const esPrestamo = e.type==='prestamo_dado' || e.type==='prestamo_recibido';
    const signo = signoDelTipo(e.type);
    const esTraslado = e.type==='traslado';
    const chip = (valor, texto, activo, attr)=>
      `<button type="button" class="chip ${activo?'active':''}" ${attr}="${esc(valor)}">${esc(texto)}</button>`;
    openSheet(`<h3>${existente ? 'Editar movimiento' : esc(TIPOS_MOV[e.type])}</h3>
      <div class="field monto"><label>Cuánto</label><input type="number" id="m_monto" inputmode="decimal" value="${e.amount}" placeholder="$"></div>
      ${e.moneda==='USD' && tasaUSD() ? `<div class="helptext" style="margin:-8px 0 14px;">A ${money(tasaUSD())} el dólar, son ${money(enPesos(e.amount||0,'USD'))}.</div>` : ''}
      ${e.type==='gasto' ? `<div class="field"><label>¿De qué fue?</label>
        <div class="chiprow envuelve" id="m_cats">${CATEGORIAS_GASTO.map(c=>chip(c, c, e.categoria===c, 'data-cat')).join('')}</div></div>` : ''}
      ${esPrestamo ? `<div class="field"><label>¿Con quién?</label><input type="text" id="m_persona" value="${esc(e.persona)}" placeholder="Nombre"></div>` : ''}
      ${esTraslado ? `
      <div class="field-row">
        <div class="field" style="flex:1;"><label>De</label><select id="m_de">${bolsillos().map(b=>`<option value="${esc(b.nombre)}" ${e.de===b.nombre?'selected':''}>${esc(b.nombre)}</option>`).join('')}</select></div>
        <div class="field" style="flex:1;"><label>A</label><select id="m_a">${bolsillos().map(b=>`<option value="${esc(b.nombre)}" ${e.a===b.nombre?'selected':''}>${esc(b.nombre)}</option>`).join('')}</select></div>
      </div>
      <div class="helptext" style="margin:-8px 0 14px;">No suma ni resta en el mes: es la misma plata cambiando de lugar. Se baja de un lugar y se sube al otro.</div>` : ''}
      ${signo ? `<div class="field"><label>${signo>0 ? '¿A dónde entró?' : '¿De dónde sale?'}</label>
        <div class="chiprow envuelve" id="m_bols">${bolsillos().map(b=>chip(b.nombre, b.nombre, (e.bolsillo||bolsilloPorDefecto())===b.nombre, 'data-bol')).join('')}${chip(SIN_BOLSILLO, 'Sin tocar saldos', e.bolsillo===SIN_BOLSILLO, 'data-bol')}</div>
        <div class="helptext">${existente ? 'Ya se movió cuando lo anotaste; si le cambias el monto, corrige el saldo a mano.' : e.type==='pago' ? 'Se descuenta de ahí el día que toques “Pagué”.' : signo>0 ? 'Se le suma a ese lugar al guardar.' : 'Se le resta a ese lugar al guardar.'}</div></div>` : ''}
      ${e.type==='pago' ? `<div class="field"><label>Se vence el</label><input type="date" id="m_fecha_pago" value="${esc(e.date)}"></div>` : ''}
      <button type="button" class="mas-campos ${verDetalles?'abierto':''}" id="m_mas">${verDetalles ? 'Menos detalles' : 'Más detalles'}</button>
      <div id="m_detalles" ${verDetalles?'':'hidden'}>
        <div class="field"><label>¿Qué fue?</label>
          <select id="m_tipo">${Object.entries(TIPOS_MOV).map(([k,v])=>`<option value="${k}" ${e.type===k?'selected':''}>${v}</option>`).join('')}</select>
        </div>
        ${esTraslado ? '' : `<div class="field"><label>${e.type==='pago' ? '¿Qué hay que pagar?' : 'En qué / de dónde'}</label>
          <input type="text" id="m_titulo" value="${esc(e.title)}" placeholder="${e.type==='gasto'?'Ej: almuerzo, transporte':'Ej: turno de Infinity'}"></div>`}
        ${e.type==='pago' ? '' : `<div class="field"><label>Cuándo</label><input type="date" id="m_fecha" value="${esc(e.date)}"></div>`}
        <div class="field"><label>Moneda</label><select id="m_moneda">
          <option value="COP" ${e.moneda!=='USD'?'selected':''}>Pesos</option>
          <option value="USD" ${e.moneda==='USD'?'selected':''}>Dólares</option>
        </select></div>
        <div class="field"><label>Nota (opcional)</label><input type="text" id="m_nota" value="${esc(e.notes)}"></div>
      </div>
      <div class="sheet-actions">
        ${existente?`<button class="btn btn-ghost" id="m_borrar">Borrar</button>`:''}
        <button class="btn btn-primary" id="m_guardar">Guardar</button>
      </div>`);

    function leer(){
      const g = id => document.getElementById(id);
      e.type = g('m_tipo').value;
      e.amount = g('m_monto').value;
      e.moneda = g('m_moneda').value;
      if(g('m_titulo')) e.title = g('m_titulo').value.trim();
      if(g('m_de')){ e.de = g('m_de').value; e.a = g('m_a').value; e.title = e.de + ' → ' + e.a; }
      e.date = (g('m_fecha_pago') || g('m_fecha')).value || todayStr();
      e.notes = g('m_nota').value.trim();
      if(g('m_persona')) e.persona = g('m_persona').value.trim();
    }
    /* las categorias y los bolsillos se eligen tocando, sin volver a pintar todo */
    document.querySelectorAll('#m_cats [data-cat]').forEach(b=>b.onclick = ()=>{
      e.categoria = b.dataset.cat;
      document.querySelectorAll('#m_cats [data-cat]').forEach(x=>x.classList.toggle('active', x===b));
    });
    document.querySelectorAll('#m_bols [data-bol]').forEach(b=>b.onclick = ()=>{
      e.bolsillo = b.dataset.bol;
      document.querySelectorAll('#m_bols [data-bol]').forEach(x=>x.classList.toggle('active', x===b));
    });
    document.getElementById('m_mas').onclick = ()=>{ leer(); verDetalles = !verDetalles; pintar(); };
    /* el formulario cambia segun el tipo: no le mostramos campos que no aplican */
    document.getElementById('m_tipo').onchange = ()=>{ leer(); pintar(); };
    document.getElementById('m_moneda').onchange = ()=>{ leer(); pintar(); };

    const borrar = document.getElementById('m_borrar');
    if(borrar) borrar.onclick = ()=>{
      DATA.events = DATA.events.filter(x=>x.id!==existente.id);
      saveData(); closeSheet(); renderPlata();
    };
    document.getElementById('m_guardar').onclick = ()=>{
      leer();
      if(!Number(e.amount)){ alert('Falta el monto.'); return; }
      /* sin titulo, el gasto se llama como su categoria: "Comida fuera" dice
         mas que "Gasto" cuando lo vuelve a ver en la lista del mes */
      if(!e.title) e.title = (e.type==='gasto' && e.categoria && e.categoria!=='Otros') ? e.categoria : TIPOS_MOV[e.type];
      /* lo que se guarda son pesos, con el original anotado al lado */
      const pesos = e.moneda==='USD' ? enPesos(e.amount,'USD') : Number(e.amount);
      if(pesos===null){ alert('Ponle la tasa del dólar primero: en Plata, abre Dólar.'); return; }
      if(e.type==='traslado' && !e.de){ e.de = bolsillos()[0].nombre; e.a = bolsillos()[1] ? bolsillos()[1].nombre : ''; e.title = e.de + ' → ' + e.a; }
      const obj = {
        cat:'finanzas', type:e.type, amount:pesos, moneda:e.moneda,
        de: e.de || '', a: e.a || '', bolsillo: signoDelTipo(e.type) ? (e.bolsillo || bolsilloPorDefecto()) : '',
        montoOriginal: e.moneda==='USD' ? Number(e.amount) : null,
        categoria: e.type==='gasto' ? e.categoria : '',
        persona: e.persona || '', title:e.title, date:e.date, notes:e.notes,
        start:'', end:'',
        status: e.type==='pago' ? 'pendiente' : 'hecho'
      };
      if(existente) Object.assign(existente, obj);
      else {
        DATA.events.push(Object.assign({id:uid(), creado:Date.now()}, obj));
        /* solo al anotarlo: si despues lo editas, los numeros ya se movieron */
        if(obj.type==='traslado') moverEntreBolsillos(obj.de, obj.a, pesos);
        /* el pago pendiente no mueve nada todavia: mueve el dia que dice "Pagué" */
        else if(signoDelTipo(obj.type) && obj.type!=='pago') aplicarABolsillo(obj.bolsillo, signoDelTipo(obj.type)*pesos);
        if(obj.bolsillo && obj.bolsillo!==SIN_BOLSILLO) DATA.plata.ultimoBolsillo = obj.bolsillo;
      }
      saveData(); closeSheet(); renderPlata();
    };
  }
  pintar();
}

function avisar(texto, alTocar){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = texto; t.classList.add('ver');
  t.style.pointerEvents = alTocar ? 'auto' : 'none';
  t.onclick = alTocar ? ()=>{ t.classList.remove('ver'); alTocar(); } : null;
  clearTimeout(t._reloj); t._reloj = setTimeout(()=>t.classList.remove('ver'), alTocar ? 4500 : 2600);
}

/* Lo que quedaria si llega lo que esperas y pagas lo que debes (D05). Es un
   estimado y se presenta como tal (D36); el saldo sigue siendo el tuyo (D99). */
function cuentaQuedaria(){
  const tengo = saldoTotal();
  if(tengo===null) return null;
  const hoy = todayStr(), en30 = fmtDate(addDays(new Date(), 30));
  const recibir = porRecibir().reduce((a,x)=>a+x.monto, 0);
  const cobros = (DATA.suscripciones||[]).map(x=>({ x, f:proximoCobro(x) })).filter(o=>o.f && o.f<=en30)
    .reduce((a,o)=>a + (enPesos(o.x.monto, o.x.moneda) || Number(o.x.montoCOP) || 0), 0);
  const pagos = DATA.events.filter(e=>e.cat==='finanzas' && e.type==='pago' && e.status!=='hecho').reduce((a,e)=>a+Number(e.amount||0), 0);
  const debes = (DATA.deudas||[]).filter(d=>!d.saldada && d.sentido!=='meDeben').reduce((a,d)=>a+Math.max(0,saldoDeuda(d)), 0);
  const cuotas = (DATA.installments||[]).reduce((a,i)=>a + Math.max(0, Number(i.total) - i.payments.reduce((s,p)=>s+Number(p.amount),0)), 0);
  const teDeben = (DATA.deudas||[]).filter(d=>!d.saldada && d.sentido==='meDeben').reduce((a,d)=>a+Math.max(0,saldoDeuda(d)), 0);
  const total = tengo + recibir - cobros - pagos - debes - cuotas;
  return { total, recibir, cobros, pagos, debes, cuotas, teDeben };
}

/* hoy · mañana · en 3 días · 19 sep */
function cuandoCorto(fecha){
  if(!fecha) return '';
  const d = daysBetween(todayStr(), fecha);
  return d===0 ? 'hoy' : d===1 ? 'mañana' : d===-1 ? 'ayer' : d>1 && d<7 ? `en ${d} días` : niceDateShort(fecha);
}
function renderPlata(){
  const box = document.getElementById('sub-finanzas');
  const P = DATA.plata;
  let html = '';

  /* 1 · cuanto tienes ahora, y en que lugar esta cada peso — lo declaras tu y
     nunca miente en silencio (D99, D122) */
  const tengo = saldoTotal();
  const fechaSaldo = saldoFecha();
  html += `<div class="card saldo-card" id="saldoCard">
    <div class="lbl">Tengo ahora <span class="saldo-edad">${fechaSaldo ? esc(haceCuanto(fechaSaldo)) : 'toca para ponerlo'}</span></div>
    <div class="saldo-nota">toda tu plata, venga de este mes o de antes</div>
    <div class="saldo-num mono">${tengo===null ? '—' : money(tengo)}</div>
    <div class="bolsillos">${bolsillos().map(b=>`
      <button class="bolsillo" data-bolsillo="${b.id}">
        <span class="n">${esc(b.nombre)}</span>
        <span class="m mono ${b.saldo===null||b.saldo===''?'vacio':''}">${b.saldo===null||b.saldo==='' ? 'poner' : money(b.saldo)}</span>
      </button>`).join('')}</div>
    ${(q=>q && (q.recibir||q.cobros||q.pagos||q.debes||q.cuotas) ? `<div class="quedaria">
      <div class="fila" style="justify-content:flex-start; gap:6px; flex-wrap:wrap;"><span style="font-size:13px; color:var(--text-muted);">Si pagas todo lo que debes, te queda</span><span class="n mono" style="color:${q.total<0?'var(--urgent)':'inherit'}">${q.total<0?'−':''}${money(Math.abs(q.total))}</span></div>
      <div class="por-que">${q.total<0 ? 'Es un estimado: hoy debes más de lo que tienes.' : 'Es un estimado, no la plata que tienes.'} <b>Ver de dónde sale ›</b></div>
      <div class="det" hidden><b>${money(saldoTotal()||0)}</b> que tienes ahora<br>${[q.recibir&&`<span style="color:var(--done)">+ ${money(q.recibir)}</span> por recibir`, q.cobros&&`<span style="color:var(--urgent)">− ${money(q.cobros)}</span> cobros del mes`, q.pagos&&`<span style="color:var(--urgent)">− ${money(q.pagos)}</span> pagos pendientes`, q.debes&&`<span style="color:var(--urgent)">− ${money(q.debes)}</span> que debes`, q.cuotas&&`<span style="color:var(--urgent)">− ${money(q.cuotas)}</span> en cuotas`].filter(Boolean).join('<br>')}${q.teDeben?`<br><span style="color:var(--text-dim)">Sin contar ${money(q.teDeben)} que te deben.</span>`:''}</div>
    </div>` : '')(cuentaQuedaria())}
  </div>
  <div class="pleg-lista">`;

  /* 2 · lo demas va plegado: cerrado se ve el nombre y un resumen, y se abre
     tocandolo. Lo vacio no aparece. */
  const mes = todayStr().slice(0,7);
  const evMes = DATA.events.filter(e=>e.cat==='finanzas' && e.date.startsWith(mes));
  const ingresos = evMes.filter(e=>e.type==='ingreso').reduce((a,e)=>a+Number(e.amount||0),0);
  const gastos = evMes.filter(e=>e.type==='gasto').reduce((a,e)=>a+Number(e.amount||0),0);
  /* como en Nequi: lo mas reciente arriba. A igual fecha manda lo ultimo
     anotado (lo viejo no tiene hora guardada, y ahi vale el orden de la lista). */
  const orden = new Map(DATA.events.map((e,i)=>[e.id, i]));
  const cuandoSeAnoto = (e)=>{ const c = e.creado; const n = typeof c==='number' ? c : c ? Date.parse(c) : 0; return n || 0; };
  const movs = evMes.slice().sort((a,b)=>
    b.date.localeCompare(a.date)
    || (cuandoSeAnoto(b) - cuandoSeAnoto(a))
    || (orden.get(b.id) - orden.get(a.id)));
  const movsHtml = movs.length ? movs.map(m=>{
    const entra = m.type==='ingreso' || m.type==='prestamo_recibido';
    const paso = m.type==='traslado';
    const pendiente = m.type==='pago' && m.status!=='hecho';
    return `<div class="fila-p mov-card" data-id="${m.id}" data-sel-tipo="movimiento" data-sel-id="${m.id}">
      <span class="nom">${esc(m.title)}</span>
      ${pendiente ? `<button class="small-btn" data-pagado="${m.id}">Pagué</button>` : `<span class="cu">${esc(cuandoCorto(m.date))}${paso?' · solo cambió de lugar':m.bolsillo && m.bolsillo!==SIN_BOLSILLO?' · '+esc(m.bolsillo):''}</span>`}
      <span class="mo" style="color:${pendiente?'var(--ambar)':paso?'var(--text-dim)':entra?'var(--done)':'var(--urgent)'}">${paso?'':entra?'+':'−'}${m.montoOriginal?'US$'+m.montoOriginal:money(m.amount)}</span>
    </div>`;
  }).join('') : '<div class="helptext" style="margin:0;">Nada todavía este mes.</div>';

  /* la resta del mes: lo que entro menos lo que salio. Los pasos de plata no
     cuentan, porque la misma plata solo cambio de lugar. Esto no toca el saldo:
     ese lo declaras tu (D99). */
  const neto = ingresos - gastos;
  const colorNeto = neto < 0 ? 'var(--urgent)' : 'var(--done)';
  const resumenMes = (ingresos || gastos)
    ? `<span style="color:${colorNeto}; font-weight:600;">${neto<0?'−':'+'}${money(Math.abs(neto))}</span>`
    : 'nada todavía';
  const totalHtml = (ingresos || gastos) ? `<div class="fila-p" style="cursor:default; border-top:none;">
      <span class="nom">${neto<0 ? 'Faltó este mes' : 'Sobró este mes'}</span>
      <span class="cu">entró <b style="color:var(--done); font-weight:600;">${money(ingresos)}</b> · salió <b style="color:var(--urgent); font-weight:600;">${money(gastos)}</b> · no es lo que tienes</span>
      <span class="mo" style="color:${colorNeto}">${neto<0?'−':'+'}${money(Math.abs(neto))}</span>
    </div>` : '';

  html += plegable('mes', 'Este mes', resumenMes, totalHtml + movsHtml);

  const recibir = porRecibir();
  if(recibir.length){
    const totalRecibir = recibir.reduce((a,x)=>a+x.monto,0);
    const recHtml = recibir.map(x=>`
    <div class="fila-p">
      <span class="nom">${esc(turnoTitulo(x.turno))}</span>
      <button class="small-btn" data-cobrar="${x.turno.id}">Me pagaron</button>
      <span class="cu">${esc(x.fecha ? cuandoCorto(x.fecha) : 'sin fecha')}</span>
      <span class="mo">${money(x.monto)}</span>
    </div>`).join('');
    html += plegable('recibir', 'Por recibir', money(totalRecibir),
      recHtml);
  }

  const gastado = gastosDelMes();
  const conTope = CATEGORIAS_GASTO.filter(c=>Number(P.topes[c])>0);
  if(conTope.length){
    const cerca = conTope.filter(c=>(gastado[c]||0) >= Number(P.topes[c])*0.8).length;
    const topesHtml = conTope.map(c=>{
      const tope = Number(P.topes[c]), usado = gastado[c]||0;
      const pct = Math.min(100, Math.round(usado/tope*100));
      const color = pct>=100 ? 'var(--urgent)' : pct>=80 ? 'var(--ambar)' : 'var(--c-dinero)';
      return `<div class="card">
        <div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline;">
          <div style="font-weight:600;">${esc(c)}</div>
          <div class="mono" style="font-size:13px;"><b style="color:${color}">${money(usado)}</b> <span style="color:var(--text-dim);">/ ${money(tope)}</span></div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${color};"></div></div>
      </div>`;
    }).join('');
    html += plegable('presupuesto', 'Presupuesto',
      cerca ? cerca + ' cerca del tope' : 'todo en orden',
      `<div style="text-align:right; margin-bottom:8px;"><button class="small-btn" id="topesBtn">Cambiar topes</button></div>` + topesHtml, cerca>0);
  }

  if(DATA.suscripciones.length){
    const porVencer = DATA.suscripciones.filter(x=>{ const pr=proximoCobro(x); return x.dia && pr && !pagadoEsteMes(x) && daysBetween(todayStr(), pr)<=3; });
    const susHtml = DATA.suscripciones.map(x=>{
      const prox = proximoCobro(x);
      const faltan = prox ? daysBetween(todayStr(), prox) : null;
      const pagado = x.dia && pagadoEsteMes(x);
      const pronto = !pagado && faltan!==null && faltan<=3;
      return `<div class="fila-p sus-card" data-id="${x.id}" data-sel-tipo="suscripcion" data-sel-id="${x.id}">
        <span class="nom">${esc(x.nombre)}</span>
        ${pronto ? `<button class="small-btn" data-pagar-sus="${x.id}">Pagué</button>` : ''}
        <span class="cu ${pagado?'ok':pronto?'ojo':''}">${pagado ? '✓ pagado' : !x.dia ? 'sin día' : esc(cuandoCorto(prox))}</span>
        <span class="mo" style="color:${pagado?'var(--text-dim)':'var(--urgent)'}">${x.moneda==='USD' ? 'US$'+x.monto : money(x.monto)}</span>
      </div>`;
    }).join('');
    html += plegable('cadames', 'Cada mes',
      porVencer.length ? esc(porVencer.map(x=>x.nombre).join(', ')) + ' vence pronto' : DATA.suscripciones.length + (DATA.suscripciones.length>1?' cobros':' cobro'),
      susHtml, porVencer.length>0);
  }

  const deudasOrden = [...DATA.deudas].sort((a,b)=> (a.saldada?1:0) - (b.saldada?1:0));
  if(deudasOrden.length){
    const abiertas = deudasOrden.filter(d=>!d.saldada);
    const debes = abiertas.filter(d=>d.sentido!=='meDeben').reduce((a,d)=>a+saldoDeuda(d),0);
    const teDeben = abiertas.filter(d=>d.sentido==='meDeben').reduce((a,d)=>a+saldoDeuda(d),0);
    const partes = [];
    if(debes) partes.push('debes ' + money(debes));
    if(teDeben) partes.push('te deben ' + money(teDeben));
    const deuHtml = deudasOrden.map(d=>{
      const saldo = saldoDeuda(d);
      const debo = d.sentido!=='meDeben';
      return `<div class="fila-p deuda-card ${d.saldada?'saldada':''}" data-id="${d.id}" data-sel-tipo="deuda" data-sel-id="${d.id}">
        <span class="nom">${esc(d.nombre)}</span>
        <span class="cu ${d.saldada?'ok':''}">${d.saldada ? '✓ saldada' : (debo?'debes':'te debe') + (d.fecha ? ' · ' + esc(cuandoCorto(d.fecha)) : '')}</span>
        <span class="mo" style="color:${d.saldada?'var(--text-dim)':debo?'var(--urgent)':'var(--done)'}">${money(saldo)}</span>
      </div>`;
    }).join('');
    html += plegable('deudas', 'Debo y me deben', partes.join(' · ') || 'todo saldado', deuHtml);
  }

  if(DATA.installments.length){
    const cuoHtml = DATA.installments.map(inst=>{
      const paid = inst.payments.reduce((a,p)=>a+Number(p.amount),0);
      return `<div class="fila-p installment-card" data-id="${inst.id}">
        <span class="nom">${esc(inst.name)}</span>
        <button class="small-btn" data-action="payInstallment" data-id="${inst.id}">Pagué</button>
        <span class="cu">${inst.payments.length}/${esc(inst.cuotas)}</span>
        <span class="mo" style="color:var(--urgent)">${money(Math.max(0, Number(inst.total)-paid))}</span>
      </div>`;
    }).join('');
    html += plegable('cuotas', 'Compras a cuotas', DATA.installments.length + (DATA.installments.length>1?' compras':' compra'), cuoHtml);
  }

  /* la tasa del dolar: la pones tu a mano y funciona sin internet (D128) */
  html += plegable('dolar', 'Dólar', tasaUSD() ? money(tasaUSD()) : 'sin poner', `<div class="fila-p tasa-card" id="tasaCard">
      <span class="nom">1 dólar</span>
      <span class="cu">${DATA.plata.tasaFecha ? esc(haceCuanto(DATA.plata.tasaFecha)) : ''}</span>
      <span class="mo">${tasaUSD() ? money(tasaUSD()) : 'poner'}</span>
    </div>`);
  html += `</div>`;

  box.innerHTML = html;
  bindItemClicks();
  document.getElementById('saldoCard').onclick = (ev)=>{
    const q = ev.target.closest('.quedaria');
    if(q){
      const d = q.querySelector('.det'), pq = q.querySelector('.por-que');
      d.hidden = !d.hidden;
      if(pq) pq.hidden = !d.hidden;
      return;
    }
    const b = ev.target.closest('.bolsillo');
    if(b){ openBolsilloModal(b.dataset.bolsillo); return; }
    openSaldoModal();
  };
  document.getElementById('tasaCard').onclick = openTasaModal;
  const _b_topesBtn = document.getElementById('topesBtn'); if(_b_topesBtn) _b_topesBtn.onclick = openTopesModal;
  const _b_addSusBtn = document.getElementById('addSusBtn'); if(_b_addSusBtn) _b_addSusBtn.onclick = ()=>openSuscripcionModal();
  const _b_addDeudaBtn = document.getElementById('addDeudaBtn'); if(_b_addDeudaBtn) _b_addDeudaBtn.onclick = ()=>openDeudaModal();
  const _b_addMoneyBtn = document.getElementById('addMoneyBtn'); if(_b_addMoneyBtn) _b_addMoneyBtn.onclick = ()=>openMovimientoModal();
  box.querySelectorAll('.mov-card').forEach(c=>c.onclick=()=>{
    const m = DATA.events.find(x=>x.id===c.dataset.id);
    openMovimientoModal(Object.assign(m, { moneda: m.moneda||'COP', amount: m.montoOriginal || m.amount }));
  });
  box.querySelectorAll('[data-cobrar]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    openCobroModal(DATA.turnos.find(t=>t.id===b.dataset.cobrar));
  });
  box.querySelectorAll('[data-pagar-sus]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    openPagarSuscripcion(DATA.suscripciones.find(x=>x.id===b.dataset.pagarSus));
  });
  box.querySelectorAll('[data-despagar]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const x = DATA.suscripciones.find(s=>s.id===b.dataset.despagar);
    x.pagados = (x.pagados||[]).filter(m=>m!==todayStr().slice(0,7));
    saveData(); renderPlata();
  });
  box.querySelectorAll('[data-pagado]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const m = DATA.events.find(x=>x.id===b.dataset.pagado);
    m.status='hecho'; m.pagadoFecha = todayStr();
    aplicarABolsillo(m.bolsillo, -Number(m.amount||0));
    saveData(); renderPlata();
  });
  const _b_addInstallmentBtn = document.getElementById('addInstallmentBtn'); if(_b_addInstallmentBtn) _b_addInstallmentBtn.onclick = openInstallmentModal;
  box.querySelectorAll('.sus-card').forEach(c=>c.onclick=()=>openSuscripcionModal(DATA.suscripciones.find(x=>x.id===c.dataset.id)));
  box.querySelectorAll('[data-usar-tasa]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const x = DATA.suscripciones.find(s=>s.id===b.dataset.usarTasa);
    DATA.plata.tasaUSD = tasaImplicita(x); DATA.plata.tasaFecha = todayStr();
    saveData(); renderPlata();
  });
  box.querySelectorAll('.deuda-card').forEach(c=>c.onclick=()=>openDeudaModal(DATA.deudas.find(x=>x.id===c.dataset.id)));
  box.querySelectorAll('[data-action="payInstallment"]').forEach(b=>b.onclick=()=>openPayModal(b.dataset.id));

}

/* un solo lugar: el camino corto, que es el de todos los dias */
function openBolsilloModal(id){
  const b = bolsillos().find(x=>x.id===id);
  if(!b) return;
  openSheet(`<h3>¿Cuánto tienes en ${esc(b.nombre)}?</h3>
    <div class="field"><label>Lo que hay hoy en ${esc(b.nombre)}</label><input type="number" id="f_bol" inputmode="numeric" value="${b.saldo??''}" placeholder="$"></div>
    <div class="helptext">${b.fecha ? 'Lo pusiste ' + esc(haceCuanto(b.fecha)) + '.' : ''} Bitácora no lo calcula sola: lo corriges cuando te des cuenta.</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="verTodos">Ver todos</button>
      <button class="btn btn-primary" id="saveBol">Guardar</button>
    </div>`);
  document.getElementById('verTodos').onclick = ()=>{ closeSheet(); openSaldoModal(); };
  document.getElementById('saveBol').onclick = ()=>{
    const v = document.getElementById('f_bol').value;
    const antes = b.saldo;
    b.saldo = v==='' ? null : Number(v)||0;
    b.fecha = v==='' ? '' : todayStr();
    DATA.plata.saldo = saldoTotal(); DATA.plata.saldoFecha = saldoFecha();
    saveData(); closeSheet(); renderPlata();
    if(antes!==null && antes!=='' && b.saldo!==null) preguntarPorLaDiferencia(b, Number(antes) - Number(b.saldo));
  };
}

/* Cuando corrige un lugar y el numero no da, casi siempre es plata que se fue
   sin quedar anotada. Se ofrece anotarla para que la cuenta del mes sea real,
   pero se ofrece, no se hace sola (D16), porque puede que el gasto ya este
   anotado y entonces quedaria contado dos veces. */
function preguntarPorLaDiferencia(b, falta){
  if(!falta) return;
  const salio = falta > 0, monto = Math.abs(falta);
  openSheet(`<h3>${salio ? 'Se fueron ' + money(monto) : 'Aparecieron ' + money(monto)}</h3>
    <div class="helptext" style="margin:-4px 0 16px;">En ${esc(b.nombre)} hay ${money(monto)} ${salio?'menos':'más'} de lo que decía Bitácora. Si ya anotaste ese ${salio?'gasto':'ingreso'}, no lo anotes otra vez.</div>
    <div class="sheet-actions" style="flex-direction:column; align-items:stretch; gap:8px;">
      <button class="btn btn-primary" id="d_anotar">Anotarlo, no sé ${salio?'en qué':'de dónde'}</button>
      <button class="btn btn-ghost" id="d_nada">Ya está anotado, solo corrige</button>
    </div>`);
  document.getElementById('d_nada').onclick = closeSheet;
  document.getElementById('d_anotar').onclick = ()=>{
    DATA.events.push({ id:uid(), cat:'finanzas', type: salio?'gasto':'ingreso', amount:monto, moneda:'COP',
      categoria: salio ? 'Otros' : '', persona:'', title: salio ? 'No sé en qué' : 'No sé de dónde',
      date: todayStr(), notes: 'Apareció al cuadrar ' + b.nombre, start:'', end:'', status:'hecho', creado:Date.now() });
    saveData(); closeSheet(); renderPlata();
  };
}

/* todos los lugares de una, para cuadrar de vez en cuando y para agregar o
   quitar lugares */
function openSaldoModal(){
  const lista = bolsillos();
  openSheet(`<h3>¿Cuánto tienes ahora?</h3>
    <div class="helptext" style="margin:-4px 0 14px;">Un renglón por lugar. Bitácora no lo calcula sola: si se desfasa, lo corriges cuando te des cuenta.</div>
    ${lista.map(b=>`<div class="field-row" style="align-items:flex-end;">
      <div class="field" style="flex:1; margin-bottom:12px;"><label>${esc(b.nombre)}</label>
        <input type="number" inputmode="numeric" data-saldo="${b.id}" value="${b.saldo??''}" placeholder="$"></div>
      <button class="small-btn" data-quitar="${b.id}" style="margin-bottom:24px;">Quitar</button>
    </div>`).join('')}
    <div class="field"><label>Agregar otro lugar</label>
      <input type="text" id="f_nuevoLugar" placeholder="Ej: Bancolombia, la alcancía"></div>
    <div class="sheet-actions"><button class="btn btn-primary" id="saveSaldo">Guardar</button></div>`);

  /* lo escrito no se pierde al quitar un lugar */
  function leerTodo(){
    sheet.querySelectorAll('[data-saldo]').forEach(inp=>{
      const b = lista.find(x=>x.id===inp.dataset.saldo); if(!b) return;
      const antes = b.saldo;
      b.saldo = inp.value==='' ? null : Number(inp.value)||0;
      if(b.saldo!==antes) b.fecha = b.saldo===null ? '' : todayStr();
    });
    const nuevo = document.getElementById('f_nuevoLugar').value.trim();
    if(nuevo && !lista.some(b=>b.nombre.toLowerCase()===nuevo.toLowerCase())){
      lista.push({ id:uid(), nombre:nuevo, saldo:null, fecha:'' });
    }
  }
  sheet.querySelectorAll('[data-quitar]').forEach(b=>b.onclick = ()=>{
    leerTodo();
    DATA.plata.bolsillos = lista.filter(x=>x.id!==b.dataset.quitar);
    closeSheet(); openSaldoModal();
  });
  document.getElementById('saveSaldo').onclick = ()=>{
    leerTodo();
    DATA.plata.bolsillos = lista;
    DATA.plata.saldo = saldoTotal(); DATA.plata.saldoFecha = saldoFecha();
    saveData(); closeSheet(); renderPlata();
  };
}

    <div class="helptext">La pones tú y la cambias cuando quieras. No se busca sola, porque eso necesitaría internet.</div>
    <div class="sheet-actions"><button class="btn btn-primary" id="saveTasa">Guardar</button></div>`);

  document.getElementById('saveSus').onclick = ()=>{

  };

/* ============================================================
   LA MAÑANA Y EL CIERRE DEL DIA
   Los dos unicos momentos en que Bitacora pregunta algo: al despertar pide
   sueño y animo (D104, D43, D44), y a las 9:30 pm pregunta una sola vez por
   lo que quedo (D18, D86). Nada mas le insiste (D94).
============================================================ */
const CIERRE_HORA = 21 * 60 + 30;        // 9:30 pm, antes del silencio (D86)
const MANANA_HASTA = 12 * 60;            // el modulo de la mañana no pasa del mediodia
const ANIMOS = ['Mal', 'Regular', 'Bien', 'Genial'];

function diaDe(fecha){
  DATA.diario = DATA.diario || {};
  DATA.diario[fecha] = DATA.diario[fecha] || { sueno:[], animo:'', cerrado:false };
  return DATA.diario[fecha];
}
/* Las clases y las rutinas no son un evento guardado: se repiten. Para poder
   marcarlas hechas sin inventar un evento cada semana, el estado se guarda en
   el dia, por id de la cosa que se repite (D107: hecho, en progreso o nada). */
function estadoRepetido(fecha, id){
  const d = diaDe(fecha);
  d.repetidos = d.repetidos || {};
  return d.repetidos[id] || 'pendiente';
}
/* Cada bloque que se repite tiene sus dos botones a la vista: el ✓ dice que
   lo hizo y la ✕ dice que hoy no fue (D27: lo de Joel se repite, pero hay dias
   que no hay colegio). Un toque cada uno, y el mismo toque lo deshace. Nada de
   pasar por "hecho" para poder decir que no fue. Lo que dice "hoy no" deja de
   ocupar el dia y ese rato vuelve a contar como libre. */
function marcarRepetido(fecha, id, estado){
  const d = diaDe(fecha);
  d.repetidos = d.repetidos || {};
  const sigue = d.repetidos[id] === estado ? 'pendiente' : estado;
  if(sigue === 'pendiente') delete d.repetidos[id]; else d.repetidos[id] = sigue;
  return sigue;
}

function minutosDormidos(fecha){
  return (diaDe(fecha).sueno || []).reduce((a,b)=>{
    const d = minutosDe(b.desde), h = finEnMinutos(b.desde, b.hasta);
    return a + (d!==null && h!==null ? h - d : 0);
  }, 0);
}
function ahoraEnMinutos(){
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}

function resolverCierre(tipo, id, accion){
  const manana = fmtDate(addDays(new Date(),1));
  const sumaArrastre = obj => { obj.arrastres = (obj.arrastres||0) + 1; };

  /* "Ya no va" borra: es lo que hace falta cuando algo quedo repetido o cuando
     ya no tiene sentido. Se pregunta antes porque no se puede deshacer. */
  if(accion==='borrar'){
    if(!confirm('¿Borrar esto? No se puede deshacer.')) return;
    if(tipo==='evento') DATA.events = DATA.events.filter(x=>x.id!==id);
    if(tipo==='entrega') DATA.academicTasks = (DATA.academicTasks||[]).filter(x=>x.id!==id);
    if(tipo==='pendiente') DATA.pendientes = (DATA.pendientes||[]).filter(x=>x.id!==id);
    saveData(); renderAll();
    return;
  }

  if(tipo==='evento'){
    const e = DATA.events.find(x=>x.id===id); if(!e) return;
    if(accion==='hecha'){ e.status='hecho'; syncSourceFromEvent(e); }
    else if(accion==='manana'){ e.date = manana; sumaArrastre(e); }
    else { e.date = ''; e.start=''; e.end=''; sumaArrastre(e); }   // sin fecha: vuelve a pendientes
  }
  if(tipo==='entrega'){
    const a = (DATA.academicTasks||[]).find(x=>x.id===id); if(!a) return;
    if(accion==='hecha'){ a.done = true; setLinkedEventStatus('academicTask', a.id, 'hecho'); }
    else if(accion==='manana'){ a.date = manana; sumaArrastre(a); }
    else { a.date = ''; sumaArrastre(a); }
  }
  if(tipo==='pendiente'){
    const p = (DATA.pendientes||[]).find(x=>x.id===id); if(!p) return;
    if(accion==='hecha') p.hecho = true;
    else if(accion==='manana'){ p.urgencia='urgente'; sumaArrastre(p); }
    else { p.arrastres = 0; }        // lo suelta: deja de insistirle
  }
  saveData(); renderHoy();
}

/* ============================================================
   EL DIA: LO OCUPADO Y LO LIBRE
   Los huecos entre bloques son tiempo utilizable, no "ocupada todo el dia"
   (D26), y se ven como espacio entre los bloques (D108). Sirve igual para
   Hoy y para cualquier dia que toque en el calendario.
============================================================ */
const DIA_DESDE = 6 * 60;    // 6 de la mañana
const DIA_HASTA = 23 * 60;   // 11 de la noche, donde arranca su silencio

/* Todo lo que ocupa ese dia, junto y en orden. */
function bloquesDeFecha(fecha){
  const { fijos, puestos } = acomodarDia(fecha);
  return [...fijos, ...puestos].sort(porHora);
}
/* Lo firme del dia: rutinas, clases, turnos y lo agendado con hora. */
function bloquesFijos(fecha){
  const d = parseDate(fecha), dow = d.getDay();
  const out = [];
  const items = weekdayItems(dow).filter(c=>c.start);
  /* "Universidad" de 6 a 10 y la materia de esa noche son la misma cosa: si la
     clase cae dentro de la franja, la franja sobra y se muestra la clase, que
     dice mas. El ingles del SENA y la clase con Leslie son a otras horas, asi
     que no les pasa. */
  const clases = items.filter(c=>c.materia)
    .map(c=>({ d:minutosDe(c.start), h: c.end ? finEnMinutos(c.start, c.end) : minutosDe(c.start) }))
    .filter(k=>k.d!==null && k.h!==null);
  items.forEach(c=>{
    if(!c.materia && clases.length){
      const d = minutosDe(c.start), h = c.end ? finEnMinutos(c.start, c.end) : minutosDe(c.start);
      if(d!==null && h!==null && clases.some(k=>k.d >= d && k.h <= h)) return;
    }
    const idRep = c.materia ? 'materia:'+c.materia.id : c.ref ? 'rutina:'+c.ref.id : '';
    out.push({ titulo:c.name, start:c.start, end:c.end, color:c.color,
      lugar:(c.ref && c.ref.notes) || '', rutina:c.ref, materia:c.materia,
      saltado: idRep ? estadoRepetido(fecha, idRep) === 'saltado' : false });
  });
  DATA.events.filter(e=>e.date===fecha && e.start).forEach(e=>{
    out.push({ titulo:e.title, start:e.start, end:e.end,
      color:CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)', lugar:e.lugar||'', ev:e });
  });
  bloquesDeSueno(fecha).forEach(b=>out.push(b));
  return out.sort(porHora);
}

/* Lo que durmio tambien es una parte del dia, y la mas grande: si no sale en
   el horario, la noche se ve como un hueco y el dia parece mas vacio de lo
   que fue. Como la noche cruza la medianoche, cada dia se queda con su pedazo:
   lo que anota el martes por la mañana ("me dormi 23:00, me levante 07:00")
   pinta de 23:00 a medianoche el lunes y de medianoche a las 07:00 el martes. */
function bloquesDeSueno(fecha){
  const diario = DATA.diario || {};
  const bloque = (start, end)=> ({ titulo:'Sueño', start, end, color:'var(--c-descanso)',
    lugar:'', sueno:fecha, noche:true });
  const out = [];
  ((diario[fecha]||{}).sueno || []).forEach(b=>{
    if(!b.desde || !b.hasta) return;
    const cruza = minutosDe(b.hasta) <= minutosDe(b.desde);
    out.push(cruza ? bloque('00:00', b.hasta) : bloque(b.desde, b.hasta));
  });
  const manana = fmtDate(addDays(parseDate(fecha), 1));
  ((diario[manana]||{}).sueno || []).forEach(b=>{
    if(!b.desde || !b.hasta) return;
    if(minutosDe(b.hasta) <= minutosDe(b.desde))
      out.push({ ...bloque(b.desde, '00:00'), sueno:manana });
  });
  return out.filter(b=>b.start);
}

/* Dos bloques encimados no ocupan el doble: se unen antes de contar. */
function ocupadoDelDia(bloques){
  const tramos = bloques
    .filter(b=>!b.saltado)          // lo que dijo que hoy no fue, no ocupa nada
    .map(b=>({ desde: minutosDe(b.start), hasta: b.end ? finEnMinutos(b.start, b.end) : minutosDe(b.start) }))
    .filter(t=>t.desde !== null && t.hasta !== null && t.hasta > t.desde)
    .sort((a,b)=>a.desde - b.desde);
  const unidos = [];
  tramos.forEach(t=>{
    const ultimo = unidos[unidos.length-1];
    if(ultimo && t.desde <= ultimo.hasta) ultimo.hasta = Math.max(ultimo.hasta, t.hasta);
    else unidos.push({ ...t });
  });
  return unidos;
}

/* Lo que queda libre dentro del dia despierto. */
function huecosDelDia(bloques){
  const ocupado = ocupadoDelDia(bloques);
  const huecos = [];
  let cursor = DIA_DESDE;
  ocupado.forEach(t=>{
    const desde = Math.max(cursor, DIA_DESDE);
    const hasta = Math.min(t.desde, DIA_HASTA);
    if(hasta - desde >= 30) huecos.push({ desde, hasta });
    cursor = Math.max(cursor, t.hasta);
  });
  if(DIA_HASTA - Math.max(cursor, DIA_DESDE) >= 30){
    huecos.push({ desde: Math.max(cursor, DIA_DESDE), hasta: DIA_HASTA });
  }
  return huecos;
}

function resumenDelDia(fecha){
  const bloques = bloquesDeFecha(fecha);
  const ocupado = ocupadoDelDia(bloques).reduce((a,t)=>
    a + Math.max(0, Math.min(t.hasta, DIA_HASTA) - Math.max(t.desde, DIA_DESDE)), 0);
  const huecos = huecosDelDia(bloques);
  const libre = huecos.reduce((a,h)=>a + (h.hasta - h.desde), 0);
  return { bloques, huecos, ocupado, libre };
}

/* La tira del dia: los bloques con los huecos entre ellos. */
function tiraDelDia(fecha, opciones){
  const o = opciones || {};
  const { bloques, huecos } = resumenDelDia(fecha);
  if(!bloques.length && !huecos.length) return '';

  /* el hueco mas grande es donde tiene sentido sugerir algo (D19) */
  let mejor = null;
  huecos.forEach(h=>{ if(!mejor || (h.hasta-h.desde) > (mejor.hasta-mejor.desde)) mejor = h; });
  const cabe = o.sugerir
    ? (DATA.pendientes||[]).filter(p=>!p.hecho && !p.fecha)
        .sort((a,b)=>(a.urgencia==='urgente'?0:1)-(b.urgencia==='urgente'?0:1))[0]
    : null;

  /* se intercalan por hora para que se lea como el dia de verdad */
  const filas = [
    ...bloques.map(b=>({ orden: minutosDe(b.start), tipo:'bloque', b })),
    ...huecos.map(h=>({ orden: h.desde, tipo:'hueco', h }))
  ].sort((x,y)=> x.orden - y.orden);

  /* lo hecho no se queda estorbando en la lista, pero tampoco desaparece: se
     guarda en una linea que se abre, para que igual se vea lo que avanzo (D03).
     Lo que dijo que hoy no fue se guarda en esa misma linea. */
  const estaHecho = (b)=> b.ev ? b.ev.status==='hecho'
    : estadoRepetido(fecha, b.rutina ? 'rutina:'+b.rutina.id : b.materia ? 'materia:'+b.materia.id : '') === 'hecho';
  const estaFuera = (b)=> b.saltado || estaHecho(b);
  /* si el bloque del medio ya esta hecho, los dos huecos que quedaban a sus
     lados son un solo rato libre: se juntan en vez de salir dos veces */
  const porHacer = [];
  filas.filter(f=> f.tipo!=='bloque' || !estaFuera(f.b)).forEach(f=>{
    const ultimo = porHacer[porHacer.length-1];
    if(f.tipo==='hueco' && ultimo && ultimo.tipo==='hueco'){
      ultimo.h = { desde: Math.min(ultimo.h.desde, f.h.desde), hasta: Math.max(ultimo.h.hasta, f.h.hasta) };
      return;
    }
    porHacer.push(f.tipo==='hueco' ? { ...f, h:{ ...f.h } } : f);
  });
  const yaHechas = filas.filter(f=> f.tipo==='bloque' && estaFuera(f.b));

  const pintar = (lista)=> lista.map(f=>{
    if(f.tipo === 'hueco'){
      const min = f.h.hasta - f.h.desde;
      const esElMejor = mejor && f.h.desde === mejor.desde;
      /* el hueco se ve como aire entre bloques, no como otro renglon (D108) */
      return `<div class="hueco">
        <span class="linea"></span>
        <span>${libres(min)}</span>
        ${esElMejor && cabe && min >= 60 ? `<span class="cabe">cabe: ${esc(cabe.titulo)}</span>` : ''}
      </div>`;
    }
    const b = f.b;
    /* lo que se repite (clases, rutinas) guarda su estado en el dia */
    const idRep = b.ev ? null : b.rutina ? 'rutina:'+b.rutina.id : b.materia ? 'materia:'+b.materia.id : null;
    const estadoRep = idRep ? estadoRepetido(fecha, idRep) : null;
    const hecho = b.ev ? b.ev.status==='hecho' : estadoRep==='hecho';
    const progreso = b.ev ? b.ev.status==='progreso' : estadoRep==='progreso';
    const saltado = estadoRep==='saltado';
    const marca = b.ev ? `data-id="${b.ev.id}" data-sel-tipo="evento" data-sel-id="${b.ev.id}"`
      : b.rutina ? `data-rutina="${b.rutina.id}" data-sel-tipo="rutina" data-sel-id="${b.rutina.id}"`
      : b.materia ? `data-materia="${b.materia.id}" data-sel-tipo="materia" data-sel-id="${b.materia.id}"`
      : b.pend ? `data-pend="${b.pend.id}" data-sel-tipo="pendiente" data-sel-id="${b.pend.id}"`
      : b.sueno ? `data-sueno="${b.sueno}"` : '';
    return `<div class="bloque${hecho?' hecho':''}${saltado?' saltado':''}${b.auto?' auto':''}${b.movidoPor?' movido':''}" ${marca} ${b.auto?`style="--raya:${b.color}"`:''}>
      <div class="hora mono">${esc(b.start)}${b.end?`<span class="hasta">${esc(b.end)}</span>`:''}</div>
      <div class="raya" style="background:${b.color};"></div>
      <div class="cuerpo">
        <div class="nombre">${esc(b.titulo)}</div>
        ${b.lugar && b.lugar.trim() !== b.titulo.trim() ? `<div class="sitio">${esc(b.lugar)}</div>` : ''}
      </div>
      ${b.ev ? `<button class="status-btn ${hecho?'hecho':progreso?'progreso':''}" data-action="cyclestatus" data-id="${b.ev.id}" aria-label="Marcar hecho"></button>` : ''}
      ${b.pend ? `<button class="status-btn" data-action="hechoPend" data-pid="${b.pend.id}" aria-label="Marcar hecho"></button>` : ''}
      ${idRep ? `<button class="no-btn ${saltado?'activo':''}" data-action="repNo" data-rep="${idRep}" data-fecha="${fecha}" data-desde="${esc(b.start||'')}" data-hasta="${esc(b.end||'')}" data-titulo="${esc(b.titulo)}" aria-label="Hoy no fue" title="Hoy no fue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="status-btn ${hecho?'hecho':progreso?'progreso':''}" data-action="repSi" data-rep="${idRep}" data-fecha="${fecha}" aria-label="Marcar hecho" title="Ya lo hice"></button>` : ''}
    </div>`;
  }).join('');

  const n = yaHechas.length;
  const nSalt = yaHechas.filter(f=>f.b.saltado).length;
  const nHechas = n - nSalt;
  const rotulo = [nHechas ? (nHechas===1 ? '1 hecha' : nHechas + ' hechas') : '',
                  nSalt ? (nSalt===1 ? '1 que hoy no fue' : nSalt + ' que hoy no fueron') : '']
                 .filter(Boolean).join(' · ');
  return (o.rapido ? botonDiaEntero(fecha) : '')
    + pintar(porHacer)
    + (porHacer.every(f=>f.tipo==='hueco') && n ? `<div class="todo-listo">Ya hiciste todo lo de hoy.</div>` : '')
    + (n ? `<button class="linea-hechas ${nHechas?'':'solo-no'}" data-abrir-hechas>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${nHechas ? '<path d="M20 6L9 17l-5-5"/>' : '<path d="M6 6l12 12M18 6L6 18"/>'}</svg>
        <span>${rotulo}</span>
      </button><div class="hechas-lista" hidden>${pintar(yaHechas)}</div>` : '');
}

/* ---------- marcar el dia de un solo toque ----------
   Anotar cosa por cosa lo que ya paso es el trabajo que la hacia no anotar
   nada. Casi siempre el dia salio como estaba escrito, asi que un boton lo
   da por pasado y ella solo toca las excepciones para decir "hoy no". */
function loQueYaPaso(fecha){
  if(fecha !== todayStr()) return [];
  const ahora = ahoraEnMinutos();
  return bloquesDeFecha(fecha).filter(b=>{
    if(b.saltado) return false;
    const fin = b.end ? finEnMinutos(b.start, b.end) : minutosDe(b.start);
    if(fin === null || fin > ahora) return false;          // todavia no le ha pasado
    if(b.ev) return b.ev.status !== 'hecho';
    if(b.pend) return !b.pend.hecho;
    const idRep = b.rutina ? 'rutina:'+b.rutina.id : b.materia ? 'materia:'+b.materia.id : '';
    return idRep ? estadoRepetido(fecha, idRep) !== 'hecho' : false;
  });
}
function botonDiaEntero(fecha){
  const n = loQueYaPaso(fecha).length;
  if(n < 2) return '';
  return `<button class="dia-entero" data-dia-entero="${fecha}">
    Ya pasó como estaba escrito <span>${n} cosas</span>
  </button>`;
}
function marcarLoQueYaPaso(fecha){
  const bloques = loQueYaPaso(fecha);
  if(!bloques.length) return;
  bloques.forEach(b=>{
    if(b.ev){ b.ev.status = 'hecho'; syncSourceFromEvent(b.ev); return; }
    if(b.pend){ b.pend.hecho = true; b.pend.hechoFecha = todayStr(); return; }
    const idRep = b.rutina ? 'rutina:'+b.rutina.id : b.materia ? 'materia:'+b.materia.id : '';
    if(idRep){ const d = diaDe(fecha); d.repetidos = d.repetidos || {}; d.repetidos[idRep] = 'hecho'; }
  });
  saveData(); renderAll(); refrescarDiaCalendario();
  avisar(bloques.length + (bloques.length===1 ? ' cosa marcada. Lo que no fue, tócalo y dile hoy no.'
                                              : ' cosas marcadas. Lo que no fue, tócalo y dile hoy no.'));
}

/* Los bloques y huecos de un dia se tocan igual en todos lados. */
function engancharTira(caja){
  caja.querySelectorAll('[data-rutina]').forEach(el=>{

      /* cambiar una cosa por otra es decir "hoy no" y contar que hizo en ese
         rato: se ofrece ahi mismo, con las horas del bloque ya puestas */
      if(estado === 'saltado'){
        avisar('Hoy no. ¿Hiciste otra cosa a esa hora?',

      }

  caja.querySelectorAll('[data-action="hechoPend"]').forEach(b=>{
    b.onclick = (ev)=>{
      ev.stopPropagation();
      const p = DATA.pendientes.find(x=>x.id===b.dataset.pid); if(!p) return;
      marcarPendienteHecho(p);
    };
  });
  bindItemClicks();
}

/* ============================================================
   SELECCIONAR Y BORRAR
   Como en WhatsApp: se mantiene presionado lo que se quiere botar, se tocan
   los demas para sumarlos, y abajo aparece la barra para eliminarlos.
============================================================ */
const SELECCION = { tipo:null, ids:new Set() };
let sinClic = false;          // tras un mantenido, el clic que viene no cuenta

/* Cada tipo dice como se llama y como se borra. Agregar una lista nueva es
   ponerle data-sel-tipo y data-sel-id, y una entrada aca. */
const BORRABLES = {
  pendiente: {
    uno:'pendiente', varios:'pendientes',
    borrar: ids => { DATA.pendientes = (DATA.pendientes||[]).filter(p=>!ids.has(p.id)); }
  },
  evento: {
    uno:'cosa agendada', varios:'cosas agendadas',
    borrar: ids => {
      ids.forEach(id=>{
        const e = (DATA.events||[]).find(x=>x.id===id);
        if(e && e.linkedType==='turno') DATA.turnos = DATA.turnos.filter(t=>t.id!==e.linkedId);
      });
      DATA.events = (DATA.events||[]).filter(e=>!ids.has(e.id));
    }
  },
  rutina: {
    uno:'cosa que se repite', varios:'cosas que se repiten',
    borrar: ids => { DATA.routines = (DATA.routines||[]).filter(r=>!ids.has(r.id)); }
  },
  turno: {
    uno:'turno', varios:'turnos',
    borrar: ids => {
      ids.forEach(id=>removeLinkedEvent('turno', id));
      DATA.turnos = (DATA.turnos||[]).filter(t=>!ids.has(t.id));
    }
  },
  entrega: {
    uno:'entrega', varios:'entregas',
    borrar: ids => {
      ids.forEach(id=>removeLinkedEvent('academicTask', id));
      DATA.academicTasks = (DATA.academicTasks||[]).filter(t=>!ids.has(t.id));
    }
  },
  movimiento: {
    uno:'movimiento', varios:'movimientos',
    borrar: ids => { DATA.events = (DATA.events||[]).filter(e=>!ids.has(e.id)); }
  },
  idea: {
    uno:'idea', varios:'ideas',
    borrar: ids => { marcaData().ideas = marcaData().ideas.filter(i=>!ids.has(i.id)); }
  },
  publicacion: {
    uno:'publicación', varios:'publicaciones',
    borrar: ids => { marcaData().publicaciones = marcaData().publicaciones.filter(p=>!ids.has(p.id)); }
  },
  suscripcion: {
    uno:'cobro', varios:'cobros',
    borrar: ids => { DATA.suscripciones = (DATA.suscripciones||[]).filter(s=>!ids.has(s.id)); }
  },
  deuda: {
    uno:'préstamo', varios:'préstamos',
    borrar: ids => { DATA.deudas = (DATA.deudas||[]).filter(d=>!ids.has(d.id)); }
  },
  materia: {
    uno:'materia', varios:'materias',
    borrar: ids => { DATA.subjects = (DATA.subjects||[]).filter(m=>!ids.has(m.id)); }
  }
};

function seleccionando(){ return SELECCION.tipo !== null; }

function entrarSeleccion(tipo, id){
  SELECCION.tipo = tipo;
  SELECCION.ids = new Set([id]);
  try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
  pintarSeleccion();
}
function salirSeleccion(){
  SELECCION.tipo = null;
  SELECCION.ids.clear();
  pintarSeleccion();
}
function alternar(id){
  if(SELECCION.ids.has(id)) SELECCION.ids.delete(id); else SELECCION.ids.add(id);
  if(!SELECCION.ids.size) salirSeleccion(); else pintarSeleccion();
}

function pintarSeleccion(){
  document.querySelectorAll('[data-sel-id]').forEach(el=>{
    const suyo = seleccionando() && el.dataset.selTipo === SELECCION.tipo;
    el.classList.toggle('seleccionable', suyo);
    el.classList.toggle('elegido', suyo && SELECCION.ids.has(el.dataset.selId));
  });

  let barra = document.getElementById('barraSel');
  if(!seleccionando()){ if(barra) barra.remove(); document.body.classList.remove('con-barra'); return; }

  const n = SELECCION.ids.size;
  const meta = BORRABLES[SELECCION.tipo] || { uno:'cosa', varios:'cosas' };
  if(!barra){
    barra = document.createElement('div');
    barra.id = 'barraSel';
    barra.className = 'barra-sel';
    document.body.appendChild(barra);
  }
  barra.innerHTML = `
    <button class="cancelar" id="selCancelar" aria-label="Cancelar">✕</button>
    <span class="cuantos">${n} ${n===1 ? meta.uno : meta.varios}</span>
    <button class="borrar" id="selBorrar">Eliminar</button>`;
  document.body.classList.add('con-barra');
  document.getElementById('selCancelar').onclick = salirSeleccion;
  document.getElementById('selBorrar').onclick = borrarSeleccionados;
}

function borrarSeleccionados(){
  const meta = BORRABLES[SELECCION.tipo];
  if(!meta) return salirSeleccion();
  const n = SELECCION.ids.size;
  const que = n===1 ? ('este ' + meta.uno) : (n + ' ' + meta.varios);
  if(!confirm(`¿Eliminar ${que}? No se puede deshacer.`)) return;
  meta.borrar(new Set(SELECCION.ids));
  salirSeleccion();
  saveData();
  renderAll();
  if(document.getElementById('view-calendario').classList.contains('active')) renderCalDayList();
}

/* El gesto: mantener presionado abre la seleccion; despues, un toque suma o quita. */
(function engancharGesto(){
  let reloj = null, desde = null;

  const cancelar = ()=>{ clearTimeout(reloj); reloj = null; desde = null; };

  document.addEventListener('pointerdown', (ev)=>{
    /* si el mantenido anterior no termino en clic, la bandera no puede quedarse
       prendida: se comeria el toque siguiente */
    sinClic = false;
    const el = ev.target.closest('[data-sel-id]');
    if(!el || ev.target.closest('.kdrag, .kinput, .kbtn')) return;
    /* si ya esta seleccionando otra cosa, el mantenido no aplica */
    if(seleccionando() && el.dataset.selTipo !== SELECCION.tipo) return;
    desde = { x: ev.clientX, y: ev.clientY };
    reloj = setTimeout(()=>{
      reloj = null;
      sinClic = true;
      if(seleccionando()) alternar(el.dataset.selId);
      else entrarSeleccion(el.dataset.selTipo, el.dataset.selId);
    }, 420);
  }, { passive:true });

  document.addEventListener('pointermove', (ev)=>{
    if(!reloj || !desde) return;
    /* si arrastra para desplazar la pantalla, no era un mantenido */
    if(Math.abs(ev.clientX - desde.x) > 10 || Math.abs(ev.clientY - desde.y) > 10) cancelar();
  }, { passive:true });

  ['pointerup','pointercancel','pointerleave'].forEach(t=>
    document.addEventListener(t, cancelar, { passive:true }));

  /* En modo seleccion, el toque elige en vez de abrir. Va en captura para
     ganarle a los clics que ya tiene cada lista. */
  document.addEventListener('click', (ev)=>{
    const el = ev.target.closest('[data-sel-id]');
    if(sinClic){
      sinClic = false;
      if(el){ ev.preventDefault(); ev.stopPropagation(); }
      return;
    }
    if(!seleccionando() || !el) return;
    if(el.dataset.selTipo !== SELECCION.tipo) return;
    ev.preventDefault(); ev.stopPropagation();
    alternar(el.dataset.selId);
  }, true);

  /* El menu del navegador al mantener presionado estorba el gesto. Y si el
     navegador se adelanta y lo dispara igual, ese mismo evento sirve para
     entrar a seleccionar: asi el gesto nunca se queda sin hacer nada. */
  document.addEventListener('contextmenu', (ev)=>{
    const el = ev.target.closest('[data-sel-id]');
    if(!el) return;
    ev.preventDefault();
    cancelar();
    sinClic = true;
    if(seleccionando() && el.dataset.selTipo !== SELECCION.tipo) return;
    if(seleccionando()) alternar(el.dataset.selId);
    else entrarSeleccion(el.dataset.selTipo, el.dataset.selId);
  });

  addEventListener('keydown', (ev)=>{ if(ev.key==='Escape' && seleccionando()) salirSeleccion(); });
})();

function renderAll(){

<script>
/* Le pide al navegador que no borre lo guardado si el telefono se queda sin
   espacio. Instalada, Chrome suele conceder esto sin preguntar nada. */
if (navigator.storage && navigator.storage.persist) {

    .then((ya) => (ya ? true : navigator.storage.persist()))

/* Guarda la app en el telefono para que abra sin internet (ver sw.js).
   Si mientras tanto se publico una version nueva, se recarga sola una vez. */
/* Cuando se publica una version nueva, el telefono puede quedarse con la

const BUILD_ACTUAL = (document.querySelector('meta[name="bitacora-build"]')||{}).content || '';
let avisandoVersion = false;
async function mirarVersionNueva(){
  if(avisandoVersion || !BUILD_ACTUAL || !navigator.onLine) return;
  try{
    const r = await fetch('/?v=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const txt = await r.text();
    const m = txt.match(/name="bitacora-build" content="([^"]+)"/);
    if(!m || m[1] === BUILD_ACTUAL) return;
    avisandoVersion = true;
    const caja = document.createElement('div');
    caja.className = 'aviso-version';
    caja.innerHTML = '<span>Hay una versión nueva de Bitácora.</span><button>Actualizar</button>';
    caja.querySelector('button').onclick = ()=>location.reload();
    document.body.appendChild(caja);
  }catch(e){}
}
setTimeout(mirarVersionNueva, 4000);
setInterval(mirarVersionNueva, 15*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) mirarVersionNueva(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const habiaControlador = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (habiaControlador && !window.__recargando) {
        window.__recargando = true;
        window.location.reload();
      }
    });
  });
}
</script>
