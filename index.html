/* ============================================================
   LISTAS DE PENDIENTES
   Decision de Sharon (14 sep 2026): lo que se agrega acá NO es "para hoy".
   Se queda en su lista, sin fecha, hasta que ella lo marque; si lo quiere
   en un día concreto se lo pone a mano y recién ahí pasa a la agenda.
============================================================ */
const URGENCIAS = ['normal','importante','urgente'];
const URG_ORDEN = { urgente:0, importante:1, normal:2 };
const URG_COLOR = { normal:'var(--text-dim)', importante:'var(--accent)', urgente:'var(--urgent)' };
const COLORES_LISTA = ['var(--c-uni)','var(--c-nexxa)','var(--c-ads)','var(--c-work)','var(--c-fin)','var(--c-ciclo)','var(--c-personal)'];
/* Tres para arrancar, con los ejemplos que ella misma dio. Puede renombrarlas. */
const LISTAS_SEMILLA = [
  { nombre:'Universidad', color:'var(--c-uni)' },
  { nombre:'Aseo', color:'var(--c-work)' },
  { nombre:'Compras', color:'var(--c-fin)' },
];
let listaActiva = null;

function asegurarListas(){
  if(!Array.isArray(DATA.listas)) DATA.listas = [];
  if(!Array.isArray(DATA.pendientes)) DATA.pendientes = [];
  if(!DATA.listas.length){
    LISTAS_SEMILLA.forEach(l=> DATA.listas.push({ id:uid(), nombre:l.nombre, color:l.color }));
    saveData();
  }
  if(!listaActiva || !DATA.listas.some(l=>l.id===listaActiva)) listaActiva = DATA.listas[0].id;
}
function chipColor(color){ return `--chip-color:${color}; --chip-color-soft:color-mix(in srgb, ${color} 16%, transparent);`; }
function pendientesDe(listaId){
  /* el orden lo pone ella arrastrando, como en Keep */
  return DATA.pendientes.filter(p=>p.listaId===listaId).sort((a,b)=>
    (a.hecho?1:0)-(b.hecho?1:0) ||
    (a.orden??1e9)-(b.orden??1e9) ||
    (a.creado||'').localeCompare(b.creado||''));
}
/* Lo que ya existia sin orden queda como estaba: urgentes primero. */
function ordenarViejos(){
  DATA.listas.forEach(l=>{
    const sin = DATA.pendientes.filter(p=>p.listaId===l.id && p.orden==null);
    if(!sin.length) return;
    let base = Math.max(0, ...DATA.pendientes.filter(p=>p.listaId===l.id && p.orden!=null).map(p=>p.orden+1));
    sin.sort((a,b)=> URG_ORDEN[a.urgencia||'normal']-URG_ORDEN[b.urgencia||'normal'] || (a.creado||'').localeCompare(b.creado||''))
      .forEach(p=>{ p.orden = base++; });
  });
}
/* Un pendiente puede tener dia, la ventana en que se puede hacer (un quiz
   abierto de 8 a 8) y la hora en que ella decide hacerlo. Solo esa hora
   ocupa el dia: la ventana no. */
function colorDeLista(p){ const l = (DATA.listas||[]).find(x=>x.id===p.listaId); return l ? l.color : 'var(--accent)'; }
/* El tiempo que dan (el profe dice 60) no es lo que ella se demora. De lo que
   ya marco hecho con su tiempo real sale cuanto le toma de verdad: primero
   comparando con su misma lista, y si alli no hay con que, con todo. Hace
   falta al menos dos casos para creerle. */
function ritmoDe(p){
  const hechos = (DATA.pendientes||[]).filter(x=>x.hecho && Number(x.realMin) && Number(x.duracion) && x.id!==p.id)
    .sort((a,b)=>(b.hechoFecha||'').localeCompare(a.hechoFecha||''));
  const deLista = hechos.filter(x=>x.listaId===p.listaId);
  const base = (deLista.length>=2 ? deLista : hechos).slice(0,10);
  if(base.length<2) return null;
  const r = base.map(x=>x.realMin/x.duracion).sort((a,b)=>a-b);
  const mediana = r.length%2 ? r[(r.length-1)/2] : (r[r.length/2-1]+r[r.length/2])/2;
  return { factor: Math.min(1.5, Math.max(0.25, mediana)), casos: base.length, deLista: base===deLista };
}
function duracionEstimada(p){
  const dada = Number(p.duracion)||30;
  const ritmo = ritmoDe(p);
  return ritmo ? Math.max(10, Math.round(dada*ritmo.factor/5)*5) : dada;
}
function finDePendiente(p){ return hhmm(minutosDe(p.hora) + duracionEstimada(p)); }
function ventanaTexto(p){ return p.desde && p.hasta ? `de ${p.desde} a ${p.hasta}` : p.desde ? `desde ${p.desde}` : p.hasta ? `hasta ${p.hasta}` : ''; }
function cuandoPendiente(p){
  if(!p.fecha) return null;
  const t = todayStr(), dias = daysBetween(t, p.fecha);
  const dia = dias===0 ? 'Hoy' : dias===1 ? 'Mañana' : dias===-1 ? 'Ayer' : niceDateShort(p.fecha);
  const partes = [dia];
  const auto = !p.hecho ? horaAuto(p) : null;
  if(auto && auto.movidoPor) partes.push(`movido a ${auto.start}–${auto.end}`);
  else if(p.hora && !p.hecho) partes.push(`${p.hora}–${finDePendiente(p)}`);
  else if(auto) partes.push(`sugerido ${auto.start}–${auto.end}`);
  else if(p.hecho){ if(p.realMin) partes.push(`te tomó ${p.realMin} min`); }
  else if(!p.hecho) partes.push(ventanaTexto(p) ? `${ventanaTexto(p)} · no te cabe` : 'no te cabe');
  return { texto: partes.join(' · '), clase: p.hecho ? '' : dias<0 ? 'tarde' : dias===0 ? 'hoy' : '' };
}
function pendientesConFecha(fecha){ return (DATA.pendientes||[]).filter(p=>!p.hecho && p.fecha===fecha); }

/* Lo que tiene dia pero no hora fija lo acomoda Bitacora sola: en el primer
   hueco libre donde quepa lo que le toma, dentro de su ventana y, si es hoy,
   no antes de ahora. Se recalcula en cada pintada, asi que si le aparece
   algo nuevo en el dia, se corre sola. Cuando ella dice "ahi lo hago" o
   elige otra hora, queda fija. `cambio` deja probar un pendiente editado
   sin guardarlo (lo usa la ficha). */
function acomodarDia(fecha, cambio){
  const firmes = bloquesFijos(fecha);
  const delDia = (DATA.pendientes||[]).map(p=>cambio && p.id===cambio.id ? cambio : p)
    .filter(p=>!p.hecho && p.fecha===fecha);
  if(cambio && !cambio.hecho && cambio.fecha===fecha && !delDia.includes(cambio)) delDia.push(cambio);
  const ventanaDe = p => ventanaTexto(p) ? 'Se puede ' + ventanaTexto(p) : '';
  const lugar = {}, fijos = [...firmes], aMover = [];

  /* la hora que ella fijo se respeta, salvo que le caiga encima algo firme
     (un turno, una clase, una cita): ahi se corre sola */
  delDia.filter(p=>p.hora).forEach(p=>{
    const d = minutosDe(p.hora), h = d + duracionEstimada(p);
    const choca = firmes.find(f=>{ const fd = minutosDe(f.start), fh = finEnMinutos(f.start, f.end||f.start); return fd!==null && fh!==null && d < fh && fd < h; });
    if(choca){ aMover.push({ p, por: choca.titulo }); return; }
    const b = { titulo:p.titulo, start:p.hora, end:hhmm(h), color:colorDeLista(p), lugar:ventanaDe(p), pend:p };
    fijos.push(b); lugar[p.id] = b;
  });

  const autos = [...aMover, ...delDia.filter(p=>!p.hora).map(p=>({ p }))]
    .sort((a,b)=> URG_ORDEN[a.p.urgencia||'normal']-URG_ORDEN[b.p.urgencia||'normal'] || (a.p.orden??1e9)-(b.p.orden??1e9));
  const ahora = new Date();
  const minAhora = fecha===todayStr() ? Math.ceil((ahora.getHours()*60 + ahora.getMinutes())/15)*15 : null;
  const puestos = [];
  autos.forEach(({ p, por })=>{
    const dur = duracionEstimada(p);
    const lo = Math.max(DIA_DESDE, minutosDe(p.desde) ?? 0, minAhora ?? 0);
    const hi = Math.min(DIA_HASTA, minutosDe(p.hasta) ?? 1440);
    const huecos = huecosDelDia([...fijos, ...puestos]).map(h=>({ desde:Math.ceil(Math.max(h.desde, lo)/15)*15, hasta:Math.min(h.hasta, hi) }))
      .filter(h=>h.hasta - h.desde >= dur);
    if(!huecos.length){ lugar[p.id] = null; return; }
    /* lo nuevo va al primer hueco; lo que se corrio por un choque, al rato
       libre mas cercano a la hora que ella habia puesto */
    let inicio = huecos[0].desde;
    if(por){
      const quiso = minutosDe(p.hora);
      const candidatos = huecos.flatMap(h=>[h.desde, Math.floor((h.hasta-dur)/15)*15].filter(x=>x>=h.desde && x+dur<=h.hasta));
      inicio = candidatos.sort((x,y)=>Math.abs(x-quiso)-Math.abs(y-quiso))[0];
    }
    const h = { desde:inicio };
    const b = { titulo:p.titulo, start:hhmm(h.desde), end:hhmm(h.desde+dur), color:colorDeLista(p),
      lugar: por ? `Se movió: a las ${p.hora} se cruzaba con ${por}` : ventanaDe(p), pend:p, auto:true, movidoPor:por||null };
    puestos.push(b); lugar[p.id] = b;
  });
  return { fijos, puestos, lugar };
}
function horaAuto(p, cambio){
  if(!p.fecha || p.hecho) return null;
  const b = acomodarDia(p.fecha, cambio).lugar[p.id] || null;
  return b && b.auto ? b : null;
}

function pendienteHTML(p){
  const urg = p.urgencia || 'normal';
  return `<div class="kitem ${p.hecho?'hecho':''}" data-sel-tipo="pendiente" data-sel-id="${p.id}" data-pid="${p.id}">
    ${p.hecho ? '<span class="kdrag" style="visibility:hidden"></span>' : '<span class="kdrag" aria-label="Arrastrar para ordenar">⠿</span>'}
    <button class="kcheck ${p.hecho?'hecho':''}" data-action="togglePend" data-pid="${p.id}" aria-label="${p.hecho?'Desmarcar':'Marcar hecho'}"></button>
    <div class="ktxt" data-action="editPend" data-pid="${p.id}">${esc(p.titulo)}${(c=>c?`<span class="kcuando ${c.clase}">📅 ${esc(c.texto)}</span>`:'')(cuandoPendiente(p))}</div>
    ${urg!=='normal' && !p.hecho ? `<span class="kurg" style="color:${URG_COLOR[urg]}">${urg}</span>` : ''}
  </div>`;
}

function renderListas(){
  asegurarListas();
  ordenarViejos();
  document.getElementById('listasBody').innerHTML = DATA.listas.map(l=>{
    const items = pendientesDe(l.id);
    const faltan = items.filter(p=>!p.hecho), hechas = items.filter(p=>p.hecho);
    const urgentes = faltan.filter(p=>p.urgencia==='urgente').length;
    const resumen = urgentes ? urgentes + ' urgente' + (urgentes>1?'s':'') + ' · ' + faltan.length : faltan.length ? String(faltan.length) : 'vacía';
    const verHechas = PLEG_ABIERTAS.has('hechas:'+l.id);
    const nota = `<div class="keep" data-lista="${l.id}">
        <div class="kpendientes">${faltan.map(pendienteHTML).join('')}</div>
        <div class="kadd" data-action="nuevoItem" data-lista="${l.id}"><span class="mas">+</span><span>Elemento de la lista</span></div>
        ${hechas.length ? `<button class="khechos ${verHechas?'abierto':''}" data-action="verHechas" data-lista="${l.id}"><span class="chev">›</span>${hechas.length} elemento${hechas.length>1?'s':''} completado${hechas.length>1?'s':''}</button>
          <div ${verHechas?'':'hidden'}>${hechas.map(pendienteHTML).join('')}</div>` : ''}
      </div>
      <div class="kpie">
        ${hechas.length ? `<button class="klink" data-action="limpiarLista" data-lista="${l.id}">Borrar completados</button>` : ''}
        <button class="klink" data-action="editarLista" data-lista="${l.id}">Editar lista</button>
      </div>`;
    return plegable('lista:'+l.id, `<span class="punto" style="background:${l.color}"></span>${esc(l.nombre)}`, resumen, nota, urgentes>0);
  }).join('');

  bindPendClicks();
}

function bindPendClicks(){
  document.querySelectorAll('[data-action="editarLista"]').forEach(b=>{
    b.onclick = ()=>openListaModal(DATA.listas.find(l=>l.id===b.dataset.lista));
  });
  document.querySelectorAll('[data-action="limpiarLista"]').forEach(b=>{
    b.onclick = ()=>{
      const n = DATA.pendientes.filter(p=>p.listaId===b.dataset.lista && p.hecho).length;
      if(!confirm(`¿Borrar ${n} completado${n>1?'s':''}?`)) return;
      DATA.pendientes = DATA.pendientes.filter(p=>!(p.listaId===b.dataset.lista && p.hecho));
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('[data-action="togglePend"]').forEach(b=>{
    b.onclick = ()=>{
      const p = DATA.pendientes.find(x=>x.id===b.dataset.pid);
      if(!p) return;
      if(!p.hecho && p.fecha){ marcarPendienteHecho(p); return; }
      p.hecho = !p.hecho;
      /* al desmarcarlo vuelve al final de lo pendiente, como en Keep */
      if(!p.hecho) p.orden = Math.max(0, ...DATA.pendientes.filter(x=>x.listaId===p.listaId && !x.hecho && x!==p).map(x=>(x.orden??0)+1));
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('[data-action="verHechas"]').forEach(b=>{
    b.onclick = ()=>{
      const key = 'hechas:'+b.dataset.lista, abrir = !b.classList.contains('abierto');
      b.classList.toggle('abierto', abrir);
      b.nextElementSibling.hidden = !abrir;
      abrir ? PLEG_ABIERTAS.add(key) : PLEG_ABIERTAS.delete(key);
      try{ localStorage.setItem('plataAbiertas', JSON.stringify([...PLEG_ABIERTAS])); }catch(e){}
    };
  });
  document.querySelectorAll('#listasBody [data-action="editPend"]').forEach(t=>{ t.onclick = ()=>editarEnSitio(t); });
  document.querySelectorAll('[data-action="nuevoItem"]').forEach(a=>{ a.onclick = ()=>escribirNuevo(a.dataset.lista); });
  document.querySelectorAll('#listasBody .kdrag').forEach(h=>engancharArrastre(h));
}

/* Tocar el texto lo vuelve editable ahi mismo. Enter guarda y abre el
   siguiente; si queda vacio, se borra. La equis lo borra y los tres puntos
   abren lo demas (urgencia, lista, fecha). */
function editarEnSitio(txt){
  if(seleccionando()) return;
  const p = DATA.pendientes.find(x=>x.id===txt.dataset.pid); if(!p) return;
  const fila = txt.closest('.kitem');
  const inp = document.createElement('input');
  inp.className = 'kinput'; inp.value = p.titulo; inp.enterKeyHint = 'next';
  txt.replaceWith(inp);
  const mas = document.createElement('button'); mas.className = 'kbtn'; mas.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'; mas.setAttribute('aria-label','Fecha, hora y más');
  const x = document.createElement('button'); x.className = 'kbtn'; x.textContent = '✕'; x.setAttribute('aria-label','Eliminar');
  fila.querySelector('.kurg')?.remove();
  fila.append(mas, x);
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  let hecho = false;
  const terminar = (siguiente)=>{
    if(hecho) return; hecho = true;
    const val = inp.value.trim();
    if(!val) DATA.pendientes = DATA.pendientes.filter(q=>q.id!==p.id);
    else p.titulo = val;
    saveData();
    if(siguiente){ renderAll(); escribirNuevo(p.listaId); return; }
    /* al salir tocando otra cosa no se repinta todo: si no, ese toque se pierde */
    if(!val){ fila.remove(); return; }
    const nueva = document.createElement('div');
    nueva.innerHTML = pendienteHTML(p);
    const el = nueva.firstElementChild;
    fila.replaceWith(el);
    engancharFila(el);
  };
  /* pointerdown en vez de click: si no, el blur del campo llega primero */
  x.onpointerdown = (ev)=>{ ev.preventDefault(); hecho = true; DATA.pendientes = DATA.pendientes.filter(q=>q.id!==p.id); saveData(); renderAll(); };
  mas.onpointerdown = (ev)=>{ ev.preventDefault(); const val = inp.value.trim(); if(val) p.titulo = val; hecho = true; saveData(); renderAll(); openPendienteModal(p); };
  inp.onkeydown = (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); terminar(true); } else if(ev.key==='Escape'){ inp.value = p.titulo; terminar(false); } };
  inp.onblur = ()=>terminar(false);
}

function escribirNuevo(listaId){
  abrirPlegable('lista:'+listaId);
  const cont = document.querySelector(`#listasBody .kadd[data-lista="${listaId}"]`);
  if(!cont) return;
  const pleg = cont.closest('.pleg');
  if(pleg && !pleg.classList.contains('abierta')){ pleg.classList.add('abierta'); pleg.querySelector('.pleg-body').hidden = false; }
  cont.innerHTML = '<span class="mas">+</span>';
  const inp = document.createElement('input');
  inp.className = 'kinput'; inp.placeholder = 'Elemento de la lista'; inp.enterKeyHint = 'next';
  cont.appendChild(inp); cont.onclick = null;
  inp.focus();
  const guardar = ()=>{
    const val = inp.value.trim(); if(!val) return false;
    const orden = Math.max(0, ...DATA.pendientes.filter(x=>x.listaId===listaId && !x.hecho).map(x=>(x.orden??0)+1));
    DATA.pendientes.push({ id:uid(), listaId, titulo:val, urgencia:'normal', hecho:false, creado:new Date().toISOString(), orden });
    return true;
  };
  let listo = false;
  inp.onkeydown = (ev)=>{
    if(ev.key==='Enter'){ ev.preventDefault(); listo = true; if(guardar()){ saveData(); renderAll(); escribirNuevo(listaId); } else { renderListas(); } }
    else if(ev.key==='Escape'){ listo = true; renderListas(); }
  };
  inp.onblur = ()=>{
    if(listo) return; listo = true;
    const guardo = guardar();
    if(guardo){
      saveData();
      const tmp = document.createElement('div');
      tmp.innerHTML = pendienteHTML(DATA.pendientes[DATA.pendientes.length-1]);
      const el = tmp.firstElementChild;
      cont.closest('.keep').querySelector('.kpendientes').appendChild(el);
      engancharFila(el);
    }
    cont.innerHTML = '<span class="mas">+</span><span>Elemento de la lista</span>';
    cont.onclick = ()=>escribirNuevo(listaId);
  };
}
function engancharFila(el){
  el.querySelector('[data-action="editPend"]').onclick = (ev)=>editarEnSitio(ev.currentTarget);
  el.querySelector('[data-action="togglePend"]').onclick = ()=>{
    const p = DATA.pendientes.find(x=>x.id===el.dataset.pid); if(!p) return;
    if(!p.hecho && p.fecha){ marcarPendienteHecho(p); return; }
    p.hecho = !p.hecho; saveData(); renderAll();
  };
  const h = el.querySelector('.kdrag'); if(h && h.textContent) engancharArrastre(h);
}

/* Arrastrar desde los puntitos para cambiar el orden. */
function engancharArrastre(handle){
  handle.onpointerdown = (ev)=>{
    ev.preventDefault();
    const fila = handle.closest('.kitem'), cont = fila.parentElement;
    fila.classList.add('arrastrando');
    let y0 = ev.clientY, movio = false;
    /* se escucha en la ventana: al mover la fila en el DOM el navegador suelta
       la captura del puntero y el soltar no llegaria */
    const mover = (e)=>{
      e.preventDefault();
      if(Math.abs(e.clientY - ev.clientY) > 3) movio = true;
      fila.style.transform = `translateY(${e.clientY - y0}px)`;
      const centro = fila.getBoundingClientRect().top + fila.offsetHeight/2;
      const hermanos = [...cont.children].filter(c=>c!==fila);
      const ref = hermanos.find(c=>{ const r = c.getBoundingClientRect(); return centro < r.top + r.height/2; }) || null;
      if(ref !== fila.nextElementSibling && !(ref===null && cont.lastElementChild===fila)){
        fila.style.transform = '';
        const topAntes = fila.getBoundingClientRect().top;
        cont.insertBefore(fila, ref);
        y0 += fila.getBoundingClientRect().top - topAntes;
        fila.style.transform = `translateY(${e.clientY - y0}px)`;
      }
    };
    const soltar = ()=>{
      removeEventListener('pointermove', mover);
      removeEventListener('pointerup', soltar);
      removeEventListener('pointercancel', soltar);
      fila.classList.remove('arrastrando'); fila.style.transform = '';
      if(!movio) return;
      [...cont.querySelectorAll('.kitem')].forEach((c,i)=>{ const q = DATA.pendientes.find(x=>x.id===c.dataset.pid); if(q) q.orden = i; });
      saveData(); renderAll();
    };
    addEventListener('pointermove', mover, { passive:false });
    addEventListener('pointerup', soltar);
    addEventListener('pointercancel', soltar);
  };
}

/* Editar un pendiente: texto, lista, urgencia, o pasarlo a un día de la agenda. */
function openPendienteModal(p){
  const DUR = [[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 hora'],[90,'1 h 30'],[120,'2 horas'],[180,'3 horas']];
  openSheet(`<h3>Pendiente</h3>
    <div class="field"><label>¿Qué hay que hacer?</label><input type="text" id="f_ptitulo" value="${esc(p.titulo)}"></div>
    <div class="field-row">
      <div class="field"><label>Día</label><input type="date" id="f_pfecha" value="${esc(p.fecha||'')}"></div>
      <div class="field"><label>Tiempo que dan</label><select id="f_pdur">${DUR.map(([v,l])=>`<option value="${v}" ${Number(p.duracion||30)===v?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div id="f_pconfecha" ${p.fecha?'':'hidden'}>
      <div class="field-row">
        <div class="field"><label>Se puede desde</label><input type="time" id="f_pdesde" value="${esc(p.desde||'')}"></div>
        <div class="field"><label>Hasta</label><input type="time" id="f_phasta" value="${esc(p.hasta||'')}"></div>
      </div>
      <div class="helptext" style="margin:-8px 0 14px;">Opcional. Ej: un quiz abierto de 8:00 a 20:00.</div>
      <div id="f_pplan"></div>
    </div>
    <div class="field"><label>Lista</label><div class="chiprow" id="chipsListaP">
      ${DATA.listas.map(l=>`<div class="chip ${l.id===p.listaId?'active':''}" data-lista="${l.id}" style="${chipColor(l.color)}">${esc(l.nombre)}</div>`).join('')}
    </div></div>
    <div class="field"><label>Urgencia</label><div class="chiprow" id="chipsUrg">
      ${URGENCIAS.map(u=>`<div class="chip ${u===(p.urgencia||'normal')?'active':''}" data-urg="${u}" style="${chipColor(URG_COLOR[u])}">${u}</div>`).join('')}
    </div></div>
    <div class="sheet-actions"><button class="btn btn-danger" id="delPend">Eliminar</button><button class="btn btn-primary" id="savePend">Guardar</button></div>`);
  const g = id => document.getElementById(id);
  let plista = p.listaId, purg = p.urgencia || 'normal';
  let horaFija = p.hora || '';          // vacio = que Bitacora lo acomode
  let eligiendo = false;

  const borrador = ()=>Object.assign({}, p, { fecha:g('f_pfecha').value, desde:g('f_pdesde').value, hasta:g('f_phasta').value,
    duracion:Number(g('f_pdur').value)||30, hora:horaFija, urgencia:purg, horaFin:'' });

  const pintarPlan = ()=>{
    const d = borrador();
    g('f_pconfecha').hidden = !d.fecha;
    const caja = g('f_pplan');
    if(!d.fecha){ caja.innerHTML = ''; return; }
    const ventana = minutosDe(d.desde)!==null || minutosDe(d.hasta)!==null;

    const ritmo = ritmoDe(d), est = duracionEstimada(d);
    const notaRitmo = ritmo && est !== d.duracion
      ? `<div class="helptext" style="margin:6px 0 0;">Dan ${d.duracion} min, pero ${ritmo.deLista?'en esta lista ':''}sueles tardar ${est<d.duracion?'menos':'más'}: te guardo ${est} min.</div>` : '';
    const lugarD = acomodarDia(d.fecha, d).lugar[p.id];
    if(horaFija && !eligiendo && lugarD && lugarD.movidoPor){
      caja.innerHTML = `<div class="plan-box ojo"><div class="qd">A las ${horaFija} se te cruza con <b>${esc(lugarD.movidoPor)}</b>. Lo corrí a <b>${lugarD.start}–${lugarD.end}</b>.</div>${notaRitmo}
        <div class="acc"><button class="small-btn" id="pl_si" data-hora="${lugarD.start}">Dejarlo ahí</button><button class="small-btn" id="pl_otra">Otra hora</button></div></div>`;
    } else if(horaFija && !eligiendo){
      caja.innerHTML = `<div class="plan-box"><div class="qd">Lo haces a las <b>${horaFija}–${finDePendiente(d)}</b>. Lo fijaste tú.</div>${notaRitmo}
        <div class="acc"><button class="small-btn" id="pl_otra">Cambiar hora</button><button class="small-btn" id="pl_auto">Que Bitácora lo acomode</button></div></div>`;
    } else if(!eligiendo){
      const auto = acomodarDia(d.fecha, Object.assign(d, { hora:'' })).lugar[p.id];
      caja.innerHTML = auto
        ? `<div class="plan-box"><div class="qd">Bitácora te lo acomoda a las <b>${auto.start}–${auto.end}</b>, en tu primer hueco libre${ventana?' dentro de la ventana':''}.</div>
            ${notaRitmo}<div class="helptext" style="margin:4px 0 0;">Si se te llena ese rato, se corre sola.</div>
            <div class="acc"><button class="small-btn" id="pl_si" data-hora="${auto.start}">Sí, ahí lo hago</button><button class="small-btn" id="pl_otra">Otra hora</button></div></div>`
        : `<div class="plan-box ojo"><div class="qd">Ese día no te queda un hueco de ${est} min${ventana?' dentro de la ventana':''}.</div>
            <div class="acc"><button class="small-btn" id="pl_otra">Ponerle hora igual</button></div></div>`;
    } else {
      const bloques = bloquesDeFecha(d.fecha).filter(b=>!(b.pend && b.pend.id===p.id));
      const vD = minutosDe(d.desde), vH = minutosDe(d.hasta);
      const huecos = huecosDelDia(bloques).map(h=>({ desde:Math.max(h.desde, vD ?? h.desde), hasta:Math.min(h.hasta, vH ?? h.hasta) }))
        .filter(h=>h.hasta - h.desde >= est);
      caja.innerHTML = `<div class="plan-box">
          <div class="field" style="margin-bottom:8px;"><label>Lo hago a las</label><input type="time" id="pl_hora" value="${esc(horaFija)}"></div>
          ${huecos.length ? `<div class="helptext" style="margin:0 0 6px;">Libres ese día:</div><div class="huecos-sug" style="margin:0;">${huecos.map(h=>`<div class="chip" data-hora="${hhmm(h.desde)}">${hhmm(h.desde)}–${hhmm(h.hasta)}</div>`).join('')}</div>` : ''}
          <div class="acc"><button class="small-btn" id="pl_auto">Mejor que lo acomode Bitácora</button></div></div>`;
      g('pl_hora').onchange = ()=>{ horaFija = g('pl_hora').value; };
      caja.querySelectorAll('.huecos-sug [data-hora]').forEach(c=>c.onclick=()=>{ horaFija = c.dataset.hora; eligiendo = false; pintarPlan(); });
    }
    const on = (id, fn)=>{ const el = g(id); if(el) el.onclick = fn; };
    on('pl_si', ()=>{ horaFija = g('pl_si').dataset.hora; eligiendo = false; pintarPlan(); });
    on('pl_otra', ()=>{ eligiendo = true; pintarPlan(); });
    on('pl_auto', ()=>{ horaFija = ''; eligiendo = false; pintarPlan(); });
  };
  ['f_pfecha','f_pdesde','f_phasta','f_pdur'].forEach(id=>g(id).addEventListener('change', pintarPlan));
  pintarPlan();

  document.querySelectorAll('#chipsListaP .chip').forEach(c=>{
    c.onclick = ()=>{ document.querySelectorAll('#chipsListaP .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); plista = c.dataset.lista; };
  });
  document.querySelectorAll('#chipsUrg .chip').forEach(c=>{
    c.onclick = ()=>{ document.querySelectorAll('#chipsUrg .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); purg = c.dataset.urg; pintarPlan(); };
  });
  g('delPend').onclick = ()=>{
    DATA.pendientes = DATA.pendientes.filter(x=>x.id!==p.id);
    saveData(); closeSheet(); renderAll(); refrescarDiaCalendario();
  };
  g('savePend').onclick = ()=>{
    const titulo = g('f_ptitulo').value.trim();
    if(!titulo){ alert('Escribe qué hay que hacer'); return; }
    if(eligiendo && g('pl_hora')) horaFija = g('pl_hora').value;
    const fecha = g('f_pfecha').value;
    const d = Object.assign(borrador(), { titulo, listaId:plista, hora: fecha ? horaFija : '' });
    if(d.hora && d.desde && d.hora < d.desde && !confirm(`Lo pones a las ${d.hora}, antes de que abra (${d.desde}). ¿Así?`)) return;
    if(d.hora && d.hasta && finDePendiente(d) > d.hasta && !confirm(`Terminarías a las ${finDePendiente(d)}, después del cierre (${d.hasta}). ¿Así?`)) return;
    Object.assign(p, { titulo, listaId:plista, urgencia:purg, fecha,
      desde: fecha ? d.desde : '', hasta: fecha ? d.hasta : '', hora: d.hora, duracion: d.duracion, horaFin:'' });
    saveData(); closeSheet(); renderAll(); refrescarDiaCalendario();
  };
}
/* Marcar hecho algo con fecha: pregunta cuanto tomo (para aprender su ritmo)
   y, si termino antes, ofrece adelantar lo que venia despues. */
function marcarPendienteHecho(p){
  const t = todayStr(), ahora = new Date(), minAhora = ahora.getHours()*60 + ahora.getMinutes();
  const bloque = p.fecha ? acomodarDia(p.fecha).lugar[p.id] : null;
  p.hecho = true; p.hechoFecha = t;
  saveData(); renderAll(); refrescarDiaCalendario();
  if(!p.fecha) return;

  const dada = Number(p.duracion)||30;
  const ini = bloque ? minutosDe(bloque.start) : null, fin = bloque ? minutosDe(bloque.end) : null;
  const enSuRato = bloque && p.fecha===t && minAhora > ini && minAhora <= fin + 30;
  const sugerido = enSuRato ? Math.max(5, Math.round((minAhora-ini)/5)*5) : null;
  const opciones = [...new Set([sugerido, 15, 30, 45, 60, 90, 120].filter(Boolean))].sort((a,b)=>a-b);
  openSheet(`<h3>¡Hecho! ¿Cuánto te tomó?</h3>
    <div class="helptext" style="margin:-8px 0 14px;">Daban ${dada} min. Con esto aprendo cuánto te demoras de verdad y te acomodo mejor lo que viene.</div>
    <div class="chiprow" id="realChips" style="flex-wrap:wrap;">${opciones.map(m=>`<div class="chip ${m===sugerido?'active':''}" data-min="${m}">${m} min${m===sugerido?' · desde que empezó':''}</div>`).join('')}</div>
    <div class="field" style="margin-top:12px;"><label>Otro</label><input type="number" id="realOtro" inputmode="numeric" min="1" placeholder="minutos"></div>
    <div class="sheet-actions"><button class="btn btn-ghost" id="realNo">No sé</button><button class="btn btn-primary" id="realSi">Guardar</button></div>`);
  let elegido = sugerido;
  document.querySelectorAll('#realChips .chip').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('#realChips .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
    elegido = Number(c.dataset.min); document.getElementById('realOtro').value = '';
  });
  document.getElementById('realNo').onclick = ()=>{ closeSheet(); ofrecerAdelantar(p, bloque); };
  document.getElementById('realSi').onclick = ()=>{
    const otro = Number(document.getElementById('realOtro').value);
    const min = otro > 0 ? otro : elegido;
    if(min){ p.realMin = min; saveData(); }
    closeSheet(); renderAll(); refrescarDiaCalendario();
    ofrecerAdelantar(p, bloque);
  };
}

/* Si termino antes de lo que tenia guardado, lo que venia despues puede
   correrse. Lo automatico ya se corre solo; lo que ella fijo, se lo pregunta. */
function ofrecerAdelantar(p, bloque){
  const t = todayStr();
  if(!bloque || p.fecha!==t) return;
  const ahora = new Date(), minAhora = ahora.getHours()*60 + ahora.getMinutes();
  const libre = minutosDe(bloque.end) - minAhora;
  if(libre < 10) return;
  const { lugar } = acomodarDia(t);
  const siguientes = pendientesConFecha(t).map(q=>({ q, b:lugar[q.id] }))
    .filter(x=>x.b && minutosDe(x.b.start) >= minAhora).sort((a,b)=>minutosDe(a.b.start)-minutosDe(b.b.start));
  const fijos = siguientes.filter(x=>!x.b.auto).map(x=>{
    const antes = acomodarDia(t, Object.assign({}, x.q, { hora:'' })).lugar[x.q.id];
    return antes && minutosDe(antes.start) < minutosDe(x.b.start) ? { ...x, nueva:antes.start } : null;

  const autos = siguientes.filter(x=>x.b.auto);
  const sinFecha = (DATA.pendientes||[]).filter(q=>!q.hecho && !q.fecha).sort((a,b)=>URG_ORDEN[a.urgencia||'normal']-URG_ORDEN[b.urgencia||'normal'])[0];

  openSheet(`<h3>Te sobraron ${duracionLarga(libre)}</h3>

/* ============================================================
   UNIVERSIDAD Y NOTAS
   Los porcentajes se ponen materia por materia, libres: no se asume
   ningun esquema de cortes (D114).
============================================================ */
function uniCfg(){ DATA.uni = DATA.uni || { pasaCon:3.0, maxFallas:8, historial:[] }; return DATA.uni; }
function cortesDe(s){ return s.cortes || (s.cortes = []); }

/* Con lo evaluado hasta ahora: cuanto lleva, cuanto del total ya se jugo, y
   cuanto necesita en lo que falta para pasar (D90). */
function estadoMateria(s){
  /* Si ya le dieron la definitiva, no hay nada que estimar: esa es la nota. */
  if(s.definitiva !== null && s.definitiva !== undefined && s.definitiva !== ''){
    return { total:100, evaluado:100, falta:0, nota:Number(s.definitiva),
             acumulado:Number(s.definitiva), necesita:null, imposible:false,
             yaPaso:Number(s.definitiva) >= uniCfg().pasaCon, esDefinitiva:true };
  }
  const cortes = cortesDe(s);
  const total = cortes.reduce((a,c)=>a+Number(c.pct||0), 0);
  const puestos = cortes.filter(c=>c.nota!==null && c.nota!=='' && c.nota!==undefined);
  const evaluado = puestos.reduce((a,c)=>a+Number(c.pct||0), 0);
  const acumulado = puestos.reduce((a,c)=>a+Number(c.nota)*Number(c.pct||0), 0) / 100;
  const nota = evaluado ? (acumulado * 100 / evaluado) : null;
  const falta = total - evaluado;
  const pasa = uniCfg().pasaCon;
  let necesita = null;
  if(falta > 0) necesita = (pasa * total / 100 - acumulado) * 100 / falta;
  return { total, evaluado, falta, nota, acumulado, necesita,
           imposible: necesita !== null && necesita > 5,
           yaPaso: necesita !== null && necesita <= 0 };
}

/* El promedio es de toda la carrera, no solo del bimestre (D100). */
function promedioCarrera(){
  const notas = [];
  (uniCfg().historial||[]).forEach(p=>(p.materias||[]).forEach(m=>{ if(Number(m.nota)) notas.push(Number(m.nota)); }));
  DATA.subjects.forEach(s=>{ const e = estadoMateria(s); if(e.nota!==null) notas.push(e.nota); });
  if(!notas.length) return null;
  return notas.reduce((a,n)=>a+n,0) / notas.length;
}
function nota1(n){ return n===null||n===undefined ? '—' : Number(n).toFixed(1).replace('.', ','); }
function fallasTotales(){ return DATA.subjects.reduce((a,s)=>a+Number(s.fallas||0), 0); }

/* ============================================================
   MARCA PERSONAL
   Ideas de contenido, calendario de publicaciones y resultados (D73).
   Los clientes no viven aca: viven en Trabajo con la etiqueta de donde
   llegaron, y de ahi sale cuantos trajo la marca (D76, D82).
============================================================ */
const ESTADOS_IDEA = { idea:'Idea', grabando:'Grabando', listo:'Listo para publicar' };
const REDES = ['Instagram','TikTok','LinkedIn','WhatsApp','Otra'];
/* Las etapas son las de su parrilla de Excel, en su orden. */
const ETAPAS = ['Por grabar','Grabado','En edición','Programado','Publicado'];
function etapaDe(p){ return p.etapa || (p.estado==='publicada' ? 'Publicado' : 'Programado'); }
function ponerEtapa(p, etapa){
  p.etapa = etapa;
  p.estado = etapa==='Publicado' ? 'publicada' : 'planeada';
}

/* Lo que Instagram le da de cada publicacion. Todo opcional: pone lo que tenga. */
const METRICAS = [
  { k:'alcance',     l:'Alcance',            ph:'cuentas alcanzadas' },
  { k:'vistas',      l:'Reproducciones',     ph:'vistas' },
  { k:'likes',       l:'Me gusta',           ph:'' },
  { k:'comentarios', l:'Comentarios',        ph:'' },
  { k:'compartidos', l:'Compartidos',        ph:'' },
  { k:'guardados',   l:'Guardados',          ph:'' },
  { k:'seguidores',  l:'Seguidores nuevos',  ph:'' },
  { k:'respuestas',  l:'Mensajes (DM)',      ph:'te escribieron' },
  { k:'leads',       l:'Leads',              ph:'pidieron info o la palabra clave' },
  { k:'cierres',     l:'Clientes',           ph:'se volvieron clientes' },
];
const num = v => Number(v)||0;
function tieneNumeros(p){ return METRICAS.some(m=>num(p[m.k])>0); }
function interacciones(p){ return num(p.likes)+num(p.comentarios)+num(p.compartidos)+num(p.guardados); }
/* "Carrusel (6 slides)" y "Carrusel (7 slides)" son el mismo formato */
function formatoCorto(f){ return String(f||'Sin formato').split(/[(+\/]/)[0].trim() || 'Sin formato'; }
function mesAnterior(mes){ const [y,m]=mes.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function nombreMes(mes){ const [y,m]=mes.split('-').map(Number); return MONTHS[m-1] + (y!==new Date().getFullYear() ? ' '+y : ''); }
function milesCO(n){ return Math.round(n).toLocaleString('es-CO'); }
function cambioPct(ahora, antes){
  if(!antes) return ahora ? { t:'nuevo', c:'igual' } : { t:'', c:'igual' };
  const pct = Math.round((ahora-antes)/antes*100);
  if(pct===0) return { t:'igual que antes', c:'igual' };
  return { t:(pct>0?'↑ ':'↓ ')+Math.abs(pct)+'%', c: pct>0?'sube':'baja' };
}

/* Lee los numeros del mes y los dice en palabras. Solo afirma lo que los
   datos sostienen: con una sola publicacion no hay comparacion que hacer. */
function informeMarca(M, mes){
  const pubs = M.publicaciones.filter(p=>etapaDe(p)==='Publicado' && (p.fecha||'').startsWith(mes));
  const conDatos = pubs.filter(tieneNumeros);
  const antes = M.publicaciones.filter(p=>etapaDe(p)==='Publicado' && (p.fecha||'').startsWith(mesAnterior(mes)) && tieneNumeros(p));
  const total = (lista, k) => lista.reduce((a,p)=>a+(k==='inter'?interacciones(p):num(p[k])),0);
  const prom = (lista, k) => lista.length ? total(lista,k)/lista.length : 0;
  const nAntes = nombreMes(mesAnterior(mes));
  const hallazgos = [];

  /* frente al mes anterior, por publicacion para que publicar mas o menos no engañe */
  if(conDatos.length && antes.length){
    const suben = [], bajan = [];
    [['alcance','alcance'],['inter','interacciones'],['guardados','guardados'],['seguidores','seguidores'],['respuestas','mensajes'],['leads','leads']].forEach(([k,nom])=>{
      const a = prom(conDatos,k), b = prom(antes,k);
      if(!b) return;
      if((a-b)/b >= 0.15) suben.push(nom); else if((b-a)/b >= 0.15) bajan.push(nom);
    });
    const lista = l => l.length>1 ? l.slice(0,-1).join(', ')+' y '+l[l.length-1] : l[0];
    if(suben.length) hallazgos.push({ t:`Mejoraste frente a ${nAntes}: cada publicación trae más ${lista(suben)}.` });
    if(bajan.length) hallazgos.push({ ojo:true, t:`Bajó frente a ${nAntes}: ${lista(bajan)} por publicación. Mira qué cambió en el formato o el tema.` });
    if(!suben.length && !bajan.length) hallazgos.push({ t:`Vas parecido a ${nAntes}: ningún número se movió más de 15% por publicación.` });
  }
  if(conDatos.length>=2){
    const top = [...conDatos].sort((a,b)=>num(b.alcance)-num(a.alcance))[0];
    if(num(top.alcance)) hallazgos.push({ t:`La que más gente alcanzó: «${top.titulo}», con ${milesCO(num(top.alcance))}.` });
    const conv = [...conDatos].sort((a,b)=>(num(b.respuestas)+num(b.leads))-(num(a.respuestas)+num(a.leads)))[0];
    const nConv = num(conv.respuestas)+num(conv.leads);
    if(nConv && conv!==top) hallazgos.push({ t:`La que más conversaciones abrió: «${conv.titulo}», con ${nConv} entre mensajes y leads. Alcance no es lo mismo que clientes.` });
    else if(nConv) hallazgos.push({ t:`Además fue la que más conversaciones abrió: ${nConv} entre mensajes y leads.` });

    const agrupar = campo => {
      const g = {};
      conDatos.forEach(p=>{ const k = campo==='formato' ? formatoCorto(p.formato) : (p.pilar||'Sin pilar'); (g[k]=g[k]||[]).push(p); });
      return Object.entries(g).map(([k,l])=>({ k, n:l.length, alcance:prom(l,'alcance'), inter:prom(l,'inter'), guardados:prom(l,'guardados'), conv:prom(l,'respuestas')+prom(l,'leads') }));
    };
    const formatos = agrupar('formato'), pilares = agrupar('pilar');
    const mejor = (lista, k) => lista.length>=2 ? [...lista].sort((a,b)=>b[k]-a[k]) : null;
    const f = mejor(formatos,'guardados');
    if(f && f[0].guardados && f[0].guardados >= f[1].guardados*1.3)
      hallazgos.push({ t:`${f[0].k} es el formato que más se guarda: ${milesCO(f[0].guardados)} por publicación, contra ${milesCO(f[1].guardados)} de ${f[1].k}.` });
    const fa = mejor(formatos,'alcance');
    if(fa && fa[0].alcance && fa[0].alcance >= fa[1].alcance*1.3 && (!f || fa[0].k!==f[0].k))
      hallazgos.push({ t:`${fa[0].k} es el que más alcanza: ${milesCO(fa[0].alcance)} por publicación.` });
    const pc = mejor(pilares,'conv');
    if(pc && pc[0].conv >= 1) hallazgos.push({ t:`El pilar que más conversaciones trae es ${pc[0].k}: ${pc[0].conv.toLocaleString('es-CO',{maximumFractionDigits:1})} por publicación. Por ahí están los clientes.` });
    hallazgos.formatos = formatos;
  }
  const alcTot = total(conDatos,'alcance');
  if(alcTot && total(conDatos,'inter')){
    const tasa = total(conDatos,'inter')/alcTot*100;
    hallazgos.push({ t:`De cada 100 personas que te vieron, ${tasa.toLocaleString('es-CO',{maximumFractionDigits:1})} interactuaron.` });
  }
  if(conDatos.length>=2 && conDatos.length<6) hallazgos.push({ t:'Son pocas publicaciones todavía: lo de formatos y pilares tómalo como pista, no como regla.' });
  const sinDatos = pubs.length - conDatos.length;
  if(sinDatos) hallazgos.push({ ojo:true, t:`${sinDatos} publicada${sinDatos>1?'s':''} sin números. Tócala abajo en Publicado y ponle lo que te dio Instagram.` });
  if(conDatos.length===1 && !antes.length) hallazgos.push({ t:'Con una sola publicación con números todavía no hay nada que comparar. A medida que llenes más, acá te digo qué funciona.' });

  return { pubs, conDatos, antes, total, prom, hallazgos, formatos: hallazgos.formatos||[] };
}

function marcaData(){
  DATA.marca = DATA.marca || { ideas:[], publicaciones:[] };
  DATA.marca.ideas = DATA.marca.ideas || [];
  DATA.marca.publicaciones = DATA.marca.publicaciones || [];
  return DATA.marca;
}
function clientesDeLaMarca(){
  return (DATA.workClients||[]).filter(c=>c.origen==='marca');
}

let marcaMes = null;
function renderMarca(){
  const box = document.getElementById('sub-marca');
  if(!box) return;
  const M = marcaData();
  const mes = todayStr().slice(0,7);
  if(!marcaMes) marcaMes = mes;
  const traidos = clientesDeLaMarca();

  let html = '';

  /* ---- lo que toca grabar: lo primero que se ve (su parrilla) ---- */
  const porGrabar = M.publicaciones.filter(p=>etapaDe(p)==='Por grabar')
    .sort((a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999'));
  if(porGrabar.length){
    html += `<div class="section-title" style="margin-top:4px;"><span>Te toca grabar</span><span class="count">${porGrabar.length}</span></div>`;
    html += porGrabar.slice(0,3).map(p=>tarjetaPieza(p)).join('');
    if(porGrabar.length>3) html += plegable('marca:grabar-mas', 'Las demás por grabar', String(porGrabar.length-3), porGrabar.slice(3).map(p=>tarjetaPieza(p)).join(''));
    html += '<div style="height:14px;"></div>';
  } else if(!M.publicaciones.length){
    html += `<div class="empty-card" style="margin-bottom:14px;">¿Tienes tu parrilla en Excel? Tócale al + y elige <b>Importar parrilla</b>: aquí te sale qué te toca grabar.</div>`;
  }

  /* ---- resultados del mes: los numeros de cada publicacion, sumados y leidos (D73) ---- */
  const inf = informeMarca(M, marcaMes);
  const antesMes = nombreMes(mesAnterior(marcaMes));
  const tarjetas = [['alcance','Alcance'],['inter','Interacciones'],['guardados','Guardados'],['seguidores','Seguidores nuevos'],['respuestas','Mensajes'],['leads','Leads']];
  const cuerpoMes = `<div class="mes-nav"><button id="mesAntes" aria-label="Mes anterior">‹</button><span class="nom">${esc(nombreMes(marcaMes))}</span><button id="mesDespues" aria-label="Mes siguiente" ${marcaMes>=mes?'disabled style="opacity:.3"':''}>›</button></div>` +
    (inf.conDatos.length ? `<div class="met-grid">${tarjetas.map(([k,l])=>{
        const ahora = inf.total(inf.conDatos,k), ch = inf.antes.length ? cambioPct(inf.prom(inf.conDatos,k), inf.prom(inf.antes,k)) : null;

/* Una pieza de la parrilla en una fila: la fecha grande a la izquierda y lo
   justo para saber que es. */
function tarjetaPieza(p, etiqueta){
  const dias = p.fecha ? daysBetween(todayStr(), p.fecha) : null;
  const d = p.fecha ? parseDate(p.fecha) : null;
  const tarde = dias!==null && dias<0 && etapaDe(p)!=='Publicado';
  return `<div class="grabar-card" data-id="${p.id}" data-sel-tipo="publicacion" data-sel-id="${p.id}">
    <div class="grabar-fecha ${tarde?'tarde':''}">${d ? `<div class="d">${d.getDate()}</div><div class="m">${MONTHS[d.getMonth()].slice(0,3)}</div>` : '<div class="m">sin fecha</div>'}</div>
    <div class="grabar-info">
      <div class="t">${esc(p.titulo)}</div>
      <div class="s">${[etiqueta, p.formato, tarde ? 'se pasó la fecha' : dias===0 ? 'sale hoy' : dias===1 ? 'sale mañana' : ''].filter(Boolean).map(esc).join(' · ')}</div>
    </div>
  </div>`;
}

/* El guion viene como "GANCHO: ... \n DESARROLLO: ...": se parte en bloques
   para leerlo de un vistazo mientras graba. */
function partesGuion(txt){
  const partes = [];
  String(txt||'').replace(/​/g,' ').split('\n').forEach(linea=>{
    const m = linea.match(/^\s*([A-ZÁÉÍÓÚÑ0-9][A-ZÁÉÍÓÚÑ0-9 \-]*(?:\([^)]*\))?)\s*:\s*(.*)$/);
    if(m) partes.push({ k:m[1].trim(), v:m[2].trim() });
    else if(linea.trim()){
      if(partes.length) partes[partes.length-1].v += '\n' + linea.trim();
      else partes.push({ k:'', v:linea.trim() });
    }
  });
  return partes;
}

/* ---- Importar la parrilla desde su Excel ----
   El contenido no vive en el codigo (el repo es publico): ella sube el
   archivo y queda en sus datos. Volver a importarlo actualiza guion, copy y
   fechas, pero respeta la etapa y los resultados que ya puso en la app. */
function cargarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, mal)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>ok(window.XLSX);
    sc.onerror = ()=>mal(new Error('sin internet'));
    document.head.appendChild(sc);
  });
}
function fechaDeCelda(XLSX, v){
  const dos = n => String(n).padStart(2,'0');
  if(typeof v==='number'){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${dos(d.m)}-${dos(d.d)}` : ''; }
  const m = String(v||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m) return `${m[3]}-${dos(m[2])}-${dos(m[1])}`;
  const iso = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return iso ? `${iso[1]}-${iso[2]}-${iso[3]}` : '';
}
function importarParrilla(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.onchange = async ()=>{
    const file = inp.files[0]; if(!file) return;
    leerParrilla(await file.arrayBuffer());
  };
  inp.click();
}
async function leerParrilla(buf){
    let XLSX;
    try{ XLSX = await cargarXLSX(); }catch(e){ alert('Para importar el Excel necesitas internet un momento.'); return; }
    const wb = XLSX.read(buf, { type:'array' });
    const M = marcaData();
    const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    let nuevas = 0, actualizadas = 0, ideasNuevas = 0;

    wb.SheetNames.forEach(nombre=>{
      const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header:1, raw:true, defval:'' });
      const iHead = filas.findIndex(f=>f.some(c=>norm(c).startsWith('tema/idea')) || f.some(c=>norm(c)==='idea / tema'));
      if(iHead<0) return;
      const head = filas[iHead].map(norm);
      const col = (...nombres) => head.findIndex(h=>nombres.some(n=>h.startsWith(n)));
      const val = (f, i) => i>=0 ? String(f[i]??'').trim() : '';

      if(head.some(h=>h.startsWith('tema/idea'))){
        const c = { fecha:col('fecha'), dia:col('dia'), pilar:col('pilar'), tema:col('tema/idea'), formato:col('formato'), cta:col('cta'),
          lead:col('lead magnet'), guion:col('guion'), copy:col('copy'), status:col('status'), grilla:col('celda grilla'), avatar:col('avatar') };
        filas.slice(iHead+1).forEach(f=>{
          const titulo = val(f, c.tema); if(!titulo) return;
          const fecha = fechaDeCelda(XLSX, f[c.fecha]);
          if(!fecha && !val(f,c.formato)) return;   // las notas de "como usar esta hoja"
          const statusXls = ETAPAS.find(e=>norm(e)===norm(val(f,c.status))) || 'Por grabar';
          const datos = { titulo, fecha, dia:val(f,c.dia), pilar:val(f,c.pilar), formato:val(f,c.formato), cta:val(f,c.cta),
            leadMagnet:val(f,c.lead), guion:val(f,c.guion), copy:val(f,c.copy), grilla:val(f,c.grilla), avatar:val(f,c.avatar), deParrilla:true };
          const ya = M.publicaciones.find(p=>norm(p.titulo)===norm(titulo));
          if(ya){ Object.assign(ya, datos); if(!ya.etapa) ponerEtapa(ya, statusXls); actualizadas++; }
          else{ const p = Object.assign({ id:uid(), red:'Instagram', alcance:'', respuestas:'', cierres:'' }, datos); ponerEtapa(p, statusXls); M.publicaciones.push(p); nuevas++; }
        });
      } else {
        const c = { idea:col('idea / tema'), pilar:col('pilar'), gancho:col('gancho'), formato:col('formato'), avatar:col('avatar'), cta:col('cta') };
        filas.slice(iHead+1).forEach(f=>{
          const texto = val(f, c.idea); if(!texto) return;
          if(M.ideas.some(i=>norm(i.texto)===norm(texto)) || M.publicaciones.some(p=>norm(p.titulo)===norm(texto))) return;
          M.ideas.push({ id:uid(), texto, estado:'idea', creado:todayStr(), pilar:val(f,c.pilar), gancho:val(f,c.gancho), formato:val(f,c.formato), avatar:val(f,c.avatar), cta:val(f,c.cta) });
          ideasNuevas++;
        });
      }
    });

    if(!nuevas && !actualizadas && !ideasNuevas){ alert('No encontré la parrilla en ese archivo. Tiene que tener la columna "Tema/Idea de Contenido".'); return; }
    saveData(); renderMarca();
    alert([nuevas && `${nuevas} contenido${nuevas>1?'s':''} nuevo${nuevas>1?'s':''}`, actualizadas && `${actualizadas} actualizado${actualizadas>1?'s':''}`, ideasNuevas && `${ideasNuevas} idea${ideasNuevas>1?'s':''} al banco`].filter(Boolean).join(' · ') + '.');
}

      estado: yaSalio ? 'publicada' : 'planeada',
    };
    METRICAS.forEach(m=>{ const el = g('p_m_'+m.k); datos[m.k] = el ? (el.value==='' ? '' : Number(el.value)) : (p[m.k]??''); });
    if(!datos.titulo){ alert('Ponle de qué es.'); return; }
    if(yaSalio) datos.etapa = 'Publicado';
    else if(etapaDe(p)==='Publicado') datos.etapa = 'Programado';
    if(yaGuardada) Object.assign(existente, datos);
    else marcaData().publicaciones.push(Object.assign({}, p, {id:uid(), etapa: p.etapa || (p.formato ? 'Por grabar' : undefined)}, datos));
    saveData(); closeSheet(); renderMarca();
  };
}

/* ---- Universidad ---- */
function renderMaterias(){
  const box = document.getElementById('sub-materias');
  const subs = [...DATA.subjects].sort((a,b)=> a.day-b.day || (a.start||'').localeCompare(b.start||''));
  const cfg = uniCfg();
  const prom = promedioCarrera();
  const fallas = fallasTotales();

  let html = `<div class="period-pill" id="periodPill">📚 ${esc(DATA.period) || 'Sin período configurado'} <span style="font-size:11px;">✎</span></div>`;

  /* ---- los dos números de arriba ---- */
  html += `<div class="summary-row">
      <div class="summary-box"><div class="lbl">Promedio de la carrera</div><div class="val mono">${nota1(prom)}</div></div>
      <div class="summary-box" id="fallasBox" style="cursor:pointer;"><div class="lbl">Fallas este bimestre</div>
        <div class="val mono" style="color:${fallas>=cfg.maxFallas?'var(--urgent)':fallas>=cfg.maxFallas*0.6?'var(--ambar)':'var(--text)'}">${fallas} <span style="font-size:13px; color:var(--text-dim);">/ ${cfg.maxFallas}</span></div></div>
    </div>`;

  /* ---- la que está en riesgo, de primera (D90) ---- */
  const enRiesgo = subs.map(s=>({s, e:estadoMateria(s)}))
    .filter(x=> x.e.necesita !== null && x.e.necesita > 0 && x.e.evaluado > 0)
    .sort((a,b)=> b.e.necesita - a.e.necesita)[0];
  if(enRiesgo){
    const {s,e} = enRiesgo;
    html += `<div class="card" style="border-left:3px solid ${e.imposible?'var(--urgent)':'var(--ambar)'}; background:${e.imposible?'var(--urgent-soft)':'var(--ambar-soft)'};">
      <div style="font-weight:700; font-size:15px;">${e.imposible ? `Con ${esc(s.name)} ya no alcanzas` : `Necesitas ${nota1(e.necesita)} en lo que falta de ${esc(s.name)}`}</div>
      <div class="helptext" style="margin:4px 0 0;">Llevas ${nota1(e.nota)} con el ${Math.round(e.evaluado)}% evaluado.${e.imposible ? ' Tendrías que sacar más de 5,0, que no se puede.' : ` Con menos de ${nota1(e.necesita)} no pasas.`}</div>
    </div>`;
  }

  /* ---- las materias ---- */
  let matHtml = `<div class="pleg-acciones"><button class="small-btn" id="defiBtn">Poner definitivas</button></div>`;
  if(subs.length){
    subs.forEach(s=>{
      const e = estadoMateria(s);
      const tasks = DATA.academicTasks.filter(t=>t.subject===s.name && !t.done).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const colorNota = e.nota===null ? 'var(--text-dim)' : e.nota < cfg.pasaCon ? 'var(--urgent)' : 'var(--done)';
      matHtml += `<div class="subject-group">
        <div class="subject-row materia-row" data-id="${s.id}" data-sel-tipo="materia" data-sel-id="${s.id}" style="cursor:pointer; border-left-color:var(--c-uni);">
          <div class="info">
            <div class="name">${esc(s.name)}</div>
            <div class="time">${[
              s.start ? DOW[s.day] + ' · ' + esc(s.start) + (s.end?'–'+esc(s.end):'') : 'sin horario',
              e.esDefinitiva ? 'definitiva' : (e.total ? Math.round(e.evaluado)+'% evaluado' : 'sin porcentajes'),
              s.fallas ? s.fallas+' falla'+(s.fallas>1?'s':'') : ''
            ].filter(Boolean).join(' · ')}</div>
          </div>
          <div class="mono" style="font-size:19px; font-weight:600; color:${colorNota};">${nota1(e.nota)}</div>
        </div>
        ${e.total && e.total!==100 ? `<div class="helptext" style="margin:2px 0 6px 14px; color:var(--ambar);">Los porcentajes suman ${Math.round(e.total)}%, no 100%.</div>` : ''}
        ${tasks.map(t=>`
          <div class="module-row" data-id="${t.id}" data-sel-tipo="entrega" data-sel-id="${t.id}" style="margin-left:14px;">
            <button class="module-check" data-action="toggleTask" data-id="${t.id}"></button>
            <div style="flex:1; min-width:0;"><div class="mname">${esc(t.name)}</div><div class="meta" style="margin-top:2px;">${esc(t.type)}${t.date?' · '+niceDateShort(t.date):''}</div></div>
          </div>`).join('')}
      </div>`;
    });
    matHtml += `<div class="helptext">Tócale a una materia para poner sus cortes, sus notas y sus fallas. Cada materia tiene los porcentajes que tenga: no se asume ninguno.</div>`;
  } else {
    matHtml += `<div class="empty-card">Sin materias cargadas.<br><br>Si estás cerrando el bimestre y solo quieres guardar las notas, tócale a <b>Poner definitivas</b>: ahí las escribes con su nombre, sin horario ni porcentajes.</div>`;
  }
  html += plegable('uni:materias', 'Materias', subs.length ? subs.length + (subs.length>1?' materias':' materia') : 'ninguna', matHtml);

  /* ---- entregas próximas ---- */
  const entregas = DATA.academicTasks.filter(t=>!t.done && t.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if(entregas.length) html += plegable('uni:entregas', 'Entregas próximas',
    (()=>{ const d=daysBetween(todayStr(), entregas[0].date); return entregas.length + ' · ' + (d<0?'una atrasada':d===0?'la próxima, hoy':d===1?'la próxima, mañana':'la próxima, '+niceDateShort(entregas[0].date)); })(),
    entregas.map(t=>{
    const dias = daysBetween(todayStr(), t.date);
    const cuando = dias<0 ? 'Atrasada' : dias===0 ? 'Hoy' : dias===1 ? 'Mañana' : niceDate(t.date);
    return `<div class="item" data-sel-tipo="entrega" data-sel-id="${t.id}" style="border-left-color:var(--c-uni);">
      <div class="body"><div class="row1"><div class="title">${esc(t.name)}</div>
        <span class="tag" style="background:${dias<=1?'var(--urgent-soft)':'var(--accent-soft)'}; color:${dias<=1?'var(--urgent)':'var(--accent)'};">${esc(cuando)}</span></div>
      <div class="meta"><span>${esc(t.subject||'General')}${t.type?' · '+esc(t.type):''}</span></div></div>
    </div>`;
  }).join(''), daysBetween(todayStr(), entregas[0].date)<=1);

  /* ---- lo de bimestres pasados ---- */
  const hist = cfg.historial||[];
  html += plegable('uni:bimestres', 'Bimestres pasados', hist.length ? String(hist.length) : 'ninguno',
    `<div class="pleg-acciones"><button class="small-btn" id="cerrarBimestreBtn">Cerrar este</button></div>` +
    (hist.length ? hist.map(h=>`
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-weight:600;">${esc(h.periodo||'Bimestre')}</div>
        <div class="mono" style="font-weight:700;">${nota1((h.materias||[]).reduce((a,m)=>a+Number(m.nota||0),0)/Math.max(1,(h.materias||[]).length))}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${(h.materias||[]).map(m=>esc(m.name)+' '+nota1(m.nota)).join(' · ')}</div>
    </div>`).join('') : '<div class="helptext" style="margin:0;">Cuando termines este bimestre, ciérralo y sus notas pasan al promedio de la carrera.</div>'));

  box.innerHTML = html;
  document.getElementById('periodPill').onclick = openPeriodModal;
  const _b_addSubjectBtn = document.getElementById('addSubjectBtn'); if(_b_addSubjectBtn) _b_addSubjectBtn.onclick = openSubjectModal;
  const _b_addTaskBtn = document.getElementById('addTaskBtn'); if(_b_addTaskBtn) _b_addTaskBtn.onclick = openTaskModal;
  document.getElementById('fallasBox').onclick = openUniAjustes;
  const defiBtn = document.getElementById('defiBtn');
  if(defiBtn) defiBtn.onclick = openDefinitivasModal;
  document.getElementById('cerrarBimestreBtn').onclick = cerrarBimestre;
  box.querySelectorAll('.materia-row').forEach(r=>{
    r.onclick = (ev)=>{ if(ev.target.closest('.small-btn')) return; openMateriaModal(DATA.subjects.find(x=>x.id===r.dataset.id)); };
  });
  box.querySelectorAll('[data-action="toggleTask"]').forEach(b=>{
    b.onclick=(ev)=>{ ev.stopPropagation(); const t=DATA.academicTasks.find(x=>x.id===b.dataset.id); t.done=!t.done; setLinkedEventStatus('academicTask', t.id, t.done?'hecho':'pendiente'); saveData(); renderMaterias(); };
  });

}

/* Una materia por dentro: su horario, sus cortes con sus porcentajes, sus
   notas y sus fallas. */
function openMateriaModal(s){
  if(!s) return;
  const e = estadoMateria(s);
  const cortes = cortesDe(s);
  openSheet(`<h3>${esc(s.name)}</h3>
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700;">Vas en</div>
        <div class="mono" style="font-size:24px; font-weight:600;">${nota1(e.nota)}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${e.total ? Math.round(e.evaluado)+'% evaluado de '+Math.round(e.total)+'%' : 'Ponle los cortes para que esto calcule'}${
        e.necesita!==null && e.falta>0 ? (e.yaPaso ? ' · ya pasaste, pase lo que pase' : e.imposible ? ' · ya no alcanzas a pasar' : ' · necesitas '+nota1(e.necesita)+' en el '+Math.round(e.falta)+'% que falta') : ''}</div>
    </div>

    <div class="field"><label>Nota definitiva</label>
      <input type="number" id="f_definitiva" step="0.1" inputmode="decimal" value="${s.definitiva ?? ''}" placeholder="La que te dio la universidad">
      <div class="helptext">Si la pones, manda sobre los cortes y ya no se calcula nada. Déjala en blanco mientras el período siga abierto.</div>
    </div>

    <div class="field"><label>Cortes y porcentajes</label>
      <div id="cortesBox">${cortes.map((c,i)=>`
        <div class="field-row corte-row" data-i="${i}" style="align-items:flex-end;">
          <div class="field" style="flex:2;"><input type="text" data-campo="nombre" value="${esc(c.nombre||'')}" placeholder="Ej: Parcial"></div>
          <div class="field" style="flex:1;"><input type="number" data-campo="pct" value="${c.pct??''}" placeholder="%" inputmode="numeric"></div>
          <div class="field" style="flex:1;"><input type="number" data-campo="nota" value="${c.nota??''}" placeholder="Nota" inputmode="decimal" step="0.1"></div>
          <button class="small-btn" data-quitar="${i}" style="margin-bottom:14px;">✕</button>
        </div>`).join('')}</div>
      <button class="small-btn" id="addCorte">+ Corte</button>
      <div class="helptext">Deja la nota en blanco mientras no te la den. Los porcentajes de esta materia son los que tú pongas.</div>
    </div>

    <div class="field-row">
      <div class="field"><label>Fallas</label><input type="number" id="f_fallas" value="${s.fallas||0}" inputmode="numeric" min="0"></div>
      <div class="field"><label>Día</label><select id="f_mday">${DOW.map((d,i)=>`<option value="${i}" ${s.day===i?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Empieza</label><input type="time" id="f_mstart" value="${esc(s.start||'')}"></div>
      <div class="field"><label>Termina</label><input type="time" id="f_mend" value="${esc(s.end||'')}"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="delMateria">Borrar materia</button>
      <button class="btn btn-primary" id="saveMateria">Guardar</button>
    </div>`);

  function leerCortes(){
    const out = [];
    sheet.querySelectorAll('.corte-row').forEach(row=>{
      const v = campo => row.querySelector(`[data-campo="${campo}"]`).value;
      const nombre = v('nombre').trim();
      if(!nombre && !v('pct')) return;
      out.push({ id:uid(), nombre, pct:Number(v('pct'))||0, nota: v('nota')==='' ? null : Number(v('nota')) });
    });
    return out;
  }
  document.getElementById('addCorte').onclick = ()=>{ s.cortes = leerCortes(); s.cortes.push({id:uid(), nombre:'', pct:'', nota:null}); openMateriaModal(s); };
  sheet.querySelectorAll('[data-quitar]').forEach(b=>{
    b.onclick = ()=>{ const i=Number(b.dataset.quitar); const c=leerCortes(); c.splice(i,1); s.cortes=c; openMateriaModal(s); };
  });
  document.getElementById('delMateria').onclick = ()=>{
    if(!confirm(`¿Borrar ${s.name}? Se van sus notas y sus cortes.`)) return;
    DATA.subjects = DATA.subjects.filter(x=>x.id!==s.id); saveData(); closeSheet(); renderAll(); renderCalDayList();
  };
  document.getElementById('saveMateria').onclick = ()=>{
    s.cortes = leerCortes();
    const defi = document.getElementById('f_definitiva').value;
    s.definitiva = defi==='' ? null : Number(defi);
    s.fallas = Number(document.getElementById('f_fallas').value)||0;
    s.day = Number(document.getElementById('f_mday').value);
    s.start = document.getElementById('f_mstart').value;
    s.end = document.getElementById('f_mend').value;
    saveData(); closeSheet(); renderAll(); renderCalDayList();
  };
}

        </div>`).join('')}

    <div class="helptext">Si una materia no está en la lista, escríbela abajo con su nota y queda creada.</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="d_volver">Volver</button>
      <button class="btn btn-primary" id="d_guardar">Guardar</button>
    </div>`);

  document.getElementById('d_volver').onclick = closeSheet;

/* Cerrar el bimestre guarda las notas y deja el tablero limpio para el que
   viene, sin perder el promedio de la carrera (D100). */
function cerrarBimestre(){
  if(!DATA.subjects.length){
    if(confirm('Todavía no hay materias con nota.\n\n¿Las escribes ahora?')) openDefinitivasModal();
    return;
  }
  const materias = DATA.subjects.map(s=>({ name:s.name, nota:estadoMateria(s).nota }));
  const sinNota = materias.filter(m=>m.nota===null).length;
  const aviso = sinNota ? `\n\n${sinNota} materia${sinNota>1?'s':''} sin nota quedarán sin contar.` : '';
  if(!confirm(`¿Cerrar ${DATA.period||'este bimestre'} y guardar sus notas?${aviso}\n\nLas materias salen del tablero y sus notas pasan al promedio de la carrera.`)) return;
  uniCfg().historial.push({ periodo: DATA.period || ('Bimestre ' + (uniCfg().historial.length+1)), materias: materias.filter(m=>m.nota!==null), cerrado: todayStr() });
  DATA.subjects = [];
  DATA.academicTasks = DATA.academicTasks.filter(t=>!t.done);
  saveData(); renderAll();
}

/* ---- Trabajo ---- */
function clientOwed(c){
  const sessions = DATA.workSessions.filter(s=>s.clientId===c.id);
  if(c.payType==='hora'){ const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0); return {qty:h, unit:'h', amount:h*Number(c.rate||0)}; }
  if(c.payType==='salario_min'){
    const hourly = Number(c.baseSalario||1750000)/240;
    let total=0, h=0;
    sessions.forEach(s=>{
      const horas=Number(s.horas||0); h+=horas;
      let mult=1;
      if(s.domingo) mult += Number(c.recargoDominical||75)/100;
      if(s.noche) mult += Number(c.recargoNocturno||35)/100;
      total += horas*hourly*mult;
    });
    return {qty:h, unit:'h', amount:total};
  }
  if(c.payType==='dia'){ const d = sessions.reduce((a,s)=>a+Number(s.dias||0),0); return {qty:d, unit:'días', amount:d*Number(c.rate||0)}; }
  const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0);
  return {qty:h, unit:'h', amount:Number(c.rate||0)};
}
const PAYTYPE_LABEL = {hora:'Por hora', salario_min:'Salario mínimo por horas', dia:'Por día', proyecto:'Por proyecto', fijo:'Fijo'};
function renderTrabajo(){
  const box = document.getElementById('sub-trabajo');
  const clients = DATA.workClients;
  box.innerHTML = (clients.length ? clients.map(c=>{
    const o = clientOwed(c);
    const sessions = DATA.workSessions.filter(s=>s.clientId===c.id);
    let rateInfo = c.payType==='salario_min' ? `Base ${money(c.baseSalario||1750000)} + aux ${money(c.auxTransporte||250000)} · dom/fest +${c.recargoDominical||75}% · nocturno +${c.recargoNocturno||35}%` : c.payType==='hora' ? money(c.rate)+' /hora' : c.payType==='dia' ? money(c.rate)+' /día' : PAYTYPE_LABEL[c.payType]+' — '+money(c.rate);
    return `<div class="client-card" data-id="${c.id}">
      <div class="head"><div><div class="name">${esc(c.name)}</div><div class="rate">${esc(rateInfo)}</div></div><button class="small-btn" data-action="logSession" data-id="${c.id}">+ Registrar</button></div>
      <div class="stats">
        <div class="stat"><b>${o.qty}${o.unit}</b><span>${o.unit==='h'?'trabajadas':'trabajados'}</span></div>
        <div class="stat"><b>${money(o.amount)}</b><span>generado</span></div>
        <div class="stat"><b>${sessions.length}</b><span>registros</span></div>
      </div>
      <button class="small-btn" data-action="delClient" data-id="${c.id}" style="margin-top:10px; color:var(--urgent);">Eliminar cliente</button>
    </div>`;
  }).join('') : '<div class="empty-card">Aún no registras clientes o empresas.</div>') +
  '';
  const _b_addClientBtn = document.getElementById('addClientBtn'); if(_b_addClientBtn) _b_addClientBtn.onclick = openClientModal;
  box.querySelectorAll('[data-action="logSession"]').forEach(b=>{ b.onclick=()=>openSessionModal(b.dataset.id); });
  box.querySelectorAll('[data-action="delClient"]').forEach(b=>{ b.onclick=()=>{ DATA.workClients = DATA.workClients.filter(x=>x.id!==b.dataset.id); DATA.workSessions = DATA.workSessions.filter(x=>x.clientId!==b.dataset.id); saveData(); renderTrabajo(); }; });
}

    if(!isEdit) DATA.personalItems.push(obj);

    /* El evento del calendario que cuelga de este ítem tiene que seguirlo. */
    let ev = findLinkedEvent('personalItem', obj.id);
    if(!ev){ ev = addLinkedEvent('personal', title, date, start, end, 'personalItem', obj.id); }
    else if(!date){ removeLinkedEvent('personalItem', obj.id); ev = null; }
    else { Object.assign(ev, { title, date, start, end }); }

      ev.status = obj.status==='hecho' ? 'hecho' : 'pendiente';

    };
  }
}

/* ============================================================
   EL RESUMEN QUE TE DEVUELVE LA SEMANA (D40, D83)
   Todo lo que anota durante la semana no sirve de nada si no vuelve
   convertido en algo. Esto lo cuenta en palabras, no en tablas: horas
   trabajadas, horas estudiadas, en que estuvo, clientes que trajo la marca,
   horas dormidas, la plata y un veredicto. Dos voces (D53): seca cuando no
   cumplio, efusiva y con su nombre cuando de verdad logro algo.
============================================================ */

/* la semana empieza el lunes (D132) */
function lunesDe(fecha){
  const d = parseDate(fecha), dow = d.getDay();
  return fmtDate(addDays(d, dow===0 ? -6 : 1-dow));
}
function diasEntre(desde, hasta){
  const out = []; let f = desde;
  while(f <= hasta){ out.push(f); f = fmtDate(addDays(parseDate(f), 1)); }
  return out;
}

/* Minutos de una cosa que se repite y quedo marcada hecha ese dia. */
function minutosRepetidosDe(fecha){
  const marcados = (diaDe(fecha).repetidos) || {};
  const out = {};
  Object.keys(marcados).forEach(clave=>{
    if(marcados[clave] !== 'hecho') return;
    const [tipo, id] = clave.split(':');
    let ref = null, cat = 'personal';
    if(tipo==='materia'){ ref = (DATA.subjects||[]).find(x=>x.id===id); cat = 'universidad'; }
    if(tipo==='rutina'){ ref = (DATA.routines||[]).find(x=>x.id===id); cat = ref ? ref.cat : 'personal'; }
    if(!ref || !ref.start || !ref.end) return;
    out[cat] = (out[cat]||0) + Math.round(horasFromRange(ref.start, ref.end) * 60);
  });
  return out;
}

function resumenDe(desde, hasta){
  const dias = diasEntre(desde, hasta);
  const enRango = f => f >= desde && f <= hasta;

  /* horas trabajadas: los turnos mandan, porque es lo que de verdad hizo */
  let minTrabajo = 0;
  (DATA.turnos||[]).filter(t=>enRango(t.fecha) && t.entra && t.sale)
    .forEach(t=>{ minTrabajo += Math.round(horasFromRange(t.entra, t.sale) * 60); });

  /* minutos por area: lo marcado hecho, sea evento o cosa que se repite */
  const porArea = {};
  const sumar = (cat, min)=>{ if(min>0) porArea[cat] = (porArea[cat]||0) + min; };
  DATA.events.filter(e=>enRango(e.date) && e.status==='hecho').forEach(e=>{
    const min = Number(e.actualMin) || (e.start && e.end ? Math.round(horasFromRange(e.start, e.end)*60) : 0);
    sumar(e.cat, min);
  });
  dias.forEach(f=>{ const m = minutosRepetidosDe(f); Object.keys(m).forEach(c=>sumar(c, m[c])); });
  sumar('trabajo', minTrabajo);

  const minEstudio = porArea['universidad'] || 0;
  const minDormido = dias.reduce((a,f)=>a + minutosDormidos(f), 0);

  /* lo que hizo y lo que no */
  /* un gasto anotado no es una cosa que hizo: la plata no cuenta aca */
  const hechas = DATA.events.filter(e=>enRango(e.date) && e.status==='hecho' && e.cat!=='finanzas').length
    + (DATA.pendientes||[]).filter(p=>p.hecho && enRango(p.fecha||'')).length;
  const quedaron = DATA.events.filter(e=>enRango(e.date) && e.status!=='hecho' && e.cat!=='finanzas').length;

  /* publicaciones y clientes que trajo la marca (D82) */
  const M = marcaData();
  const publicadas = (M.publicaciones||[]).filter(p=>p.etapa==='Publicado' && enRango(p.fecha||'')).length;
  const deMarca = clientesDeLaMarca();
  const clientesNuevos = deMarca.filter(c=>c.creado && enRango(c.creado)).length;

  /* plata del rango */
  const movs = DATA.events.filter(e=>e.cat==='finanzas' && enRango(e.date));
  const entro = movs.filter(e=>e.type==='ingreso').reduce((a,e)=>a+Number(e.amount||0),0);
  const salio = movs.filter(e=>e.type==='gasto').reduce((a,e)=>a+Number(e.amount||0),0);

  const focoEntradas = Object.entries(porArea).sort((a,b)=>b[1]-a[1]);
  return { desde, hasta, dias, minTrabajo, minEstudio, minDormido, porArea,
    foco: focoEntradas[0] || null, hechas, quedaron, publicadas,
    clientesNuevos, clientesMarca: deMarca.length, entro, salio };
}

/* La comparacion contra el periodo anterior: sin esto son numeros sueltos. */
function compararConAntes(r, largoDias){
  const finAntes = fmtDate(addDays(parseDate(r.desde), -1));
  const iniAntes = fmtDate(addDays(parseDate(finAntes), -(largoDias-1)));
  return resumenDe(iniAntes, finAntes);
}

function horasTexto(min){
  if(!min) return '0 h';
  const h = Math.floor(min/60), m = min%60;
  return h ? h + ' h' + (m ? ' ' + m : '') : m + ' min';
}

/* El veredicto. Efusiva solo cuando de verdad logro algo (D53). */
function veredictoDe(r, antes, periodo){
  const P = periodo === 'mes' ? 'mes' : 'semana';
  const laP = P === 'mes' ? 'el mes' : 'la semana';
  const masTrabajo = r.minTrabajo > antes.minTrabajo;
  const durmioBien = r.minDormido >= r.dias.length * 7 * 60;
  const cumplio = r.hechas > 0 && r.quedaron <= 2;
  if(cumplio && durmioBien)
    return { tono:'bien', texto:`¡Increíble ${P}, Sharon! 🎉 Cumpliste casi todo y además dormiste. Eso segundo es lo difícil.` };
  if(cumplio)
    return { tono:'bien', texto: r.quedaron
      ? `${P==='mes'?'Buen mes':'Buena semana'}, Sharon. Cerraste ${r.hechas} ${r.hechas===1?'cosa':'cosas'} y solo ${r.quedaron} ${r.quedaron===1?'quedó':'quedaron'} colgando.`
      : `¡${P==='mes'?'Mes limpio':'Semana limpia'}, Sharon! 🎉 Cerraste ${r.hechas} ${r.hechas===1?'cosa':'cosas'} y no quedó nada pendiente.` };
  if(r.quedaron > 6)
    return { tono:'seco', texto:`Quedaron ${r.quedaron} cosas sin hacer. O fue ${P==='mes'?'un mes pesado':'una semana pesada'}, o estás cargando ${laP} con más de lo que cabe.` };
  if(!r.minDormido)
    return { tono:'seco', texto:`No registraste sueño en todo ${P==='mes'?'el mes':'la semana'}, así que de descanso no te puedo decir nada.` };
  if(masTrabajo && r.minEstudio < antes.minEstudio)
    return { tono:'seco', texto:`Trabajaste más que ${P==='mes'?'el mes pasado':'la semana pasada'} y estudiaste menos. Pasa, pero que no se vuelva la norma en bimestre.` };
  return { tono:'seco', texto:`${P==='mes'?'Mes normal':'Semana normal'}: ${r.hechas} ${r.hechas===1?'cosa hecha':'cosas hechas'} y ${r.quedaron} sin hacer.` };
}

/* Una fila del resumen: el numero, que es, y como va contra antes. */
function filaResumen(que, valor, antes, formato){
  const dif = valor - antes;
  const pinta = dif === 0 ? '' : dif > 0 ? 'sube' : 'baja';
  const flecha = dif === 0 ? 'igual que antes' : (dif > 0 ? '+' : '−') + formato(Math.abs(dif));
  return `<div class="fila-res">
    <span class="que">${esc(que)}</span>
    <span class="val">${esc(formato(valor))}</span>
    <span class="dif ${pinta}">${esc(flecha)}</span>
  </div>`;
}

var RESUMEN_VISTA = 'semana';
function renderResumen(){
  const caja = document.getElementById('resumenBox');
  if(!caja) return;
  const hoy = todayStr();
  const esMes = RESUMEN_VISTA === 'mes';

  const desde = esMes ? hoy.slice(0,8) + '01' : lunesDe(hoy);
  const hasta = esMes ? fmtDate(new Date(parseDate(hoy).getFullYear(), parseDate(hoy).getMonth()+1, 0)) : fmtDate(addDays(parseDate(desde), 6));
  const r = resumenDe(desde, hasta);
  const antes = compararConAntes(r, r.dias.length);
  const v = veredictoDe(r, antes, esMes ? 'mes' : 'semana');

  const rotulo = esMes ? 'Este mes' : (desde === lunesDe(hoy) ? 'Esta semana' : 'La semana');
  const nada = !r.minTrabajo && !r.minEstudio && !r.minDormido && !r.hechas && !r.entro && !r.salio;

  caja.innerHTML = `<div class="card resumen">
    <div class="res-tabs">
      <button class="res-tab ${esMes?'':'activa'}" data-res="semana">Semana</button>
      <button class="res-tab ${esMes?'activa':''}" data-res="mes">Mes</button>
      <span class="res-rango">${esc(niceDateShort(desde))} – ${esc(niceDateShort(hasta))}</span>
    </div>
    ${nada ? `<div class="helptext" style="margin:14px 0 0;">Todavía no hay nada anotado en ${rotulo.toLowerCase()}. Esto se llena solo con lo que vas marcando.</div>` : `
    <div class="veredicto ${v.tono}">${esc(v.texto)}</div>
    <div class="res-filas">
      ${filaResumen('Trabajaste', r.minTrabajo, antes.minTrabajo, horasTexto)}
      ${filaResumen('Estudiaste', r.minEstudio, antes.minEstudio, horasTexto)}
      ${filaResumen('Dormiste', r.minDormido, antes.minDormido, horasTexto)}
      ${filaResumen('Entró', r.entro, antes.entro, money)}
      ${filaResumen('Salió', r.salio, antes.salio, money)}
    </div>
    <div class="res-notas">
      ${r.foco ? `<p>Donde más se te fue el tiempo: <b>${esc(catDe(r.foco[0]).label)}</b>, ${esc(horasTexto(r.foco[1]))}.</p>` : ''}
      ${r.publicadas ? `<p>Publicaste <b>${r.publicadas}</b> ${r.publicadas===1?'pieza':'piezas'} de marca personal.</p>` : ''}
      ${r.clientesNuevos ? `<p><b>${r.clientesNuevos}</b> ${r.clientesNuevos===1?'cliente llegó':'clientes llegaron'} por la marca personal.</p>`
        : r.clientesMarca ? `<p>La marca personal te ha traído <b>${r.clientesMarca}</b> ${r.clientesMarca===1?'cliente':'clientes'} en total.</p>` : ''}
      ${r.quedaron ? `<p><b>${r.quedaron}</b> ${r.quedaron===1?'cosa quedó':'cosas quedaron'} sin hacer.</p>` : ''}
    </div>`}
  </div>`;

  caja.querySelectorAll('[data-res]').forEach(b=>b.onclick = ()=>{
    RESUMEN_VISTA = b.dataset.res;
    try{ localStorage.setItem('resumenVista', RESUMEN_VISTA); }catch(e){}
    renderResumen();
  });
}

    const inPeriodNow = daysBetween(last, todayStr()) < (DATA.cycle.periodLen||5) && daysBetween(last, todayStr())>=0;
    box.innerHTML = `<div class="cycle-hero">
        <div class="big">${inPeriodNow ? 'En curso' : (diff>=0 ? 'En ' + diff + ' días' : 'Atrasado ' + Math.abs(diff) + ' días')}</div>

  }
  const now = new Date();
  const weekStart = addDays(now, -now.getDay());
  const weekDates = [...Array(7)].map((_,i)=>fmtDate(addDays(weekStart,i)));
  const weekEvents = DATA.events.filter(e=>weekDates.includes(e.date) && e.status==='hecho' && e.actualMin);
  const byCat = {}; weekEvents.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0) + Number(e.actualMin); });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxMin = Math.max(1, ...catEntries.map(c=>c[1]));
  const tsBox = document.getElementById('timeSummary');
  if(catEntries.length){
    tsBox.innerHTML = `<div class="bar-chart">${catEntries.map(([cat,min])=>`<div class="bar-col"><div class="bar" style="height:${Math.max(6,(min/maxMin)*95)}px; background:${catDe(cat).color}"></div><div class="lbl">${catDe(cat).emoji}</div></div>`).join('')}</div>

  } else {
    tsBox.innerHTML = `<div style="font-size:13px; color:var(--text-dim); text-align:center; padding:10px 0;">Marca cosas como "hechas" y registra minutos (o usa "Registrar tiempo" en Personal) para ver aquí en qué se te va el tiempo.</div>`;
  }
  const insightsBox = document.getElementById('insights');
  let insights = [];
  if(catEntries.length){ const top = catDe(catEntries[0][0]); insights.push(`<div class="insight"><div class="ico">${top.emoji}</div><div class="txt">Esta semana, la mayoría de tu tiempo se fue en <b>${top.label}</b>.</div></div>`); }
  const overEst = DATA.events.filter(e=>e.status==='hecho' && e.estMin && e.actualMin && e.actualMin > e.estMin*1.3);

  const overdueCount = DATA.events.filter(e=>e.status!=='hecho' && e.date<todayStr()).length;
  if(overdueCount>0){ insights.push(`<div class="insight"><div class="ico">📌</div><div class="txt">Tienes <b>${overdueCount}</b> pendiente${overdueCount>1?'s':''} atrasado${overdueCount>1?'s':''}. Revísalos en Tareas.</div></div>`); }
  insightsBox.innerHTML = insights.length ? insights.join('') : '<div class="empty-card">Aún no hay suficientes datos para mostrar patrones.</div>';
}
