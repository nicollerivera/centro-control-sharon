<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Bitácora</title>
<meta name="bitacora-build" content="20260918195629">
<script>
/* Modo claro u oscuro (D55). La primera vez sigue al teléfono; después manda el botón. */
/* Arranca en claro. El oscuro se elige con el boton, no lo decide el
   telefono: lo que pidio Sharon fue un boton manual (D55). */
try{
  document.documentElement.dataset.tema = localStorage.getItem('bitacora:tema') || 'claro';
}catch(e){}
</script>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icono-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Tokens tomados tal cual del lienzo de pantallas. Modo claro. */
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface-2:#EDEFF3;
  --surface-3:#E4E6EB;
  --border:#E4E6EB;
  --border-2:#D2D6DE;
  --text:#14161C;
  --text-muted:#5E6472;
  --text-dim:#8E95A3;
  --accent:#7C4DCC;                       /* morado solo en detalles (D56) */
  --accent-soft:rgba(124,77,204,.10);
  --urgent:#D93A3A;                       /* rojo: vencido o choque (D57) */
  --urgent-soft:rgba(217,58,58,.10);
  --ambar:#E0A020;                        /* amarillo: ojo con esto (D57) */
  --ambar-soft:rgba(224,160,32,.13);
  --done:#18845F;
  --done-soft:rgba(24,132,95,.10);
  /* Las once áreas (D89) */
  --c-trabajo:#2F6FB3;
  --c-dinero:#18845F;
  --c-uni:#4A56C4;
  --c-marca:#7C4DCC;
  --c-clientes:#0E8A96;
  --c-empr:#8E3B6B;
  --c-joel:#DE6B3C;
  --c-casa:#657687;
  --c-salud:#D2497E;
  --c-descanso:#5A8A63;
  --c-metas:#A8762A;
  /* Alias de compatibilidad con el código que venía de Centro de Control */
  --c-nexxa:var(--c-empr);
  --c-ads:var(--c-marca);
  --c-work:var(--c-trabajo);
  --c-fin:var(--c-dinero);
  --c-personal:var(--c-salud);
  --c-ciclo:var(--c-salud);
  --radius:12px;                          /* esquinas discretas (D117) */
  --radius-sm:10px;
}
html[data-tema="oscuro"]{
  --bg:#101218;
  --surface:#191C23;
  --surface-2:#20242D;
  --surface-3:#272B34;
  --border:#272B34;
  --border-2:#343A46;
  --text:#E8EAEF;
  --text-muted:#9AA1B0;
  --text-dim:#737B8B;
  --accent:#A98BEA;
  --accent-soft:rgba(169,139,234,.15);
  --urgent:#F07070;
  --urgent-soft:rgba(240,112,112,.15);
  --ambar:#E8B559;
  --ambar-soft:rgba(232,181,89,.15);
  --done:#4FB98C;
  --done-soft:rgba(79,185,140,.14);
  --c-trabajo:#6FA8DC;
  --c-dinero:#4FB98C;
  --c-uni:#8A92E8;
  --c-marca:#A98BEA;
  --c-clientes:#4FB9C4;
  --c-empr:#C77FA6;
  --c-joel:#F0946B;
  --c-casa:#94A2B1;
  --c-salud:#E88AAE;
  --c-descanso:#8FBE97;
  --c-metas:#D4A85E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{min-height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif; letter-spacing:-0.01em;}
.mono,.hora,.monto{font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
button{font-family:inherit;}
.app{max-width:560px; margin:0 auto; position:relative;}

/* ---------- header ---------- */
.topbar{padding:22px 18px 10px; position:sticky; top:0; z-index:20; background:var(--bg);}
.topbar .greet{font-size:13px; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.08em;}
.topbar h1{font-size:26px; margin:2px 0 0; font-weight:700;}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.topbar-row .greet{margin-right:auto;}
.sync{display:inline-flex; align-items:center; gap:6px; flex:none; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:11px; font-weight:600; letter-spacing:.02em; padding:5px 10px; border-radius:999px; cursor:pointer;}
.tema{flex:none; width:30px; height:30px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:14px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--text-dim); flex:none;}
.sync[data-state="ok"]{color:var(--done); background:var(--done-soft); border-color:transparent;}
.sync[data-state="ok"] .sync-dot{background:var(--done);}
.sync[data-state="sync"]{color:var(--accent); background:var(--accent-soft); border-color:transparent;}
.sync[data-state="sync"] .sync-dot{background:var(--accent); animation:pulse 1s ease-in-out infinite;}
.sync[data-state="off"],.sync[data-state="lock"]{color:var(--urgent); background:var(--urgent-soft); border-color:transparent;}
.sync[data-state="off"] .sync-dot,.sync[data-state="lock"] .sync-dot{background:var(--urgent);}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
.linework{width:100%; height:14px; margin-top:10px; opacity:.6;}

/* ---------- view container ---------- */
.view{padding:4px 18px 20px; display:none; animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* mismo tono que .rotulo: sin mayusculas ni espaciado, que era ruido */
.section-title{font-size:13px; color:var(--text-muted); font-weight:600; margin:24px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.section-title:first-child{margin-top:4px;}
.section-title .count{color:var(--accent); font-weight:700;}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
.empty-card{background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); padding:20px 16px; text-align:center; color:var(--text-muted); font-size:13.5px;}

.item{display:flex; align-items:flex-start; gap:11px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; cursor:pointer;}
.item:active{background:var(--surface-2);}
.item .hora{flex:none; width:44px; font-size:12.5px; font-weight:600; color:var(--text-muted); padding-top:1px;}

/* ---------- la portada: quieta a proposito ---------- */
.rotulo{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:24px 0 10px; font-size:13px; font-weight:600; color:var(--text-muted);}
.rotulo span:last-child{font-size:12px; font-weight:500; color:var(--text-dim);}
.rotulo:first-child{margin-top:6px;}

/* lo que vence: una linea por cosa, sin tarjeta ni etiquetas de colores */
.vence{margin:2px 0 4px;}
.vence-fila{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border);}
.vence-fila:last-child{border-bottom:none;}
.vence-fila .punto{width:7px; height:7px; border-radius:50%; flex:none;}
.vence-fila .que{flex:1; min-width:0; font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.vence-fila .cuando{flex:none; font-size:12px; color:var(--text-muted); font-weight:600;}

/* un bloque: hora, nombre, lugar y el circulo. Nada mas (D105) */
.bloque{display:flex; align-items:center; gap:12px; padding:13px 2px;}
.bloque .hora{flex:none; width:52px; font-size:14px; font-weight:600; color:var(--text-muted); line-height:1.3;}
.bloque .hora .hasta{display:block; font-size:12px; font-weight:400; color:var(--text-dim);}
.bloque .raya{flex:none; width:3px; align-self:stretch; border-radius:3px; min-height:26px;}
.bloque .cuerpo{flex:1; min-width:0;}
.bloque .nombre{font-size:15px; font-weight:600; line-height:1.3;}
.bloque .sitio{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.bloque.hecho .nombre{color:var(--text-dim); text-decoration:line-through;}
/* lo que hoy no fue: ahi sigue, pero apagado y sin tachar (no lo hizo, no le tocaba) */
.bloque.saltado{opacity:.55;}
.bloque.saltado .nombre::after{content:' · hoy no'; font-weight:500; font-size:12px; color:var(--text-dim);}
/* la ✕ vive al lado del ✓: decir "hoy no" es un toque, igual que decir que si */
.no-btn{flex:none; width:26px; height:26px; margin:1px 0 0; padding:0; display:flex; align-items:center; justify-content:center; border:2px solid var(--border); border-radius:50%; background:none; color:var(--text-dim); cursor:pointer;}
.no-btn svg{width:13px; height:13px;}
.no-btn.activo{border-color:var(--text-muted); background:var(--surface-2); color:var(--text-muted);}
.bloque .no-btn{width:28px; height:28px;}
/* el boton que da el dia por pasado: ancho, arriba de la tira, imposible de no ver */
.dia-entero{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 6px; padding:11px 14px; border:1px solid var(--border); border-radius:12px; background:var(--surface-2); color:var(--text); font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;}
.dia-entero span{font-size:12px; font-weight:600; color:var(--text-muted);}
/* Los dos botones del bloque dicen cosas opuestas, asi que no pueden quedar
   pegados: un pulgar que apunta mal marcaria "hecho" queriendo decir "hoy no".
   28 px cada uno y 18 entre centros de borde a borde — mas que el ancho de una
   yema — con el ✕ arrimado al texto y el ✓ contra el margen. */
.bloque .status-btn{width:28px; height:28px; margin:0;}
.bloque{gap:10px;}
.bloque .no-btn{margin-right:8px;}

/* lo hecho, guardado en una linea discreta al final del dia */
.linea-hechas{display:flex; align-items:center; gap:7px; margin:6px 0 0; padding:7px 2px; background:none; border:none; color:var(--done); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer;}
.linea-hechas svg{width:14px; height:14px;}
.linea-hechas.abierta{color:var(--text-muted);}
/* si en el dia no hubo nada hecho y solo cosas que no fueron, el verde miente */
.linea-hechas.solo-no{color:var(--text-muted);}
.hechas-lista{opacity:.75;}
.hechas-lista .bloque{padding:8px 2px;}
.todo-listo{padding:14px 2px; font-size:14px; color:var(--text-muted);}

/* hidden tiene que ganarle a cualquier display de clase */
[hidden]{display:none !important;}
.cal-modos{display:flex; gap:6px; margin:0 0 12px;}
.cal-modo{background:var(--surface-2); border:none; color:var(--text-muted); font:inherit; font-size:13px; font-weight:600; padding:5px 14px; border-radius:20px;}
.cal-modo.activa{background:var(--accent); color:#fff;}
.cal-semana{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}

/* el hueco es espacio, no un renglon mas (D108) */
.hueco{margin:0; padding:8px 0 8px 2px; font-size:12.5px; color:var(--text-dim); display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:26px;}
.hueco .linea{flex:none; width:52px; display:flex; justify-content:center;}
.hueco .linea::before{content:''; width:2px; height:18px; border-radius:2px; background:repeating-linear-gradient(to bottom, var(--border) 0 3px, transparent 3px 6px);}
.cabe{color:var(--accent); font-weight:600;}

/* lo que no tiene hora, en el mismo idioma que lo demas */
.suelto{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border);}
.suelto:last-child{border-bottom:none;}
.suelto .punto{width:7px; height:7px; border-radius:50%; flex:none; margin:0 8px;}
.suelto .que{flex:1; min-width:0; font-size:14.5px; font-weight:500;}
.suelto .de{flex:none; font-size:12px; color:var(--text-dim);}

/* ---------- la mañana y el cierre ---------- */
.agregar-opciones{display:grid; gap:8px;}
.opcion-agregar{width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 15px; cursor:pointer; color:var(--text);}
.opcion-agregar .que{display:block; font-size:15px; font-weight:600;}
.opcion-agregar .nota{display:block; font-size:12.5px; color:var(--text-muted); margin-top:2px;}

.lista-head .nombre{background:none; border:none; padding:0; color:inherit; font:inherit; cursor:pointer; display:flex; align-items:center; gap:7px; text-align:left;}

.manana{margin-bottom:6px;}
.manana .saludo{font-size:15px; font-weight:600; margin-bottom:12px;}
.manana .par{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;}
.manana .dato{flex:1; min-width:120px; text-align:left; background:none; border:none; padding:0; cursor:pointer;}
.manana .dato.animo{cursor:default; flex:2;}
.manana .et{display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:5px;}
.manana .val{font-size:19px; font-weight:600; color:var(--text);}
.manana .chiprow{gap:5px;}
.manana .chip{font-size:12px; padding:6px 10px;}

.cierre{margin-top:22px; border-left:3px solid var(--accent);}
.cierre .titulo{font-size:15px; font-weight:600; line-height:1.35;}
.cierre-fila{padding:12px 0; border-bottom:1px solid var(--border);}
.cierre-fila:last-of-type{border-bottom:none;}
.cierre-fila .que{font-size:14.5px; font-weight:600;}
.cierre-fila .por{font-size:12px; color:var(--text-muted); margin-top:2px;}
.cierre-fila.insiste .por{color:var(--ambar); font-weight:600;}
.cierre-fila .opciones{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap;}

/* ---------- seleccionar para borrar ---------- */
[data-sel-id]{ -webkit-touch-callout:none; }
.seleccionable{position:relative;}
.elegido{background:var(--accent-soft) !important; border-radius:var(--radius-sm);}
.elegido::after{content:'✓'; position:absolute; top:50%; right:8px; transform:translateY(-50%);
  width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff;
  font-size:12px; line-height:20px; text-align:center; font-weight:700;}
/* mantener presionado tiene que ser un gesto de la app, no del navegador:
   sin esto el telefono empieza a seleccionar el texto y cancela el toque */
[data-sel-id]{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
[data-sel-id] input, [data-sel-id] textarea{-webkit-user-select:text; user-select:text;}
.aviso-version{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:210; display:flex; align-items:center; gap:10px; background:var(--text); color:var(--surface); font-size:13.5px; font-weight:600; padding:9px 10px 9px 15px; border-radius:12px; max-width:calc(100% - 28px);}
.aviso-version button{border:none; border-radius:8px; background:var(--accent); color:#fff; font:inherit; padding:7px 12px;}
.barra-sel{position:fixed; left:0; right:0; z-index:60; display:flex; align-items:center; gap:12px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--surface);
  border-top:1px solid var(--border); box-shadow:0 -6px 20px rgba(0,0,0,.08);
  bottom:0; max-width:560px; margin:0 auto;}
.barra-sel .cancelar{border:none; background:none; color:var(--text-muted); font-size:18px; cursor:pointer; padding:4px 6px;}
.barra-sel .cuantos{flex:1; font-size:14.5px; font-weight:600;}
.barra-sel .borrar{border:none; background:var(--urgent); color:#fff; font-weight:700; font-size:14px;
  padding:10px 18px; border-radius:var(--radius-sm); cursor:pointer;}
/* mientras la barra esta abajo, la de navegacion se esconde */
body.con-barra .bottomnav{display:none;}
/* showView le pone el display al + por estilo en linea, asi que hay que ganarle */
body.con-barra .fab{display:none !important;}
/* mientras elige, las etiquetas estorban: el visto va donde estaban */
body.con-barra .elegido .urg, body.con-barra .elegido .tag{visibility:hidden;}
.status-btn.chico{width:20px; height:20px; margin-left:2px;}
.cuenta{font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:none; letter-spacing:0;}
.item .body{flex:1; min-width:0;}
.item .row1{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.item .title{font-size:14.5px; font-weight:600; line-height:1.3;}
.item.done .title{color:var(--text-dim); text-decoration:line-through;}
.item .meta{font-size:12px; color:var(--text-muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
.status-btn{width:26px; height:26px; border-radius:50%; border:2.5px solid var(--accent); background:var(--accent-soft); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; color:transparent;}
.status-btn::before{content:''; width:9px; height:5px; border-left:2.5px solid currentColor; border-bottom:2.5px solid currentColor; transform:rotate(-45deg) translate(1px,-1px);}
.status-btn.progreso{border-color:var(--accent); background:conic-gradient(var(--accent) 50%, transparent 0);}
.status-btn.hecho{border-color:var(--done); background:var(--done); color:#fff;}

/* ---------- bottom nav ---------- */
.bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:space-around;}
.navbtn{background:none; border:none; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:700; padding:4px 6px; border-radius:10px; flex:1; max-width:90px; position:relative;}
.navbtn.active{color:var(--accent);}
.navbtn svg{width:21px; height:21px;}
.navbtn .badge{position:absolute; top:0; right:12px; background:var(--urgent); color:#fff; font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;}

/* ---------- FAB ---------- */
.fab{position:fixed; right:20px; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:25; width:46px; height:46px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:22px; line-height:1; box-shadow:0 4px 12px rgba(139,108,249,.28); display:flex; align-items:center; justify-content:center;}
.fab:active{transform:scale(.94);}

/* ---------- chips ---------- */
.chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:2px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; padding:5px 11px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:12.5px; font-weight:600;}
.chip.active{border-color:var(--chip-color, var(--accent)); background:var(--chip-color-soft, var(--accent-soft)); color:var(--text);}
button.chip{font-family:inherit; line-height:1.5; cursor:pointer;}
/* cuando son para elegir y no para desplazar, caben todos a la vista */
.chiprow.envuelve{flex-wrap:wrap; overflow:visible; gap:7px;}
/* el monto es la pregunta de verdad: se ve grande y es lo primero que toca */
.field.monto input[type=number]{font-size:22px; font-weight:600; padding-top:12px; padding-bottom:12px;}
/* lo que casi nunca cambia se guarda aca detras */
.mas-campos{display:block; margin:-2px 0 14px; padding:4px 2px; background:none; border:none; color:var(--accent); font:inherit; font-size:13px; font-weight:600; cursor:pointer;}
.mas-campos::after{content:' ›'; display:inline-block; transition:transform .15s;}
.mas-campos.abierto::after{transform:rotate(90deg);}

/* ---------- subtabs ---------- */
.subtabs-wrap{position:relative; margin-bottom:16px;}
.subtabs{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; overflow-x:auto; scrollbar-width:none; scroll-behavior:smooth;}
.subtabs::-webkit-scrollbar{display:none;}
/* una sombrita al borde avisa que hay mas pestanas para ese lado */
.subtabs-wrap::after, .subtabs-wrap::before{content:''; position:absolute; top:1px; bottom:1px; width:26px; pointer-events:none; opacity:0; transition:opacity .18s; border-radius:12px;}
.subtabs-wrap::after{right:1px; background:linear-gradient(90deg, transparent, var(--surface) 72%);}
.subtabs-wrap::before{left:1px; background:linear-gradient(270deg, transparent, var(--surface) 72%); z-index:1;}
.subtabs-wrap[data-mas-derecha]::after{opacity:1;}
.subtabs-wrap[data-mas-izquierda]::before{opacity:1;}
.subtab{flex-shrink:0; border:none; background:none; color:var(--text-dim); font-weight:700; font-size:12.5px; padding:9px 12px; border-radius:9px; white-space:nowrap;}
.subtab.active{background:var(--accent); color:#fff;}

/* ---------- week/subject rows ---------- */
.subject-row{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-uni); border-radius:var(--radius-sm); margin-bottom:8px;}
.subject-row.ads{border-left-color:var(--c-ads);}
.subject-row .info{flex:1;}
.subject-row .name{font-weight:600; font-size:14px;}
.subject-row .time{font-size:12px; color:var(--text-dim); margin-top:2px;}
.period-pill{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; padding:6px 12px; border-radius:20px; margin-bottom:14px;}
.subject-group{margin-bottom:14px;}
.subject-group-head{font-weight:700; font-size:13.5px; margin:4px 0 6px; padding-left:2px; color:var(--text);}

/* ---------- curso ---------- */
.module-row{display:flex; align-items:center; gap:11px; padding:12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-ads); border-radius:var(--radius-sm); margin-bottom:8px;}
.module-check{width:24px; height:24px; border-radius:7px; border:1.5px solid var(--border); background:transparent; flex-shrink:0;}
.module-check.done{background:var(--c-ads); border-color:var(--c-ads); position:relative;}
.module-check.done::after{content:'✓'; color:#fff; font-size:14px; font-weight:900; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.module-row .mname{font-size:14px; font-weight:600; flex:1;}
.module-row.done .mname{color:var(--text-dim); text-decoration:line-through;}

/* ---------- nexxa events ---------- */
.nexxa-card{padding:13px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-nexxa); border-radius:var(--radius); margin-bottom:9px;}
.nexxa-card .head{display:flex; justify-content:space-between; align-items:flex-start;}
.nexxa-card .name{font-weight:700; font-size:14.5px;}
.nexxa-card .meta{font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.5;}
.status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
.status-pill.cotizado{background:var(--surface-3); color:var(--text-muted);}
.status-pill.confirmado{background:rgba(139,108,249,.16); color:var(--c-nexxa);}
.status-pill.realizado{background:var(--done-soft); color:var(--done);}
.mini-tag{display:inline-block; font-size:11px; background:var(--surface-3); color:var(--text-muted); padding:2px 8px; border-radius:8px; margin-top:6px; margin-right:5px;}

/* ---------- trabajo ---------- */
.client-card{padding:14px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-work); border-radius:var(--radius); margin-bottom:10px;}
.client-card .head{display:flex; justify-content:space-between; align-items:flex-start;}
.client-card .name{font-weight:700; font-size:15px;}
.client-card .rate{font-size:12px; color:var(--text-dim); margin-top:2px;}
.client-card .stats{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;}
.client-card .stat b{display:block; font-size:16px; font-family:'Space Grotesk',sans-serif;}
.client-card .stat span{font-size:11px; color:var(--text-dim);}
/* el de borrar es una canequita, no una palabra: pesa menos en la fila */
.small-btn.icono{display:inline-flex; align-items:center; justify-content:center; padding:5px 9px; color:var(--text-dim);}
.small-btn.icono svg{width:15px; height:15px;}
.small-btn.icono:active{color:var(--urgent);}
.small-btn{background:var(--surface-2); border:none; color:var(--text-muted); font-size:12px; font-weight:600; padding:5px 10px; border-radius:8px;}

/* ---------- plata ---------- */
.saldo-card .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700; display:flex; align-items:baseline; gap:8px;}
.saldo-nota{font-size:11.5px; color:var(--text-dim); margin-top:1px;}
.saldo-edad{text-transform:none; letter-spacing:0; font-weight:600; color:var(--text-muted); font-size:11.5px;}
.saldo-num{font-size:32px; font-weight:600; margin-top:2px; letter-spacing:-.02em;}
.saldo-card{cursor:pointer; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--c-dinero); border-radius:var(--radius); padding:13px 14px 14px; margin-bottom:12px;}
/* cada lugar donde tiene plata: efectivo, Nequi, Daviplata, lo que agregue */
.bolsillos{display:grid; grid-template-columns:repeat(auto-fit, minmax(92px, 1fr)); gap:7px; margin-top:12px;}
.bolsillo{min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:1px; background:var(--surface-2); border:none; border-radius:10px; padding:9px 10px; color:var(--text); font:inherit; text-align:left; cursor:pointer;}
.bolsillo .n{max-width:100%; font-size:11.5px; font-weight:600; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bolsillo .m{font-size:14.5px; font-weight:600;}
.bolsillo .m.vacio{color:var(--text-dim); font-weight:500;}
.lista-avisos{margin:0 0 10px; padding-left:20px; font-size:13.5px; color:var(--text); line-height:1.5;}
.lista-avisos li{margin:3px 0;}
.deuda-card.saldada{opacity:.62;}
.quedaria{margin-top:6px; cursor:pointer;}
.quedaria .det[hidden]{display:none;}
.quedaria .fila{display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
.quedaria .n{font-size:14px; font-weight:600;}
.quedaria .det{font-size:12.5px; color:var(--text-muted); margin-top:5px; line-height:1.5;}
.quedaria .por-que{font-size:12px; color:var(--text-dim); margin-top:2px;}
.quedaria .por-que b{color:var(--accent); font-weight:600;}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translate(-50%, 20px); background:var(--text); color:var(--surface); font-size:14px; font-weight:600; padding:11px 16px; border-radius:12px; opacity:0; transition:opacity .2s, transform .2s; z-index:200; max-width:calc(100% - 32px); text-align:center; pointer-events:none;}
.toast.ver{opacity:1; transform:translate(-50%, 0);}
/* el resumen de la semana: primero el veredicto en palabras, despues los
   numeros con su comparacion, y al final lo que no cabe en un numero */
.resumen{padding:14px 16px 16px;}
.res-tabs{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.res-tab{background:var(--surface-2); border:none; color:var(--text-muted); font:inherit; font-size:13px; font-weight:600; padding:5px 12px; border-radius:20px;}
.res-tab.activa{background:var(--accent); color:#fff;}
.res-rango{margin-left:auto; font-size:12px; color:var(--text-dim);}
.veredicto{margin-top:14px; font-size:16px; line-height:1.45; font-weight:500;}
.veredicto.bien{color:var(--done);}
.res-filas{margin-top:14px; border-top:1px solid var(--border);}
.fila-res{display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--border);}
.fila-res .que{font-size:14.5px; color:var(--text-muted);}
.fila-res .val{font-size:15.5px; font-weight:600; font-variant-numeric:tabular-nums;}
.fila-res .dif{font-size:12px; color:var(--text-dim); min-width:84px; text-align:right; font-variant-numeric:tabular-nums;}
.fila-res .dif.sube{color:var(--done);} .fila-res .dif.baja{color:var(--ambar);}
.res-notas{margin-top:12px;}
.res-notas p{margin:5px 0; font-size:14px; color:var(--text-muted);}
.res-notas b{color:var(--text);}

/* secciones plegables: cerradas muestran solo nombre y resumen */
.pleg{margin-bottom:8px;}
.pleg-head{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font:inherit; cursor:pointer;}
.pleg-tit{flex:1; font-weight:600; font-size:14.5px;}
.pleg-res{font-size:13px; color:var(--text-muted); text-align:right;}
.pleg-res.alerta{color:var(--ambar); font-weight:600;}
.pleg-chev{flex:none; color:var(--text-dim); transition:transform .18s;}
.pleg.abierta .pleg-chev{transform:rotate(90deg);}
.pleg-body{padding:8px 0 6px;}
.pleg-tit .punto{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; vertical-align:1px;}
/* parrilla de contenido: lo que toca grabar y la ficha de cada pieza */
.grabar-card{display:flex; gap:12px; align-items:flex-start; padding:13px 14px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--c-marca); border-radius:var(--radius); margin-bottom:8px; cursor:pointer;}
.grabar-fecha{flex:none; width:44px; text-align:center; line-height:1.1;}
.grabar-fecha .d{font-size:19px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
.grabar-fecha .m{font-size:11px; color:var(--text-dim); text-transform:uppercase;}
.grabar-fecha.tarde .d, .grabar-fecha.tarde .m{color:var(--ambar);}
.grabar-info{flex:1; min-width:0;}
.grabar-info .t{font-weight:600; font-size:14.5px; line-height:1.3;}
.grabar-info .s{font-size:12.5px; color:var(--text-muted); margin-top:3px;}
.ficha-meta{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:13.5px; margin-bottom:16px;}
.ficha-meta dt{color:var(--text-dim);} .ficha-meta dd{margin:0; font-weight:600;}
.ficha-bloque{background:var(--surface-2); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;}
.ficha-bloque .k{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--c-marca); margin-bottom:4px;}
.ficha-bloque .v{font-size:15px; line-height:1.45; white-space:pre-line;}
.ficha-sub{font-size:13px; color:var(--text-muted); font-weight:600; margin:18px 0 8px; display:flex; justify-content:space-between; align-items:center;}
.etapas{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
.etapas .chip{padding:6px 11px; font-size:12.5px;}
.etapas .chip.active{border-color:var(--c-marca); color:var(--c-marca); background:color-mix(in srgb, var(--c-marca) 12%, transparent);}
/* informe del mes de la marca */
.mes-nav{display:flex; align-items:center; justify-content:space-between; margin:0 0 10px;}
.mes-nav button{background:var(--surface-2); border:none; color:var(--text); width:34px; height:34px; border-radius:50%; font-size:17px;}
.mes-nav .nom{font-weight:700; font-size:15px; text-transform:capitalize;}
.met-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:12px;}
.met{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:11px 12px;}
.met .l{font-size:11.5px; color:var(--text-dim); font-weight:600;}
.met .n{font-size:20px; font-weight:600; font-family:'Space Grotesk',sans-serif; margin-top:2px;}
.met .c{font-size:11.5px; font-weight:700; margin-top:1px;}
.met .c.sube{color:var(--done);} .met .c.baja{color:var(--urgent);} .met .c.igual{color:var(--text-dim); font-weight:600;}
.hallazgos{list-style:none; margin:0 0 12px; padding:0;}
.hallazgos li{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--c-marca); border-radius:var(--radius); padding:11px 13px; margin-bottom:7px; font-size:14px; line-height:1.4;}
.hallazgos li.ojo{border-left-color:var(--ambar);}
.tabla-mini{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:12px;}
.tabla-mini th{text-align:left; font-size:11px; color:var(--text-dim); font-weight:600; padding:4px 6px;}
.tabla-mini td{padding:7px 6px; border-top:1px solid var(--border);}
.tabla-mini td.num, .tabla-mini th.num{text-align:right; font-family:'Space Grotesk',sans-serif;}
/* En Plata cada seccion es un bloque con borde y aire alrededor: como lista
   corrida se veia todo plano y no se distinguia donde empezaba cada cosa. */
.pleg-lista{display:flex; flex-direction:column; gap:10px;}
.pleg-lista .pleg{margin:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.pleg-lista .pleg-head{background:none; border:none; border-radius:0; padding:14px;}
.pleg-lista .pleg.abierta .pleg-head{border-bottom:1px solid var(--border); background:var(--surface-2);}
.pleg-lista .pleg-body{padding:2px 14px 8px;}
.pleg-head:focus{outline:none;}
.pleg-head:focus-visible{outline:2px solid var(--accent-soft); outline-offset:-2px;}
/* adentro, cada cosa es una fila con linea fina, no una tarjeta */
.pleg-lista .card{background:none; border:none !important; border-radius:0; padding:9px 2px; margin:0; border-top:1px solid var(--border) !important; font-size:14px;}
.pleg-lista .pleg-body > .card:first-child{border-top:none !important;}
.pleg-lista .card .mono{font-size:14px !important; font-weight:600 !important;}
.pleg-lista .card .helptext{font-size:12px; margin-top:2px !important;}
.pleg-lista .card .small-btn{margin-top:6px !important;}
.pleg-lista .progress-track{height:4px; margin-top:6px;}
/* una fila de plata: nombre, cuando y monto en una sola linea */
.fila-p{display:grid; grid-template-columns:minmax(0,1fr) auto auto; column-gap:10px; row-gap:1px; align-items:center; padding:12px 2px; border-top:1px solid var(--border); cursor:pointer;}
.fila-p .nom{grid-column:1; grid-row:1;}
.fila-p .cu{grid-column:1; grid-row:2;}
.fila-p .small-btn{grid-column:2; grid-row:1 / 3;}
.fila-p .mo{grid-column:3; grid-row:1 / 3;}
/* los montos se escriben: sin flechitas para subir y bajar */
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
input[type=number]{-moz-appearance:textfield; appearance:textfield;}
.pleg-body > .fila-p:first-child{border-top:none;}
.fila-p .nom{min-width:0; font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fila-p .cu{font-size:12.5px; color:var(--text-dim);}
.fila-p .cu.ojo{color:var(--ambar); font-weight:600;} .fila-p .cu.ok{color:var(--done);}
.fila-p .mo{font-family:'Space Grotesk',sans-serif; font-size:15.5px; font-weight:600; text-align:right;}
.fila-p .small-btn{padding:4px 9px; font-size:11.5px;}
.pleg-acciones{display:flex; justify-content:flex-end; gap:8px; margin:2px 0 8px;}

/* ---------- turnos y choques ---------- */
.lugares{display:grid; gap:8px; margin-top:6px;}
.lugar{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:12px 13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
.lugar.sel{border-color:var(--c-trabajo); background:color-mix(in srgb, var(--c-trabajo) 8%, var(--surface));}
.lugar .ini{flex:none; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#fff; background:var(--c-trabajo); font-family:'Bricolage Grotesque',sans-serif;}
.lugar .nom{font-weight:600; font-size:15px;}
.lugar .sub{font-size:12.5px; color:var(--text-muted); margin-top:1px;}
.choque-head{display:flex; align-items:center; gap:8px; color:var(--urgent); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em;}
.choque-box{margin-top:9px; padding:13px 14px; border-radius:var(--radius); background:var(--urgent-soft); border-left:3px solid var(--urgent); font-size:14.5px; line-height:1.45;}
.choque-box p{margin:0 0 7px;} .choque-box p:last-child{margin-bottom:0;}
.choque-head.suave{color:var(--ambar);}
.choque-box.suave{background:var(--ambar-soft); border-left-color:var(--ambar);}
.porque-suave{color:var(--text-muted); font-size:13px;}
.opcion{width:100%; text-align:left; padding:12px 13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:default; margin-bottom:8px;}
.opcion .qué{font-weight:600; font-size:14.5px;}
.opcion .porqué{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.nota-suave{font-size:12.5px; color:var(--text-dim); margin:12px 0 14px; line-height:1.45;}
.pago-calc{margin-top:8px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--done-soft); color:var(--done); font-size:13px; font-weight:600;}
.tentativo{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:var(--ambar-soft); color:var(--ambar); margin-left:6px;}

/* ---------- finanzas ---------- */
.progress-track{height:7px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:9px;}
.progress-fill{height:100%; background:var(--c-fin); border-radius:6px;}
.money{font-family:'Space Grotesk',sans-serif; font-weight:700;}
.summary-row{display:flex; gap:10px; margin-bottom:16px;}
.summary-box{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px;}
.summary-box .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
.summary-box .val{font-size:18px; margin-top:4px;}
.installment-card{border-left:4px solid var(--c-fin) !important;}

/* ---------- personal ---------- */
.item.personal-row{border-left-color:var(--c-personal);}

/* ---------- reminders ---------- */
.reminder-row{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--urgent); border-radius:var(--radius-sm); margin-bottom:7px;}
.reminder-row.done{opacity:.55;}
.reminder-row .txt{flex:1; font-size:13.5px; font-weight:500;}
.reminder-row.done .txt{text-decoration:line-through; color:var(--text-dim);}
.addbar{display:flex; gap:8px; margin-bottom:14px;}
.addbar input{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:14px; font-family:inherit; color:var(--text);}
.addbar button{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px; font-weight:700; font-size:13px;}

/* ---------- calendar month ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-nav button{background:var(--surface); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:10px; font-size:16px;}
.cal-nav h2{margin:0; font-size:18px; text-transform:capitalize;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-dow{text-align:center; font-size:10.5px; color:var(--text-dim); font-weight:700; padding-bottom:4px;}
.cal-cell{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; color:var(--text-muted); position:relative; border:1px solid transparent; background:var(--surface);}
.cal-cell.blank{visibility:hidden;}
.cal-cell.today{border-color:var(--accent); border-width:2px; color:var(--text); font-weight:700;}
.cal-cell .dots{display:flex; gap:2px; margin-top:3px; height:5px;}
.cal-cell .dots span{width:4.5px; height:4.5px; border-radius:50%;}
.cal-cell.ciclo-range{background:rgba(214,70,126,.10);}
.cal-cell.ciclo-log{background:rgba(214,70,126,.28); color:#3A0F26; font-weight:700;}
/* el dia que toca va de ultimo: si no, el color del ciclo lo tapaba */
.cal-cell.selected{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
.cal-cell.selected .dots span{background:rgba(255,255,255,.92) !important;}
/* en oscuro el morado es claro: encima va tinta oscura, no blanca */
html[data-tema="oscuro"] .cal-cell.selected{color:#101218;}
html[data-tema="oscuro"] .cal-cell.selected .dots span{background:rgba(16,18,24,.8) !important;}
.cal-daylist{margin-top:18px;}

/* ---------- la semana como una agenda: las horas de arriba abajo, cada dia
   una columna y cada cosa un bloque del alto que de verdad dura (D103) ---------- */
.gc{--hp:44px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden; margin-bottom:10px;}
.gc-head{display:grid; grid-template-columns:34px repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--border);}
.gc-dia{display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 8px; background:none; border:none; font:inherit; color:var(--text-dim); cursor:pointer;}
.gc-dia b{font-size:9.5px; font-weight:700; letter-spacing:.05em;}
.gc-dia .num{width:26px; height:26px; line-height:26px; border-radius:50%; font-size:14px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums;}
.gc-dia.hoy .num{background:var(--accent); color:#fff;}
.gc-dia.elegido:not(.hoy) .num{background:var(--accent-soft); color:var(--accent);}
.gc-scroll{max-height:58vh; overflow-y:auto; overscroll-behavior:contain;}
.gc-cuerpo{display:grid; grid-template-columns:34px repeat(7,minmax(0,1fr));}
.gc-hora{height:var(--hp); font-size:9.5px; color:var(--text-dim); text-align:right; padding-right:4px;}
.gc-hora span{position:relative; top:-5px;}
.gc-col{position:relative; border-left:1px solid var(--border);
  background-image:linear-gradient(var(--border) 1px, transparent 1px);
  background-size:100% var(--hp); background-position:0 -1px;}
.gc-col.hoy{background-color:var(--accent-soft);}
.gc-ev{position:absolute; overflow:hidden; text-align:left; border:none; font:inherit; cursor:pointer;
  border-radius:5px; padding:2px 3px 2px 4px; line-height:1.15; color:var(--text);
  background:color-mix(in srgb, var(--c) 18%, var(--surface)); border-left:3px solid var(--c);}
.gc-ev b{font-size:9px; font-weight:600; overflow-wrap:break-word;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;}
.gc-ev .h{display:block; font-size:8.5px; color:var(--text-muted);}
/* si el bloque es corto no cabe partir la palabra: una linea y puntos */
.gc-ev.corto{padding-top:1px;}
.gc-ev.corto b{-webkit-line-clamp:1; overflow-wrap:normal;}
.gc-ev.hecho{opacity:.45;}
.gc-ev.saltado{opacity:.5;}
.gc-ev.saltado b{text-decoration:line-through;}
/* la raya roja de la hora en la que va: lo unico que se mueve en la pantalla */
.gc-ahora{position:absolute; left:0; right:0; height:2px; background:var(--urgent); z-index:3; pointer-events:none;}
.gc-ahora::before{content:''; position:absolute; left:-3px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--urgent);}

/* ---------- Yo tab ---------- */
.cycle-hero{background:linear-gradient(135deg, rgba(214,70,126,.14), rgba(139,108,249,.07)); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
.cycle-hero .big{font-size:26px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--c-ciclo);}
.cycle-hero .sub{font-size:13px; color:var(--text-muted); margin-top:4px;}
.ring-row{display:flex; gap:10px; margin-top:14px;}
.ring-box{flex:1; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 4px;}
.ring-box b{display:block; font-size:16px; font-family:'Space Grotesk',sans-serif;}
.ring-box span{font-size:10.5px; color:var(--text-dim);}
.bar-chart{display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:6px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar-col .bar{width:100%; border-radius:6px 6px 3px 3px; min-height:3px;}
.bar-col .lbl{font-size:10px; color:var(--text-dim); margin-top:6px;}
.insight{display:flex; gap:10px; align-items:flex-start; padding:12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); margin-bottom:8px;}
.insight .ico{font-size:16px;}
.insight .txt{font-size:13px; color:var(--text-muted); line-height:1.4;}
.insight .txt b{color:var(--text);}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,17,26,.55); backdrop-filter:blur(3px); z-index:50; display:none; align-items:flex-end;}
.overlay.active{display:flex;}
.sheet{background:var(--surface); width:100%; max-width:560px; margin:0 auto; border-radius:22px 22px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:slideup .28s cubic-bezier(.2,.9,.3,1); border-top:3px solid var(--accent);}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:6px auto 14px;}
.sheet h3{margin:0 0 16px; font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:14.5px; font-family:inherit;}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.field-check{display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:14px;}
.field-check input{width:18px; height:18px;}
.field-check label{margin:0; font-size:13.5px; font-weight:600; color:var(--text); text-transform:none;}
.sheet-actions{display:flex; gap:8px; margin-top:10px; justify-content:flex-end; align-items:center;}
.btn{border:none; padding:9px 16px; border-radius:10px; font-weight:600; font-size:13.5px;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-ghost{background:none; color:var(--text-muted);}
.btn-danger{background:none; color:var(--urgent); margin-right:auto; padding-left:4px;}
.close-x{position:absolute; top:16px; right:16px; background:var(--surface-2); border:none; color:var(--text-muted); width:30px; height:30px; border-radius:50%; font-size:15px;}
.helptext{font-size:12px; color:var(--text-muted); margin:-8px 0 14px; line-height:1.45;}

::selection{background:var(--accent-soft);}

/* ---------- listas de pendientes (sin fecha, por seccion) ---------- */
.lista-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:20px 0 9px;}
.lista-head .nombre{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700;}
.lista-head .punto{width:9px; height:9px; border-radius:50%; flex:none;}
.lista-head .acciones{display:flex; gap:6px; flex:none;}
/* listas como notas de Keep: casilla, texto que se edita ahi mismo, arrastrar
   para ordenar y lo completado tachado y plegado abajo */
.keep{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:4px 0; margin-bottom:6px;}
.kitem{display:flex; align-items:flex-start; gap:6px; padding:2px 10px 2px 2px; min-height:40px; background:var(--surface);}
.kitem.arrastrando{opacity:.85; box-shadow:0 4px 14px rgba(0,0,0,.14); position:relative; z-index:2; border-radius:8px;}
.kdrag{flex:none; width:24px; height:38px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); touch-action:none; cursor:grab; opacity:.55; font-size:15px; letter-spacing:-2px;}
.kcheck{flex:none; width:20px; height:20px; margin:10px 6px 0 0; border:2px solid var(--text-dim); border-radius:4px; background:transparent; padding:0; display:flex; align-items:center; justify-content:center; color:#fff;}
.kcheck.hecho{background:var(--text-dim); border-color:var(--text-dim);}
.kcheck.hecho::after{content:''; width:10px; height:5px; border:2px solid var(--surface); border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px);}
.ktxt{flex:1; min-width:0; font-size:15px; line-height:1.35; padding:9px 0; cursor:text; word-break:break-word;}
.kitem.hecho .ktxt{text-decoration:line-through; color:var(--text-dim);}
.kinput{flex:1; min-width:0; font:inherit; font-size:15px; line-height:1.35; padding:8px 0; border:none; border-bottom:1px solid var(--accent); background:transparent; color:var(--text); outline:none; border-radius:0;}
.kbtn{flex:none; width:34px; height:38px; border:none; background:none; color:var(--text-muted); font-size:17px; padding:0;}
.kcuando{display:block; font-size:12px; color:var(--text-muted); margin-top:2px; text-decoration:none;}
.kcuando.hoy{color:var(--accent); font-weight:600;} .kcuando.tarde{color:var(--urgent); font-weight:600;}
.plan-box{background:var(--surface-2); border-radius:var(--radius); padding:12px 14px; margin:0 0 14px;}
.plan-box .qd{font-size:14.5px; line-height:1.4;}
.plan-box .qd b{font-family:'Space Grotesk',sans-serif;}
.plan-box .acc{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.plan-box.ojo{background:var(--ambar-soft);}
.bloque.auto .raya{background:repeating-linear-gradient(to bottom, var(--raya) 0 5px, transparent 5px 9px) !important;}
.bloque.auto .nombre::after{content:' · sugerido'; font-weight:500; font-size:12px; color:var(--text-dim);}
.bloque.auto.movido .nombre::after{content:' · movido'; color:var(--ambar);}
.huecos-sug{display:flex; flex-wrap:wrap; gap:6px; margin:-6px 0 14px;}
.huecos-sug .chip{font-size:12px; padding:5px 10px;}
.suelto .cuando{flex:none; font-size:12px; color:var(--text-muted);}
.kurg{flex:none; align-self:center; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;}
.kadd{display:flex; align-items:center; gap:12px; padding:0 12px 0 32px; min-height:42px; color:var(--text-muted); font-size:15px; cursor:text;}
.kadd .mas{font-size:20px; font-weight:300; width:14px; text-align:center;}
.khechos{display:flex; align-items:center; gap:8px; width:100%; border:none; border-top:1px solid var(--border); background:none; color:var(--text-muted); font:inherit; font-size:14px; padding:12px 14px 8px; margin-top:4px; text-align:left;}
.khechos .chev{transition:transform .15s; display:inline-block;}
.khechos.abierto .chev{transform:rotate(90deg);}
.kpie{display:flex; justify-content:flex-end; gap:8px; padding:4px 0 8px;}
.klink{border:none; background:none; color:var(--text-muted); font:inherit; font-size:13px; font-weight:600; padding:6px 4px;}
.pend{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); padding:11px 12px; margin-bottom:7px;}
.pend.hecho{opacity:.5;}
.pend.hecho .txt{text-decoration:line-through;}
.pend .txt{flex:1; font-size:14px; line-height:1.35; cursor:pointer;}
.urg{flex:none; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:5px 9px; border-radius:20px; border:none; font-family:inherit;}
.urg[data-nivel="normal"]{background:var(--surface-3); color:var(--text-dim);}
.urg[data-nivel="importante"]{background:var(--accent-soft); color:var(--accent);}
.urg[data-nivel="urgente"]{background:var(--urgent-soft); color:var(--urgent);}
</style>
</head>

<script>
/* ============================================================
   STORAGE
   Fuente de verdad: un JSON en Vercel Blob, vía /api/data.
   localStorage queda como caché local (arranque instantáneo y offline).
============================================================ */
const STORAGE_KEY = 'centro-control-sharon';
const DIRTY_KEY   = 'centro-control-sharon:pendiente';
const PASS_KEY    = 'centro-control-sharon:pin';
const API_URL     = '/api/data';
let DATA = {
  events: [],
  subjects: [],
  period: '',
  academicTasks: [],
  courseSchedule: [],
  courseTasks: [],
  courseModules: [],
  courseNotes: '',
  nexxaEvents: [],
  workClients: [],
  workSessions: [],
  installments: [],
  personalItems: [],
  reminders: [],
  routines: [], // {id,cat,title,days:[0..6],start,end,notes}
  listas: [],      // {id,nombre,color} — las secciones que arma Sharon
  pendientes: [],  // {id,listaId,titulo,urgencia,hecho,creado} — sin fecha a proposito
  cycle: { starts: [], avgLen: 28, periodLen: 5 },
  turnos: [],          // {id,lugar,hotel,fecha,entra,sale,confirmado,trasladoMin,estimado}
  plata: { saldo:null, saldoFecha:'', tasaUSD:null, tasaFecha:'', topes:{}, bolsillos:[] },
  uni: { pasaCon:3.0, maxFallas:8, historial:[] },   // historial: {periodo, materias:[{name,nota}]}
  marca: { ideas:[], publicaciones:[] },             // marca personal (D73)
  diario: {},                                        // {fecha:{sueno:[],animo,cerrado}}
  suscripciones: [],   // {id,nombre,monto,moneda,dia,nota} — vuelven cada mes
  deudas: [],          // {id,nombre,sentido,monto,fecha,fechaHasta,aprox,nota,movs:[]}
  compromisosSembrados: false,
  platoSembrado: false
};
let saveTimer=null;
let dirty=false;        // hay cambios locales que todavía no subieron
let pushing=false;      // hay un guardado en vuelo
let pendingPush=false;  // llegó otro cambio mientras subíamos
let SYNC_STATE='sync';
const SYNC_LABELS = { ok:'Sincronizado', sync:'Sincronizando…', off:'Sin conexión', lock:'Bloqueado' };

function setSync(state){
  SYNC_STATE = state;
  const btn = document.getElementById('syncBtn');
  const txt = document.getElementById('syncText');
  if(!btn || !txt) return;
  btn.dataset.state = state;
  txt.textContent = SYNC_LABELS[state] || '';
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function setDirty(v){
  dirty = v;
  if(v) lsSet(DIRTY_KEY,'1'); else lsDel(DIRTY_KEY);
}
function cacheLocal(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
  catch(e){ console.warn('No se pudo guardar la copia local', e); }
}
/* Copia solo las claves que la app conoce: ignora basura y campos viejos. */
function mergeInto(src){
  if(!src || typeof src!=='object') return false;
  Object.keys(DATA).forEach(k=>{ if(k in src && src[k]!=null) DATA[k] = src[k]; });
  return true;
}
function hasLocalData(){
  return !!(DATA.events.length || DATA.subjects.length || DATA.routines.length || DATA.reminders.length ||
    DATA.academicTasks.length || DATA.courseSchedule.length || DATA.courseTasks.length || DATA.courseModules.length ||
    DATA.nexxaEvents.length || DATA.workClients.length || DATA.workSessions.length || DATA.installments.length ||
    DATA.personalItems.length || (DATA.cycle && DATA.cycle.starts.length) || DATA.period || DATA.courseNotes);
}

function askPass(){
  const p = prompt('PIN de acceso del Centro de Control:');
  if(p===null) return false;
  lsSet(PASS_KEY, p.trim());
  return true;
}
async function apiRequest(method, body, retry){
  const headers = { 'Content-Type':'application/json' };
  const pass = lsGet(PASS_KEY);
  if(pass) headers['x-app-password'] = pass;
  const res = await fetch(API_URL, { method, headers, cache:'no-store', body: body ? JSON.stringify(body) : undefined });
  if(res.status===401){
    if(retry!==false && askPass()) return apiRequest(method, body, false);
    const err = new Error('PIN incorrecto'); err.code = 401; throw err;
  }
  if(!res.ok){
    let detail=''; try{ detail = (await res.json()).error || ''; }catch(e){}
    throw new Error(detail || ('HTTP '+res.status));
  }
  return res.json();
}

/* Baja el estado remoto y pisa el local. Solo se llama cuando no hay cambios pendientes. */
async function pullRemote(){
  setSync('sync');
  try{
    const out = await apiRequest('GET');
    if(out && out.data){ mergeInto(out.data); cacheLocal(); }
    else if(hasLocalData()){ setDirty(true); }  // primera vez en la nube: sube lo que ya había acá
    setSync(dirty ? 'sync' : 'ok');
    return true;
  }catch(e){
    console.warn('No se pudo leer desde Vercel Blob', e);
    setSync(e.code===401 ? 'lock' : 'off');
    return false;
  }
}

/* Sube el estado completo (último que escribe, gana). */
async function pushRemote(){
  if(!dirty) return true;
  if(pushing){ pendingPush = true; return false; }
  pushing = true; setSync('sync');
  const before = JSON.stringify(DATA);
  try{
    await apiRequest('POST', { data: DATA });
    if(JSON.stringify(DATA)===before){ setDirty(false); setSync('ok'); }
    else { pendingPush = true; }
    return true;
  }catch(e){
    console.warn('No se pudo guardar en Vercel Blob', e);
    setSync(e.code===401 ? 'lock' : 'off');
    return false;
  }finally{
    pushing = false;
    if(pendingPush){ pendingPush = false; setTimeout(pushRemote, 0); }
  }
}

async function loadData(){
  try{
    const raw = lsGet(STORAGE_KEY);
    if(raw) mergeInto(JSON.parse(raw));
  }catch(e){ console.warn('No se pudieron leer los datos locales', e); }

  if(lsGet(DIRTY_KEY)==='1'){
    /* Quedó algo sin subir de la sesión anterior: no lo pisamos con lo remoto. */
    dirty = true;
    await pushRemote();
  }else{
    await pullRemote();
    if(dirty) await pushRemote();
  }
}

function saveData(){
  setDirty(true);
  cacheLocal();
  setSync('sync');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 600);
}

/* Sincroniza al volver a la app / recuperar red. */
async function syncNow(){
  if(dirty) return pushRemote();
  const ok = await pullRemote();
  if(ok) renderAll();
  return ok;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* Todo lo que escribe el usuario pasa por acá antes de entrar al HTML.
   Sin esto una comilla en un título corta el atributo value y el dato se
   trunca al editarlo, y un < se traga el resto del texto. */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function esc(v){
  if(v===null || v===undefined) return '';
  return String(v).replace(/[&<>"']/g, c=>ESC_MAP[c]);
}

const DOW = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOW_SHORT = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function niceDate(s){ const d=parseDate(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function niceDateShort(s){ if(!s) return ''; const d=parseDate(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
/* Secciones plegables (Plata y Pendientes): cerradas muestran nombre y resumen,
   se abren tocandolas y el telefono recuerda cuales quedaron abiertas. */
var PLEG_ABIERTAS = new Set();
try{ PLEG_ABIERTAS = new Set(JSON.parse(localStorage.getItem('plataAbiertas')||'[]')); }catch(e){}
function abrirPlegable(key){
  PLEG_ABIERTAS.add(key);

}

  abrir ? PLEG_ABIERTAS.add(key) : PLEG_ABIERTAS.delete(key);
  try{ localStorage.setItem('plataAbiertas', JSON.stringify([...PLEG_ABIERTAS])); }catch(e){}
});
function plegable(key, titulo, resumen, contenido, alerta){
  const abierta = PLEG_ABIERTAS.has(key);
  return `<div class="pleg ${abierta?'abierta':''}" data-pleg="${key}">
    <button class="pleg-head" aria-expanded="${abierta}">

    </button>
    <div class="pleg-body" ${abierta?'':'hidden'}>${contenido}</div>
  </div>`;
}
function money(n){ return '$' + Math.round(Number(n||0)).toLocaleString('es-CO'); }
function horasFromRange(start,end){
  if(!start||!end) return 0;
  const [h1,m1]=start.split(':').map(Number), [h2,m2]=end.split(':').map(Number);
  let mins = (h2*60+m2)-(h1*60+m1);
  if(mins<=0) mins += 24*60; // cruza medianoche
  return Math.round((mins/60)*100)/100;
}
function weekdayItems(dayIdx){
  const items=[];
  const hayClases = DATA.subjects.some(s=>s.day===dayIdx);
  DATA.subjects.filter(s=>s.day===dayIdx).forEach(s=>items.push({name:s.name, start:s.start, end:s.end, color:'var(--c-uni)', tag:'clase', materia:s}));
  DATA.routines.filter(r=>r.days.includes(dayIdx)).forEach(r=>{
    /* si ya cargo las materias de ese dia, el bloque generico de Universidad
       sobra: seria la misma cosa dos veces */
    if(r.auto==='universidad' && hayClases) return;
    items.push({name:r.title, start:r.start, end:r.end, color:catDe(r.cat).color, tag:catDe(r.cat).label.toLowerCase(), ref:r});
  });
  return items.sort(porHora);
}
/* Lo que tiene hora va primero y en orden; lo que no, al final. */
function porHora(a,b){ return (a.start||'99:99').localeCompare(b.start||'99:99'); }

const SUB_VIEW = { listas:'pendientes', materias:'pendientes', marca:'pendientes', nexxa:'pendientes', trabajo:'pendientes', finanzas:'plata', personal:'yo', rutinas:'calendario' };
function showView(v){

/* Salir a contestar un mensaje y volver no es empezar de cero: el telefono
   cierra la app cuando le hace falta memoria, y al reabrirla caia en Hoy.
   Asi que se guarda donde estaba parada y se vuelve ahi, mientras sea del
   mismo dia y de hace menos de cuatro horas. Mas viejo que eso, Hoy. */
const DONDE_KEY = 'bitacora:donde';
const DONDE_VENCE = 4 * 60 * 60 * 1000;
function recordarDonde(vista, sub){
  let previo = {};
  try{ previo = JSON.parse(lsGet(DONDE_KEY)) || {}; }catch(e){}
  const v = vista || previo.vista || 'hoy';
  lsSet(DONDE_KEY, JSON.stringify({
    vista: v,
    sub: sub || (vista && vista !== previo.vista ? '' : previo.sub) || '',
    dia: todayStr(),
    cuando: Date.now()
  }));
}
function dondeEstaba(){
  let d = null;
  try{ d = JSON.parse(lsGet(DONDE_KEY)); }catch(e){}
  if(!d || !views.includes(d.vista)) return null;
  if(d.dia !== todayStr() || Date.now() - (d.cuando||0) > DONDE_VENCE) return null;
  return d;
}
function volverDondeEstaba(){
  const d = dondeEstaba();
  if(!d) return;
  if(d.vista !== 'hoy') showView(d.vista);
  if(d.sub && SUB_VIEW[d.sub] === d.vista) goToSubtab(d.sub);
}

/* Marca en que lado quedan pestanas escondidas, para pintar la sombrita. */
function marcarBordes(barra){
  const caja = barra.closest('.subtabs-wrap');
  if(!caja) return;
  const hayMas = barra.scrollWidth - barra.clientWidth;
  caja.toggleAttribute('data-mas-izquierda', barra.scrollLeft > 4);
  caja.toggleAttribute('data-mas-derecha', barra.scrollLeft < hayMas - 4);
}

/* Cada barra de subpestañas manda solo sobre las suyas. */
document.querySelectorAll('.subtabs').forEach(barra=>{
  const botones = [...barra.querySelectorAll('.subtab')];
  const subs = botones.map(b=>b.dataset.sub);
  barra.addEventListener('scroll', ()=>marcarBordes(barra), {passive:true});
  addEventListener('resize', ()=>marcarBordes(barra));
  requestAnimationFrame(()=>marcarBordes(barra));
  botones.forEach(b=>{
    b.addEventListener('click', ()=>{
      botones.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      recordarDonde(SUB_VIEW[b.dataset.sub], b.dataset.sub);
      b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

});

function itemHTML(e){
  const cat = catDe(e.cat);
  const isUrgent = e.status!=='hecho' && daysBetween(todayStr(), e.date)>=0 && daysBetween(todayStr(), e.date)<=2;
  let metaParts = [];
  if(e.start) metaParts.push(e.start + (e.end? '–'+e.end : ''));
  if(e.date !== todayStr()) metaParts.push(niceDateShort(e.date));
  if(e.cat==='finanzas' && e.amount) metaParts.push(e.type==='traslado' ? money(e.amount) : (e.type==='ingreso'||e.type==='prestamo_recibido' ?'+':'-') + money(e.amount));
  if(e.persona) metaParts.push('con ' + e.persona);
  return `<div class="item ${e.status==='hecho'?'done':''}" data-id="${e.id}" data-sel-tipo="evento" data-sel-id="${e.id}" style="border-left-color:${cat.color}">
    <button class="status-btn ${e.status==='progreso'?'progreso':e.status==='hecho'?'hecho':''}" data-action="cyclestatus" data-id="${e.id}"></button>
    <div class="body">
      <div class="row1">
        <div class="title">${esc(e.title)}</div>
        <span class="tag" style="background:color-mix(in srgb, ${cat.color} 20%, transparent); color:${cat.color};">${cat.emoji}</span>
      </div>
      <div class="meta">${metaParts.map(m=>`<span>${esc(m)}</span>`).join('')} ${isUrgent?'<span style="color:var(--urgent); font-weight:700;">· pronto</span>':''}</div>
    </div>
  </div>`;
}
function bindItemClicks(){
  document.querySelectorAll('[data-action="cyclestatus"]').forEach(b=>{
    b.onclick = (ev)=>{
      ev.stopPropagation();
      const e = DATA.events.find(x=>x.id===b.dataset.id);
      if(!e) return;
      if(e.status==='pendiente'||!e.status) e.status='progreso';
      else if(e.status==='progreso'){
        const actual = prompt('¿Cuántos minutos reales te tomó? (opcional, Cancelar para omitir)');
        if(actual && !isNaN(actual)) e.actualMin = Number(actual);
        e.status='hecho';
      } else { e.status='pendiente'; }
      syncSourceFromEvent(e);
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('.item[data-id], .bloque[data-id]').forEach(it=>{
    /* bindItemClicks corre en cada render y recorre todo el documento: sin esto,
       un item de otra seccion terminaba con el mismo clic colgado dos veces */
    if(it.dataset.enganchado) return;
    it.dataset.enganchado = '1';
    it.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-action="cyclestatus"]')) return;
      const e = DATA.events.find(x=>x.id===it.dataset.id);
      if(!e) return;
      if(e.linkedType){ openLinkedSource(e.linkedType, e.linkedId); return; }
      openEventModal(e);
    });
  });
}

function openLinkedSource(type, id){

/* ============================================================
   RENDER: HOY
============================================================ */
function renderHoy(){
  const t = todayStr();
  const manana = fmtDate(addDays(new Date(),1));
  const dow = new Date().getDay();

  /* ---- 1 · lo que vence hoy o mañana (D104) ---- */
  const vencen = [];
  DATA.events.filter(e=>e.status!=='hecho' && e.date<=manana && !e.linkedType).forEach(e=>{
    if(e.start) return;                       // lo que tiene hora va en Tu día
    vencen.push({ titulo:e.title, cuando:e.date<t?'Atrasado':e.date===t?'Hoy':'Mañana',
      sub:CATS[e.cat]?CATS[e.cat].label:'', color:CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)', tarde:e.date<t });
  });
  DATA.events.filter(e=>e.status!=='hecho' && e.date<t && e.start).forEach(e=>{
    vencen.push({ titulo:e.title, cuando:'Atrasado', sub:niceDateShort(e.date),
      color:CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)', tarde:true });
  });
  /* las mismas que disparan el aviso del dia antes, para que no se contradigan */
  (DATA.academicTasks||[]).forEach(a=>{
    if(a.done || !a.date || a.date > manana) return;
    vencen.push({ titulo:a.name, cuando:a.date<t?'Atrasada':a.date===t?'Hoy':'Mañana',
      sub:a.subject||'Universidad', color:'var(--c-uni)', tarde:a.date<t });
  });
  /* pendientes de las listas con dia: los atrasados, y los de hoy o mañana sin hora */
  (DATA.pendientes||[]).forEach(p=>{
    if(p.hecho || !p.fecha || p.fecha > manana) return;
    if(p.fecha===t) return;                       // los de hoy van en Tu día o en Sin hora
    vencen.push({ titulo:p.titulo, cuando:p.fecha<t?'Atrasado':p.fecha===t?'Hoy':'Mañana',
      sub:'', color:colorDeLista(p), tarde:p.fecha<t });
  });
  (DATA.suscripciones||[]).forEach(x=>{
    const prox = proximoCobro(x);
    if(prox && (prox===t || prox===manana)) vencen.push({ titulo:x.nombre, cuando:prox===t?'Hoy':'Mañana',
      sub:montoConMoneda(x.monto,x.moneda,x.montoCOP), color:'var(--c-dinero)', tarde:false });
  });
  (DATA.deudas||[]).forEach(d=>{
    if(d.fecha && (d.fecha===t || d.fecha===manana)) vencen.push({ titulo:d.nombre, cuando:d.fecha===t?'Hoy':'Mañana',
      sub:money(saldoDeuda(d)), color:'var(--urgent)', tarde:false });
  });

  document.getElementById('hoyUrgent').innerHTML = vencen.length ? `
    <div class="vence">
      ${vencen.map(v=>`
        <div class="vence-fila">
          <span class="punto" style="background:${v.tarde?'var(--urgent)':'var(--ambar)'};"></span>
          <span class="que">${esc(v.titulo)}</span>
          <span class="cuando">${esc(v.cuando)}</span>
        </div>`).join('')}
    </div>` : '';

  /* ---- 2 · tu día: la misma tira que usa el calendario ---- */
  const resumen = resumenDelDia(t);
  const lista = document.getElementById('hoyList');
  lista.innerHTML = resumen.bloques.length
    ? tiraDelDia(t, { sugerir:true, rapido:true })
    : `<div class="empty-card">Hoy no tienes nada con hora. Toca + para agregar algo.</div>`;
  engancharTira(lista);

  document.getElementById('hoyClasses').innerHTML = resumen.bloques.length
    ? `<div class="rotulo"><span>Tu día</span><span>${duracionLarga(resumen.ocupado)} ocupadas · ${libres(resumen.libre)}</span></div>`
    : `<div class="rotulo"><span>Tu día</span></div>`;

  /* ---- 3 · lo flexible de hoy: sin hora ---- */
  const sueltos = DATA.events.filter(e=>e.date===t && !e.start && e.status!=='hecho');
  const lugarHoy = acomodarDia(t).lugar;
  const pendHoy = pendientesConFecha(t).filter(p=>!p.hora && !lugarHoy[p.id]);
  const urgentes = (DATA.pendientes||[]).filter(p=>!p.hecho && p.urgencia==='urgente' && !(p.fecha===t));
  const flexBox = document.getElementById('hoyUpcoming');
  flexBox.innerHTML = (sueltos.length || urgentes.length || pendHoy.length) ? `
    <div class="rotulo" style="margin-top:22px;"><span>Sin hora</span></div>
    ${pendHoy.map(sueltoPendiente).join('')}
    ${sueltos.map(e=>`
      <div class="suelto" data-id="${e.id}" data-sel-tipo="evento" data-sel-id="${e.id}">
        <span class="punto" style="background:${CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)'};"></span>
        <span class="que">${esc(e.title)}</span>
      </div>`).join('')}
    ${urgentes.map(p=>{
      const l = (DATA.listas||[]).find(x=>x.id===p.listaId);
      return `<div class="suelto" data-sel-tipo="pendiente" data-sel-id="${p.id}">
        <button class="status-btn chico" data-action="togglePend" data-pid="${p.id}"></button>
        <span class="que">${esc(p.titulo)}</span>
        ${l ? `<span class="de">${esc(l.nombre)}</span>` : ''}
      </div>`;
    }).join('')}` : '';

  document.getElementById('hoyUrgentListas').innerHTML = '';

  renderManana();
  renderCierre();
  bindItemClicks();
  bindPendClicks();
  engancharTira(flexBox);
}

   avisan con uno o dos dias (D24). */
var CAL_MODO = 'mes';
try{ CAL_MODO = localStorage.getItem('calModo') || 'mes'; }catch(e){}

function renderCalendar(){

  for(let i=0;i<startBlank;i++) cells += `<div class="cal-cell blank"></div>`;
  const t = todayStr();
  const cyclePreds = predictCycle();
  for(let day=1; day<=lastDay; day++){
    const d = new Date(calDate.getFullYear(), calDate.getMonth(), day);
    const ds = fmtDate(d);
    const dayEvents = DATA.events.filter(e=>e.date===ds && !esMovimientoDePlata(e));
    const wdItems = weekdayItems(d.getDay());
    let dotColors = [...new Set([...dayEvents.map(e=>catDe(e.cat).color), ...pendientesConFecha(ds).map(colorDeLista)])];
    wdItems.forEach(it=>{ if(!dotColors.includes(it.color)) dotColors.push(it.color); });
    dotColors = dotColors.slice(0,3);
    const isCycleLog = DATA.cycle.starts.some(s=>{ const diff = daysBetween(s, ds); return diff>=0 && diff < DATA.cycle.periodLen; });
    const isPredicted = cyclePreds.some(p=> ds>=p.start && ds<=p.end);
    let cls = 'cal-cell';
    if(ds===t) cls+=' today';
    if(ds===calSelected) cls+=' selected';
    if(isCycleLog) cls+=' ciclo-log'; else if(isPredicted) cls+=' ciclo-range';
    cells += `<div class="${cls}" data-date="${ds}"><span>${day}</span><div class="dots">${dotColors.map(c=>`<span style="background:${c}"></span>`).join('')}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML = cells;
  document.querySelectorAll('.cal-cell:not(.blank)').forEach(c=>{ c.onclick = ()=>{ calSelected = c.dataset.date; renderCalendar(); renderCalDayList(); }; });
  if(!calSelected) calSelected = t;
  renderCalDayList();
}
/* La semana como agenda: siete columnas de horas y cada cosa dibujada donde
   cae y del alto que dura. Ver el dia en bloques contesta sola la pregunta de
   si le cabe un turno, que es para lo que abre la semana (D24, D103). */
const GC_HP = 44;                 // pixeles que mide una hora
/* Dos cosas a la misma hora no se pisan: se parten el ancho de la columna. */
function acomodarEnCarriles(items){
  items.sort((a,b)=> a.desde - b.desde || a.hasta - b.hasta);
  let grupo = [], finGrupo = -1;
  const cerrar = ()=>{
    if(!grupo.length) return;
    const carriles = [];
    grupo.forEach(it=>{
      let i = carriles.findIndex(fin => fin <= it.desde);
      if(i < 0){ carriles.push(it.hasta); i = carriles.length - 1; }
      else carriles[i] = it.hasta;
      it.carril = i;
    });
    grupo.forEach(it=> it.carriles = carriles.length);
    grupo = []; finGrupo = -1;
  };
  items.forEach(it=>{
    if(grupo.length && it.desde >= finGrupo) cerrar();
    grupo.push(it); finGrupo = Math.max(finGrupo, it.hasta);
  });
  cerrar();
  return items;
}
function renderCalSemana(){
  const grid = document.getElementById('calGrid'), caja = document.getElementById('calSemana');
  grid.hidden = true; caja.hidden = false;
  const hoy = todayStr();
  if(!calSelected) calSelected = hoy;
  const lunes = lunesDe(calSelected);
  const dias = diasEntre(lunes, fmtDate(addDays(parseDate(lunes), 6)));

  document.getElementById('calTitle').textContent =
    niceDateShort(lunes) + ' – ' + niceDateShort(dias[6]);

  const cabeza = dias.map(f=>{
    const d = parseDate(f);
    return `<button class="gc-dia ${f===hoy?'hoy':''} ${f===calSelected?'elegido':''}" data-dia="${f}">
      <b>${DOW_SHORT[d.getDay()]}</b><span class="num">${d.getDate()}</span>
    </button>`;
  }).join('');

  const horas = Array.from({length:24}, (_,h)=>
    `<div class="gc-hora"><span>${h ? String(h).padStart(2,'0') : ''}</span></div>`).join('');

  const ahora = ahoraEnMinutos();
  let primera = 24*60;

  const columnas = dias.map(f=>{
    const items = bloquesDeFecha(f).map(b=>{
      const desde = minutosDe(b.start);
      if(desde === null) return null;
      const hasta = Math.min(1440, b.end ? finEnMinutos(b.start, b.end) : desde + 30);
      return { desde, hasta: Math.max(hasta, desde + 20), b };
    }).filter(Boolean);
    /* la semana abre donde empieza el dia despierto: el sueño de la madrugada
       no cuenta para eso o siempre abriria a medianoche */
    items.forEach(it=>{ if(!it.b.noche && it.desde < primera) primera = it.desde; });

    const evs = acomodarEnCarriles(items).map(it=>{
      const b = it.b;
      const idRep = b.ev ? null : b.rutina ? 'rutina:'+b.rutina.id : b.materia ? 'materia:'+b.materia.id : null;
      const estadoRep = idRep ? estadoRepetido(f, idRep) : null;
      const hecho = b.ev ? b.ev.status==='hecho' : estadoRep==='hecho';
      const saltado = b.saltado || estadoRep==='saltado';
      const marca = b.ev ? `data-id="${b.ev.id}" data-sel-tipo="evento" data-sel-id="${b.ev.id}"`
        : b.rutina ? `data-rutina="${b.rutina.id}" data-sel-tipo="rutina" data-sel-id="${b.rutina.id}"`
        : b.materia ? `data-materia="${b.materia.id}" data-sel-tipo="materia" data-sel-id="${b.materia.id}"`
        : b.pend ? `data-pend="${b.pend.id}" data-sel-tipo="pendiente" data-sel-id="${b.pend.id}"`
      : b.sueno ? `data-sueno="${b.sueno}"` : '';
      const ancho = 100 / (it.carriles || 1);
      const alto = (it.hasta - it.desde) / 60 * GC_HP;
      return `<button class="gc-ev${alto < 34 ? ' corto':''}${hecho?' hecho':''}${saltado?' saltado':''}" ${marca}
        style="--c:${b.color}; top:${it.desde/60*GC_HP}px; height:${Math.max(alto, 15)}px;
               left:${it.carril*ancho}%; width:calc(${ancho}% - 2px);"
        title="${esc(b.start)}${b.end?'–'+esc(b.end):''} ${esc(b.titulo)}">
        <b>${esc(b.titulo)}</b>${alto >= 30 ? `<span class="h mono">${esc(b.start)}</span>` : ''}
      </button>`;
    }).join('');

    return `<div class="gc-col ${f===hoy?'hoy':''}" data-dia="${f}">${evs}${
      f===hoy ? `<div class="gc-ahora" style="top:${ahora/60*GC_HP}px"></div>` : ''}</div>`;
  }).join('');

  caja.innerHTML = `<div class="gc">
    <div class="gc-head"><div></div>${cabeza}</div>
    <div class="gc-scroll" id="gcScroll">
      <div class="gc-cuerpo"><div>${horas}</div>${columnas}</div>
    </div>
  </div>`;

  /* se abre donde empieza el dia de verdad, no a medianoche */
  const arranque = dias.includes(hoy) ? Math.min(primera, ahora) : primera;
  const scroll = document.getElementById('gcScroll');
  scroll.scrollTop = Math.max(0, (arranque===24*60 ? 7*60 : arranque - 30) / 60 * GC_HP);

  /* tocar el dia arriba, o el aire de su columna, lo elige abajo */
  caja.querySelectorAll('[data-dia]').forEach(el=>el.onclick = (ev)=>{
    if(ev.target.closest('.gc-ev')) return;
    calSelected = el.dataset.dia; renderCalSemana(); renderCalDayList();
  });
  engancharTira(caja);
  renderCalDayList();
}

/* ============================================================
   CYCLE
============================================================ */
/* El promedio sale de lo que ella registro, pero no de cualquier cosa: dos
   inicios pegados son el mismo periodo anotado dos veces, y un salto enorme es
   que se le olvido anotar. Esos no cuentan, para que no salga "ciclo de 2
   dias". Si no queda ninguno bueno, manda el numero que ella puso. */
const CICLO_MIN = 15, CICLO_MAX = 60;
function computeAvgCycle(){
  const starts = [...DATA.cycle.starts].sort();
  const diffs = [];
  for(let i=1;i<starts.length;i++){
    const d = daysBetween(starts[i-1], starts[i]);
    if(d >= CICLO_MIN && d <= CICLO_MAX) diffs.push(d);
  }
  if(!diffs.length) return DATA.cycle.avgLen || 28;
  const ultimos = diffs.slice(-6);
  return Math.round(ultimos.reduce((a,b)=>a+b,0)/ultimos.length);
}
function predictCycle(){
  const starts = [...DATA.cycle.starts].sort();
  if(!starts.length) return [];
  const avg = computeAvgCycle(); const plen = DATA.cycle.periodLen || 5;
  let cursor = parseDate(starts[starts.length-1]); let preds=[];
  for(let i=0;i<4;i++){ cursor = addDays(cursor, avg); preds.push({start:fmtDate(cursor), end:fmtDate(addDays(cursor, plen-1))}); }
  return preds;
}
