function bindPendClicks(){
  document.querySelectorAll('[data-action="editarLista"]').forEach(b=>{
    b.onclick = ()=>openListaModal(DATA.listas.find(l=>l.id===b.dataset.lista));
  });
  document.querySelectorAll('[data-action="limpiarLista"]').forEach(b=>{
    b.onclick = ()=>{
      const n = DATA.pendientes.filter(p=>p.listaId===b.dataset.lista && p.hecho).length;
      if(!confirm(`¿Borrar ${n} completado${n>1?'s':''}?`)) return;
      DATA.pendientes = DATA.pendientes.filter(p=>!(p.listaId===b.dataset.lista && p.hecho));
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('[data-action="togglePend"]').forEach(b=>{
    b.onclick = ()=>{
      const p = DATA.pendientes.find(x=>x.id===b.dataset.pid);
      if(!p) return;
      p.hecho = !p.hecho;
      /* al desmarcarlo vuelve al final de lo pendiente, como en Keep */
      if(!p.hecho) p.orden = Math.max(0, ...DATA.pendientes.filter(x=>x.listaId===p.listaId && !x.hecho && x!==p).map(x=>(x.orden??0)+1));
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('[data-action="verHechas"]').forEach(b=>{
    b.onclick = ()=>{
      const key = 'hechas:'+b.dataset.lista, abrir = !b.classList.contains('abierto');
      b.classList.toggle('abierto', abrir);
      b.nextElementSibling.hidden = !abrir;
      abrir ? PLEG_ABIERTAS.add(key) : PLEG_ABIERTAS.delete(key);
      try{ localStorage.setItem('plataAbiertas', JSON.stringify([...PLEG_ABIERTAS])); }catch(e){}
    };
  });
  document.querySelectorAll('#listasBody [data-action="editPend"]').forEach(t=>{ t.onclick = ()=>editarEnSitio(t); });
  document.querySelectorAll('[data-action="nuevoItem"]').forEach(a=>{ a.onclick = ()=>escribirNuevo(a.dataset.lista); });
  document.querySelectorAll('#listasBody .kdrag').forEach(h=>engancharArrastre(h));
}

/* Tocar el texto lo vuelve editable ahi mismo. Enter guarda y abre el
   siguiente; si queda vacio, se borra. La equis lo borra y los tres puntos
   abren lo demas (urgencia, lista, fecha). */
function editarEnSitio(txt){
  if(seleccionando()) return;
  const p = DATA.pendientes.find(x=>x.id===txt.dataset.pid); if(!p) return;
  const fila = txt.closest('.kitem');
  const inp = document.createElement('input');
  inp.className = 'kinput'; inp.value = p.titulo; inp.enterKeyHint = 'next';
  txt.replaceWith(inp);
  const mas = document.createElement('button'); mas.className = 'kbtn'; mas.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'; mas.setAttribute('aria-label','Fecha, hora y más');
  const x = document.createElement('button'); x.className = 'kbtn'; x.textContent = '✕'; x.setAttribute('aria-label','Eliminar');
  fila.querySelector('.kurg')?.remove();
  fila.append(mas, x);
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  let hecho = false;
  const terminar = (siguiente)=>{
    if(hecho) return; hecho = true;
    const val = inp.value.trim();
    if(!val) DATA.pendientes = DATA.pendientes.filter(q=>q.id!==p.id);
    else p.titulo = val;
    saveData();
    if(siguiente){ renderAll(); escribirNuevo(p.listaId); return; }
    /* al salir tocando otra cosa no se repinta todo: si no, ese toque se pierde */
    if(!val){ fila.remove(); return; }
    const nueva = document.createElement('div');
    nueva.innerHTML = pendienteHTML(p);
    const el = nueva.firstElementChild;
    fila.replaceWith(el);
    engancharFila(el);
  };
  /* pointerdown en vez de click: si no, el blur del campo llega primero */
  x.onpointerdown = (ev)=>{ ev.preventDefault(); hecho = true; DATA.pendientes = DATA.pendientes.filter(q=>q.id!==p.id); saveData(); renderAll(); };
  mas.onpointerdown = (ev)=>{ ev.preventDefault(); const val = inp.value.trim(); if(val) p.titulo = val; hecho = true; saveData(); renderAll(); openPendienteModal(p); };
  inp.onkeydown = (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); terminar(true); } else if(ev.key==='Escape'){ inp.value = p.titulo; terminar(false); } };
  inp.onblur = ()=>terminar(false);
}

function escribirNuevo(listaId){
  abrirPlegable('lista:'+listaId);
  const cont = document.querySelector(`#listasBody .kadd[data-lista="${listaId}"]`);
  if(!cont) return;
  const pleg = cont.closest('.pleg');
  if(pleg && !pleg.classList.contains('abierta')){ pleg.classList.add('abierta'); pleg.querySelector('.pleg-body').hidden = false; }
  cont.innerHTML = '<span class="mas">+</span>';
  const inp = document.createElement('input');
  inp.className = 'kinput'; inp.placeholder = 'Elemento de la lista'; inp.enterKeyHint = 'next';
  cont.appendChild(inp); cont.onclick = null;
  inp.focus();
  const guardar = ()=>{
    const val = inp.value.trim(); if(!val) return false;
    const orden = Math.max(0, ...DATA.pendientes.filter(x=>x.listaId===listaId && !x.hecho).map(x=>(x.orden??0)+1));
    DATA.pendientes.push({ id:uid(), listaId, titulo:val, urgencia:'normal', hecho:false, creado:new Date().toISOString(), orden });
    return true;
  };
  let listo = false;
  inp.onkeydown = (ev)=>{
    if(ev.key==='Enter'){ ev.preventDefault(); listo = true; if(guardar()){ saveData(); renderAll(); escribirNuevo(listaId); } else { renderListas(); } }
    else if(ev.key==='Escape'){ listo = true; renderListas(); }
  };
  inp.onblur = ()=>{
    if(listo) return; listo = true;
    const guardo = guardar();
    if(guardo){
      saveData();
      const tmp = document.createElement('div');
      tmp.innerHTML = pendienteHTML(DATA.pendientes[DATA.pendientes.length-1]);
      const el = tmp.firstElementChild;
      cont.closest('.keep').querySelector('.kpendientes').appendChild(el);
      engancharFila(el);
    }
    cont.innerHTML = '<span class="mas">+</span><span>Elemento de la lista</span>';
    cont.onclick = ()=>escribirNuevo(listaId);
  };
}
function engancharFila(el){
  el.querySelector('[data-action="editPend"]').onclick = (ev)=>editarEnSitio(ev.currentTarget);
  el.querySelector('[data-action="togglePend"]').onclick = ()=>{
    const p = DATA.pendientes.find(x=>x.id===el.dataset.pid); if(!p) return;
    p.hecho = !p.hecho; saveData(); renderAll();
  };
  const h = el.querySelector('.kdrag'); if(h && h.textContent) engancharArrastre(h);
}

/* Arrastrar desde los puntitos para cambiar el orden. */
function engancharArrastre(handle){
  handle.onpointerdown = (ev)=>{
    ev.preventDefault();
    const fila = handle.closest('.kitem'), cont = fila.parentElement;
    fila.classList.add('arrastrando');
    let y0 = ev.clientY, movio = false;
    /* se escucha en la ventana: al mover la fila en el DOM el navegador suelta
       la captura del puntero y el soltar no llegaria */
    const mover = (e)=>{
      e.preventDefault();
      if(Math.abs(e.clientY - ev.clientY) > 3) movio = true;
      fila.style.transform = `translateY(${e.clientY - y0}px)`;
      const centro = fila.getBoundingClientRect().top + fila.offsetHeight/2;
      const hermanos = [...cont.children].filter(c=>c!==fila);
      const ref = hermanos.find(c=>{ const r = c.getBoundingClientRect(); return centro < r.top + r.height/2; }) || null;
      if(ref !== fila.nextElementSibling && !(ref===null && cont.lastElementChild===fila)){
        fila.style.transform = '';
        const topAntes = fila.getBoundingClientRect().top;
        cont.insertBefore(fila, ref);
        y0 += fila.getBoundingClientRect().top - topAntes;
        fila.style.transform = `translateY(${e.clientY - y0}px)`;
      }
    };
    const soltar = ()=>{
      removeEventListener('pointermove', mover);
      removeEventListener('pointerup', soltar);
      removeEventListener('pointercancel', soltar);
      fila.classList.remove('arrastrando'); fila.style.transform = '';
      if(!movio) return;
      [...cont.querySelectorAll('.kitem')].forEach((c,i)=>{ const q = DATA.pendientes.find(x=>x.id===c.dataset.pid); if(q) q.orden = i; });
      saveData(); renderAll();
    };
    addEventListener('pointermove', mover, { passive:false });
    addEventListener('pointerup', soltar);
    addEventListener('pointercancel', soltar);
  };
}

/* Editar un pendiente: texto, lista, urgencia, o pasarlo a un día de la agenda. */
function openPendienteModal(p){
  const DUR = [[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 hora'],[90,'1 h 30'],[120,'2 horas'],[180,'3 horas']];
  openSheet(`<h3>Pendiente</h3>
    <div class="field"><label>¿Qué hay que hacer?</label><input type="text" id="f_ptitulo" value="${esc(p.titulo)}"></div>
    <div class="field-row">
      <div class="field"><label>Día</label><input type="date" id="f_pfecha" value="${esc(p.fecha||'')}"></div>
      <div class="field"><label>Me toma</label><select id="f_pdur">${DUR.map(([v,l])=>`<option value="${v}" ${Number(p.duracion||30)===v?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div id="f_pconfecha" ${p.fecha?'':'hidden'}>
      <div class="field-row">
        <div class="field"><label>Se puede desde</label><input type="time" id="f_pdesde" value="${esc(p.desde||'')}"></div>
        <div class="field"><label>Hasta</label><input type="time" id="f_phasta" value="${esc(p.hasta||'')}"></div>
      </div>
      <div class="helptext" style="margin:-8px 0 14px;">Opcional. Ej: un quiz abierto de 8:00 a 20:00.</div>
      <div id="f_pplan"></div>
    </div>
    <div class="field"><label>Lista</label><div class="chiprow" id="chipsListaP">
      ${DATA.listas.map(l=>`<div class="chip ${l.id===p.listaId?'active':''}" data-lista="${l.id}" style="${chipColor(l.color)}">${esc(l.nombre)}</div>`).join('')}
    </div></div>
    <div class="field"><label>Urgencia</label><div class="chiprow" id="chipsUrg">
      ${URGENCIAS.map(u=>`<div class="chip ${u===(p.urgencia||'normal')?'active':''}" data-urg="${u}" style="${chipColor(URG_COLOR[u])}">${u}</div>`).join('')}
    </div></div>
    <div class="sheet-actions"><button class="btn btn-danger" id="delPend">Eliminar</button><button class="btn btn-primary" id="savePend">Guardar</button></div>`);
  const g = id => document.getElementById(id);
  let plista = p.listaId, purg = p.urgencia || 'normal';
  let horaFija = p.hora || '';          // vacio = que Bitacora lo acomode
  let eligiendo = false;

  const borrador = ()=>Object.assign({}, p, { fecha:g('f_pfecha').value, desde:g('f_pdesde').value, hasta:g('f_phasta').value,
    duracion:Number(g('f_pdur').value)||30, hora:horaFija, urgencia:purg, horaFin:'' });

  const pintarPlan = ()=>{
    const d = borrador();
    g('f_pconfecha').hidden = !d.fecha;
    const caja = g('f_pplan');
    if(!d.fecha){ caja.innerHTML = ''; return; }
    const ventana = minutosDe(d.desde)!==null || minutosDe(d.hasta)!==null;

    if(horaFija && !eligiendo){
      caja.innerHTML = `<div class="plan-box"><div class="qd">Lo haces a las <b>${horaFija}–${finDePendiente(d)}</b>. Lo fijaste tú.</div>
        <div class="acc"><button class="small-btn" id="pl_otra">Cambiar hora</button><button class="small-btn" id="pl_auto">Que Bitácora lo acomode</button></div></div>`;
    } else if(!eligiendo){
      const auto = acomodarDia(d.fecha, Object.assign(d, { hora:'' })).lugar[p.id];
      caja.innerHTML = auto
        ? `<div class="plan-box"><div class="qd">Bitácora te lo acomoda a las <b>${auto.start}–${auto.end}</b>, en tu primer hueco libre${ventana?' dentro de la ventana':''}.</div>
            <div class="helptext" style="margin:4px 0 0;">Si se te llena ese rato, se corre sola.</div>
            <div class="acc"><button class="small-btn" id="pl_si" data-hora="${auto.start}">Sí, ahí lo hago</button><button class="small-btn" id="pl_otra">Otra hora</button></div></div>`
        : `<div class="plan-box ojo"><div class="qd">Ese día no te queda un hueco de ${d.duracion} min${ventana?' dentro de la ventana':''}.</div>
            <div class="acc"><button class="small-btn" id="pl_otra">Ponerle hora igual</button></div></div>`;
    } else {
      const bloques = bloquesDeFecha(d.fecha).filter(b=>!(b.pend && b.pend.id===p.id));
      const vD = minutosDe(d.desde), vH = minutosDe(d.hasta);
      const huecos = huecosDelDia(bloques).map(h=>({ desde:Math.max(h.desde, vD ?? h.desde), hasta:Math.min(h.hasta, vH ?? h.hasta) }))
        .filter(h=>h.hasta - h.desde >= d.duracion);
      caja.innerHTML = `<div class="plan-box">
          <div class="field" style="margin-bottom:8px;"><label>Lo hago a las</label><input type="time" id="pl_hora" value="${esc(horaFija)}"></div>
          ${huecos.length ? `<div class="helptext" style="margin:0 0 6px;">Libres ese día:</div><div class="huecos-sug" style="margin:0;">${huecos.map(h=>`<div class="chip" data-hora="${hhmm(h.desde)}">${hhmm(h.desde)}–${hhmm(h.hasta)}</div>`).join('')}</div>` : ''}
          <div class="acc"><button class="small-btn" id="pl_auto">Mejor que lo acomode Bitácora</button></div></div>`;
      g('pl_hora').onchange = ()=>{ horaFija = g('pl_hora').value; };
      caja.querySelectorAll('.huecos-sug [data-hora]').forEach(c=>c.onclick=()=>{ horaFija = c.dataset.hora; eligiendo = false; pintarPlan(); });
    }
    const on = (id, fn)=>{ const el = g(id); if(el) el.onclick = fn; };
    on('pl_si', ()=>{ horaFija = g('pl_si').dataset.hora; eligiendo = false; pintarPlan(); });
    on('pl_otra', ()=>{ eligiendo = true; pintarPlan(); });
    on('pl_auto', ()=>{ horaFija = ''; eligiendo = false; pintarPlan(); });
  };
  ['f_pfecha','f_pdesde','f_phasta','f_pdur'].forEach(id=>g(id).addEventListener('change', pintarPlan));
  pintarPlan();

  document.querySelectorAll('#chipsListaP .chip').forEach(c=>{
    c.onclick = ()=>{ document.querySelectorAll('#chipsListaP .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); plista = c.dataset.lista; };
  });
  document.querySelectorAll('#chipsUrg .chip').forEach(c=>{
    c.onclick = ()=>{ document.querySelectorAll('#chipsUrg .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); purg = c.dataset.urg; pintarPlan(); };
  });
  g('delPend').onclick = ()=>{
    DATA.pendientes = DATA.pendientes.filter(x=>x.id!==p.id);
    saveData(); closeSheet(); renderAll(); refrescarDiaCalendario();
  };
  g('savePend').onclick = ()=>{
    const titulo = g('f_ptitulo').value.trim();
    if(!titulo){ alert('Escribe qué hay que hacer'); return; }
    if(eligiendo && g('pl_hora')) horaFija = g('pl_hora').value;
    const fecha = g('f_pfecha').value;
    const d = Object.assign(borrador(), { titulo, listaId:plista, hora: fecha ? horaFija : '' });
    if(d.hora && d.desde && d.hora < d.desde && !confirm(`Lo pones a las ${d.hora}, antes de que abra (${d.desde}). ¿Así?`)) return;
    if(d.hora && d.hasta && finDePendiente(d) > d.hasta && !confirm(`Terminarías a las ${finDePendiente(d)}, después del cierre (${d.hasta}). ¿Así?`)) return;
    Object.assign(p, { titulo, listaId:plista, urgencia:purg, fecha,
      desde: fecha ? d.desde : '', hasta: fecha ? d.hasta : '', hora: d.hora, duracion: d.duracion, horaFin:'' });
    saveData(); closeSheet(); renderAll(); refrescarDiaCalendario();
  };
}

    }

  };

/* ============================================================
   UNIVERSIDAD Y NOTAS
   Los porcentajes se ponen materia por materia, libres: no se asume
   ningun esquema de cortes (D114).
============================================================ */
function uniCfg(){ DATA.uni = DATA.uni || { pasaCon:3.0, maxFallas:8, historial:[] }; return DATA.uni; }
function cortesDe(s){ return s.cortes || (s.cortes = []); }

/* Con lo evaluado hasta ahora: cuanto lleva, cuanto del total ya se jugo, y
   cuanto necesita en lo que falta para pasar (D90). */
function estadoMateria(s){
  /* Si ya le dieron la definitiva, no hay nada que estimar: esa es la nota. */
  if(s.definitiva !== null && s.definitiva !== undefined && s.definitiva !== ''){
    return { total:100, evaluado:100, falta:0, nota:Number(s.definitiva),
             acumulado:Number(s.definitiva), necesita:null, imposible:false,
             yaPaso:Number(s.definitiva) >= uniCfg().pasaCon, esDefinitiva:true };
  }
  const cortes = cortesDe(s);
  const total = cortes.reduce((a,c)=>a+Number(c.pct||0), 0);
  const puestos = cortes.filter(c=>c.nota!==null && c.nota!=='' && c.nota!==undefined);
  const evaluado = puestos.reduce((a,c)=>a+Number(c.pct||0), 0);
  const acumulado = puestos.reduce((a,c)=>a+Number(c.nota)*Number(c.pct||0), 0) / 100;
  const nota = evaluado ? (acumulado * 100 / evaluado) : null;
  const falta = total - evaluado;
  const pasa = uniCfg().pasaCon;
  let necesita = null;
  if(falta > 0) necesita = (pasa * total / 100 - acumulado) * 100 / falta;
  return { total, evaluado, falta, nota, acumulado, necesita,
           imposible: necesita !== null && necesita > 5,
           yaPaso: necesita !== null && necesita <= 0 };
}

/* El promedio es de toda la carrera, no solo del bimestre (D100). */
function promedioCarrera(){
  const notas = [];
  (uniCfg().historial||[]).forEach(p=>(p.materias||[]).forEach(m=>{ if(Number(m.nota)) notas.push(Number(m.nota)); }));
  DATA.subjects.forEach(s=>{ const e = estadoMateria(s); if(e.nota!==null) notas.push(e.nota); });
  if(!notas.length) return null;
  return notas.reduce((a,n)=>a+n,0) / notas.length;
}
function nota1(n){ return n===null||n===undefined ? '—' : Number(n).toFixed(1).replace('.', ','); }
function fallasTotales(){ return DATA.subjects.reduce((a,s)=>a+Number(s.fallas||0), 0); }

/* ============================================================
   MARCA PERSONAL
   Ideas de contenido, calendario de publicaciones y resultados (D73).
   Los clientes no viven aca: viven en Trabajo con la etiqueta de donde
   llegaron, y de ahi sale cuantos trajo la marca (D76, D82).
============================================================ */
const ESTADOS_IDEA = { idea:'Idea', grabando:'Grabando', listo:'Listo para publicar' };
const REDES = ['Instagram','TikTok','LinkedIn','WhatsApp','Otra'];
/* Las etapas son las de su parrilla de Excel, en su orden. */
const ETAPAS = ['Por grabar','Grabado','En edición','Programado','Publicado'];
function etapaDe(p){ return p.etapa || (p.estado==='publicada' ? 'Publicado' : 'Programado'); }
function ponerEtapa(p, etapa){
  p.etapa = etapa;
  p.estado = etapa==='Publicado' ? 'publicada' : 'planeada';
}

/* Lo que Instagram le da de cada publicacion. Todo opcional: pone lo que tenga. */
const METRICAS = [
  { k:'alcance',     l:'Alcance',            ph:'cuentas alcanzadas' },
  { k:'vistas',      l:'Reproducciones',     ph:'vistas' },
  { k:'likes',       l:'Me gusta',           ph:'' },
  { k:'comentarios', l:'Comentarios',        ph:'' },
  { k:'compartidos', l:'Compartidos',        ph:'' },
  { k:'guardados',   l:'Guardados',          ph:'' },
  { k:'seguidores',  l:'Seguidores nuevos',  ph:'' },
  { k:'respuestas',  l:'Mensajes (DM)',      ph:'te escribieron' },
  { k:'leads',       l:'Leads',              ph:'pidieron info o la palabra clave' },
  { k:'cierres',     l:'Clientes',           ph:'se volvieron clientes' },
];
const num = v => Number(v)||0;
function tieneNumeros(p){ return METRICAS.some(m=>num(p[m.k])>0); }
function interacciones(p){ return num(p.likes)+num(p.comentarios)+num(p.compartidos)+num(p.guardados); }
/* "Carrusel (6 slides)" y "Carrusel (7 slides)" son el mismo formato */
function formatoCorto(f){ return String(f||'Sin formato').split(/[(+\/]/)[0].trim() || 'Sin formato'; }
function mesAnterior(mes){ const [y,m]=mes.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function nombreMes(mes){ const [y,m]=mes.split('-').map(Number); return MONTHS[m-1] + (y!==new Date().getFullYear() ? ' '+y : ''); }
function milesCO(n){ return Math.round(n).toLocaleString('es-CO'); }
function cambioPct(ahora, antes){
  if(!antes) return ahora ? { t:'nuevo', c:'igual' } : { t:'', c:'igual' };
  const pct = Math.round((ahora-antes)/antes*100);
  if(pct===0) return { t:'igual que antes', c:'igual' };
  return { t:(pct>0?'↑ ':'↓ ')+Math.abs(pct)+'%', c: pct>0?'sube':'baja' };
}

/* Lee los numeros del mes y los dice en palabras. Solo afirma lo que los
   datos sostienen: con una sola publicacion no hay comparacion que hacer. */
function informeMarca(M, mes){
  const pubs = M.publicaciones.filter(p=>etapaDe(p)==='Publicado' && (p.fecha||'').startsWith(mes));
  const conDatos = pubs.filter(tieneNumeros);
  const antes = M.publicaciones.filter(p=>etapaDe(p)==='Publicado' && (p.fecha||'').startsWith(mesAnterior(mes)) && tieneNumeros(p));
  const total = (lista, k) => lista.reduce((a,p)=>a+(k==='inter'?interacciones(p):num(p[k])),0);
  const prom = (lista, k) => lista.length ? total(lista,k)/lista.length : 0;
  const nAntes = nombreMes(mesAnterior(mes));
  const hallazgos = [];

  /* frente al mes anterior, por publicacion para que publicar mas o menos no engañe */
  if(conDatos.length && antes.length){
    const suben = [], bajan = [];
    [['alcance','alcance'],['inter','interacciones'],['guardados','guardados'],['seguidores','seguidores'],['respuestas','mensajes'],['leads','leads']].forEach(([k,nom])=>{
      const a = prom(conDatos,k), b = prom(antes,k);
      if(!b) return;
      if((a-b)/b >= 0.15) suben.push(nom); else if((b-a)/b >= 0.15) bajan.push(nom);
    });
    const lista = l => l.length>1 ? l.slice(0,-1).join(', ')+' y '+l[l.length-1] : l[0];
    if(suben.length) hallazgos.push({ t:`Mejoraste frente a ${nAntes}: cada publicación trae más ${lista(suben)}.` });
    if(bajan.length) hallazgos.push({ ojo:true, t:`Bajó frente a ${nAntes}: ${lista(bajan)} por publicación. Mira qué cambió en el formato o el tema.` });
    if(!suben.length && !bajan.length) hallazgos.push({ t:`Vas parecido a ${nAntes}: ningún número se movió más de 15% por publicación.` });
  }
  if(conDatos.length>=2){
    const top = [...conDatos].sort((a,b)=>num(b.alcance)-num(a.alcance))[0];
    if(num(top.alcance)) hallazgos.push({ t:`La que más gente alcanzó: «${top.titulo}», con ${milesCO(num(top.alcance))}.` });
    const conv = [...conDatos].sort((a,b)=>(num(b.respuestas)+num(b.leads))-(num(a.respuestas)+num(a.leads)))[0];
    const nConv = num(conv.respuestas)+num(conv.leads);
    if(nConv && conv!==top) hallazgos.push({ t:`La que más conversaciones abrió: «${conv.titulo}», con ${nConv} entre mensajes y leads. Alcance no es lo mismo que clientes.` });
    else if(nConv) hallazgos.push({ t:`Además fue la que más conversaciones abrió: ${nConv} entre mensajes y leads.` });

    const agrupar = campo => {
      const g = {};
      conDatos.forEach(p=>{ const k = campo==='formato' ? formatoCorto(p.formato) : (p.pilar||'Sin pilar'); (g[k]=g[k]||[]).push(p); });
      return Object.entries(g).map(([k,l])=>({ k, n:l.length, alcance:prom(l,'alcance'), inter:prom(l,'inter'), guardados:prom(l,'guardados'), conv:prom(l,'respuestas')+prom(l,'leads') }));
    };
    const formatos = agrupar('formato'), pilares = agrupar('pilar');
    const mejor = (lista, k) => lista.length>=2 ? [...lista].sort((a,b)=>b[k]-a[k]) : null;
    const f = mejor(formatos,'guardados');
    if(f && f[0].guardados && f[0].guardados >= f[1].guardados*1.3)
      hallazgos.push({ t:`${f[0].k} es el formato que más se guarda: ${milesCO(f[0].guardados)} por publicación, contra ${milesCO(f[1].guardados)} de ${f[1].k}.` });
    const fa = mejor(formatos,'alcance');
    if(fa && fa[0].alcance && fa[0].alcance >= fa[1].alcance*1.3 && (!f || fa[0].k!==f[0].k))
      hallazgos.push({ t:`${fa[0].k} es el que más alcanza: ${milesCO(fa[0].alcance)} por publicación.` });
    const pc = mejor(pilares,'conv');
    if(pc && pc[0].conv >= 1) hallazgos.push({ t:`El pilar que más conversaciones trae es ${pc[0].k}: ${pc[0].conv.toLocaleString('es-CO',{maximumFractionDigits:1})} por publicación. Por ahí están los clientes.` });
    hallazgos.formatos = formatos;
  }
  const alcTot = total(conDatos,'alcance');
  if(alcTot && total(conDatos,'inter')){
    const tasa = total(conDatos,'inter')/alcTot*100;
    hallazgos.push({ t:`De cada 100 personas que te vieron, ${tasa.toLocaleString('es-CO',{maximumFractionDigits:1})} interactuaron.` });
  }
  if(conDatos.length>=2 && conDatos.length<6) hallazgos.push({ t:'Son pocas publicaciones todavía: lo de formatos y pilares tómalo como pista, no como regla.' });
  const sinDatos = pubs.length - conDatos.length;
  if(sinDatos) hallazgos.push({ ojo:true, t:`${sinDatos} publicada${sinDatos>1?'s':''} sin números. Tócala abajo en Publicado y ponle lo que te dio Instagram.` });
  if(conDatos.length===1 && !antes.length) hallazgos.push({ t:'Con una sola publicación con números todavía no hay nada que comparar. A medida que llenes más, acá te digo qué funciona.' });

  return { pubs, conDatos, antes, total, prom, hallazgos, formatos: hallazgos.formatos||[] };
}

  return DATA.marca;

    (inf.formatos.length>=2 ? `<div class="ficha-sub"><span>Por formato</span></div><div style="overflow-x:auto;"><table class="tabla-mini"><tr><th>Formato</th><th class="num">Alcance</th><th class="num">Guard.</th><th class="num">Conv.</th></tr>${[...inf.formatos].sort((a,b)=>b.alcance-a.alcance).map(f=>`<tr><td>${esc(f.k)} <span style="color:var(--text-dim)">×${f.n}</span></td><td class="num">${milesCO(f.alcance)}</td><td class="num">${milesCO(f.guardados)}</td><td class="num">${f.conv.toLocaleString('es-CO',{maximumFractionDigits:1})}</td></tr>`).join('')}</table></div><div class="helptext" style="margin:-6px 0 12px;">Promedio por publicación. Conv. = mensajes + leads.</div>` : '') +

  const publicadas = M.publicaciones.filter(p=>p.estado==='publicada').sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));

      ${!tieneNumeros(p) ? '<div class="helptext" style="margin:5px 0 0; color:var(--ambar);">Tócala para ponerle cómo le fue.</div>' : ''}

  box.innerHTML = html;

  document.getElementById('mesAntes').onclick = ()=>{ marcaMes = mesAnterior(marcaMes); renderMarca(); };
  document.getElementById('mesDespues').onclick = ()=>{ if(marcaMes<mes){ const [y,m]=marcaMes.split('-').map(Number); const d=new Date(y,m,1); marcaMes = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); renderMarca(); } };
  document.getElementById('addIdeaBtn').onclick = agregarIdea;
  document.getElementById('ideaInput').onkeydown = (ev)=>{ if(ev.key==='Enter') agregarIdea(); };
  const _b_addPubBtn = document.getElementById('addPubBtn'); if(_b_addPubBtn) _b_addPubBtn.onclick = ()=>openPublicacionModal();
  box.querySelectorAll('[data-cambiar]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const i = M.ideas.find(x=>x.id===b.dataset.cambiar);
    const orden = Object.keys(ESTADOS_IDEA);
    i.estado = orden[(orden.indexOf(i.estado)+1) % orden.length];
    saveData(); renderMarca();
  });
  box.querySelectorAll('.idea-row').forEach(r=>r.onclick=()=>{

/* Una pieza de la parrilla en una fila: la fecha grande a la izquierda y lo
   justo para saber que es. */
function tarjetaPieza(p, etiqueta){
  const dias = p.fecha ? daysBetween(todayStr(), p.fecha) : null;
  const d = p.fecha ? parseDate(p.fecha) : null;
  const tarde = dias!==null && dias<0 && etapaDe(p)!=='Publicado';
  return `<div class="grabar-card" data-id="${p.id}" data-sel-tipo="publicacion" data-sel-id="${p.id}">
    <div class="grabar-fecha ${tarde?'tarde':''}">${d ? `<div class="d">${d.getDate()}</div><div class="m">${MONTHS[d.getMonth()].slice(0,3)}</div>` : '<div class="m">sin fecha</div>'}</div>
    <div class="grabar-info">
      <div class="t">${esc(p.titulo)}</div>
      <div class="s">${[etiqueta, p.formato, tarde ? 'se pasó la fecha' : dias===0 ? 'sale hoy' : dias===1 ? 'sale mañana' : ''].filter(Boolean).map(esc).join(' · ')}</div>
    </div>
  </div>`;
}

/* El guion viene como "GANCHO: ... \n DESARROLLO: ...": se parte en bloques
   para leerlo de un vistazo mientras graba. */
function partesGuion(txt){
  const partes = [];
  String(txt||'').replace(/​/g,' ').split('\n').forEach(linea=>{
    const m = linea.match(/^\s*([A-ZÁÉÍÓÚÑ0-9][A-ZÁÉÍÓÚÑ0-9 \-]*(?:\([^)]*\))?)\s*:\s*(.*)$/);
    if(m) partes.push({ k:m[1].trim(), v:m[2].trim() });
    else if(linea.trim()){
      if(partes.length) partes[partes.length-1].v += '\n' + linea.trim();
      else partes.push({ k:'', v:linea.trim() });
    }
  });
  return partes;
}

  openSheet(`<h3 style="line-height:1.3;">${esc(p.titulo)}</h3>
    <div class="etapas" id="f_etapas">${ETAPAS.map(e=>`<div class="chip ${e===etapa?'active':''}" data-etapa="${e}">${e}</div>`).join('')}</div>
    <div class="helptext" style="margin:0 0 14px;">Tócale a la etapa en la que va.</div>
    <dl class="ficha-meta">${meta.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>

/* ---- Importar la parrilla desde su Excel ----
   El contenido no vive en el codigo (el repo es publico): ella sube el
   archivo y queda en sus datos. Volver a importarlo actualiza guion, copy y
   fechas, pero respeta la etapa y los resultados que ya puso en la app. */
function cargarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, mal)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>ok(window.XLSX);
    sc.onerror = ()=>mal(new Error('sin internet'));
    document.head.appendChild(sc);
  });
}
function fechaDeCelda(XLSX, v){
  const dos = n => String(n).padStart(2,'0');
  if(typeof v==='number'){ const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${dos(d.m)}-${dos(d.d)}` : ''; }
  const m = String(v||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m) return `${m[3]}-${dos(m[2])}-${dos(m[1])}`;
  const iso = String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return iso ? `${iso[1]}-${iso[2]}-${iso[3]}` : '';
}
function importarParrilla(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  inp.onchange = async ()=>{
    const file = inp.files[0]; if(!file) return;
    leerParrilla(await file.arrayBuffer());
  };
  inp.click();
}
async function leerParrilla(buf){
    let XLSX;
    try{ XLSX = await cargarXLSX(); }catch(e){ alert('Para importar el Excel necesitas internet un momento.'); return; }
    const wb = XLSX.read(buf, { type:'array' });
    const M = marcaData();
    const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    let nuevas = 0, actualizadas = 0, ideasNuevas = 0;

    wb.SheetNames.forEach(nombre=>{
      const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header:1, raw:true, defval:'' });
      const iHead = filas.findIndex(f=>f.some(c=>norm(c).startsWith('tema/idea')) || f.some(c=>norm(c)==='idea / tema'));
      if(iHead<0) return;
      const head = filas[iHead].map(norm);
      const col = (...nombres) => head.findIndex(h=>nombres.some(n=>h.startsWith(n)));
      const val = (f, i) => i>=0 ? String(f[i]??'').trim() : '';

      if(head.some(h=>h.startsWith('tema/idea'))){
        const c = { fecha:col('fecha'), dia:col('dia'), pilar:col('pilar'), tema:col('tema/idea'), formato:col('formato'), cta:col('cta'),
          lead:col('lead magnet'), guion:col('guion'), copy:col('copy'), status:col('status'), grilla:col('celda grilla'), avatar:col('avatar') };
        filas.slice(iHead+1).forEach(f=>{
          const titulo = val(f, c.tema); if(!titulo) return;
          const fecha = fechaDeCelda(XLSX, f[c.fecha]);
          if(!fecha && !val(f,c.formato)) return;   // las notas de "como usar esta hoja"
          const statusXls = ETAPAS.find(e=>norm(e)===norm(val(f,c.status))) || 'Por grabar';
          const datos = { titulo, fecha, dia:val(f,c.dia), pilar:val(f,c.pilar), formato:val(f,c.formato), cta:val(f,c.cta),
            leadMagnet:val(f,c.lead), guion:val(f,c.guion), copy:val(f,c.copy), grilla:val(f,c.grilla), avatar:val(f,c.avatar), deParrilla:true };
          const ya = M.publicaciones.find(p=>norm(p.titulo)===norm(titulo));
          if(ya){ Object.assign(ya, datos); if(!ya.etapa) ponerEtapa(ya, statusXls); actualizadas++; }
          else{ const p = Object.assign({ id:uid(), red:'Instagram', alcance:'', respuestas:'', cierres:'' }, datos); ponerEtapa(p, statusXls); M.publicaciones.push(p); nuevas++; }
        });
      } else {
        const c = { idea:col('idea / tema'), pilar:col('pilar'), gancho:col('gancho'), formato:col('formato'), avatar:col('avatar'), cta:col('cta') };
        filas.slice(iHead+1).forEach(f=>{
          const texto = val(f, c.idea); if(!texto) return;
          if(M.ideas.some(i=>norm(i.texto)===norm(texto)) || M.publicaciones.some(p=>norm(p.titulo)===norm(texto))) return;
          M.ideas.push({ id:uid(), texto, estado:'idea', creado:todayStr(), pilar:val(f,c.pilar), gancho:val(f,c.gancho), formato:val(f,c.formato), avatar:val(f,c.avatar), cta:val(f,c.cta) });
          ideasNuevas++;
        });
      }
    });

    if(!nuevas && !actualizadas && !ideasNuevas){ alert('No encontré la parrilla en ese archivo. Tiene que tener la columna "Tema/Idea de Contenido".'); return; }
    saveData(); renderMarca();
    alert([nuevas && `${nuevas} contenido${nuevas>1?'s':''} nuevo${nuevas>1?'s':''}`, actualizadas && `${actualizadas} actualizado${actualizadas>1?'s':''}`, ideasNuevas && `${ideasNuevas} idea${ideasNuevas>1?'s':''} al banco`].filter(Boolean).join(' · ') + '.');
}

function renderMaterias(){
  const box = document.getElementById('sub-materias');
  const subs = [...DATA.subjects].sort((a,b)=> a.day-b.day || (a.start||'').localeCompare(b.start||''));
  const cfg = uniCfg();
  const prom = promedioCarrera();
  const fallas = fallasTotales();

  let html = `<div class="period-pill" id="periodPill">📚 ${esc(DATA.period) || 'Sin período configurado'} <span style="font-size:11px;">✎</span></div>`;

  /* ---- los dos números de arriba ---- */
  html += `<div class="summary-row">
      <div class="summary-box"><div class="lbl">Promedio de la carrera</div><div class="val mono">${nota1(prom)}</div></div>
      <div class="summary-box" id="fallasBox" style="cursor:pointer;"><div class="lbl">Fallas este bimestre</div>
        <div class="val mono" style="color:${fallas>=cfg.maxFallas?'var(--urgent)':fallas>=cfg.maxFallas*0.6?'var(--ambar)':'var(--text)'}">${fallas} <span style="font-size:13px; color:var(--text-dim);">/ ${cfg.maxFallas}</span></div></div>
    </div>`;

  /* ---- la que está en riesgo, de primera (D90) ---- */
  const enRiesgo = subs.map(s=>({s, e:estadoMateria(s)}))
    .filter(x=> x.e.necesita !== null && x.e.necesita > 0 && x.e.evaluado > 0)
    .sort((a,b)=> b.e.necesita - a.e.necesita)[0];
  if(enRiesgo){
    const {s,e} = enRiesgo;
    html += `<div class="card" style="border-left:3px solid ${e.imposible?'var(--urgent)':'var(--ambar)'}; background:${e.imposible?'var(--urgent-soft)':'var(--ambar-soft)'};">
      <div style="font-weight:700; font-size:15px;">${e.imposible ? `Con ${esc(s.name)} ya no alcanzas` : `Necesitas ${nota1(e.necesita)} en lo que falta de ${esc(s.name)}`}</div>
      <div class="helptext" style="margin:4px 0 0;">Llevas ${nota1(e.nota)} con el ${Math.round(e.evaluado)}% evaluado.${e.imposible ? ' Tendrías que sacar más de 5,0, que no se puede.' : ` Con menos de ${nota1(e.necesita)} no pasas.`}</div>
    </div>`;
  }

  /* ---- las materias ---- */
  let matHtml = `<div class="pleg-acciones"><button class="small-btn" id="defiBtn">Poner definitivas</button></div>`;
  if(subs.length){
    subs.forEach(s=>{
      const e = estadoMateria(s);
      const tasks = DATA.academicTasks.filter(t=>t.subject===s.name && !t.done).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const colorNota = e.nota===null ? 'var(--text-dim)' : e.nota < cfg.pasaCon ? 'var(--urgent)' : 'var(--done)';
      matHtml += `<div class="subject-group">
        <div class="subject-row materia-row" data-id="${s.id}" data-sel-tipo="materia" data-sel-id="${s.id}" style="cursor:pointer; border-left-color:var(--c-uni);">
          <div class="info">
            <div class="name">${esc(s.name)}</div>
            <div class="time">${[
              s.start ? DOW[s.day] + ' · ' + esc(s.start) + (s.end?'–'+esc(s.end):'') : 'sin horario',
              e.esDefinitiva ? 'definitiva' : (e.total ? Math.round(e.evaluado)+'% evaluado' : 'sin porcentajes'),
              s.fallas ? s.fallas+' falla'+(s.fallas>1?'s':'') : ''
            ].filter(Boolean).join(' · ')}</div>
          </div>
          <div class="mono" style="font-size:19px; font-weight:600; color:${colorNota};">${nota1(e.nota)}</div>
        </div>
        ${e.total && e.total!==100 ? `<div class="helptext" style="margin:2px 0 6px 14px; color:var(--ambar);">Los porcentajes suman ${Math.round(e.total)}%, no 100%.</div>` : ''}
        ${tasks.map(t=>`
          <div class="module-row" data-id="${t.id}" style="margin-left:14px;">
            <button class="module-check" data-action="toggleTask" data-id="${t.id}"></button>

          </div>`).join('')}
      </div>`;
    });
    matHtml += `<div class="helptext">Tócale a una materia para poner sus cortes, sus notas y sus fallas. Cada materia tiene los porcentajes que tenga: no se asume ninguno.</div>`;
  } else {
    matHtml += `<div class="empty-card">Sin materias cargadas.<br><br>Si estás cerrando el bimestre y solo quieres guardar las notas, tócale a <b>Poner definitivas</b>: ahí las escribes con su nombre, sin horario ni porcentajes.</div>`;
  }
  html += plegable('uni:materias', 'Materias', subs.length ? subs.length + (subs.length>1?' materias':' materia') : 'ninguna', matHtml);

  /* ---- entregas próximas ---- */
  const entregas = DATA.academicTasks.filter(t=>!t.done && t.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if(entregas.length) html += plegable('uni:entregas', 'Entregas próximas',
    (()=>{ const d=daysBetween(todayStr(), entregas[0].date); return entregas.length + ' · ' + (d<0?'una atrasada':d===0?'la próxima, hoy':d===1?'la próxima, mañana':'la próxima, '+niceDateShort(entregas[0].date)); })(),

  /* ---- lo de bimestres pasados ---- */
  const hist = cfg.historial||[];
  html += plegable('uni:bimestres', 'Bimestres pasados', hist.length ? String(hist.length) : 'ninguno',

    </div>`).join('') : '<div class="helptext" style="margin:0;">Cuando termines este bimestre, ciérralo y sus notas pasan al promedio de la carrera.</div>'));

  box.innerHTML = html;
  document.getElementById('periodPill').onclick = openPeriodModal;

  const _b_addTaskBtn = document.getElementById('addTaskBtn'); if(_b_addTaskBtn) _b_addTaskBtn.onclick = openTaskModal;

  const defiBtn = document.getElementById('defiBtn');
  if(defiBtn) defiBtn.onclick = openDefinitivasModal;

  });

  function leerCortes(){
    const out = [];
    sheet.querySelectorAll('.corte-row').forEach(row=>{
      const v = campo => row.querySelector(`[data-campo="${campo}"]`).value;
      const nombre = v('nombre').trim();

      out.push({ id:uid(), nombre, pct:Number(v('pct'))||0, nota: v('nota')==='' ? null : Number(v('nota')) });
    });
    return out;
  }
  document.getElementById('addCorte').onclick = ()=>{ s.cortes = leerCortes(); s.cortes.push({id:uid(), nombre:'', pct:'', nota:null}); openMateriaModal(s); };

    s.start = document.getElementById('f_mstart').value;
    s.end = document.getElementById('f_mend').value;
    saveData(); closeSheet(); renderAll(); renderCalDayList();
  };
}

/* Cerrar el bimestre guarda las notas y deja el tablero limpio para el que
   viene, sin perder el promedio de la carrera (D100). */
function cerrarBimestre(){
  if(!DATA.subjects.length){
    if(confirm('Todavía no hay materias con nota.\n\n¿Las escribes ahora?')) openDefinitivasModal();
    return;
  }
  const materias = DATA.subjects.map(s=>({ name:s.name, nota:estadoMateria(s).nota }));
  const sinNota = materias.filter(m=>m.nota===null).length;
  const aviso = sinNota ? `\n\n${sinNota} materia${sinNota>1?'s':''} sin nota quedarán sin contar.` : '';
  if(!confirm(`¿Cerrar ${DATA.period||'este bimestre'} y guardar sus notas?${aviso}\n\nLas materias salen del tablero y sus notas pasan al promedio de la carrera.`)) return;
  uniCfg().historial.push({ periodo: DATA.period || ('Bimestre ' + (uniCfg().historial.length+1)), materias: materias.filter(m=>m.nota!==null), cerrado: todayStr() });
  DATA.subjects = [];
  DATA.academicTasks = DATA.academicTasks.filter(t=>!t.done);
  saveData(); renderAll();
}

/* ---- Trabajo ---- */
function clientOwed(c){
  const sessions = DATA.workSessions.filter(s=>s.clientId===c.id);
  if(c.payType==='hora'){ const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0); return {qty:h, unit:'h', amount:h*Number(c.rate||0)}; }
  if(c.payType==='salario_min'){
    const hourly = Number(c.baseSalario||1750000)/240;
    let total=0, h=0;
    sessions.forEach(s=>{
      const horas=Number(s.horas||0); h+=horas;
      let mult=1;
      if(s.domingo) mult += Number(c.recargoDominical||75)/100;
      if(s.noche) mult += Number(c.recargoNocturno||35)/100;
      total += horas*hourly*mult;
    });
    return {qty:h, unit:'h', amount:total};
  }
  if(c.payType==='dia'){ const d = sessions.reduce((a,s)=>a+Number(s.dias||0),0); return {qty:d, unit:'días', amount:d*Number(c.rate||0)}; }
  const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0);
  return {qty:h, unit:'h', amount:Number(c.rate||0)};
}

function renderYo(){
  const box = document.getElementById('cycleBox');
  const starts = [...DATA.cycle.starts].sort();
  if(!starts.length){
    box.innerHTML = `<div class="empty-card">Aún no registras tu ciclo. <br><button class="btn btn-primary" style="margin-top:10px;" id="setupCycleBtn">Configurar ciclo</button></div>`;
    document.getElementById('setupCycleBtn').onclick = openCycleSetup;
  } else {
    const last = starts[starts.length-1]; const avg = computeAvgCycle();
    const nextStart = fmtDate(addDays(parseDate(last), avg));
    const diff = daysBetween(todayStr(), nextStart);
    const inPeriodNow = daysBetween(last, todayStr()) < (DATA.cycle.periodLen||5) && daysBetween(last, todayStr())>=0;
    box.innerHTML = `<div class="cycle-hero">
        <div class="big">${inPeriodNow ? 'En curso' : (diff>=0 ? 'En ' + diff + ' días' : 'Atrasado ' + Math.abs(diff) + ' días')}</div>
        <div class="sub">${inPeriodNow ? 'Tu período está activo' : 'Próximo período estimado: ' + niceDate(nextStart)}</div>
        <div class="ring-row">
          <div class="ring-box"><b>${avg}</b><span>días de ciclo</span></div>
          <div class="ring-box"><b>${esc(DATA.cycle.periodLen)}</b><span>días de duración</span></div>
          <div class="ring-box"><b>${starts.length}</b><span>registrados</span></div>
        </div>
      </div>
      <div style="display:flex; gap:10px;"><button class="btn btn-primary" id="logPeriodBtn">Registrar inicio hoy</button><button class="btn btn-ghost" id="editCycleBtn">Ajustar</button></div>`;
    document.getElementById('logPeriodBtn').onclick = ()=>{ if(!DATA.cycle.starts.includes(todayStr())){ DATA.cycle.starts.push(todayStr()); saveData(); renderAll(); } };
    document.getElementById('editCycleBtn').onclick = openCycleSetup;
  }
  const now = new Date();
  const weekStart = addDays(now, -now.getDay());
  const weekDates = [...Array(7)].map((_,i)=>fmtDate(addDays(weekStart,i)));
  const weekEvents = DATA.events.filter(e=>weekDates.includes(e.date) && e.status==='hecho' && e.actualMin);
  const byCat = {}; weekEvents.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0) + Number(e.actualMin); });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxMin = Math.max(1, ...catEntries.map(c=>c[1]));
  const tsBox = document.getElementById('timeSummary');
  if(catEntries.length){
    tsBox.innerHTML = `<div class="bar-chart">${catEntries.map(([cat,min])=>`<div class="bar-col"><div class="bar" style="height:${Math.max(6,(min/maxMin)*95)}px; background:${CATS[cat].color}"></div><div class="lbl">${CATS[cat].emoji}</div></div>`).join('')}</div>
    <div style="margin-top:12px; font-size:13px; color:var(--text-muted);">Total registrado: <b style="color:var(--text)">${Math.round(weekEvents.reduce((a,e)=>a+Number(e.actualMin),0)/60*10)/10}h</b> esta semana</div>`;
  } else {
    tsBox.innerHTML = `<div style="font-size:13px; color:var(--text-dim); text-align:center; padding:10px 0;">Marca cosas como "hechas" y registra minutos (o usa "Registrar tiempo" en Personal) para ver aquí en qué se te va el tiempo.</div>`;
  }
  const insightsBox = document.getElementById('insights');
  let insights = [];
  if(catEntries.length){ const top = CATS[catEntries[0][0]]; insights.push(`<div class="insight"><div class="ico">${top.emoji}</div><div class="txt">Esta semana, la mayoría de tu tiempo se fue en <b>${top.label}</b>.</div></div>`); }
  const overEst = DATA.events.filter(e=>e.status==='hecho' && e.estMin && e.actualMin && e.actualMin > e.estMin*1.3);
  if(overEst.length){ insights.push(`<div class="insight"><div class="ico">⏱</div><div class="txt">Sueles subestimar tareas de <b>${CATS[overEst[overEst.length-1].cat].label}</b> — tomaron más tiempo del planeado.</div></div>`); }
  const overdueCount = DATA.events.filter(e=>e.status!=='hecho' && e.date<todayStr()).length;
  if(overdueCount>0){ insights.push(`<div class="insight"><div class="ico">📌</div><div class="txt">Tienes <b>${overdueCount}</b> pendiente${overdueCount>1?'s':''} atrasado${overdueCount>1?'s':''}. Revísalos en Tareas.</div></div>`); }
  insightsBox.innerHTML = insights.length ? insights.join('') : '<div class="empty-card">Aún no hay suficientes datos para mostrar patrones.</div>';
}

    { que:'Un cobro de cada mes', nota:'como Datos o Claude', hacer:()=>openSuscripcionModal() },

    { que:'Una compra a cuotas', nota:'', hacer:()=>openInstallmentModal() },
    ...(CATEGORIAS_GASTO.some(c=>Number(DATA.plata.topes[c])>0) ? [] : [{ que:'Topes de presupuesto', nota:'un máximo por categoría', hacer:()=>openTopesModal() }])
  ];
  if(vista==='pendientes'){
    const sub = subActiva('pendientes');
    if(sub==='materias') return [
      { que:'Una materia', nota:'', hacer:()=>openSubjectModal() },
      { que:'Una entrega', nota:'tarea, proyecto, parcial', hacer:()=>openTaskModal() }
    ];
    if(sub==='marca') return [
      { que:'Una publicación', nota:'programarla o anotarla', hacer:()=>openPublicacionModal() },
      { que:'Importar parrilla', nota:'tu Excel de contenido', hacer:()=>importarParrilla() }
    ];
    if(sub==='nexxa') return [{ que:'Un evento de Nexxa', nota:'', hacer:()=>openNexxaModal() }];
    if(sub==='trabajo') return [{ que:'Un cliente o empresa', nota:'', hacer:()=>openClientModal() }];
    return [
      { que:'Una lista nueva', nota:'como una nota de Keep', hacer:()=>openListaModal(null) },
      { que:'Algo con fecha', nota:'lo sin fecha va en su lista', hacer:()=>openEventModal() },

  return [{ que:'Algo con fecha y hora', nota:'', hacer:()=>openEventModal() }];
}

/* ============================================================
   TURNOS Y CHOQUES
   La funcion central del proyecto (D25): Bitacora te avisa y te muestra
   que tendrias que mover, pero nunca te lo impide (D16).
============================================================ */

/* Que tan de verdad te bloquea un bloque. No todo lo que esta en tu dia te
   impide trabajar: la U la puedes ver grabada y a Joel lo recogen si no estas. */
const FLEX = {
  firme:    { label:'No se mueve',        corto:'firme',    nota:'Esto sí te bloquea.' },
  saltable: { label:'La puedo ver después', corto:'saltable', nota:'Se puede ver grabado o recuperar.' },
  cubrible: { label:'Alguien lo cubre',   corto:'cubrible', nota:'Si no estás, alguien más lo hace.' }
};
function flexDe(b){ return (b && FLEX[b.flex]) ? b.flex : 'firme'; }

/* Los tres lugares, con sus reglas distintas (D23). */
const LUGARES = {
  infinity:{ nombre:'Infinity',       ini:'I', sub:'Horario variable · paga lunes',   entra:'', sale:'',      traslado:60 },
  asignar:{  nombre:'Asignar',        ini:'A', sub:'8 h · hotel variable · por corte', entra:'', sale:'',     traslado:90 },
  movistar:{ nombre:'Movistar Arena', ini:'M', sub:'15:00 — 00:00 · horario parejo',   entra:'15:00', sale:'00:00', traslado:120 }
};

/* Los cuatro cortes de nomina de Asignar, de la cartelera que mando Sharon.
   Con el hotel del turno, Bitacora ya sabe que dia le pagan. */
const CORTES_ASIGNAR = [
  { grupo:'01', cortes:[{desde:26, hasta:10, pago:15}, {desde:11, hasta:25, pago:30}],
    hoteles:['Corferias','Estelares','Colsubsidio','JW Marriot','Dann 93'] },
  { grupo:'02', cortes:[{desde:1, hasta:15, pago:20}, {desde:16, hasta:30, pago:5}],
    hoteles:['Grupo GHL','Habitel','Movich','Dann 19','Dann 103'] },
  { grupo:'03', cortes:[{desde:1, hasta:15, pago:15}, {desde:16, hasta:30, pago:30}],
    hoteles:['Metrotel','Grupo NH','Temporales'] },
  { grupo:'04', cortes:[{desde:23, hasta:10, pago:15}, {desde:11, hasta:22, pago:30}],
    hoteles:['Hyatt','W Marriot'] }
];
const HOTELES_ASIGNAR = CORTES_ASIGNAR.flatMap(g=>g.hoteles).sort((a,b)=>a.localeCompare(b,'es'));

function grupoDeHotel(hotel){ return CORTES_ASIGNAR.find(g=>g.hoteles.includes(hotel)) || null; }

function ultimoDiaDelMes(anio,mes){ return new Date(anio, mes+1, 0).getDate(); }

/* De la fecha del turno y el hotel sale el dia de pago. Los cortes que
   arrancan a fin de mes (26 al 10, 23 al 10) se pagan el mes siguiente. */
function pagoDeTurno(fechaStr, hotel){
  const g = grupoDeHotel(hotel); if(!g) return null;
  const d = parseDate(fechaStr), dia = d.getDate();
  for(const c of g.cortes){
    const cruzaMes = c.desde > c.hasta;
    const dentro = cruzaMes ? (dia>=c.desde || dia<=c.hasta) : (dia>=c.desde && dia<=c.hasta);
    if(!dentro) continue;
    let anio=d.getFullYear(), mes=d.getMonth();
    // si el corte cruza el mes y estamos en la punta de arriba, el pago cae el mes que viene
    if(cruzaMes && dia>=c.desde) mes++;
    // el corte 16 al 30 del grupo 02 se paga el 05 del mes siguiente
    else if(!cruzaMes && c.pago < c.desde) mes++;
    const f = new Date(anio, mes, Math.min(c.pago, ultimoDiaDelMes(anio,mes)));
    return { fecha: fmtDate(f), corte: c.desde+' al '+c.hasta, grupo: g.grupo };
  }
  return null;
}

function minutosDe(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60 + (m||0);
}
/* Un turno que sale a medianoche termina despues de entrar, no antes. */
function finEnMinutos(entra, sale){
  const a = minutosDe(entra), b = minutosDe(sale);
  if(a===null || b===null) return null;
  return b <= a ? b + 1440 : b;
}

/* Todo lo que ya ocupa ese dia: eventos con hora, rutinas del dia y otros turnos. */
function bloquesDelDia(fecha, exceptoTurnoId){
  const d = parseDate(fecha), dow = d.getDay();
  const out = [];
  DATA.events.forEach(e=>{
    if(e.date!==fecha || !e.start || e.status==='hecho') return;
    if(e.linkedType==='turno' && e.linkedId===exceptoTurnoId) return;
    if(e.cat==='nexxa' && e.noVoy) return;        // si no vas, no te ocupa el tiempo (D129)
    out.push({ titulo:e.title, desde:minutosDe(e.start), hasta:finEnMinutos(e.start, e.end||e.start), fuente:'evento', flex:flexDe(e), ref:e });
  });
  (DATA.routines||[]).forEach(r=>{
    if(!r.days || !r.days.includes(dow) || !r.start) return;
    out.push({ titulo:r.title, desde:minutosDe(r.start), hasta:finEnMinutos(r.start, r.end||r.start), fuente:'rutina', flex:flexDe(r), ref:r });
  });
  return out.filter(b=>b.desde!==null && b.hasta!==null);
}

/* El corazon: choque directo, o choque porque el traslado no te da (D70, D95). */
function detectarChoques(turno){
  const desde = minutosDe(turno.entra), hasta = finEnMinutos(turno.entra, turno.sale);
  if(desde===null || hasta===null) return [];
  const traslado = Number(turno.trasladoMin || LUGARES[turno.lugar]?.traslado || 0);
  const choques = [];
  bloquesDelDia(turno.fecha, turno.id).forEach(b=>{
    const grado = flexDe(b) === 'firme' ? 'duro' : 'blando';
    if(b.desde < hasta && desde < b.hasta){
      choques.push({ tipo:'directo', grado, bloque:b });
    } else if(b.hasta <= desde && desde - b.hasta < traslado){
      choques.push({ tipo:'traslado', grado, bloque:b, faltan: traslado - (desde - b.hasta) });
    } else if(hasta <= b.desde && b.desde - hasta < traslado){
      choques.push({ tipo:'traslado-despues', grado, bloque:b, faltan: traslado - (b.desde - hasta) });
    }
  });
  return choques;
}
function choquesDuros(t){ return detectarChoques(t).filter(c=>c.grado==='duro'); }

function hhmm(min){
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function duracionLarga(min){
  const h = Math.floor(min/60), m = min%60;
  return h ? (h + ' h' + (m ? ' ' + m : '')) : (m + ' min');
}
/* "1 h libre" y no "1 h libres". */
function libres(min){
  return duracionLarga(min) + (min === 60 ? ' libre' : ' libres');
}

    <div class="field"><label>Lo que calculas que te pagan (opcional)</label>
      <input type="number" id="t_estimado" inputmode="numeric" placeholder="Un estimado, lo corriges cuando te paguen" value="${t.estimado||''}"></div>
    <div class="field"><label>Traslado</label>
      <input type="number" id="t_traslado" inputmode="numeric" placeholder="${l ? l.traslado : 60}" value="${t.trasladoMin||''}">
      <div class="helptext">Minutos de puerta a puerta.${t.lugar==='asignar' ? ' En Asignar arranca en 1 h 30 porque cada vez te mandan a un hotel distinto — cámbialo si este queda lejos.' : ''}</div>
    </div>
    <label class="field-check"><input type="checkbox" id="t_tentativo" ${t.confirmado?'':'checked'}>
      <span>Todavía sin confirmar<br><span class="helptext" style="margin:2px 0 0;">Te lo ofrecieron pero aún no dices que sí.</span></span></label>
    <div class="sheet-actions">
      ${DATA.turnos.some(x=>x.id===t.id) ? `<button class="btn-ghost" id="t_borrar">Borrar</button>` : ''}
      <button class="btn-primary" id="t_guardar">Guardar turno</button>
    </div>
  `);

  function leer(){
    const g = id => document.getElementById(id);
    t.fecha = g('t_fecha').value || t.fecha;
    t.entra = g('t_entra').value;
    t.sale  = g('t_sale').value;
    t.estimado = g('t_estimado').value;
    t.trasladoMin = g('t_traslado').value ? Number(g('t_traslado').value) : null;
    t.confirmado = !g('t_tentativo').checked;
    if(g('t_hotel')) t.hotel = g('t_hotel').value;
  }

  sheet.querySelectorAll('.lugar').forEach(b=>{
    b.onclick = ()=>{
      leer();
      t.lugar = b.dataset.lugar;
      const v = LUGARES[t.lugar];
      if(v.entra && !t.entra){ t.entra = v.entra; t.sale = v.sale; }   // plantilla en dos toques (D67)
      if(t.lugar!=='asignar') t.hotel='';
      pintarTurnoModal();
    };
  });
  const selHotel = document.getElementById('t_hotel');
  if(selHotel) selHotel.onchange = ()=>{ leer(); pintarTurnoModal(); };
  const inFecha = document.getElementById('t_fecha');
  if(inFecha) inFecha.onchange = ()=>{ leer(); if(t.lugar==='asignar' && t.hotel) pintarTurnoModal(); };

  const btnBorrar = document.getElementById('t_borrar');
  if(btnBorrar) btnBorrar.onclick = ()=>{ borrarTurno(t.id); closeSheet(); };

  document.getElementById('t_guardar').onclick = ()=>{
    leer();
    if(!t.lugar){ alert('Elige el lugar del turno.'); return; }
    if(!t.entra || !t.sale){ alert('Falta la hora de entrada o de salida.'); return; }
    const choques = detectarChoques(t);
    /* Solo te para lo que de verdad te bloquea. Lo que se acomoda queda
       anotado en el turno, sin interrumpirte (D07: nada de ruido). */
    if(choques.some(c=>c.grado==='duro')){ mostrarChoque(t, choques); return; }
    guardarTurno(t); closeSheet();
  };
}

/* La pantalla de choque. Muestra que se cruza y que tendria que mover,
   y deja aceptarlo igual: Bitacora no decide por ella (D16). */
function mostrarChoque(t, choques){
  const l = LUGARES[t.lugar];
  const traslado = Number(t.trasladoMin || l.traslado || 0);
  const desde = minutosDe(t.entra), hasta = finEnMinutos(t.entra, t.sale);
  const duros = choques.filter(c=>c.grado==='duro');
  const blandos = choques.filter(c=>c.grado!=='duro');

  const frase = c => {
    if(c.tipo==='directo') return `Se cruza con <b>${esc(c.bloque.titulo)}</b>, de ${hhmm(c.bloque.desde)} a ${hhmm(c.bloque.hasta)}.`;
    if(c.tipo==='traslado') return `Con ${duracionLarga(traslado)} de traslado no alcanzas: <b>${esc(c.bloque.titulo)}</b> termina ${hhmm(c.bloque.hasta)} y te faltan ${duracionLarga(c.faltan)}.`;
    return `Al salir no alcanzas a llegar a <b>${esc(c.bloque.titulo)}</b>, que empieza ${hhmm(c.bloque.desde)}: te faltan ${duracionLarga(c.faltan)}.`;
  };

  const opciones = duros.map(c=>({
    que: 'Soltar ' + c.bloque.titulo,
    por: hhmm(c.bloque.desde) + '–' + hhmm(c.bloque.hasta) + (c.bloque.fuente==='rutina' ? ' · se repite cada semana' : '')
  }));
  const masTarde = Math.max(...duros.map(c=> c.bloque.hasta + traslado));
  if(isFinite(masTarde) && masTarde > desde && masTarde < hasta){
    const dia = masTarde >= 1440 ? ' del día siguiente' : '';
    opciones.push({ que:'Pedir entrar más tarde', por: l.nombre + ' · llegarías ' + hhmm(masTarde) + dia });
  }

  openSheet(`
    <h3>${esc(turnoTitulo(t))}</h3>
    <div class="helptext" style="margin:-4px 0 12px;">${niceDate(t.fecha)} · ${t.entra} — ${t.sale}${t.confirmado?'':' <span class="tentativo">sin confirmar</span>'}</div>
    <div class="choque-head">⚠ Se cruza con ${duros.length===1?'una cosa':duros.length+' cosas'}</div>
    <div class="choque-box">${duros.map(c=>`<p>${frase(c)}</p>`).join('')}</div>
    ${blandos.length ? `
      <div class="choque-head suave" style="margin-top:16px;">Además, pero se acomoda</div>
      <div class="choque-box suave">${blandos.map(c=>`<p>${frase(c)} <span class="porque-suave">${esc(FLEX[flexDe(c.bloque)].nota)}</span></p>`).join('')}</div>` : ''}
    <div class="section-title" style="margin-top:20px;">Qué tendrías que mover o soltar</div>
    ${opciones.map(o=>`<div class="opcion"><div class="qué">${esc(o.que)}</div><div class="porqué">${esc(o.por)}</div></div>`).join('')}
    <p class="nota-suave">Bitácora no decide por ti. Puedes aceptarlo igual.</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="ch_volver">Volver</button>
      <button class="btn btn-primary" id="ch_igual">Aceptar igual</button>
    </div>
  `);
  document.getElementById('ch_volver').onclick = ()=> pintarTurnoModal();
  document.getElementById('ch_igual').onclick = ()=>{ guardarTurno(t); closeSheet(); };
}

/* Los turnos que vienen. */
function renderTurnos(){
  const caja = document.getElementById('turnosBody');
  if(!caja) return;
  const hoy = todayStr();
  const proximos = DATA.turnos.filter(t=>t.fecha>=hoy).sort((a,b)=> a.fecha===b.fecha ? (a.entra||'').localeCompare(b.entra||'') : a.fecha.localeCompare(b.fecha));
  if(!proximos.length){
    caja.innerHTML = '<div class="empty-card">Sin turnos cargados. Tócale a + Turno apenas te avisen.</div>';
    return;
  }
  caja.innerHTML = proximos.map(t=>{
    const pago = (t.lugar==='asignar' && t.hotel) ? pagoDeTurno(t.fecha, t.hotel) : null;
    const todos = detectarChoques(t);
    const duros = todos.filter(c=>c.grado==='duro').length;
    const blandos = todos.length - duros;
    const meta = [niceDate(t.fecha), t.entra + '–' + t.sale];
    if(pago) meta.push('te pagan el ' + niceDateShort(pago.fecha));
    if(t.estimado) meta.push(money(t.estimado) + ' est.');
    return `<div class="card turno-card" data-turno="${t.id}" data-sel-tipo="turno" data-sel-id="${t.id}" style="border-left:3px solid var(--c-trabajo); cursor:pointer;">
      <div style="font-weight:600;">${esc(turnoTitulo(t))}${t.confirmado?'':'<span class="tentativo">sin confirmar</span>'}</div>
      <div class="helptext" style="margin:3px 0 0;">${esc(meta.join(' · '))}</div>
      ${duros ? `<div class="helptext" style="margin:5px 0 0; color:var(--urgent); font-weight:600;">⚠ se cruza con ${duros===1?'algo':duros+' cosas'} de ese día</div>` : ''}
      ${blandos ? `<div class="helptext" style="margin:5px 0 0; color:var(--ambar); font-weight:600;">se cruza con ${blandos===1?'algo':blandos+' cosas'} que se acomodan</div>` : ''}
    </div>`;
  }).join('');
  caja.querySelectorAll('.turno-card').forEach(c=>{
    c.onclick = ()=> openTurnoModal(DATA.turnos.find(t=>t.id===c.dataset.turno));
  });
}

/* Aviso de cruces de la semana, arriba del calendario (D25). */
function renderChoquesSemana(){
  const caja = document.getElementById('choquesSemana');
  if(!caja) return;
  const hoy = new Date();
  const cruces = [];
  for(let i=0;i<7;i++){
    const f = fmtDate(addDays(hoy,i));
    DATA.turnos.filter(t=>t.fecha===f).forEach(t=>{
      if(choquesDuros(t).length) cruces.push({ fecha:f, turno:t });
    });
  }
  if(!cruces.length){ caja.innerHTML=''; return; }
  caja.innerHTML = `
    <div class="choque-head" style="margin-top:4px;">⚠ ${cruces.length===1?'1 cruce':cruces.length+' cruces'} esta semana</div>
    <div class="choque-box">${cruces.map(c=>`<p>${esc(niceDate(c.fecha))}: <b>${esc(turnoTitulo(c.turno))}</b> se cruza con algo que ya tenías.</p>`).join('')}</div>`;
}

/* ============================================================
   AVISOS
   Solo existen tres, y se explican en la pantalla para que sepa exactamente
   que va a recibir antes de decir que si (D45, D46, D49, D07).
============================================================ */
const PUSH_URL = '/api/push';

function soportaAvisos(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function b64aBytes(base64){
  const relleno = '='.repeat((4 - base64.length % 4) % 4);
  const limpio = (base64 + relleno).replace(/-/g, '+').replace(/_/g, '/');
  const crudo = atob(limpio);
  return Uint8Array.from([...crudo].map(c => c.charCodeAt(0)));
}
async function pushRequest(method, body){
  const headers = { 'Content-Type':'application/json' };
  const pass = lsGet(PASS_KEY);
  if(pass) headers['x-app-password'] = pass;
  const res = await fetch(PUSH_URL, { method, headers, cache:'no-store', body: body ? JSON.stringify(body) : undefined });
  if(!res.ok){
    let detalle=''; try{ detalle = (await res.json()).error || ''; }catch(e){}
    throw new Error(detalle || ('HTTP '+res.status));
  }
  return res.json();
}
async function suscripcionActual(){
  if(!soportaAvisos()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? await reg.pushManager.getSubscription() : null;
}

async function renderAvisos(){
  const caja = document.getElementById('avisosBox');
  if(!caja) return;

  const explicacion = `
    <div class="helptext" style="margin:0 0 10px;">Solo existen tres, y llegan el día antes:</div>
    <ol class="lista-avisos">
      <li>Una entrega de la universidad que se acerca</li>
      <li>Un pago o una cuota por vencer</li>
      <li>Un hueco libre con un pendiente que cabe</li>
    </ol>
    <div class="helptext">Nunca de recoger a Joel ni de entrar o salir de un turno. Nada entre las 11 de la noche y las 6 de la mañana, ni en noches de turno. Máximo 8 en un día.</div>`;

  if(!soportaAvisos()){
    caja.innerHTML = `<div class="card">${explicacion}
      <div class="helptext" style="color:var(--ambar); font-weight:600; margin-top:10px;">Este navegador no los soporta. En el celular, instala Bitácora desde el menú de Chrome y ábrela desde el ícono.</div></div>`;
    return;
  }

  const permiso = Notification.permission;
  const sub = await suscripcionActual();
  let estado, accion;

  if(permiso === 'denied'){
    estado = `<div class="helptext" style="color:var(--urgent); font-weight:600;">Los bloqueaste. Para volver a activarlos toca el candado de la barra de direcciones y permite las notificaciones.</div>`;
    accion = '';
  } else if(sub){
    estado = `<div class="helptext" style="color:var(--done); font-weight:600;">✓ Activados en este dispositivo.</div>`;
    accion = `<button class="small-btn" id="avisosProbar">Mandarme uno de prueba</button>
              <button class="small-btn" id="avisosQuitar" style="color:var(--urgent);">Desactivar</button>`;
  } else {
    estado = `<div class="helptext">Apagados. No te llega nada.</div>`;
    accion = `<button class="btn btn-primary" style="width:100%; margin-top:4px;" id="avisosPrender">Activar los avisos</button>`;
  }

  caja.innerHTML = `<div class="card">${explicacion}<div style="margin-top:12px;">${estado}</div>
    <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">${accion}</div></div>`;

  const prender = document.getElementById('avisosPrender');
  if(prender) prender.onclick = activarAvisos;
  const quitar = document.getElementById('avisosQuitar');
  if(quitar) quitar.onclick = desactivarAvisos;
  const probar = document.getElementById('avisosProbar');
  if(probar) probar.onclick = async ()=>{
    const reg = await navigator.serviceWorker.getRegistration();
    reg.showNotification('Bitácora', {
      body: 'Así se van a ver. Este es el único que te mando yo.',
      icon: '/icons/icono-192.png', badge: '/icons/icono-192.png', tag: 'bitacora-prueba'
    });
  };
}

async function activarAvisos(){
  const btn = document.getElementById('avisosPrender');
  if(btn){ btn.disabled = true; btn.textContent = 'Un momento…'; }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){ renderAvisos(); return; }

    const { publicKey } = await pushRequest('GET');
    if(!publicKey) throw new Error('Al proyecto le faltan las llaves VAPID en Vercel.');

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64aBytes(publicKey)
    });
    await pushRequest('POST', { subscription: sub.toJSON() });
    renderAvisos();
  }catch(err){
    alert('No se pudieron activar: ' + err.message);
    renderAvisos();
  }
}

async function desactivarAvisos(){
  try{
    const sub = await suscripcionActual();
    if(sub){
      await pushRequest('POST', { subscription: sub.toJSON(), quitar: true }).catch(()=>{});
      await sub.unsubscribe();
    }
  }catch(err){ /* si falla el servidor, igual se quita del navegador */ }
  renderAvisos();
}

/* Al tocar un aviso, la app abre donde toca. */
function engancharAvisos(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', (ev)=>{
      if(ev.data?.tipo === 'ir' && views.includes(ev.data.a)) showView(ev.data.a);
    });
  }
  try{
    const ir = new URLSearchParams(location.search).get('ir');
    if(ir && views.includes(ir)){
      showView(ir);
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
}

/* ============================================================
   PLATA
   Orden de la pantalla, tal cual lo pediste (D112): cuanto tienes ahora,
   cuanto vas a recibir y cuando, y como vas contra el presupuesto.
============================================================ */

/* Las ocho que elegiste, mas Otros para que ningun gasto te deje atascada (D98). */
const CATEGORIAS_GASTO = ['Transporte','Comida fuera','Casa y servicios','Salud','Ropa y cuidado personal','Salidas y ocio','Datos y celular','Herramientas y cursos','Otros'];

function tasaUSD(){ return Number(DATA.plata.tasaUSD) || null; }
function enPesos(monto, moneda){
  if(moneda!=='USD') return Number(monto)||0;
  const t = tasaUSD();
  return t ? Math.round(Number(monto)*t) : null;
}
function montoConMoneda(monto, moneda, montoCOP){
  if(moneda!=='USD') return money(monto);
  const etiqueta = 'US$' + Number(monto).toLocaleString('es-CO');
  if(Number(montoCOP)>0) return etiqueta + ' · ' + money(montoCOP);
  const pesos = enPesos(monto, moneda);
  return etiqueta + (pesos!==null ? ' · ' + money(pesos) : ' · falta la tasa');
}
/* Si escribio lo que le descontaron, de ahi sale la tasa real de ese cobro. */
function tasaImplicita(x){
  if(x.moneda!=='USD' || !Number(x.montoCOP) || !Number(x.monto)) return null;
  return Math.round(Number(x.montoCOP) / Number(x.monto));
}
function haceCuanto(fecha){
  if(!fecha) return 'nunca';
  const d = daysBetween(fecha, todayStr());
  if(d<=0) return 'hoy';
  if(d===1) return 'ayer';
  return 'hace ' + d + ' días';
}

/* Cuando te pagan un turno. Asignar sale del corte del hotel; Infinity
   paga el lunes siguiente; Movistar todavia no esta definido (D23, D37). */
function fechaDePagoTurno(t){
  if(t.lugar==='asignar' && t.hotel){ const p = pagoDeTurno(t.fecha, t.hotel); return p ? p.fecha : null; }
  if(t.lugar==='infinity'){
    const d = parseDate(t.fecha);
    const faltan = (8 - d.getDay()) % 7 || 7;      // el lunes que viene
    return fmtDate(addDays(d, faltan));
  }
  return null;
}
function porRecibir(){
  const hoy = todayStr();
  return DATA.turnos
    .filter(t=>Number(t.estimado)>0 && !t.cobrado)
    .map(t=>({ turno:t, fecha:fechaDePagoTurno(t), monto:Number(t.estimado) }))
    .filter(x=> !x.fecha || x.fecha>=hoy)
    .sort((a,b)=> (a.fecha||'9999').localeCompare(b.fecha||'9999'));
}

/* Un cobro que vuelve cada mes: el proximo que viene. Si ya lo pago este
   mes, el proximo es el del mes que sigue. */
function pagadoEsteMes(sus, mes){
  return (sus.pagados||[]).includes(mes || todayStr().slice(0,7));
}
function proximoCobro(sus){
  const hoy = new Date(), dia = Number(sus.dia);
  if(!dia) return null;
  const arma = (anio, mes) => new Date(anio, mes, Math.min(dia, ultimoDiaDelMes(anio, mes)));
  let f = arma(hoy.getFullYear(), hoy.getMonth());
  if(fmtDate(f) < todayStr() || pagadoEsteMes(sus, fmtDate(f).slice(0,7))){
    f = arma(hoy.getFullYear(), hoy.getMonth()+1);
  }
  return fmtDate(f);
}

/* Lo de Jerson no es un numero quieto: si a veces le prestas tu, se descuenta. */
function saldoDeuda(d){
  const movs = (d.movs||[]).reduce((a,m)=> a + (m.sentido==='abono' ? -Number(m.monto) : Number(m.monto)), 0);
  return Number(d.monto) + movs;
}

function gastosDelMes(){
  const mes = todayStr().slice(0,7);
  const out = {};
  DATA.events.filter(e=>e.cat==='finanzas' && e.type==='gasto' && e.date.startsWith(mes)).forEach(e=>{
    const c = e.categoria || 'Otros';
    out[c] = (out[c]||0) + Number(e.amount||0);
  });
  return out;
}

        <div class="helptext">De esto sale el presupuesto.</div></div>` : ''}
