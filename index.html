<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Bitácora</title>
<script>
/* Modo claro u oscuro (D55). La primera vez sigue al teléfono; después manda el botón. */
/* Arranca en claro. El oscuro se elige con el boton, no lo decide el
   telefono: lo que pidio Sharon fue un boton manual (D55). */
try{
  document.documentElement.dataset.tema = localStorage.getItem('bitacora:tema') || 'claro';
}catch(e){}
</script>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icono-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tokens tomados tal cual del lienzo de pantallas. Modo claro. */
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface-2:#EDEFF3;
  --surface-3:#E4E6EB;
  --border:#E4E6EB;
  --border-2:#D2D6DE;
  --text:#14161C;
  --text-muted:#5E6472;
  --text-dim:#8E95A3;
  --accent:#7C4DCC;                       /* morado solo en detalles (D56) */
  --accent-soft:rgba(124,77,204,.10);
  --urgent:#D93A3A;                       /* rojo: vencido o choque (D57) */
  --urgent-soft:rgba(217,58,58,.10);
  --ambar:#E0A020;                        /* amarillo: ojo con esto (D57) */
  --ambar-soft:rgba(224,160,32,.13);
  --done:#18845F;
  --done-soft:rgba(24,132,95,.10);
  /* Las once áreas (D89) */
  --c-trabajo:#2F6FB3;
  --c-dinero:#18845F;
  --c-uni:#4A56C4;
  --c-marca:#7C4DCC;
  --c-clientes:#0E8A96;
  --c-empr:#8E3B6B;
  --c-joel:#DE6B3C;
  --c-casa:#657687;
  --c-salud:#D2497E;
  --c-descanso:#5A8A63;
  --c-metas:#A8762A;
  /* Alias de compatibilidad con el código que venía de Centro de Control */
  --c-nexxa:var(--c-empr);
  --c-ads:var(--c-marca);
  --c-work:var(--c-trabajo);
  --c-fin:var(--c-dinero);
  --c-personal:var(--c-salud);
  --c-ciclo:var(--c-salud);
  --radius:12px;                          /* esquinas discretas (D117) */
  --radius-sm:10px;
}
html[data-tema="oscuro"]{
  --bg:#101218;
  --surface:#191C23;
  --surface-2:#20242D;
  --surface-3:#272B34;
  --border:#272B34;
  --border-2:#343A46;
  --text:#E8EAEF;
  --text-muted:#9AA1B0;
  --text-dim:#737B8B;
  --accent:#A98BEA;
  --accent-soft:rgba(169,139,234,.15);
  --urgent:#F07070;
  --urgent-soft:rgba(240,112,112,.15);
  --ambar:#E8B559;
  --ambar-soft:rgba(232,181,89,.15);
  --done:#4FB98C;
  --done-soft:rgba(79,185,140,.14);
  --c-trabajo:#6FA8DC;
  --c-dinero:#4FB98C;
  --c-uni:#8A92E8;
  --c-marca:#A98BEA;
  --c-clientes:#4FB9C4;
  --c-empr:#C77FA6;
  --c-joel:#F0946B;
  --c-casa:#94A2B1;
  --c-salud:#E88AAE;
  --c-descanso:#8FBE97;
  --c-metas:#D4A85E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{min-height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif; letter-spacing:-0.01em;}
.mono,.hora,.monto{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
.app{max-width:560px; margin:0 auto; position:relative;}

/* ---------- header ---------- */
.topbar{padding:22px 18px 10px; position:sticky; top:0; z-index:20; background:var(--bg);}
.topbar .greet{font-size:13px; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.08em;}
.topbar h1{font-size:26px; margin:2px 0 0; font-weight:700;}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.topbar-row .greet{margin-right:auto;}
.sync{display:inline-flex; align-items:center; gap:6px; flex:none; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:11px; font-weight:600; letter-spacing:.02em; padding:5px 10px; border-radius:999px; cursor:pointer;}
.tema{flex:none; width:30px; height:30px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:14px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--text-dim); flex:none;}
.sync[data-state="ok"]{color:var(--done); background:var(--done-soft); border-color:transparent;}
.sync[data-state="ok"] .sync-dot{background:var(--done);}
.sync[data-state="sync"]{color:var(--accent); background:var(--accent-soft); border-color:transparent;}
.sync[data-state="sync"] .sync-dot{background:var(--accent); animation:pulse 1s ease-in-out infinite;}
.sync[data-state="off"],.sync[data-state="lock"]{color:var(--urgent); background:var(--urgent-soft); border-color:transparent;}
.sync[data-state="off"] .sync-dot,.sync[data-state="lock"] .sync-dot{background:var(--urgent);}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
.linework{width:100%; height:14px; margin-top:10px; opacity:.6;}

/* ---------- view container ---------- */
.view{padding:4px 18px 20px; display:none; animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* mismo tono que .rotulo: sin mayusculas ni espaciado, que era ruido */
.section-title{font-size:13px; color:var(--text-muted); font-weight:600; margin:24px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.section-title:first-child{margin-top:4px;}
.section-title .count{color:var(--accent); font-weight:700;}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
.empty-card{background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); padding:20px 16px; text-align:center; color:var(--text-muted); font-size:13.5px;}

.item{display:flex; align-items:flex-start; gap:11px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; cursor:pointer;}
.item:active{background:var(--surface-2);}
.item .hora{flex:none; width:44px; font-size:12.5px; font-weight:600; color:var(--text-muted); padding-top:1px;}

/* ---------- la portada: quieta a proposito ---------- */
.rotulo{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:24px 0 10px; font-size:13px; font-weight:600; color:var(--text-muted);}
.rotulo span:last-child{font-size:12px; font-weight:500; color:var(--text-dim);}
.rotulo:first-child{margin-top:6px;}

/* lo que vence: una linea por cosa, sin tarjeta ni etiquetas de colores */
.vence{margin:2px 0 4px;}
.vence-fila{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border);}
.vence-fila:last-child{border-bottom:none;}
.vence-fila .punto{width:7px; height:7px; border-radius:50%; flex:none;}
.vence-fila .que{flex:1; min-width:0; font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.vence-fila .cuando{flex:none; font-size:12px; color:var(--text-muted); font-weight:600;}

/* un bloque: hora, nombre, lugar y el circulo. Nada mas (D105) */
.bloque{display:flex; align-items:center; gap:11px; padding:11px 2px; }
.bloque .hora{flex:none; width:46px; font-size:13px; font-weight:600; color:var(--text); line-height:1.25;}
.bloque .hora .hasta{display:block; font-size:11px; font-weight:400; color:var(--text-dim);}
.bloque .raya{flex:none; width:3px; align-self:stretch; border-radius:3px; min-height:26px;}
.bloque .cuerpo{flex:1; min-width:0;}
.bloque .nombre{font-size:15px; font-weight:600; line-height:1.3;}
.bloque .sitio{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.bloque.hecho .nombre{color:var(--text-dim); text-decoration:line-through;}
.bloque .status-btn{width:24px; height:24px; margin:0;}

/* el hueco es espacio, no un renglon mas (D108) */
.hueco{margin:0; padding:7px 0 7px 2px; font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:9px; flex-wrap:wrap; min-height:26px;}
.hueco .rango{flex:none; width:96px; font-size:11.5px; color:var(--text-muted); font-weight:500;}
.cabe{color:var(--accent); font-weight:600;}

/* lo que no tiene hora, en el mismo idioma que lo demas */
.suelto{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border);}
.suelto:last-child{border-bottom:none;}
.suelto .punto{width:7px; height:7px; border-radius:50%; flex:none; margin:0 8px;}
.suelto .que{flex:1; min-width:0; font-size:14.5px; font-weight:500;}
.suelto .de{flex:none; font-size:12px; color:var(--text-dim);}

/* ---------- seleccionar para borrar ---------- */
[data-sel-id]{ -webkit-touch-callout:none; }
.seleccionable{position:relative;}
.elegido{background:var(--accent-soft) !important; border-radius:var(--radius-sm);}
.elegido::after{content:'✓'; position:absolute; top:50%; right:8px; transform:translateY(-50%);
  width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff;
  font-size:12px; line-height:20px; text-align:center; font-weight:700;}
.barra-sel{position:fixed; left:0; right:0; z-index:60; display:flex; align-items:center; gap:12px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--surface);
  border-top:1px solid var(--border); box-shadow:0 -6px 20px rgba(0,0,0,.08);
  bottom:0; max-width:560px; margin:0 auto;}
.barra-sel .cancelar{border:none; background:none; color:var(--text-muted); font-size:18px; cursor:pointer; padding:4px 6px;}
.barra-sel .cuantos{flex:1; font-size:14.5px; font-weight:600;}
.barra-sel .borrar{border:none; background:var(--urgent); color:#fff; font-weight:700; font-size:14px;
  padding:10px 18px; border-radius:var(--radius-sm); cursor:pointer;}
/* mientras la barra esta abajo, la de navegacion se esconde */
body.con-barra .bottomnav{display:none;}
/* showView le pone el display al + por estilo en linea, asi que hay que ganarle */
body.con-barra .fab{display:none !important;}
/* mientras elige, las etiquetas estorban: el visto va donde estaban */
body.con-barra .elegido .urg, body.con-barra .elegido .tag{visibility:hidden;}
.status-btn.chico{width:20px; height:20px; margin-left:2px;}
.cuenta{font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:none; letter-spacing:0;}
.item .body{flex:1; min-width:0;}
.item .row1{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.item .title{font-size:14.5px; font-weight:600; line-height:1.3;}
.item.done .title{color:var(--text-dim); text-decoration:line-through;}
.item .meta{font-size:12px; color:var(--text-muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
.status-btn{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border); background:transparent; flex-shrink:0; margin-top:1px;}
.status-btn.progreso{border-color:var(--accent); background:conic-gradient(var(--accent) 50%, transparent 0);}
.status-btn.hecho{border-color:var(--done); background:var(--done);}

/* ---------- bottom nav ---------- */
.bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:space-around;}
.navbtn{background:none; border:none; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:700; padding:4px 6px; border-radius:10px; flex:1; max-width:90px; position:relative;}
.navbtn.active{color:var(--accent);}
.navbtn svg{width:21px; height:21px;}
.navbtn .badge{position:absolute; top:0; right:12px; background:var(--urgent); color:#fff; font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;}

/* ---------- FAB ---------- */
.fab{position:fixed; right:20px; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:25; width:54px; height:54px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:26px; line-height:1; box-shadow:0 8px 22px rgba(139,108,249,.4); display:flex; align-items:center; justify-content:center;}
.fab:active{transform:scale(.94);}

/* ---------- chips ---------- */
.chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:2px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:13px; font-weight:600;}
.chip.active{border-color:var(--chip-color, var(--accent)); background:var(--chip-color-soft, var(--accent-soft)); color:var(--text);}

/* ---------- subtabs ---------- */
.subtabs-wrap{position:relative; margin-bottom:16px;}
.subtabs{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; overflow-x:auto; scrollbar-width:none; scroll-behavior:smooth;}
.subtabs::-webkit-scrollbar{display:none;}
/* una sombrita al borde avisa que hay mas pestanas para ese lado */
.subtabs-wrap::after, .subtabs-wrap::before{content:''; position:absolute; top:1px; bottom:1px; width:26px; pointer-events:none; opacity:0; transition:opacity .18s; border-radius:12px;}
.subtabs-wrap::after{right:1px; background:linear-gradient(90deg, transparent, var(--surface) 72%);}
.subtabs-wrap::before{left:1px; background:linear-gradient(270deg, transparent, var(--surface) 72%); z-index:1;}
.subtabs-wrap[data-mas-derecha]::after{opacity:1;}
.subtabs-wrap[data-mas-izquierda]::before{opacity:1;}
.subtab{flex-shrink:0; border:none; background:none; color:var(--text-dim); font-weight:700; font-size:12.5px; padding:9px 12px; border-radius:9px; white-space:nowrap;}
.subtab.active{background:var(--accent); color:#fff;}

/* ---------- week/subject rows ---------- */
.subject-row{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-uni); border-radius:var(--radius-sm); margin-bottom:8px;}
.subject-row.ads{border-left-color:var(--c-ads);}
.subject-row .info{flex:1;}
.subject-row .name{font-weight:600; font-size:14px;}
.subject-row .time{font-size:12px; color:var(--text-dim); margin-top:2px;}
.period-pill{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; padding:6px 12px; border-radius:20px; margin-bottom:14px;}
.subject-group{margin-bottom:14px;}
.subject-group-head{font-weight:700; font-size:13.5px; margin:4px 0 6px; padding-left:2px; color:var(--text);}

/* ---------- curso ---------- */
.module-row{display:flex; align-items:center; gap:11px; padding:12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-ads); border-radius:var(--radius-sm); margin-bottom:8px;}
.module-check{width:24px; height:24px; border-radius:7px; border:1.5px solid var(--border); background:transparent; flex-shrink:0;}
.module-check.done{background:var(--c-ads); border-color:var(--c-ads); position:relative;}
.module-check.done::after{content:'✓'; color:#fff; font-size:14px; font-weight:900; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.module-row .mname{font-size:14px; font-weight:600; flex:1;}
.module-row.done .mname{color:var(--text-dim); text-decoration:line-through;}

/* ---------- nexxa events ---------- */
.nexxa-card{padding:13px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-nexxa); border-radius:var(--radius); margin-bottom:9px;}
.nexxa-card .head{display:flex; justify-content:space-between; align-items:flex-start;}
.nexxa-card .name{font-weight:700; font-size:14.5px;}
.nexxa-card .meta{font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.5;}
.status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
.status-pill.cotizado{background:var(--surface-3); color:var(--text-muted);}
.status-pill.confirmado{background:rgba(139,108,249,.16); color:var(--c-nexxa);}
.status-pill.realizado{background:var(--done-soft); color:var(--done);}
.mini-tag{display:inline-block; font-size:11px; background:var(--surface-3); color:var(--text-muted); padding:2px 8px; border-radius:8px; margin-top:6px; margin-right:5px;}

/* ---------- trabajo ---------- */
.client-card{padding:14px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-work); border-radius:var(--radius); margin-bottom:10px;}
.client-card .head{display:flex; justify-content:space-between; align-items:flex-start;}
.client-card .name{font-weight:700; font-size:15px;}
.client-card .rate{font-size:12px; color:var(--text-dim); margin-top:2px;}
.client-card .stats{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;}
.client-card .stat b{display:block; font-size:16px; font-family:'Space Grotesk',sans-serif;}
.client-card .stat span{font-size:11px; color:var(--text-dim);}
.small-btn{background:var(--surface-3); border:1px solid var(--border); color:var(--text); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px;}

/* ---------- plata ---------- */
.saldo-card .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700; display:flex; align-items:baseline; gap:8px;}
.saldo-edad{text-transform:none; letter-spacing:0; font-weight:600; color:var(--text-muted); font-size:11.5px;}
.saldo-num{font-size:30px; font-weight:600; margin-top:3px; letter-spacing:-.02em;}
.saldo-card{cursor:pointer;}
.lista-avisos{margin:0 0 10px; padding-left:20px; font-size:13.5px; color:var(--text); line-height:1.5;}
.lista-avisos li{margin:3px 0;}
.deuda-card.saldada{opacity:.62;}

/* ---------- turnos y choques ---------- */
.lugares{display:grid; gap:8px; margin-top:6px;}
.lugar{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:12px 13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer;}
.lugar.sel{border-color:var(--c-trabajo); background:color-mix(in srgb, var(--c-trabajo) 8%, var(--surface));}
.lugar .ini{flex:none; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#fff; background:var(--c-trabajo); font-family:'Bricolage Grotesque',sans-serif;}
.lugar .nom{font-weight:600; font-size:15px;}
.lugar .sub{font-size:12.5px; color:var(--text-muted); margin-top:1px;}
.choque-head{display:flex; align-items:center; gap:8px; color:var(--urgent); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em;}
.choque-box{margin-top:9px; padding:13px 14px; border-radius:var(--radius); background:var(--urgent-soft); border-left:3px solid var(--urgent); font-size:14.5px; line-height:1.45;}
.choque-box p{margin:0 0 7px;} .choque-box p:last-child{margin-bottom:0;}
.choque-head.suave{color:var(--ambar);}
.choque-box.suave{background:var(--ambar-soft); border-left-color:var(--ambar);}
.porque-suave{color:var(--text-muted); font-size:13px;}
.opcion{width:100%; text-align:left; padding:12px 13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:default; margin-bottom:8px;}
.opcion .qué{font-weight:600; font-size:14.5px;}
.opcion .porqué{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
.nota-suave{font-size:12.5px; color:var(--text-dim); margin:12px 0 14px; line-height:1.45;}
.pago-calc{margin-top:8px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--done-soft); color:var(--done); font-size:13px; font-weight:600;}
.tentativo{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:999px; background:var(--ambar-soft); color:var(--ambar); margin-left:6px;}

/* ---------- finanzas ---------- */
.progress-track{height:7px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:9px;}
.progress-fill{height:100%; background:var(--c-fin); border-radius:6px;}
.money{font-family:'Space Grotesk',sans-serif; font-weight:700;}
.summary-row{display:flex; gap:10px; margin-bottom:16px;}
.summary-box{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px;}
.summary-box .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
.summary-box .val{font-size:18px; margin-top:4px;}
.installment-card{border-left:4px solid var(--c-fin) !important;}

/* ---------- personal ---------- */
.item.personal-row{border-left-color:var(--c-personal);}

/* ---------- reminders ---------- */
.reminder-row{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--urgent); border-radius:var(--radius-sm); margin-bottom:7px;}
.reminder-row.done{opacity:.55;}
.reminder-row .txt{flex:1; font-size:13.5px; font-weight:500;}
.reminder-row.done .txt{text-decoration:line-through; color:var(--text-dim);}
.addbar{display:flex; gap:8px; margin-bottom:14px;}
.addbar input{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:14px; font-family:inherit; color:var(--text);}
.addbar button{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px; font-weight:700; font-size:13px;}

/* ---------- calendar month ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-nav button{background:var(--surface); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:10px; font-size:16px;}
.cal-nav h2{margin:0; font-size:18px; text-transform:capitalize;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-dow{text-align:center; font-size:10.5px; color:var(--text-dim); font-weight:700; padding-bottom:4px;}
.cal-cell{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; color:var(--text-muted); position:relative; border:1px solid transparent; background:var(--surface);}
.cal-cell.blank{visibility:hidden;}
.cal-cell.today{border-color:var(--accent); color:var(--text); font-weight:700;}
.cal-cell.selected{background:var(--surface-3); color:var(--text);}
.cal-cell .dots{display:flex; gap:2px; margin-top:3px; height:5px;}
.cal-cell .dots span{width:4.5px; height:4.5px; border-radius:50%;}
.cal-cell.ciclo-range{background:rgba(214,70,126,.10);}
.cal-cell.ciclo-log{background:rgba(214,70,126,.28); color:#3A0F26; font-weight:700;}
.cal-daylist{margin-top:18px;}

/* ---------- Yo tab ---------- */
.cycle-hero{background:linear-gradient(135deg, rgba(214,70,126,.14), rgba(139,108,249,.07)); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
.cycle-hero .big{font-size:26px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--c-ciclo);}
.cycle-hero .sub{font-size:13px; color:var(--text-muted); margin-top:4px;}
.ring-row{display:flex; gap:10px; margin-top:14px;}
.ring-box{flex:1; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 4px;}
.ring-box b{display:block; font-size:16px; font-family:'Space Grotesk',sans-serif;}
.ring-box span{font-size:10.5px; color:var(--text-dim);}

.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar-col .bar{width:100%; border-radius:6px 6px 3px 3px; min-height:3px;}
.bar-col .lbl{font-size:10px; color:var(--text-dim); margin-top:6px;}
.insight{display:flex; gap:10px; align-items:flex-start; padding:12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); margin-bottom:8px;}
.insight .ico{font-size:16px;}

.sheet{background:var(--surface); width:100%; max-width:560px; margin:0 auto; border-radius:22px 22px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:slideup .28s cubic-bezier(.2,.9,.3,1); border-top:3px solid var(--accent);}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}

</style>
</head>

<script>
/* ============================================================
   STORAGE
   Fuente de verdad: un JSON en Vercel Blob, vía /api/data.
   localStorage queda como caché local (arranque instantáneo y offline).
============================================================ */
const STORAGE_KEY = 'centro-control-sharon';
const DIRTY_KEY   = 'centro-control-sharon:pendiente';
const PASS_KEY    = 'centro-control-sharon:pin';
const API_URL     = '/api/data';
let DATA = {
  events: [],
  subjects: [],
  period: '',
  academicTasks: [],
  courseSchedule: [],
  courseTasks: [],
  courseModules: [],
  courseNotes: '',
  nexxaEvents: [],
  workClients: [],
  workSessions: [],
  installments: [],
  personalItems: [],
  reminders: [],
  routines: [], // {id,cat,title,days:[0..6],start,end,notes}
  listas: [],      // {id,nombre,color} — las secciones que arma Sharon
  pendientes: [],  // {id,listaId,titulo,urgencia,hecho,creado} — sin fecha a proposito
  cycle: { starts: [], avgLen: 28, periodLen: 5 },
  turnos: [],          // {id,lugar,hotel,fecha,entra,sale,confirmado,trasladoMin,estimado}
  plata: { saldo:null, saldoFecha:'', tasaUSD:null, tasaFecha:'', topes:{} },
  uni: { pasaCon:3.0, maxFallas:8, historial:[] },   // historial: {periodo, materias:[{name,nota}]}
  marca: { ideas:[], publicaciones:[] },             // marca personal (D73)
  suscripciones: [],   // {id,nombre,monto,moneda,dia,nota} — vuelven cada mes
  deudas: [],          // {id,nombre,sentido,monto,fecha,fechaHasta,aprox,nota,movs:[]}
  compromisosSembrados: false,
  platoSembrado: false
};
let saveTimer=null;
let dirty=false;        // hay cambios locales que todavía no subieron
let pushing=false;      // hay un guardado en vuelo
let pendingPush=false;  // llegó otro cambio mientras subíamos
let SYNC_STATE='sync';
const SYNC_LABELS = { ok:'Sincronizado', sync:'Sincronizando…', off:'Sin conexión', lock:'Bloqueado' };

function setSync(state){
  SYNC_STATE = state;
  const btn = document.getElementById('syncBtn');
  const txt = document.getElementById('syncText');
  if(!btn || !txt) return;
  btn.dataset.state = state;
  txt.textContent = SYNC_LABELS[state] || '';
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function setDirty(v){
  dirty = v;
  if(v) lsSet(DIRTY_KEY,'1'); else lsDel(DIRTY_KEY);
}
function cacheLocal(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
  catch(e){ console.warn('No se pudo guardar la copia local', e); }
}
/* Copia solo las claves que la app conoce: ignora basura y campos viejos. */
function mergeInto(src){
  if(!src || typeof src!=='object') return false;
  Object.keys(DATA).forEach(k=>{ if(k in src && src[k]!=null) DATA[k] = src[k]; });
  return true;
}
function hasLocalData(){
  return !!(DATA.events.length || DATA.subjects.length || DATA.routines.length || DATA.reminders.length ||
    DATA.academicTasks.length || DATA.courseSchedule.length || DATA.courseTasks.length || DATA.courseModules.length ||
    DATA.nexxaEvents.length || DATA.workClients.length || DATA.workSessions.length || DATA.installments.length ||
    DATA.personalItems.length || (DATA.cycle && DATA.cycle.starts.length) || DATA.period || DATA.courseNotes);
}

function askPass(){
  const p = prompt('PIN de acceso del Centro de Control:');
  if(p===null) return false;
  lsSet(PASS_KEY, p.trim());
  return true;
}
async function apiRequest(method, body, retry){
  const headers = { 'Content-Type':'application/json' };
  const pass = lsGet(PASS_KEY);
  if(pass) headers['x-app-password'] = pass;
  const res = await fetch(API_URL, { method, headers, cache:'no-store', body: body ? JSON.stringify(body) : undefined });
  if(res.status===401){
    if(retry!==false && askPass()) return apiRequest(method, body, false);
    const err = new Error('PIN incorrecto'); err.code = 401; throw err;
  }
  if(!res.ok){
    let detail=''; try{ detail = (await res.json()).error || ''; }catch(e){}
    throw new Error(detail || ('HTTP '+res.status));
  }
  return res.json();
}

/* Baja el estado remoto y pisa el local. Solo se llama cuando no hay cambios pendientes. */
async function pullRemote(){
  setSync('sync');
  try{
    const out = await apiRequest('GET');
    if(out && out.data){ mergeInto(out.data); cacheLocal(); }
    else if(hasLocalData()){ setDirty(true); }  // primera vez en la nube: sube lo que ya había acá
    setSync(dirty ? 'sync' : 'ok');
    return true;
  }catch(e){
    console.warn('No se pudo leer desde Vercel Blob', e);
    setSync(e.code===401 ? 'lock' : 'off');
    return false;
  }
}

/* Sube el estado completo (último que escribe, gana). */
async function pushRemote(){
  if(!dirty) return true;
  if(pushing){ pendingPush = true; return false; }
  pushing = true; setSync('sync');
  const before = JSON.stringify(DATA);
  try{
    await apiRequest('POST', { data: DATA });
    if(JSON.stringify(DATA)===before){ setDirty(false); setSync('ok'); }
    else { pendingPush = true; }
    return true;
  }catch(e){
    console.warn('No se pudo guardar en Vercel Blob', e);
    setSync(e.code===401 ? 'lock' : 'off');
    return false;
  }finally{
    pushing = false;
    if(pendingPush){ pendingPush = false; setTimeout(pushRemote, 0); }
  }
}

async function loadData(){
  try{
    const raw = lsGet(STORAGE_KEY);
    if(raw) mergeInto(JSON.parse(raw));
  }catch(e){ console.warn('No se pudieron leer los datos locales', e); }

  if(lsGet(DIRTY_KEY)==='1'){
    /* Quedó algo sin subir de la sesión anterior: no lo pisamos con lo remoto. */
    dirty = true;
    await pushRemote();
  }else{
    await pullRemote();
    if(dirty) await pushRemote();
  }
}

function saveData(){
  setDirty(true);
  cacheLocal();
  setSync('sync');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 600);
}

/* Sincroniza al volver a la app / recuperar red. */
async function syncNow(){
  if(dirty) return pushRemote();
  const ok = await pullRemote();
  if(ok) renderAll();
  return ok;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* Todo lo que escribe el usuario pasa por acá antes de entrar al HTML.
   Sin esto una comilla en un título corta el atributo value y el dato se
   trunca al editarlo, y un < se traga el resto del texto. */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function esc(v){
  if(v===null || v===undefined) return '';
  return String(v).replace(/[&<>"']/g, c=>ESC_MAP[c]);
}

/* ============================================================
   DATE HELPERS
============================================================ */
const DOW = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOW_SHORT = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function niceDate(s){ const d=parseDate(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function niceDateShort(s){ if(!s) return ''; const d=parseDate(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
function money(n){ return '$' + Math.round(Number(n||0)).toLocaleString('es-CO'); }
function horasFromRange(start,end){
  if(!start||!end) return 0;
  const [h1,m1]=start.split(':').map(Number), [h2,m2]=end.split(':').map(Number);
  let mins = (h2*60+m2)-(h1*60+m1);
  if(mins<=0) mins += 24*60; // cruza medianoche
  return Math.round((mins/60)*100)/100;
}
function weekdayItems(dayIdx){
  const items=[];
  const hayClases = DATA.subjects.some(s=>s.day===dayIdx);
  DATA.subjects.filter(s=>s.day===dayIdx).forEach(s=>items.push({name:s.name, start:s.start, end:s.end, color:'var(--c-uni)', tag:'clase', materia:s}));
  DATA.routines.filter(r=>r.days.includes(dayIdx)).forEach(r=>{
    /* si ya cargo las materias de ese dia, el bloque generico de Universidad
       sobra: seria la misma cosa dos veces */
    if(r.auto==='universidad' && hayClases) return;
    items.push({name:r.title, start:r.start, end:r.end, color:CATS[r.cat].color, tag:CATS[r.cat].label.toLowerCase(), ref:r});
  });
  return items.sort(porHora);
}
/* Lo que tiene hora va primero y en orden; lo que no, al final. */
function porHora(a,b){ return (a.start||'99:99').localeCompare(b.start||'99:99'); }

/* ============================================================
   LINKED EVENTS (sync entre secciones y calendario)
============================================================ */
function addLinkedEvent(cat,title,date,start,end,linkedType,linkedId,extra){
  if(!date) return null;
  const ev = Object.assign({ id:uid(), cat, title, date, start:start||'', end:end||'', status:'pendiente', estMin:null, actualMin:null, notes:'', linkedType, linkedId }, extra||{});
  DATA.events.push(ev);
  return ev;
}
function findLinkedEvent(type,id){ return DATA.events.find(e=>e.linkedType===type && e.linkedId===id); }
function removeLinkedEvent(type,id){ DATA.events = DATA.events.filter(e=>!(e.linkedType===type && e.linkedId===id)); }
function setLinkedEventStatus(type,id,status){ const ev=findLinkedEvent(type,id); if(ev) ev.status=status; }
function syncSourceFromEvent(e){
  if(!e.linkedType) return;
  if(e.linkedType==='academicTask'){ const t=DATA.academicTasks.find(x=>x.id===e.linkedId); if(t) t.done = e.status==='hecho'; }
  if(e.linkedType==='courseTask'){ const t=DATA.courseTasks.find(x=>x.id===e.linkedId); if(t) t.done = e.status==='hecho'; }
  if(e.linkedType==='personalItem'){ const p=DATA.personalItems.find(x=>x.id===e.linkedId); if(p) p.status = e.status==='hecho' ? 'hecho' : 'pendiente'; }
  if(e.linkedType==='nexxaEvent'){ const n=DATA.nexxaEvents.find(x=>x.id===e.linkedId); if(n) n.status = e.status==='hecho' ? 'realizado' : e.status==='progreso' ? 'confirmado' : 'cotizado'; }
}

const views = ['hoy','calendario','pendientes','plata','yo'];
/* Cada subpestaña sabe en qué sección vive, porque Gestión desapareció (D137). */
const SUB_VIEW = { listas:'pendientes', materias:'pendientes', marca:'pendientes', nexxa:'pendientes', trabajo:'pendientes', finanzas:'plata', personal:'yo', rutinas:'calendario' };
function showView(v){
  views.forEach(x=>{ document.getElementById('view-'+x).classList.toggle('active', x===v); });
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('fabAdd').style.display = 'flex';
  renderAll();
  /* la barra recien se puede medir cuando su seccion esta a la vista */
  document.querySelectorAll('#view-'+v+' .subtabs').forEach(marcarBordes);
}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));

/* Marca en que lado quedan pestanas escondidas, para pintar la sombrita. */
function marcarBordes(barra){
  const caja = barra.closest('.subtabs-wrap');
  if(!caja) return;
  const hayMas = barra.scrollWidth - barra.clientWidth;
  caja.toggleAttribute('data-mas-izquierda', barra.scrollLeft > 4);
  caja.toggleAttribute('data-mas-derecha', barra.scrollLeft < hayMas - 4);
}

/* Cada barra de subpestañas manda solo sobre las suyas. */
document.querySelectorAll('.subtabs').forEach(barra=>{
  const botones = [...barra.querySelectorAll('.subtab')];
  const subs = botones.map(b=>b.dataset.sub);
  barra.addEventListener('scroll', ()=>marcarBordes(barra), {passive:true});
  addEventListener('resize', ()=>marcarBordes(barra));
  requestAnimationFrame(()=>marcarBordes(barra));
  botones.forEach(b=>{
    b.addEventListener('click', ()=>{
      botones.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
      setTimeout(()=>marcarBordes(barra), 320);
      subs.forEach(sub=>{
        const el = document.getElementById('sub-'+sub);
        if(el) el.style.display = (sub===b.dataset.sub) ? 'block' : 'none';
      });
      renderAll();
    });
  });
});

function itemHTML(e){
  const cat = CATS[e.cat];
  const isUrgent = e.status!=='hecho' && daysBetween(todayStr(), e.date)>=0 && daysBetween(todayStr(), e.date)<=2;
  let metaParts = [];
  if(e.start) metaParts.push(e.start + (e.end? '–'+e.end : ''));
  if(e.date !== todayStr()) metaParts.push(niceDateShort(e.date));
  if(e.cat==='finanzas' && e.amount) metaParts.push((e.type==='ingreso'||e.type==='prestamo_recibido' ?'+':'-') + money(e.amount));
  if(e.persona) metaParts.push('con ' + e.persona);
  return `<div class="item ${e.status==='hecho'?'done':''}" data-id="${e.id}" data-sel-tipo="evento" data-sel-id="${e.id}" style="border-left-color:${cat.color}">
    <button class="status-btn ${e.status==='progreso'?'progreso':e.status==='hecho'?'hecho':''}" data-action="cyclestatus" data-id="${e.id}"></button>
    <div class="body">
      <div class="row1">
        <div class="title">${esc(e.title)}</div>
        <span class="tag" style="background:color-mix(in srgb, ${cat.color} 20%, transparent); color:${cat.color};">${cat.emoji}</span>
      </div>
      <div class="meta">${metaParts.map(m=>`<span>${esc(m)}</span>`).join('')} ${isUrgent?'<span style="color:var(--urgent); font-weight:700;">· pronto</span>':''}</div>
    </div>
  </div>`;
}
function bindItemClicks(){
  document.querySelectorAll('[data-action="cyclestatus"]').forEach(b=>{
    b.onclick = (ev)=>{
      ev.stopPropagation();
      const e = DATA.events.find(x=>x.id===b.dataset.id);
      if(!e) return;
      if(e.status==='pendiente'||!e.status) e.status='progreso';
      else if(e.status==='progreso'){
        const actual = prompt('¿Cuántos minutos reales te tomó? (opcional, Cancelar para omitir)');
        if(actual && !isNaN(actual)) e.actualMin = Number(actual);
        e.status='hecho';
      } else { e.status='pendiente'; }
      syncSourceFromEvent(e);
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('.item[data-id], .bloque[data-id]').forEach(it=>{
    /* bindItemClicks corre en cada render y recorre todo el documento: sin esto,
       un item de otra seccion terminaba con el mismo clic colgado dos veces */
    if(it.dataset.enganchado) return;
    it.dataset.enganchado = '1';
    it.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-action="cyclestatus"]')) return;
      const e = DATA.events.find(x=>x.id===it.dataset.id);
      if(!e) return;
      if(e.linkedType){ openLinkedSource(e.linkedType, e.linkedId); return; }
      openEventModal(e);
    });
  });
}

   llevamos ahí en vez de avisar dónde queda. */
const LINKED_SUBTAB = { academicTask:'materias', nexxaEvent:'nexxa', personalItem:'personal' };
function goToSubtab(sub){
  showView(SUB_VIEW[sub] || 'pendientes');
  const tab = document.querySelector(`.subtab[data-sub="${sub}"]`);
  if(tab) tab.click();
}
function openLinkedSource(type, id){
  if(type==='turno'){
    const t = DATA.turnos.find(x=>x.id===id);
    if(t){ openTurnoModal(t); return; }
  }
  if(!LINKED_SUBTAB[type]) return;      // sin ruta conocida, mejor no llevarla a otro lado
  goToSubtab(LINKED_SUBTAB[type]);
  if(type==='personalItem'){
    const it = DATA.personalItems.find(x=>x.id===id);
    if(it) openPersonalModal(it);
  }
}

function renderHoy(){
  const t = todayStr();
  const manana = fmtDate(addDays(new Date(),1));
  const dow = new Date().getDay();

  /* ---- 1 · lo que vence hoy o mañana (D104) ---- */
  const vencen = [];
  DATA.events.filter(e=>e.status!=='hecho' && e.date<=manana && !e.linkedType).forEach(e=>{
    if(e.start) return;                       // lo que tiene hora va en Tu día
    vencen.push({ titulo:e.title, cuando:e.date<t?'Atrasado':e.date===t?'Hoy':'Mañana',
      sub:CATS[e.cat]?CATS[e.cat].label:'', color:CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)', tarde:e.date<t });
  });
  DATA.events.filter(e=>e.status!=='hecho' && e.date<t && e.start).forEach(e=>{
    vencen.push({ titulo:e.title, cuando:'Atrasado', sub:niceDateShort(e.date),
      color:CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)', tarde:true });
  });
  /* las mismas que disparan el aviso del dia antes, para que no se contradigan */
  (DATA.academicTasks||[]).forEach(a=>{
    if(a.done || !a.date || a.date > manana) return;
    vencen.push({ titulo:a.name, cuando:a.date<t?'Atrasada':a.date===t?'Hoy':'Mañana',
      sub:a.subject||'Universidad', color:'var(--c-uni)', tarde:a.date<t });
  });
  (DATA.suscripciones||[]).forEach(x=>{
    const prox = proximoCobro(x);
    if(prox && (prox===t || prox===manana)) vencen.push({ titulo:x.nombre, cuando:prox===t?'Hoy':'Mañana',
      sub:montoConMoneda(x.monto,x.moneda,x.montoCOP), color:'var(--c-dinero)', tarde:false });
  });
  (DATA.deudas||[]).forEach(d=>{
    if(d.fecha && (d.fecha===t || d.fecha===manana)) vencen.push({ titulo:d.nombre, cuando:d.fecha===t?'Hoy':'Mañana',
      sub:money(saldoDeuda(d)), color:'var(--urgent)', tarde:false });
  });

  document.getElementById('hoyUrgent').innerHTML = vencen.length ? `
    <div class="vence">
      ${vencen.map(v=>`
        <div class="vence-fila">
          <span class="punto" style="background:${v.tarde?'var(--urgent)':'var(--ambar)'};"></span>
          <span class="que">${esc(v.titulo)}</span>
          <span class="cuando">${esc(v.cuando)}</span>
        </div>`).join('')}
    </div>` : '';

  /* ---- 2 · tu día: la misma tira que usa el calendario ---- */
  const resumen = resumenDelDia(t);
  const lista = document.getElementById('hoyList');
  lista.innerHTML = resumen.bloques.length
    ? tiraDelDia(t, { sugerir:true })
    : `<div class="empty-card">Hoy no tienes nada con hora. Toca + para agregar algo.</div>`;
  engancharTira(lista);

  document.getElementById('hoyClasses').innerHTML = resumen.bloques.length
    ? `<div class="rotulo"><span>Tu día</span><span>${duracionLarga(resumen.ocupado)} ocupadas · ${libres(resumen.libre)}</span></div>`
    : `<div class="rotulo"><span>Tu día</span></div>`;

  /* ---- 3 · lo flexible de hoy: sin hora ---- */
  const sueltos = DATA.events.filter(e=>e.date===t && !e.start && e.status!=='hecho');
  const urgentes = (DATA.pendientes||[]).filter(p=>!p.hecho && p.urgencia==='urgente');
  const flexBox = document.getElementById('hoyUpcoming');
  flexBox.innerHTML = (sueltos.length || urgentes.length) ? `
    <div class="rotulo" style="margin-top:22px;"><span>Sin hora</span></div>
    ${sueltos.map(e=>`
      <div class="suelto" data-id="${e.id}" data-sel-tipo="evento" data-sel-id="${e.id}">
        <span class="punto" style="background:${CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)'};"></span>
        <span class="que">${esc(e.title)}</span>
      </div>`).join('')}
    ${urgentes.map(p=>{
      const l = (DATA.listas||[]).find(x=>x.id===p.listaId);
      return `<div class="suelto" data-sel-tipo="pendiente" data-sel-id="${p.id}">
        <button class="status-btn chico" data-action="togglePend" data-pid="${p.id}"></button>
        <span class="que">${esc(p.titulo)}</span>
        ${l ? `<span class="de">${esc(l.nombre)}</span>` : ''}
      </div>`;
    }).join('')}` : '';

  document.getElementById('hoyUrgentListas').innerHTML = '';

  bindItemClicks();
  bindPendClicks();
}

/* ============================================================
   RENDER: MES
============================================================ */
let calDate = new Date();
let calSelected = null;
function renderCalendar(){
  document.getElementById('calTitle').textContent = MONTHS[calDate.getMonth()] + ' ' + calDate.getFullYear();
  const first = new Date(calDate.getFullYear(), calDate.getMonth(), 1);
  const lastDay = new Date(calDate.getFullYear(), calDate.getMonth()+1, 0).getDate();
  const startBlank = first.getDay();
  let cells = DOW_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startBlank;i++) cells += `<div class="cal-cell blank"></div>`;
  const t = todayStr();
  const cyclePreds = predictCycle();
  for(let day=1; day<=lastDay; day++){
    const d = new Date(calDate.getFullYear(), calDate.getMonth(), day);
    const ds = fmtDate(d);
    const dayEvents = DATA.events.filter(e=>e.date===ds);
    const wdItems = weekdayItems(d.getDay());
    let dotColors = [...new Set(dayEvents.map(e=>CATS[e.cat].color))];
    wdItems.forEach(it=>{ if(!dotColors.includes(it.color)) dotColors.push(it.color); });
    dotColors = dotColors.slice(0,3);
    const isCycleLog = DATA.cycle.starts.some(s=>{ const diff = daysBetween(s, ds); return diff>=0 && diff < DATA.cycle.periodLen; });
    const isPredicted = cyclePreds.some(p=> ds>=p.start && ds<=p.end);
    let cls = 'cal-cell';
    if(ds===t) cls+=' today';
    if(ds===calSelected) cls+=' selected';
    if(isCycleLog) cls+=' ciclo-log'; else if(isPredicted) cls+=' ciclo-range';
    cells += `<div class="${cls}" data-date="${ds}"><span>${day}</span><div class="dots">${dotColors.map(c=>`<span style="background:${c}"></span>`).join('')}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML = cells;
  document.querySelectorAll('.cal-cell:not(.blank)').forEach(c=>{ c.onclick = ()=>{ calSelected = c.dataset.date; renderCalendar(); renderCalDayList(); }; });
  if(!calSelected) calSelected = t;
  renderCalDayList();
}
function renderCalDayList(){
  const box = document.getElementById('calDayList');
  if(!calSelected){ box.innerHTML=''; return; }
  const ds = calSelected;
  const { bloques, ocupado, libre } = resumenDelDia(ds);
  const sinHora = DATA.events.filter(e=>e.date===ds && !e.start);

  box.innerHTML =
    `<div class="rotulo"><span>${niceDate(ds)}</span>${
      bloques.length ? `<span>${duracionLarga(ocupado)} ocupadas · ${libres(libre)}</span>` : ''}</div>` +
    (bloques.length ? tiraDelDia(ds, { sugerir:true })
      : `<div class="empty-card">Este día lo tienes libre entero.</div>`) +
    (sinHora.length ? `<div class="rotulo" style="margin-top:20px;"><span>Sin hora</span></div>` +
      sinHora.map(itemHTML).join('') : '');

  engancharTira(box);
}
document.getElementById('calPrev').onclick = ()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendar(); };
document.getElementById('calNext').onclick = ()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendar(); };

/* ============================================================
   CYCLE
============================================================ */
function computeAvgCycle(){
  const starts = [...DATA.cycle.starts].sort();
  if(starts.length<2) return DATA.cycle.avgLen || 28;
  let diffs=[]; for(let i=1;i<starts.length;i++) diffs.push(daysBetween(starts[i-1], starts[i]));
  diffs = diffs.slice(-6);
  return Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
}
function predictCycle(){
  const starts = [...DATA.cycle.starts].sort();
  if(!starts.length) return [];
  const avg = computeAvgCycle(); const plen = DATA.cycle.periodLen || 5;
  let cursor = parseDate(starts[starts.length-1]); let preds=[];
  for(let i=0;i<4;i++){ cursor = addDays(cursor, avg); preds.push({start:fmtDate(cursor), end:fmtDate(addDays(cursor, plen-1))}); }
  return preds;
}

/* ============================================================
   LISTAS DE PENDIENTES
   Decision de Sharon (14 sep 2026): lo que se agrega acá NO es "para hoy".
   Se queda en su lista, sin fecha, hasta que ella lo marque; si lo quiere
   en un día concreto se lo pone a mano y recién ahí pasa a la agenda.
============================================================ */
const URGENCIAS = ['normal','importante','urgente'];
const URG_ORDEN = { urgente:0, importante:1, normal:2 };
const URG_COLOR = { normal:'var(--text-dim)', importante:'var(--accent)', urgente:'var(--urgent)' };
const COLORES_LISTA = ['var(--c-uni)','var(--c-nexxa)','var(--c-ads)','var(--c-work)','var(--c-fin)','var(--c-ciclo)','var(--c-personal)'];
/* Tres para arrancar, con los ejemplos que ella misma dio. Puede renombrarlas. */
const LISTAS_SEMILLA = [
  { nombre:'Universidad', color:'var(--c-uni)' },
  { nombre:'Aseo', color:'var(--c-work)' },
  { nombre:'Compras', color:'var(--c-fin)' },
];
let listaActiva = null;

function asegurarListas(){
  if(!Array.isArray(DATA.listas)) DATA.listas = [];
  if(!Array.isArray(DATA.pendientes)) DATA.pendientes = [];
  if(!DATA.listas.length){
    LISTAS_SEMILLA.forEach(l=> DATA.listas.push({ id:uid(), nombre:l.nombre, color:l.color }));
    saveData();
  }
  if(!listaActiva || !DATA.listas.some(l=>l.id===listaActiva)) listaActiva = DATA.listas[0].id;
}
function chipColor(color){ return `--chip-color:${color}; --chip-color-soft:color-mix(in srgb, ${color} 16%, transparent);`; }
function pendientesDe(listaId){
  return DATA.pendientes.filter(p=>p.listaId===listaId).sort((a,b)=>
    (a.hecho?1:0)-(b.hecho?1:0) ||
    URG_ORDEN[a.urgencia||'normal']-URG_ORDEN[b.urgencia||'normal'] ||
    (a.creado||'').localeCompare(b.creado||''));
}
function pendienteHTML(p, color){
  const urg = p.urgencia || 'normal';
  return `<div class="pend ${p.hecho?'hecho':''}" data-sel-tipo="pendiente" data-sel-id="${p.id}" style="border-left-color:${p.hecho?'var(--border)':color}">
    <button class="status-btn ${p.hecho?'hecho':''}" data-action="togglePend" data-pid="${p.id}"></button>
    <div class="txt" data-action="editPend" data-pid="${p.id}">${esc(p.titulo)}</div>
    <button class="urg" data-nivel="${urg}" data-action="cicloUrg" data-pid="${p.id}" title="Tocar para cambiar la urgencia">${urg}</button>
  </div>`;
}

function renderListas(){
  asegurarListas();
  document.getElementById('listaChips').innerHTML =
    DATA.listas.map(l=>`<div class="chip ${l.id===listaActiva?'active':''}" data-action="activarLista" data-lista="${l.id}" style="${chipColor(l.color)}">${esc(l.nombre)}</div>`).join('') +
    `<div class="chip" data-action="nuevaLista">+ Lista</div>`;

  document.getElementById('listasBody').innerHTML = DATA.listas.map(l=>{
    const items = pendientesDe(l.id);

  });

    saveData(); closeSheet(); renderAll();

  document.getElementById('saveLista').onclick = ()=>{
    const nombre = document.getElementById('f_lnombre').value.trim();

/* ============================================================
   UNIVERSIDAD Y NOTAS
   Los porcentajes se ponen materia por materia, libres: no se asume
   ningun esquema de cortes (D114).
============================================================ */
function uniCfg(){ DATA.uni = DATA.uni || { pasaCon:3.0, maxFallas:8, historial:[] }; return DATA.uni; }
function cortesDe(s){ return s.cortes || (s.cortes = []); }

/* Con lo evaluado hasta ahora: cuanto lleva, cuanto del total ya se jugo, y
   cuanto necesita en lo que falta para pasar (D90). */
function estadoMateria(s){
  /* Si ya le dieron la definitiva, no hay nada que estimar: esa es la nota. */
  if(s.definitiva !== null && s.definitiva !== undefined && s.definitiva !== ''){
    return { total:100, evaluado:100, falta:0, nota:Number(s.definitiva),
             acumulado:Number(s.definitiva), necesita:null, imposible:false,
             yaPaso:Number(s.definitiva) >= uniCfg().pasaCon, esDefinitiva:true };
  }
  const cortes = cortesDe(s);
  const total = cortes.reduce((a,c)=>a+Number(c.pct||0), 0);
  const puestos = cortes.filter(c=>c.nota!==null && c.nota!=='' && c.nota!==undefined);
  const evaluado = puestos.reduce((a,c)=>a+Number(c.pct||0), 0);
  const acumulado = puestos.reduce((a,c)=>a+Number(c.nota)*Number(c.pct||0), 0) / 100;
  const nota = evaluado ? (acumulado * 100 / evaluado) : null;
  const falta = total - evaluado;
  const pasa = uniCfg().pasaCon;
  let necesita = null;
  if(falta > 0) necesita = (pasa * total / 100 - acumulado) * 100 / falta;
  return { total, evaluado, falta, nota, acumulado, necesita,
           imposible: necesita !== null && necesita > 5,
           yaPaso: necesita !== null && necesita <= 0 };
}

/* El promedio es de toda la carrera, no solo del bimestre (D100). */
function promedioCarrera(){
  const notas = [];
  (uniCfg().historial||[]).forEach(p=>(p.materias||[]).forEach(m=>{ if(Number(m.nota)) notas.push(Number(m.nota)); }));
  DATA.subjects.forEach(s=>{ const e = estadoMateria(s); if(e.nota!==null) notas.push(e.nota); });
  if(!notas.length) return null;
  return notas.reduce((a,n)=>a+n,0) / notas.length;
}
function nota1(n){ return n===null||n===undefined ? '—' : Number(n).toFixed(1).replace('.', ','); }
function fallasTotales(){ return DATA.subjects.reduce((a,s)=>a+Number(s.fallas||0), 0); }

      <div class="helptext" style="margin:3px 0 0;">${esc(p.red||'')}${p.alcance?' · '+Number(p.alcance).toLocaleString('es-CO')+' de alcance':''}${p.respuestas?' · '+p.respuestas+' respuesta'+(p.respuestas>1?'s':''):''}${p.cierres?' · '+p.cierres+' cierre'+(p.cierres>1?'s':''):''}</div>
      ${!p.alcance && !p.respuestas ? '<div class="helptext" style="margin:5px 0 0; color:var(--ambar);">Tócala para ponerle cómo le fue.</div>' : ''}
    </div>`).join('') : '<div class="empty-card">Todavía no has publicado nada por acá.</div>';

  box.innerHTML = html;

  document.getElementById('addIdeaBtn').onclick = agregarIdea;
  document.getElementById('ideaInput').onkeydown = (ev)=>{ if(ev.key==='Enter') agregarIdea(); };
  document.getElementById('addPubBtn').onclick = ()=>openPublicacionModal();
  box.querySelectorAll('[data-cambiar]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const i = M.ideas.find(x=>x.id===b.dataset.cambiar);
    const orden = Object.keys(ESTADOS_IDEA);
    i.estado = orden[(orden.indexOf(i.estado)+1) % orden.length];
    saveData(); renderMarca();
  });
  box.querySelectorAll('.idea-row').forEach(r=>r.onclick=()=>{
    const i = M.ideas.find(x=>x.id===r.dataset.id);
    openIdeaModal(i);
  });
  box.querySelectorAll('.pub-card').forEach(c=>c.onclick=(ev)=>{
    if(ev.target.closest('[data-publicada]')) return;
    openPublicacionModal(M.publicaciones.find(p=>p.id===c.dataset.id));
  });
  box.querySelectorAll('[data-publicada]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    openPublicacionModal(M.publicaciones.find(p=>p.id===b.dataset.publicada), true);
  });
}

function agregarIdea(){
  const inp = document.getElementById('ideaInput');
  const texto = inp.value.trim();
  if(!texto) return;
  marcaData().ideas.push({ id:uid(), texto, estado:'idea', creado:todayStr() });
  inp.value='';
  saveData(); renderMarca();
}

function openIdeaModal(i){
  if(!i) return;
  openSheet(`<h3>Idea</h3>
    <div class="field"><label>¿De qué es?</label><input type="text" id="i_texto" value="${esc(i.texto)}"></div>
    <div class="field"><label>Cómo va</label><select id="i_estado">
      ${Object.entries(ESTADOS_IDEA).map(([k,v])=>`<option value="${k}" ${i.estado===k?'selected':''}>${v}</option>`).join('')}
    </select></div>
    <div class="helptext">Si ya sabes cuándo la publicas, prográmala y pasa a la lista de arriba.</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="i_borrar">Borrar</button>
      <button class="btn btn-ghost" id="i_programar">Programarla</button>
      <button class="btn btn-primary" id="i_guardar">Guardar</button>
    </div>`);
  document.getElementById('i_borrar').onclick = ()=>{
    marcaData().ideas = marcaData().ideas.filter(x=>x.id!==i.id);
    saveData(); closeSheet(); renderMarca();
  };
  document.getElementById('i_guardar').onclick = ()=>{
    i.texto = document.getElementById('i_texto').value.trim() || i.texto;
    i.estado = document.getElementById('i_estado').value;
    saveData(); closeSheet(); renderMarca();
  };
  document.getElementById('i_programar').onclick = ()=>{
    const texto = document.getElementById('i_texto').value.trim() || i.texto;
    marcaData().ideas = marcaData().ideas.filter(x=>x.id!==i.id);
    openPublicacionModal({ id:null, titulo:texto, fecha:'', red:'', estado:'planeada', alcance:'', respuestas:'', cierres:'' });
  };
}

function openPublicacionModal(existente, marcandoPublicada){
  const p = existente || { id:null, titulo:'', fecha:todayStr(), red:REDES[0], estado:'planeada', alcance:'', respuestas:'', cierres:'' };
  const yaSalio = marcandoPublicada || p.estado==='publicada';
  const yaGuardada = !!(existente && existente.id);
  openSheet(`<h3>${marcandoPublicada ? '¿Cómo te fue?' : yaGuardada ? 'Publicación' : 'Nueva publicación'}</h3>
    <div class="field"><label>¿De qué es?</label><input type="text" id="p_titulo" value="${esc(p.titulo)}" placeholder="Ej: carrusel de errores en Meta Ads"></div>
    <div class="field-row">
      <div class="field"><label>Dónde</label><select id="p_red">${REDES.map(r=>`<option ${p.red===r?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="field"><label>${yaSalio?'Salió el':'Sale el'}</label><input type="date" id="p_fecha" value="${esc(p.fecha)}"></div>
    </div>
    ${yaSalio ? `
      <div class="field-row">
        <div class="field"><label>Alcance</label><input type="number" id="p_alcance" inputmode="numeric" value="${p.alcance}" placeholder="Cuánta gente"></div>
        <div class="field"><label>Respuestas</label><input type="number" id="p_resp" inputmode="numeric" value="${p.respuestas}" placeholder="DM, comentarios"></div>
      </div>
      <div class="field"><label>Cierres</label><input type="number" id="p_cierres" inputmode="numeric" value="${p.cierres}" placeholder="Clientes que salieron de acá">
        <div class="helptext">Si alguno se volvió cliente, agrégalo en Trabajo y dile que llegó por la marca.</div></div>
    ` : '<div class="helptext">Cuando la publiques le pones cómo le fue.</div>'}
    <div class="sheet-actions">
      ${yaGuardada?`<button class="btn btn-ghost" id="p_borrar">Borrar</button>`:''}
      <button class="btn btn-primary" id="p_guardar">Guardar</button>
    </div>`);
  const borrar = document.getElementById('p_borrar');
  if(borrar) borrar.onclick = ()=>{
    marcaData().publicaciones = marcaData().publicaciones.filter(x=>x.id!==p.id);
    saveData(); closeSheet(); renderMarca();
  };
  document.getElementById('p_guardar').onclick = ()=>{
    const g = id => document.getElementById(id);
    const datos = {
      titulo: g('p_titulo').value.trim(),
      red: g('p_red').value,
      fecha: g('p_fecha').value,
      estado: yaSalio ? 'publicada' : 'planeada',
      alcance: g('p_alcance') ? Number(g('p_alcance').value)||'' : (p.alcance||''),
      respuestas: g('p_resp') ? Number(g('p_resp').value)||'' : (p.respuestas||''),
      cierres: g('p_cierres') ? Number(g('p_cierres').value)||'' : (p.cierres||'')
    };
    if(!datos.titulo){ alert('Ponle de qué es.'); return; }
    if(yaGuardada) Object.assign(existente, datos);
    else marcaData().publicaciones.push(Object.assign({id:uid()}, datos));
    saveData(); closeSheet(); renderMarca();
  };
}

/* ---- Universidad ---- */
function renderMaterias(){
  const box = document.getElementById('sub-materias');
  const subs = [...DATA.subjects].sort((a,b)=> a.day-b.day || (a.start||'').localeCompare(b.start||''));
  const cfg = uniCfg();
  const prom = promedioCarrera();
  const fallas = fallasTotales();

  let html = `<div class="period-pill" id="periodPill">📚 ${esc(DATA.period) || 'Sin período configurado'} <span style="font-size:11px;">✎</span></div>`;

  /* ---- los dos números de arriba ---- */
  html += `<div class="summary-row">
      <div class="summary-box"><div class="lbl">Promedio de la carrera</div><div class="val mono">${nota1(prom)}</div></div>
      <div class="summary-box" id="fallasBox" style="cursor:pointer;"><div class="lbl">Fallas este bimestre</div>
        <div class="val mono" style="color:${fallas>=cfg.maxFallas?'var(--urgent)':fallas>=cfg.maxFallas*0.6?'var(--ambar)':'var(--text)'}">${fallas} <span style="font-size:13px; color:var(--text-dim);">/ ${cfg.maxFallas}</span></div></div>
    </div>`;

  /* ---- la que está en riesgo, de primera (D90) ---- */
  const enRiesgo = subs.map(s=>({s, e:estadoMateria(s)}))
    .filter(x=> x.e.necesita !== null && x.e.necesita > 0 && x.e.evaluado > 0)
    .sort((a,b)=> b.e.necesita - a.e.necesita)[0];
  if(enRiesgo){
    const {s,e} = enRiesgo;
    html += `<div class="card" style="border-left:3px solid ${e.imposible?'var(--urgent)':'var(--ambar)'}; background:${e.imposible?'var(--urgent-soft)':'var(--ambar-soft)'};">
      <div style="font-weight:700; font-size:15px;">${e.imposible ? `Con ${esc(s.name)} ya no alcanzas` : `Necesitas ${nota1(e.necesita)} en lo que falta de ${esc(s.name)}`}</div>
      <div class="helptext" style="margin:4px 0 0;">Llevas ${nota1(e.nota)} con el ${Math.round(e.evaluado)}% evaluado.${e.imposible ? ' Tendrías que sacar más de 5,0, que no se puede.' : ` Con menos de ${nota1(e.necesita)} no pasas.`}</div>
    </div>`;
  }

  /* ---- las materias ---- */
  html += `<div class="section-title"><span>Materias</span><button class="small-btn" id="defiBtn">Poner definitivas</button></div>`;
  if(subs.length){
    subs.forEach(s=>{
      const e = estadoMateria(s);
      const tasks = DATA.academicTasks.filter(t=>t.subject===s.name && !t.done).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const colorNota = e.nota===null ? 'var(--text-dim)' : e.nota < cfg.pasaCon ? 'var(--urgent)' : 'var(--done)';
      html += `<div class="subject-group">
        <div class="subject-row materia-row" data-id="${s.id}" data-sel-tipo="materia" data-sel-id="${s.id}" style="cursor:pointer; border-left-color:var(--c-uni);">
          <div class="info">
            <div class="name">${esc(s.name)}</div>
            <div class="time">${[
              s.start ? DOW[s.day] + ' · ' + esc(s.start) + (s.end?'–'+esc(s.end):'') : 'sin horario',
              e.esDefinitiva ? 'definitiva' : (e.total ? Math.round(e.evaluado)+'% evaluado' : 'sin porcentajes'),
              s.fallas ? s.fallas+' falla'+(s.fallas>1?'s':'') : ''
            ].filter(Boolean).join(' · ')}</div>
          </div>
          <div class="mono" style="font-size:19px; font-weight:600; color:${colorNota};">${nota1(e.nota)}</div>
        </div>
        ${e.total && e.total!==100 ? `<div class="helptext" style="margin:2px 0 6px 14px; color:var(--ambar);">Los porcentajes suman ${Math.round(e.total)}%, no 100%.</div>` : ''}
        ${tasks.map(t=>`
          <div class="module-row" data-id="${t.id}" style="margin-left:14px;">
            <button class="module-check" data-action="toggleTask" data-id="${t.id}"></button>
            <div style="flex:1; min-width:0;"><div class="mname">${esc(t.name)}</div><div class="meta" style="margin-top:2px;">${esc(t.type)}${t.date?' · '+niceDateShort(t.date):''}</div></div>
            <button class="small-btn" data-action="delTask" data-id="${t.id}">✕</button>
          </div>`).join('')}
      </div>`;
    });
    html += `<div class="helptext">Tócale a una materia para poner sus cortes, sus notas y sus fallas. Cada materia tiene los porcentajes que tenga: no se asume ninguno.</div>`;
  } else {
    html += `<div class="empty-card">Sin materias cargadas.<br><br>Si estás cerrando el bimestre y solo quieres guardar las notas, tócale a <b>Poner definitivas</b>: ahí las escribes con su nombre, sin horario ni porcentajes.</div>`;
  }
  html += `<button class="btn btn-primary" style="width:100%; margin-top:6px;" id="addSubjectBtn">+ Agregar materia</button>`;

  /* ---- entregas próximas ---- */
  const entregas = DATA.academicTasks.filter(t=>!t.done && t.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  html += `<div class="section-title" style="margin-top:24px;">Entregas próximas</div>`;
  html += entregas.length ? entregas.map(t=>{
    const dias = daysBetween(todayStr(), t.date);
    const cuando = dias<0 ? 'Atrasada' : dias===0 ? 'Hoy' : dias===1 ? 'Mañana' : niceDate(t.date);
    return `<div class="item" style="border-left-color:var(--c-uni);">
      <div class="body"><div class="row1"><div class="title">${esc(t.name)}</div>
        <span class="tag" style="background:${dias<=1?'var(--urgent-soft)':'var(--accent-soft)'}; color:${dias<=1?'var(--urgent)':'var(--accent)'};">${esc(cuando)}</span></div>
      <div class="meta"><span>${esc(t.subject||'General')}${t.type?' · '+esc(t.type):''}</span></div></div>
    </div>`;
  }).join('') : '<div class="empty-card">Sin entregas con fecha.</div>';
  html += `<button class="btn btn-primary" style="width:100%; margin-top:10px;" id="addTaskBtn">+ Agregar tarea/proyecto/entregable</button>`;

  /* ---- lo de bimestres pasados ---- */
  html += `<div class="section-title" style="margin-top:24px;"><span>Bimestres pasados</span><button class="small-btn" id="cerrarBimestreBtn">Cerrar este</button></div>`;
  html += (cfg.historial||[]).length ? cfg.historial.map(h=>`
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-weight:600;">${esc(h.periodo||'Bimestre')}</div>
        <div class="mono" style="font-weight:700;">${nota1((h.materias||[]).reduce((a,m)=>a+Number(m.nota||0),0)/Math.max(1,(h.materias||[]).length))}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${(h.materias||[]).map(m=>esc(m.name)+' '+nota1(m.nota)).join(' · ')}</div>
    </div>`).join('') : '<div class="empty-card">Todavía no has cerrado ningún bimestre. Cuando termines este, ciérralo y sus notas pasan al promedio de la carrera.</div>';

  box.innerHTML = html;
  document.getElementById('periodPill').onclick = openPeriodModal;
  document.getElementById('addSubjectBtn').onclick = openSubjectModal;
  document.getElementById('addTaskBtn').onclick = openTaskModal;
  document.getElementById('fallasBox').onclick = openUniAjustes;
  const defiBtn = document.getElementById('defiBtn');
  if(defiBtn) defiBtn.onclick = openDefinitivasModal;
  document.getElementById('cerrarBimestreBtn').onclick = cerrarBimestre;
  box.querySelectorAll('.materia-row').forEach(r=>{
    r.onclick = (ev)=>{ if(ev.target.closest('.small-btn')) return; openMateriaModal(DATA.subjects.find(x=>x.id===r.dataset.id)); };
  });
  box.querySelectorAll('[data-action="toggleTask"]').forEach(b=>{
    b.onclick=(ev)=>{ ev.stopPropagation(); const t=DATA.academicTasks.find(x=>x.id===b.dataset.id); t.done=!t.done; setLinkedEventStatus('academicTask', t.id, t.done?'hecho':'pendiente'); saveData(); renderMaterias(); };
  });
  box.querySelectorAll('[data-action="delTask"]').forEach(b=>{
    b.onclick=(ev)=>{ ev.stopPropagation(); DATA.academicTasks = DATA.academicTasks.filter(x=>x.id!==b.dataset.id); removeLinkedEvent('academicTask', b.dataset.id); saveData(); renderMaterias(); };
  });
}

/* Una materia por dentro: su horario, sus cortes con sus porcentajes, sus
   notas y sus fallas. */
function openMateriaModal(s){
  if(!s) return;
  const e = estadoMateria(s);
  const cortes = cortesDe(s);
  openSheet(`<h3>${esc(s.name)}</h3>
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700;">Vas en</div>
        <div class="mono" style="font-size:24px; font-weight:600;">${nota1(e.nota)}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${e.total ? Math.round(e.evaluado)+'% evaluado de '+Math.round(e.total)+'%' : 'Ponle los cortes para que esto calcule'}${
        e.necesita!==null && e.falta>0 ? (e.yaPaso ? ' · ya pasaste, pase lo que pase' : e.imposible ? ' · ya no alcanzas a pasar' : ' · necesitas '+nota1(e.necesita)+' en el '+Math.round(e.falta)+'% que falta') : ''}</div>
    </div>

    <div class="field"><label>Nota definitiva</label>
      <input type="number" id="f_definitiva" step="0.1" inputmode="decimal" value="${s.definitiva ?? ''}" placeholder="La que te dio la universidad">
      <div class="helptext">Si la pones, manda sobre los cortes y ya no se calcula nada. Déjala en blanco mientras el período siga abierto.</div>
    </div>

    <div class="field"><label>Cortes y porcentajes</label>
      <div id="cortesBox">${cortes.map((c,i)=>`
        <div class="field-row corte-row" data-i="${i}" style="align-items:flex-end;">
          <div class="field" style="flex:2;"><input type="text" data-campo="nombre" value="${esc(c.nombre||'')}" placeholder="Ej: Parcial"></div>
          <div class="field" style="flex:1;"><input type="number" data-campo="pct" value="${c.pct??''}" placeholder="%" inputmode="numeric"></div>
          <div class="field" style="flex:1;"><input type="number" data-campo="nota" value="${c.nota??''}" placeholder="Nota" inputmode="decimal" step="0.1"></div>
          <button class="small-btn" data-quitar="${i}" style="margin-bottom:14px;">✕</button>
        </div>`).join('')}</div>
      <button class="small-btn" id="addCorte">+ Corte</button>
      <div class="helptext">Deja la nota en blanco mientras no te la den. Los porcentajes de esta materia son los que tú pongas.</div>
    </div>

    <div class="field-row">
      <div class="field"><label>Fallas</label><input type="number" id="f_fallas" value="${s.fallas||0}" inputmode="numeric" min="0"></div>
      <div class="field"><label>Día</label><select id="f_mday">${DOW.map((d,i)=>`<option value="${i}" ${s.day===i?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Empieza</label><input type="time" id="f_mstart" value="${esc(s.start||'')}"></div>
      <div class="field"><label>Termina</label><input type="time" id="f_mend" value="${esc(s.end||'')}"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="delMateria">Borrar materia</button>
      <button class="btn btn-primary" id="saveMateria">Guardar</button>
    </div>`);

  function leerCortes(){
    const out = [];
    sheet.querySelectorAll('.corte-row').forEach(row=>{
      const v = campo => row.querySelector(`[data-campo="${campo}"]`).value;
      const nombre = v('nombre').trim();
      if(!nombre && !v('pct')) return;
      out.push({ id:uid(), nombre, pct:Number(v('pct'))||0, nota: v('nota')==='' ? null : Number(v('nota')) });
    });
    return out;
  }
  document.getElementById('addCorte').onclick = ()=>{ s.cortes = leerCortes(); s.cortes.push({id:uid(), nombre:'', pct:'', nota:null}); openMateriaModal(s); };
  sheet.querySelectorAll('[data-quitar]').forEach(b=>{
    b.onclick = ()=>{ const i=Number(b.dataset.quitar); const c=leerCortes(); c.splice(i,1); s.cortes=c; openMateriaModal(s); };
  });
  document.getElementById('delMateria').onclick = ()=>{
    if(!confirm(`¿Borrar ${s.name}? Se van sus notas y sus cortes.`)) return;
    DATA.subjects = DATA.subjects.filter(x=>x.id!==s.id); saveData(); closeSheet(); renderAll(); renderCalDayList();
  };
  document.getElementById('saveMateria').onclick = ()=>{
    s.cortes = leerCortes();
    const defi = document.getElementById('f_definitiva').value;
    s.definitiva = defi==='' ? null : Number(defi);
    s.fallas = Number(document.getElementById('f_fallas').value)||0;
    s.day = Number(document.getElementById('f_mday').value);
    s.start = document.getElementById('f_mstart').value;
    s.end = document.getElementById('f_mend').value;
    saveData(); closeSheet(); renderAll(); renderCalDayList();
  };
}

/* Cuando la universidad le entrega las definitivas, ese numero manda sobre
   todo lo calculado: ya no hay nada que estimar. */
function openDefinitivasModal(){
  const subs = [...DATA.subjects].sort((a,b)=> a.day-b.day || (a.start||'').localeCompare(b.start||''));
  const extras = 5 - subs.length;
  openSheet(`<h3>Notas definitivas</h3>
    <div class="helptext" style="margin:-4px 0 14px;">Las de ${esc(DATA.period || 'este período')}. Escribe la que te dieron y ya: manda sobre lo que Bitácora venía calculando. Deja en blanco las que todavía no te den.</div>

    <div id="defiBox">
      ${subs.map(s=>`
        <div class="field-row defi-row" data-id="${s.id}" style="align-items:flex-end;">
          <div class="field" style="flex:2;"><label>${esc(s.name)}</label>
            <input type="number" data-defi step="0.1" inputmode="decimal" value="${s.definitiva ?? ''}" placeholder="${nota1(estadoMateria(s).nota)}"></div>
        </div>`).join('')}
      ${Array.from({length: Math.max(extras, 2)}, (_, i)=>`
        <div class="field-row defi-nueva" style="align-items:flex-end;">
          <div class="field" style="flex:2;"><label>${i===0 && subs.length ? 'Otra materia' : (subs.length ? '' : 'Materia')}</label>
            <input type="text" data-nombre placeholder="Nombre de la materia"></div>
          <div class="field" style="flex:1;"><label>Nota</label>
            <input type="number" data-nota step="0.1" inputmode="decimal" placeholder="Ej: 4,2"></div>
        </div>`).join('')}
    </div>

    <div class="helptext">Si una materia no está en la lista, escríbela abajo con su nota y queda creada.</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="d_volver">Volver</button>
      <button class="btn btn-primary" id="d_guardar">Guardar</button>
    </div>`);

  document.getElementById('d_volver').onclick = closeSheet;
  document.getElementById('d_guardar').onclick = ()=>{
    sheet.querySelectorAll('.defi-row').forEach(row=>{
      const s = DATA.subjects.find(x=>x.id===row.dataset.id);
      if(!s) return;
      const v = row.querySelector('[data-defi]').value;
      s.definitiva = v==='' ? null : Number(v);
    });
    sheet.querySelectorAll('.defi-nueva').forEach(row=>{
      const nombre = row.querySelector('[data-nombre]').value.trim();
      const nota = row.querySelector('[data-nota]').value;
      if(!nombre) return;
      DATA.subjects.push({ id:uid(), name:nombre, day:1, start:'', end:'',
        cortes:[], fallas:0, definitiva: nota==='' ? null : Number(nota) });
    });
    saveData(); closeSheet(); renderAll();
  };
}

function openUniAjustes(){
  const cfg = uniCfg();

/* Cerrar el bimestre guarda las notas y deja el tablero limpio para el que
   viene, sin perder el promedio de la carrera (D100). */
function cerrarBimestre(){
  if(!DATA.subjects.length){
    if(confirm('Todavía no hay materias con nota.\n\n¿Las escribes ahora?')) openDefinitivasModal();
    return;
  }
  const materias = DATA.subjects.map(s=>({ name:s.name, nota:estadoMateria(s).nota }));
  const sinNota = materias.filter(m=>m.nota===null).length;
  const aviso = sinNota ? `\n\n${sinNota} materia${sinNota>1?'s':''} sin nota quedarán sin contar.` : '';
  if(!confirm(`¿Cerrar ${DATA.period||'este bimestre'} y guardar sus notas?${aviso}\n\nLas materias salen del tablero y sus notas pasan al promedio de la carrera.`)) return;
  uniCfg().historial.push({ periodo: DATA.period || ('Bimestre ' + (uniCfg().historial.length+1)), materias: materias.filter(m=>m.nota!==null), cerrado: todayStr() });
  DATA.subjects = [];
  DATA.academicTasks = DATA.academicTasks.filter(t=>!t.done);
  saveData(); renderAll();
}
