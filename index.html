/* ---- Trabajo ---- */
function clientOwed(c){
  const sessions = DATA.workSessions.filter(s=>s.clientId===c.id);
  if(c.payType==='hora'){ const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0); return {qty:h, unit:'h', amount:h*Number(c.rate||0)}; }
  if(c.payType==='salario_min'){
    const hourly = Number(c.baseSalario||1750000)/240;
    let total=0, h=0;
    sessions.forEach(s=>{
      const horas=Number(s.horas||0); h+=horas;
      let mult=1;
      if(s.domingo) mult += Number(c.recargoDominical||75)/100;
      if(s.noche) mult += Number(c.recargoNocturno||35)/100;
      total += horas*hourly*mult;
    });
    return {qty:h, unit:'h', amount:total};
  }
  if(c.payType==='dia'){ const d = sessions.reduce((a,s)=>a+Number(s.dias||0),0); return {qty:d, unit:'días', amount:d*Number(c.rate||0)}; }
  const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0);
  return {qty:h, unit:'h', amount:Number(c.rate||0)};
}
const PAYTYPE_LABEL = {hora:'Por hora', salario_min:'Salario mínimo por horas', dia:'Por día', proyecto:'Por proyecto', fijo:'Fijo'};
function renderTrabajo(){
  const box = document.getElementById('sub-trabajo');
  const clients = DATA.workClients;
  box.innerHTML = (clients.length ? clients.map(c=>{
    const o = clientOwed(c);
    const sessions = DATA.workSessions.filter(s=>s.clientId===c.id);
    let rateInfo = c.payType==='salario_min' ? `Base ${money(c.baseSalario||1750000)} + aux ${money(c.auxTransporte||250000)} · dom/fest +${c.recargoDominical||75}% · nocturno +${c.recargoNocturno||35}%` : c.payType==='hora' ? money(c.rate)+' /hora' : c.payType==='dia' ? money(c.rate)+' /día' : PAYTYPE_LABEL[c.payType]+' — '+money(c.rate);
    return `<div class="client-card" data-id="${c.id}">
      <div class="head"><div><div class="name">${esc(c.name)}</div><div class="rate">${esc(rateInfo)}</div></div><button class="small-btn" data-action="logSession" data-id="${c.id}">+ Registrar</button></div>
      <div class="stats">
        <div class="stat"><b>${o.qty}${o.unit}</b><span>${o.unit==='h'?'trabajadas':'trabajados'}</span></div>
        <div class="stat"><b>${money(o.amount)}</b><span>generado</span></div>
        <div class="stat"><b>${sessions.length}</b><span>registros</span></div>
      </div>
      <button class="small-btn" data-action="delClient" data-id="${c.id}" style="margin-top:10px; color:var(--urgent);">Eliminar cliente</button>
    </div>`;
  }).join('') : '<div class="empty-card">Aún no registras clientes o empresas.</div>') +
  `<button class="btn btn-primary" style="width:100%; margin-top:6px;" id="addClientBtn">+ Agregar cliente/empresa</button>`;
  document.getElementById('addClientBtn').onclick = openClientModal;
  box.querySelectorAll('[data-action="logSession"]').forEach(b=>{ b.onclick=()=>openSessionModal(b.dataset.id); });
  box.querySelectorAll('[data-action="delClient"]').forEach(b=>{ b.onclick=()=>{ DATA.workClients = DATA.workClients.filter(x=>x.id!==b.dataset.id); DATA.workSessions = DATA.workSessions.filter(x=>x.clientId!==b.dataset.id); saveData(); renderTrabajo(); }; });
}

const PERSONAL_TYPES = ['Cita médica','Trámite','Salida','Hábito / tiempo libre','Otro'];

  const isEdit = !!existing;

  openSheet(`<h3>${isEdit?'Editar':'Agregar'} personal</h3>

    </div>

      <div class="field"><label>Franja: fin</label><input type="time" id="f_pend" value="${esc(it.end)}"></div>
    </div>
    <div class="field"><label>¿Ya pasó? Horas dedicadas (opcional)</label><input type="number" id="f_photas" step="0.25" value="${esc(it.horas)}" placeholder="Ej: 5"></div>
    <div class="helptext">Si pones horas, se registra como algo que ya hiciste y cuenta en tu resumen de tiempo (pestaña Yo).</div>
    <div class="sheet-actions">
      ${isEdit ? '<button class="btn btn-danger" id="delPersonalModal">Eliminar</button>' : ''}
      <button class="btn btn-primary" id="savePersonal">Guardar</button>
    </div>`);
  document.getElementById('savePersonal').onclick = ()=>{
    const title = document.getElementById('f_ptitle').value.trim();
    if(!title){ alert('Escribe qué es'); return; }
    const horas = document.getElementById('f_photas').value;
    const date = document.getElementById('f_pdate2').value;
    const start = document.getElementById('f_pstart').value;
    const end = document.getElementById('f_pend').value;
    const isLog = !!horas;
    const type = document.getElementById('f_ptype2').value;

    const obj = isEdit ? existing : { id:uid() };
    Object.assign(obj, { title, type, date, start, end, horas: horas||null });
    if(!isEdit || isLog) obj.status = isLog ? 'hecho' : (obj.status || 'pendiente');
    if(!isEdit) DATA.personalItems.push(obj);

    /* El evento del calendario que cuelga de este ítem tiene que seguirlo. */
    let ev = findLinkedEvent('personalItem', obj.id);
    if(!ev){ ev = addLinkedEvent('personal', title, date, start, end, 'personalItem', obj.id); }
    else if(!date){ removeLinkedEvent('personalItem', obj.id); ev = null; }
    else { Object.assign(ev, { title, date, start, end }); }
    if(ev){
      ev.status = obj.status==='hecho' ? 'hecho' : 'pendiente';
      ev.actualMin = isLog ? Math.round(Number(horas)*60) : null;
    }
    saveData(); closeSheet(); renderAll(); renderPersonalGestion();
  };
  if(isEdit){
    document.getElementById('delPersonalModal').onclick = ()=>{
      DATA.personalItems = DATA.personalItems.filter(x=>x.id!==existing.id);
      removeLinkedEvent('personalItem', existing.id);
      saveData(); closeSheet(); renderAll(); renderPersonalGestion();
    };
  }
}

/* ============================================================
   RENDER: YO
============================================================ */
function renderYo(){
  const box = document.getElementById('cycleBox');
  const starts = [...DATA.cycle.starts].sort();
  if(!starts.length){
    box.innerHTML = `<div class="empty-card">Aún no registras tu ciclo. <br><button class="btn btn-primary" style="margin-top:10px;" id="setupCycleBtn">Configurar ciclo</button></div>`;
    document.getElementById('setupCycleBtn').onclick = openCycleSetup;
  } else {
    const last = starts[starts.length-1]; const avg = computeAvgCycle();
    const nextStart = fmtDate(addDays(parseDate(last), avg));
    const diff = daysBetween(todayStr(), nextStart);
    const inPeriodNow = daysBetween(last, todayStr()) < (DATA.cycle.periodLen||5) && daysBetween(last, todayStr())>=0;
    box.innerHTML = `<div class="cycle-hero">
        <div class="big">${inPeriodNow ? 'En curso' : (diff>=0 ? 'En ' + diff + ' días' : 'Atrasado ' + Math.abs(diff) + ' días')}</div>
        <div class="sub">${inPeriodNow ? 'Tu período está activo' : 'Próximo período estimado: ' + niceDate(nextStart)}</div>
        <div class="ring-row">
          <div class="ring-box"><b>${avg}</b><span>días de ciclo</span></div>
          <div class="ring-box"><b>${esc(DATA.cycle.periodLen)}</b><span>días de duración</span></div>
          <div class="ring-box"><b>${starts.length}</b><span>registrados</span></div>
        </div>
      </div>
      <div style="display:flex; gap:10px;"><button class="btn btn-primary" id="logPeriodBtn">Registrar inicio hoy</button><button class="btn btn-ghost" id="editCycleBtn">Ajustar</button></div>`;
    document.getElementById('logPeriodBtn').onclick = ()=>{ if(!DATA.cycle.starts.includes(todayStr())){ DATA.cycle.starts.push(todayStr()); saveData(); renderAll(); } };
    document.getElementById('editCycleBtn').onclick = openCycleSetup;
  }
  const now = new Date();
  const weekStart = addDays(now, -now.getDay());
  const weekDates = [...Array(7)].map((_,i)=>fmtDate(addDays(weekStart,i)));
  const weekEvents = DATA.events.filter(e=>weekDates.includes(e.date) && e.status==='hecho' && e.actualMin);
  const byCat = {}; weekEvents.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0) + Number(e.actualMin); });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxMin = Math.max(1, ...catEntries.map(c=>c[1]));
  const tsBox = document.getElementById('timeSummary');
  if(catEntries.length){
    tsBox.innerHTML = `<div class="bar-chart">${catEntries.map(([cat,min])=>`<div class="bar-col"><div class="bar" style="height:${Math.max(6,(min/maxMin)*95)}px; background:${CATS[cat].color}"></div><div class="lbl">${CATS[cat].emoji}</div></div>`).join('')}</div>
    <div style="margin-top:12px; font-size:13px; color:var(--text-muted);">Total registrado: <b style="color:var(--text)">${Math.round(weekEvents.reduce((a,e)=>a+Number(e.actualMin),0)/60*10)/10}h</b> esta semana</div>`;
  } else {
    tsBox.innerHTML = `<div style="font-size:13px; color:var(--text-dim); text-align:center; padding:10px 0;">Marca cosas como "hechas" y registra minutos (o usa "Registrar tiempo" en Personal) para ver aquí en qué se te va el tiempo.</div>`;
  }
  const insightsBox = document.getElementById('insights');
  let insights = [];
  if(catEntries.length){ const top = CATS[catEntries[0][0]]; insights.push(`<div class="insight"><div class="ico">${top.emoji}</div><div class="txt">Esta semana, la mayoría de tu tiempo se fue en <b>${top.label}</b>.</div></div>`); }
  const overEst = DATA.events.filter(e=>e.status==='hecho' && e.estMin && e.actualMin && e.actualMin > e.estMin*1.3);
  if(overEst.length){ insights.push(`<div class="insight"><div class="ico">⏱</div><div class="txt">Sueles subestimar tareas de <b>${CATS[overEst[overEst.length-1].cat].label}</b> — tomaron más tiempo del planeado.</div></div>`); }
  const overdueCount = DATA.events.filter(e=>e.status!=='hecho' && e.date<todayStr()).length;
  if(overdueCount>0){ insights.push(`<div class="insight"><div class="ico">📌</div><div class="txt">Tienes <b>${overdueCount}</b> pendiente${overdueCount>1?'s':''} atrasado${overdueCount>1?'s':''}. Revísalos en Tareas.</div></div>`); }
  insightsBox.innerHTML = insights.length ? insights.join('') : '<div class="empty-card">Aún no hay suficientes datos para mostrar patrones.</div>';
}

    <div class="field-row"><div class="field"><label>Duración del ciclo (días)</label><input type="number" id="f_cyclen" value="${esc(DATA.cycle.avgLen||28)}"></div><div class="field"><label>Duración del período (días)</label><input type="number" id="f_perlen" value="${esc(DATA.cycle.periodLen||5)}"></div></div>

/* ============================================================
   TURNOS Y CHOQUES
   La funcion central del proyecto (D25): Bitacora te avisa y te muestra
   que tendrias que mover, pero nunca te lo impide (D16).
============================================================ */

/* Que tan de verdad te bloquea un bloque. No todo lo que esta en tu dia te
   impide trabajar: la U la puedes ver grabada y a Joel lo recogen si no estas. */
const FLEX = {
  firme:    { label:'No se mueve',        corto:'firme',    nota:'Esto sí te bloquea.' },
  saltable: { label:'La puedo ver después', corto:'saltable', nota:'Se puede ver grabado o recuperar.' },
  cubrible: { label:'Alguien lo cubre',   corto:'cubrible', nota:'Si no estás, alguien más lo hace.' }
};
function flexDe(b){ return (b && FLEX[b.flex]) ? b.flex : 'firme'; }

/* Los tres lugares, con sus reglas distintas (D23). */
const LUGARES = {
  infinity:{ nombre:'Infinity',       ini:'I', sub:'Horario variable · paga lunes',   entra:'', sale:'',      traslado:60 },
  asignar:{  nombre:'Asignar',        ini:'A', sub:'8 h · hotel variable · por corte', entra:'', sale:'',     traslado:90 },
  movistar:{ nombre:'Movistar Arena', ini:'M', sub:'15:00 — 00:00 · horario parejo',   entra:'15:00', sale:'00:00', traslado:120 }
};

/* Los cuatro cortes de nomina de Asignar, de la cartelera que mando Sharon.
   Con el hotel del turno, Bitacora ya sabe que dia le pagan. */
const CORTES_ASIGNAR = [
  { grupo:'01', cortes:[{desde:26, hasta:10, pago:15}, {desde:11, hasta:25, pago:30}],
    hoteles:['Corferias','Estelares','Colsubsidio','JW Marriot','Dann 93'] },
  { grupo:'02', cortes:[{desde:1, hasta:15, pago:20}, {desde:16, hasta:30, pago:5}],
    hoteles:['Grupo GHL','Habitel','Movich','Dann 19','Dann 103'] },
  { grupo:'03', cortes:[{desde:1, hasta:15, pago:15}, {desde:16, hasta:30, pago:30}],
    hoteles:['Metrotel','Grupo NH','Temporales'] },
  { grupo:'04', cortes:[{desde:23, hasta:10, pago:15}, {desde:11, hasta:22, pago:30}],
    hoteles:['Hyatt','W Marriot'] }
];
const HOTELES_ASIGNAR = CORTES_ASIGNAR.flatMap(g=>g.hoteles).sort((a,b)=>a.localeCompare(b,'es'));

function grupoDeHotel(hotel){ return CORTES_ASIGNAR.find(g=>g.hoteles.includes(hotel)) || null; }

function ultimoDiaDelMes(anio,mes){ return new Date(anio, mes+1, 0).getDate(); }

/* De la fecha del turno y el hotel sale el dia de pago. Los cortes que
   arrancan a fin de mes (26 al 10, 23 al 10) se pagan el mes siguiente. */
function pagoDeTurno(fechaStr, hotel){
  const g = grupoDeHotel(hotel); if(!g) return null;
  const d = parseDate(fechaStr), dia = d.getDate();
  for(const c of g.cortes){
    const cruzaMes = c.desde > c.hasta;
    const dentro = cruzaMes ? (dia>=c.desde || dia<=c.hasta) : (dia>=c.desde && dia<=c.hasta);
    if(!dentro) continue;
    let anio=d.getFullYear(), mes=d.getMonth();
    // si el corte cruza el mes y estamos en la punta de arriba, el pago cae el mes que viene
    if(cruzaMes && dia>=c.desde) mes++;
    // el corte 16 al 30 del grupo 02 se paga el 05 del mes siguiente
    else if(!cruzaMes && c.pago < c.desde) mes++;
    const f = new Date(anio, mes, Math.min(c.pago, ultimoDiaDelMes(anio,mes)));
    return { fecha: fmtDate(f), corte: c.desde+' al '+c.hasta, grupo: g.grupo };
  }
  return null;
}

function minutosDe(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60 + (m||0);
}
/* Un turno que sale a medianoche termina despues de entrar, no antes. */
function finEnMinutos(entra, sale){
  const a = minutosDe(entra), b = minutosDe(sale);
  if(a===null || b===null) return null;
  return b <= a ? b + 1440 : b;
}

/* Todo lo que ya ocupa ese dia: eventos con hora, rutinas del dia y otros turnos. */
function bloquesDelDia(fecha, exceptoTurnoId){
  const d = parseDate(fecha), dow = d.getDay();
  const out = [];
  DATA.events.forEach(e=>{
    if(e.date!==fecha || !e.start || e.status==='hecho') return;
    if(e.linkedType==='turno' && e.linkedId===exceptoTurnoId) return;
    if(e.cat==='nexxa' && e.noVoy) return;        // si no vas, no te ocupa el tiempo (D129)
    out.push({ titulo:e.title, desde:minutosDe(e.start), hasta:finEnMinutos(e.start, e.end||e.start), fuente:'evento', flex:flexDe(e), ref:e });
  });
  (DATA.routines||[]).forEach(r=>{
    if(!r.days || !r.days.includes(dow) || !r.start) return;
    out.push({ titulo:r.title, desde:minutosDe(r.start), hasta:finEnMinutos(r.start, r.end||r.start), fuente:'rutina', flex:flexDe(r), ref:r });
  });
  return out.filter(b=>b.desde!==null && b.hasta!==null);
}

/* El corazon: choque directo, o choque porque el traslado no te da (D70, D95). */
function detectarChoques(turno){
  const desde = minutosDe(turno.entra), hasta = finEnMinutos(turno.entra, turno.sale);
  if(desde===null || hasta===null) return [];
  const traslado = Number(turno.trasladoMin || LUGARES[turno.lugar]?.traslado || 0);
  const choques = [];
  bloquesDelDia(turno.fecha, turno.id).forEach(b=>{
    const grado = flexDe(b) === 'firme' ? 'duro' : 'blando';
    if(b.desde < hasta && desde < b.hasta){
      choques.push({ tipo:'directo', grado, bloque:b });
    } else if(b.hasta <= desde && desde - b.hasta < traslado){
      choques.push({ tipo:'traslado', grado, bloque:b, faltan: traslado - (desde - b.hasta) });
    } else if(hasta <= b.desde && b.desde - hasta < traslado){
      choques.push({ tipo:'traslado-despues', grado, bloque:b, faltan: traslado - (b.desde - hasta) });
    }
  });
  return choques;
}
function choquesDuros(t){ return detectarChoques(t).filter(c=>c.grado==='duro'); }

function hhmm(min){
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function duracionLarga(min){
  const h = Math.floor(min/60), m = min%60;
  return h ? (h + ' h' + (m ? ' ' + m : '')) : (m + ' min');
}
/* "1 h libre" y no "1 h libres". */
function libres(min){
  return duracionLarga(min) + (min === 60 ? ' libre' : ' libres');
}

/* La pantalla de choque. Muestra que se cruza y que tendria que mover,
   y deja aceptarlo igual: Bitacora no decide por ella (D16). */
function mostrarChoque(t, choques){
  const l = LUGARES[t.lugar];
  const traslado = Number(t.trasladoMin || l.traslado || 0);
  const desde = minutosDe(t.entra), hasta = finEnMinutos(t.entra, t.sale);
  const duros = choques.filter(c=>c.grado==='duro');
  const blandos = choques.filter(c=>c.grado!=='duro');

  const frase = c => {
    if(c.tipo==='directo') return `Se cruza con <b>${esc(c.bloque.titulo)}</b>, de ${hhmm(c.bloque.desde)} a ${hhmm(c.bloque.hasta)}.`;
    if(c.tipo==='traslado') return `Con ${duracionLarga(traslado)} de traslado no alcanzas: <b>${esc(c.bloque.titulo)}</b> termina ${hhmm(c.bloque.hasta)} y te faltan ${duracionLarga(c.faltan)}.`;
    return `Al salir no alcanzas a llegar a <b>${esc(c.bloque.titulo)}</b>, que empieza ${hhmm(c.bloque.desde)}: te faltan ${duracionLarga(c.faltan)}.`;
  };

  const opciones = duros.map(c=>({
    que: 'Soltar ' + c.bloque.titulo,
    por: hhmm(c.bloque.desde) + '–' + hhmm(c.bloque.hasta) + (c.bloque.fuente==='rutina' ? ' · se repite cada semana' : '')
  }));
  const masTarde = Math.max(...duros.map(c=> c.bloque.hasta + traslado));
  if(isFinite(masTarde) && masTarde > desde && masTarde < hasta){
    const dia = masTarde >= 1440 ? ' del día siguiente' : '';
    opciones.push({ que:'Pedir entrar más tarde', por: l.nombre + ' · llegarías ' + hhmm(masTarde) + dia });
  }

  openSheet(`
    <h3>${esc(turnoTitulo(t))}</h3>
    <div class="helptext" style="margin:-4px 0 12px;">${niceDate(t.fecha)} · ${t.entra} — ${t.sale}${t.confirmado?'':' <span class="tentativo">sin confirmar</span>'}</div>
    <div class="choque-head">⚠ Se cruza con ${duros.length===1?'una cosa':duros.length+' cosas'}</div>
    <div class="choque-box">${duros.map(c=>`<p>${frase(c)}</p>`).join('')}</div>
    ${blandos.length ? `
      <div class="choque-head suave" style="margin-top:16px;">Además, pero se acomoda</div>
      <div class="choque-box suave">${blandos.map(c=>`<p>${frase(c)} <span class="porque-suave">${esc(FLEX[flexDe(c.bloque)].nota)}</span></p>`).join('')}</div>` : ''}
    <div class="section-title" style="margin-top:20px;">Qué tendrías que mover o soltar</div>
    ${opciones.map(o=>`<div class="opcion"><div class="qué">${esc(o.que)}</div><div class="porqué">${esc(o.por)}</div></div>`).join('')}
    <p class="nota-suave">Bitácora no decide por ti. Puedes aceptarlo igual.</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="ch_volver">Volver</button>
      <button class="btn btn-primary" id="ch_igual">Aceptar igual</button>
    </div>
  `);
  document.getElementById('ch_volver').onclick = ()=> pintarTurnoModal();
  document.getElementById('ch_igual').onclick = ()=>{ guardarTurno(t); closeSheet(); };
}

    caja.innerHTML = '<div class="empty-card">Sin turnos cargados. Tócale a + Turno apenas te avisen.</div>';

  caja.querySelectorAll('.turno-card').forEach(c=>{

}

function renderChoquesSemana(){
  const caja = document.getElementById('choquesSemana');

  const hoy = new Date();
  const cruces = [];
  for(let i=0;i<7;i++){
    const f = fmtDate(addDays(hoy,i));
    DATA.turnos.filter(t=>t.fecha===f).forEach(t=>{
      if(choquesDuros(t).length) cruces.push({ fecha:f, turno:t });
    });
  }
  if(!cruces.length){ caja.innerHTML=''; return; }
  caja.innerHTML = `
    <div class="choque-head" style="margin-top:4px;">⚠ ${cruces.length===1?'1 cruce':cruces.length+' cruces'} esta semana</div>
    <div class="choque-box">${cruces.map(c=>`<p>${esc(niceDate(c.fecha))}: <b>${esc(turnoTitulo(c.turno))}</b> se cruza con algo que ya tenías.</p>`).join('')}</div>`;
}

/* ============================================================
   AVISOS
   Solo existen tres, y se explican en la pantalla para que sepa exactamente
   que va a recibir antes de decir que si (D45, D46, D49, D07).
============================================================ */
const PUSH_URL = '/api/push';

function soportaAvisos(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function b64aBytes(base64){
  const relleno = '='.repeat((4 - base64.length % 4) % 4);
  const limpio = (base64 + relleno).replace(/-/g, '+').replace(/_/g, '/');
  const crudo = atob(limpio);
  return Uint8Array.from([...crudo].map(c => c.charCodeAt(0)));
}
async function pushRequest(method, body){
  const headers = { 'Content-Type':'application/json' };
  const pass = lsGet(PASS_KEY);
  if(pass) headers['x-app-password'] = pass;
  const res = await fetch(PUSH_URL, { method, headers, cache:'no-store', body: body ? JSON.stringify(body) : undefined });
  if(!res.ok){
    let detalle=''; try{ detalle = (await res.json()).error || ''; }catch(e){}
    throw new Error(detalle || ('HTTP '+res.status));
  }
  return res.json();
}
async function suscripcionActual(){
  if(!soportaAvisos()) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  return reg ? await reg.pushManager.getSubscription() : null;
}

async function renderAvisos(){
  const caja = document.getElementById('avisosBox');
  if(!caja) return;

  const explicacion = `
    <div class="helptext" style="margin:0 0 10px;">Solo existen tres, y llegan el día antes:</div>
    <ol class="lista-avisos">
      <li>Una entrega de la universidad que se acerca</li>
      <li>Un pago o una cuota por vencer</li>
      <li>Un hueco libre con un pendiente que cabe</li>
    </ol>
    <div class="helptext">Nunca de recoger a Joel ni de entrar o salir de un turno. Nada entre las 11 de la noche y las 6 de la mañana, ni en noches de turno. Máximo 8 en un día.</div>`;

  if(!soportaAvisos()){
    caja.innerHTML = `<div class="card">${explicacion}
      <div class="helptext" style="color:var(--ambar); font-weight:600; margin-top:10px;">Este navegador no los soporta. En el celular, instala Bitácora desde el menú de Chrome y ábrela desde el ícono.</div></div>`;
    return;
  }

  const permiso = Notification.permission;
  const sub = await suscripcionActual();
  let estado, accion;

  if(permiso === 'denied'){
    estado = `<div class="helptext" style="color:var(--urgent); font-weight:600;">Los bloqueaste. Para volver a activarlos toca el candado de la barra de direcciones y permite las notificaciones.</div>`;
    accion = '';
  } else if(sub){
    estado = `<div class="helptext" style="color:var(--done); font-weight:600;">✓ Activados en este dispositivo.</div>`;
    accion = `<button class="small-btn" id="avisosProbar">Mandarme uno de prueba</button>
              <button class="small-btn" id="avisosQuitar" style="color:var(--urgent);">Desactivar</button>`;
  } else {
    estado = `<div class="helptext">Apagados. No te llega nada.</div>`;
    accion = `<button class="btn btn-primary" style="width:100%; margin-top:4px;" id="avisosPrender">Activar los avisos</button>`;
  }

  caja.innerHTML = `<div class="card">${explicacion}<div style="margin-top:12px;">${estado}</div>
    <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">${accion}</div></div>`;

  const prender = document.getElementById('avisosPrender');
  if(prender) prender.onclick = activarAvisos;
  const quitar = document.getElementById('avisosQuitar');
  if(quitar) quitar.onclick = desactivarAvisos;
  const probar = document.getElementById('avisosProbar');
  if(probar) probar.onclick = async ()=>{
    const reg = await navigator.serviceWorker.getRegistration();
    reg.showNotification('Bitácora', {
      body: 'Así se van a ver. Este es el único que te mando yo.',
      icon: '/icons/icono-192.png', badge: '/icons/icono-192.png', tag: 'bitacora-prueba'
    });
  };
}

async function activarAvisos(){
  const btn = document.getElementById('avisosPrender');
  if(btn){ btn.disabled = true; btn.textContent = 'Un momento…'; }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){ renderAvisos(); return; }

    const { publicKey } = await pushRequest('GET');
    if(!publicKey) throw new Error('Al proyecto le faltan las llaves VAPID en Vercel.');

    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64aBytes(publicKey)
    });
    await pushRequest('POST', { subscription: sub.toJSON() });
    renderAvisos();
  }catch(err){
    alert('No se pudieron activar: ' + err.message);
    renderAvisos();
  }
}

async function desactivarAvisos(){
  try{
    const sub = await suscripcionActual();
    if(sub){
      await pushRequest('POST', { subscription: sub.toJSON(), quitar: true }).catch(()=>{});
      await sub.unsubscribe();
    }
  }catch(err){ /* si falla el servidor, igual se quita del navegador */ }
  renderAvisos();
}

/* Al tocar un aviso, la app abre donde toca. */
function engancharAvisos(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', (ev)=>{
      if(ev.data?.tipo === 'ir' && views.includes(ev.data.a)) showView(ev.data.a);
    });
  }
  try{
    const ir = new URLSearchParams(location.search).get('ir');
    if(ir && views.includes(ir)){
      showView(ir);
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
}

/* ============================================================
   PLATA
   Orden de la pantalla, tal cual lo pediste (D112): cuanto tienes ahora,
   cuanto vas a recibir y cuando, y como vas contra el presupuesto.
============================================================ */

/* Las ocho que elegiste, mas Otros para que ningun gasto te deje atascada (D98). */
const CATEGORIAS_GASTO = ['Transporte','Comida fuera','Casa y servicios','Salud','Ropa y cuidado personal','Salidas y ocio','Datos y celular','Herramientas y cursos','Otros'];

function tasaUSD(){ return Number(DATA.plata.tasaUSD) || null; }
function enPesos(monto, moneda){
  if(moneda!=='USD') return Number(monto)||0;
  const t = tasaUSD();
  return t ? Math.round(Number(monto)*t) : null;
}
function montoConMoneda(monto, moneda, montoCOP){
  if(moneda!=='USD') return money(monto);
  const etiqueta = 'US$' + Number(monto).toLocaleString('es-CO');
  if(Number(montoCOP)>0) return etiqueta + ' · ' + money(montoCOP);
  const pesos = enPesos(monto, moneda);
  return etiqueta + (pesos!==null ? ' · ' + money(pesos) : ' · falta la tasa');
}
/* Si escribio lo que le descontaron, de ahi sale la tasa real de ese cobro. */
function tasaImplicita(x){
  if(x.moneda!=='USD' || !Number(x.montoCOP) || !Number(x.monto)) return null;
  return Math.round(Number(x.montoCOP) / Number(x.monto));
}
function haceCuanto(fecha){
  if(!fecha) return 'nunca';
  const d = daysBetween(fecha, todayStr());
  if(d<=0) return 'hoy';
  if(d===1) return 'ayer';
  return 'hace ' + d + ' días';
}

/* Cuando te pagan un turno. Asignar sale del corte del hotel; Infinity
   paga el lunes siguiente; Movistar todavia no esta definido (D23, D37). */
function fechaDePagoTurno(t){
  if(t.lugar==='asignar' && t.hotel){ const p = pagoDeTurno(t.fecha, t.hotel); return p ? p.fecha : null; }
  if(t.lugar==='infinity'){
    const d = parseDate(t.fecha);
    const faltan = (8 - d.getDay()) % 7 || 7;      // el lunes que viene
    return fmtDate(addDays(d, faltan));
  }
  return null;
}
function porRecibir(){
  const hoy = todayStr();
  return DATA.turnos
    .filter(t=>Number(t.estimado)>0 && !t.cobrado)
    .map(t=>({ turno:t, fecha:fechaDePagoTurno(t), monto:Number(t.estimado) }))
    .filter(x=> !x.fecha || x.fecha>=hoy)
    .sort((a,b)=> (a.fecha||'9999').localeCompare(b.fecha||'9999'));
}

/* Un cobro que vuelve cada mes: el proximo que viene. Si ya lo pago este
   mes, el proximo es el del mes que sigue. */
function pagadoEsteMes(sus, mes){
  return (sus.pagados||[]).includes(mes || todayStr().slice(0,7));
}
function proximoCobro(sus){
  const hoy = new Date(), dia = Number(sus.dia);
  if(!dia) return null;
  const arma = (anio, mes) => new Date(anio, mes, Math.min(dia, ultimoDiaDelMes(anio, mes)));
  let f = arma(hoy.getFullYear(), hoy.getMonth());
  if(fmtDate(f) < todayStr() || pagadoEsteMes(sus, fmtDate(f).slice(0,7))){
    f = arma(hoy.getFullYear(), hoy.getMonth()+1);
  }
  return fmtDate(f);
}

/* Lo de Jerson no es un numero quieto: si a veces le prestas tu, se descuenta. */
function saldoDeuda(d){
  const movs = (d.movs||[]).reduce((a,m)=> a + (m.sentido==='abono' ? -Number(m.monto) : Number(m.monto)), 0);
  return Number(d.monto) + movs;
}

function gastosDelMes(){
  const mes = todayStr().slice(0,7);
  const out = {};
  DATA.events.filter(e=>e.cat==='finanzas' && e.type==='gasto' && e.date.startsWith(mes)).forEach(e=>{
    const c = e.categoria || 'Otros';
    out[c] = (out[c]||0) + Number(e.amount||0);
  });
  return out;
}

      ${e.type==='gasto' ? `<div class="field"><label>¿De qué categoría?</label>

        <div class="helptext">De esto sale el presupuesto.</div></div>` : ''}
      ${esPrestamo ? `<div class="field"><label>¿Con quién?</label><input type="text" id="m_persona" value="${esc(e.persona)}" placeholder="Nombre"></div>` : ''}
      <div class="field"><label>${e.type==='pago' ? '¿Qué hay que pagar?' : 'En qué / de dónde'}</label>

      <div class="field"><label>${e.type==='pago' ? 'Se vence el' : 'Cuándo'}</label><input type="date" id="m_fecha" value="${esc(e.date)}"></div>
      <div class="field"><label>Nota (opcional)</label><input type="text" id="m_nota" value="${esc(e.notes)}"></div>

    function leer(){
      const g = id => document.getElementById(id);

      e.amount = g('m_monto').value;
      e.moneda = g('m_moneda').value;

function renderPlata(){
  const box = document.getElementById('sub-finanzas');
  const P = DATA.plata;
  let html = '';

  /* 1 · cuanto tienes ahora — lo declaras tu y nunca miente en silencio (D99, D122) */
  html += `<div class="card saldo-card" id="saldoCard">
    <div class="lbl">Tengo ahora <span class="saldo-edad">${P.saldoFecha ? esc(haceCuanto(P.saldoFecha)) : 'sin declarar'}</span></div>
    <div class="saldo-num mono">${P.saldo===null||P.saldo==='' ? '—' : money(P.saldo)}</div>
    <div class="helptext" style="margin:4px 0 0;">${P.saldoFecha ? 'Tú lo declaraste el ' + esc(niceDate(P.saldoFecha)) + '. Tócalo para ajustarlo.' : 'Tócalo para decir cuánto tienes. Bitácora no lo calcula sola.'}</div>
  </div>`;

  /* 2 · cuanto vas a recibir y cuando (D112, D36) */
  const recibir = porRecibir();
  const totalRecibir = recibir.reduce((a,x)=>a+x.monto,0);
  html += `<div class="section-title"><span>Por recibir</span><span class="mono" style="color:var(--c-dinero); font-weight:700;">${money(totalRecibir)}</span></div>`;
  html += recibir.length ? recibir.map(x=>`
    <div class="card" style="border-left:3px solid var(--c-trabajo);">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline;">
        <div style="font-weight:600;">${esc(turnoTitulo(x.turno))} <span class="tentativo">est.</span></div>
        <div class="mono" style="font-weight:700;">${money(x.monto)}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${x.fecha ? 'Te pagan el ' + esc(niceDate(x.fecha)) : 'Sin fecha de pago definida'} · turno del ${esc(niceDateShort(x.turno.fecha))}</div>
      <button class="small-btn" data-cobrar="${x.turno.id}" style="margin-top:9px;">Ya me pagaron</button>
    </div>`).join('')
    : '<div class="empty-card" style="margin-bottom:8px;">Nada por recibir. Ponle a cada turno lo que calculas que te pagan y aparece acá.</div>';
  html += `<div class="helptext">Son estimados tuyos. Cuando te paguen los corriges y Bitácora ajusta.</div>`;

  /* 3 · como vas contra el presupuesto — topes en pesos, y no te notifica (D80, D88) */
  const gastado = gastosDelMes();
  const conTope = CATEGORIAS_GASTO.filter(c=>Number(P.topes[c])>0);
  html += `<div class="section-title"><span>Presupuesto</span><button class="small-btn" id="topesBtn">Topes</button></div>`;
  if(conTope.length){
    html += conTope.map(c=>{
      const tope = Number(P.topes[c]), usado = gastado[c]||0;
      const pct = Math.min(100, Math.round(usado/tope*100));
      const color = pct>=100 ? 'var(--urgent)' : pct>=80 ? 'var(--ambar)' : 'var(--c-dinero)';
      return `<div class="card">
        <div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline;">
          <div style="font-weight:600;">${esc(c)}</div>
          <div class="mono" style="font-size:13px;"><b style="color:${color}">${money(usado)}</b> <span style="color:var(--text-dim);">/ ${money(tope)}</span></div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${color};"></div></div>
      </div>`;
    }).join('');
    html += `<div class="helptext">Los topes se revisan cada vez que te pagan, no cada 30 días. Esto no te notifica: lo ves cuando entras.</div>`;
  } else {
    html += '<div class="empty-card" style="margin-bottom:8px;">Sin topes puestos. Tócale a Topes y ponles un máximo en pesos a las categorías que quieras vigilar.</div>';
  }

  /* 4 · lo que vuelve cada mes */
  html += `<div class="section-title"><span>Cada mes</span><button class="small-btn" id="addSusBtn">+ Cobro</button></div>`;
  html += DATA.suscripciones.length ? DATA.suscripciones.map(x=>{
    const prox = proximoCobro(x);
    const faltan = prox ? daysBetween(todayStr(), prox) : null;
    const pronto = faltan!==null && faltan<=3;
    return `<div class="card sus-card" data-id="${x.id}" data-sel-tipo="suscripcion" data-sel-id="${x.id}" style="cursor:pointer; border-left:3px solid var(--c-dinero);">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline;">
        <div style="font-weight:600;">${esc(x.nombre)}</div>
        <div class="mono" style="font-weight:700;">${montoConMoneda(x.monto, x.moneda, x.montoCOP)}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0; ${pronto?'color:var(--ambar); font-weight:600;':''}">
        ${x.dia ? 'El ' + x.dia + ' de cada mes' + (prox ? ' · el próximo, ' + esc(niceDate(prox)) : '') : '⚠ falta el día del mes'}${x.nota ? ' · ' + esc(x.nota) : ''}
      </div>
      ${tasaImplicita(x) ? `<div class="helptext" style="margin:4px 0 0;">Te lo descontaron a ${money(tasaImplicita(x))} el dólar${tasaImplicita(x)!==tasaUSD() ? ` · <button class="small-btn" data-usar-tasa="${x.id}">usar esta tasa</button>` : ''}</div>` : ''}
      ${x.dia ? (pagadoEsteMes(x)
        ? `<div class="helptext" style="margin:6px 0 0; color:var(--done); font-weight:600;">✓ Pagado este mes · <button class="small-btn" data-despagar="${x.id}">deshacer</button></div>`
        : `<button class="small-btn" data-pagar-sus="${x.id}" style="margin-top:9px;">Ya lo pagué este mes</button>`) : ''}
    </div>`;
  }).join('') : '<div class="empty-card" style="margin-bottom:8px;">Sin cobros mensuales.</div>';

  /* 5 · deudas y prestamos, en los dos sentidos (D96, D39) */
  html += `<div class="section-title"><span>Debo y me deben</span><button class="small-btn" id="addDeudaBtn">+ Préstamo</button></div>`;
  const deudasOrden = [...DATA.deudas].sort((a,b)=> (a.saldada?1:0) - (b.saldada?1:0));
  html += deudasOrden.length ? deudasOrden.map(d=>{
    const saldo = saldoDeuda(d);
    const debo = d.sentido!=='meDeben';
    const cuando = d.fecha ? (d.fechaHasta ? niceDateShort(d.fecha) + ' al ' + niceDateShort(d.fechaHasta) : niceDate(d.fecha)) + (d.aprox ? ' (estimado)' : '') : 'Sin fecha';
    const color = d.saldada ? 'var(--done)' : debo ? 'var(--urgent)' : 'var(--c-dinero)';
    return `<div class="card deuda-card ${d.saldada?'saldada':''}" data-id="${d.id}" data-sel-tipo="deuda" data-sel-id="${d.id}" style="cursor:pointer; border-left:3px solid ${color};">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline;">
        <div style="font-weight:600;">${d.saldada?'✓ ':''}${esc(d.nombre)}</div>
        <div class="mono" style="font-weight:700; color:${color};">${d.saldada ? 'saldada' : money(saldo)}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${d.saldada ? 'Saldada el ' + esc(niceDate(d.saldadaFecha||todayStr())) : (debo?'Le debes':'Te debe') + ' · ' + esc(cuando) + (d.nota ? ' · ' + esc(d.nota) : '') + ((d.movs||[]).length ? ' · ' + d.movs.length + ' movimiento' + (d.movs.length>1?'s':'') : '')}</div>
    </div>`;
  }).join('') : '<div class="empty-card" style="margin-bottom:8px;">Sin préstamos registrados.</div>';

  /* 6 · movimientos sueltos y cuotas, lo que ya existia */
  const mes = todayStr().slice(0,7);
  const evMes = DATA.events.filter(e=>e.cat==='finanzas' && e.date.startsWith(mes));
  const ingresos = evMes.filter(e=>e.type==='ingreso').reduce((a,e)=>a+Number(e.amount||0),0);
  const gastos = evMes.filter(e=>e.type==='gasto').reduce((a,e)=>a+Number(e.amount||0),0);
  html += `<div class="section-title">Este mes</div>
    <div class="summary-row">
      <div class="summary-box"><div class="lbl">Entró</div><div class="val money" style="color:var(--done)">+${money(ingresos)}</div></div>
      <div class="summary-box"><div class="lbl">Salió</div><div class="val money" style="color:var(--urgent)">-${money(gastos)}</div></div>
    </div>
    <button class="btn btn-primary" style="width:100%; margin:2px 0 4px;" id="addMoneyBtn">+ Registrar un movimiento</button>`;

  /* los movimientos, uno por uno y tocables: antes solo se veian los totales */
  const movs = evMes.slice().sort((a,b)=>b.date.localeCompare(a.date));
  html += movs.length ? movs.map(m=>{
    const entra = m.type==='ingreso' || m.type==='prestamo_recibido';
    const pendiente = m.type==='pago' && m.status!=='hecho';
    return `<div class="card mov-card" data-id="${m.id}" data-sel-tipo="movimiento" data-sel-id="${m.id}" style="cursor:pointer; border-left:3px solid ${pendiente?'var(--ambar)':entra?'var(--c-dinero)':'var(--urgent)'};">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline;">
        <div style="font-weight:600;">${esc(m.title)}</div>
        <div class="mono" style="font-weight:700; color:${pendiente?'var(--ambar)':entra?'var(--c-dinero)':'var(--urgent)'};">${entra?'+':'−'}${money(m.amount)}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${esc(TIPOS_MOV[m.type]||'Movimiento')}${m.categoria?' · '+esc(m.categoria):''}${m.persona?' · '+esc(m.persona):''} · ${esc(niceDateShort(m.date))}${m.montoOriginal?' · US$'+m.montoOriginal:''}</div>
      ${pendiente ? `<button class="small-btn" data-pagado="${m.id}" style="margin-top:9px;">Ya lo pagué</button>` : ''}
      ${m.type==='pago' && m.status==='hecho' ? `<div class="helptext" style="margin:5px 0 0; color:var(--done); font-weight:600;">✓ Pagado</div>` : ''}
    </div>`;
  }).join('') : '<div class="empty-card" style="margin-bottom:8px;">Sin movimientos este mes.</div>';

  html += `<div class="section-title">Compras a cuotas</div>`;
  if(DATA.installments.length){
    html += DATA.installments.map(inst=>{
      const paid = inst.payments.reduce((a,p)=>a+Number(p.amount),0);
      const pct = Math.min(100, Math.round((paid/Number(inst.total))*100));
      return `<div class="card installment-card" data-id="${inst.id}">
        <div style="display:flex; justify-content:space-between; align-items:baseline;">
          <div style="font-weight:700; font-size:14.5px;">${esc(inst.name)}</div>
          <div style="font-size:12px; color:var(--text-dim);">${inst.payments.length}/${esc(inst.cuotas)} cuotas</div>
        </div>
        <div style="font-size:12.5px; color:var(--text-muted); margin-top:3px;">${money(paid)} pagado de ${money(inst.total)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="small-btn" data-action="payInstallment" data-id="${inst.id}">+ Registrar pago</button>
          <button class="small-btn" data-action="delInstallment" data-id="${inst.id}" style="color:var(--urgent);">Eliminar</button>
        </div>
      </div>`;
    }).join('');
  } else { html += '<div class="empty-card" style="margin-bottom:10px;">Sin compras a cuotas registradas.</div>'; }
  html += `<button class="btn btn-primary" style="width:100%; margin-top:6px;" id="addInstallmentBtn">+ Agregar compra a cuotas</button>`;

  /* la tasa del dolar vive abajo: la pones tu a mano y funciona sin internet (D128) */
  html += `<div class="section-title" style="margin-top:26px;">Dólar</div>
    <div class="card tasa-card" id="tasaCard" style="cursor:pointer;">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:baseline;">
        <div style="font-weight:600;">1 USD</div>
        <div class="mono" style="font-weight:700;">${tasaUSD() ? money(tasaUSD()) : 'sin poner'}</div>
      </div>
      <div class="helptext" style="margin:3px 0 0;">${DATA.plata.tasaFecha ? 'La pusiste ' + esc(haceCuanto(DATA.plata.tasaFecha)) + '. Tócala para cambiarla.' : 'Tócala para ponerla. La pones tú, así funciona sin internet.'}</div>
    </div>`;

  box.innerHTML = html;
  bindItemClicks();
  document.getElementById('saldoCard').onclick = openSaldoModal;
  document.getElementById('tasaCard').onclick = openTasaModal;
  document.getElementById('topesBtn').onclick = openTopesModal;
  document.getElementById('addSusBtn').onclick = ()=>openSuscripcionModal();
  document.getElementById('addDeudaBtn').onclick = ()=>openDeudaModal();
  document.getElementById('addMoneyBtn').onclick = ()=>openMovimientoModal();
  box.querySelectorAll('.mov-card').forEach(c=>c.onclick=()=>{
    const m = DATA.events.find(x=>x.id===c.dataset.id);
    openMovimientoModal(Object.assign(m, { moneda: m.moneda||'COP', amount: m.montoOriginal || m.amount }));
  });
  box.querySelectorAll('[data-cobrar]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    openCobroModal(DATA.turnos.find(t=>t.id===b.dataset.cobrar));
  });
  box.querySelectorAll('[data-pagar-sus]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    openPagarSuscripcion(DATA.suscripciones.find(x=>x.id===b.dataset.pagarSus));
  });
  box.querySelectorAll('[data-despagar]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const x = DATA.suscripciones.find(s=>s.id===b.dataset.despagar);
    x.pagados = (x.pagados||[]).filter(m=>m!==todayStr().slice(0,7));
    saveData(); renderPlata();
  });
  box.querySelectorAll('[data-pagado]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const m = DATA.events.find(x=>x.id===b.dataset.pagado);
    m.status='hecho'; m.pagadoFecha = todayStr();
    saveData(); renderPlata();
  });
  document.getElementById('addInstallmentBtn').onclick = openInstallmentModal;
  box.querySelectorAll('.sus-card').forEach(c=>c.onclick=()=>openSuscripcionModal(DATA.suscripciones.find(x=>x.id===c.dataset.id)));
  box.querySelectorAll('[data-usar-tasa]').forEach(b=>b.onclick=(ev)=>{
    ev.stopPropagation();
    const x = DATA.suscripciones.find(s=>s.id===b.dataset.usarTasa);
    DATA.plata.tasaUSD = tasaImplicita(x); DATA.plata.tasaFecha = todayStr();
    saveData(); renderPlata();
  });
  box.querySelectorAll('.deuda-card').forEach(c=>c.onclick=()=>openDeudaModal(DATA.deudas.find(x=>x.id===c.dataset.id)));
  box.querySelectorAll('[data-action="payInstallment"]').forEach(b=>b.onclick=()=>openPayModal(b.dataset.id));
  box.querySelectorAll('[data-action="delInstallment"]').forEach(b=>b.onclick=()=>{ DATA.installments = DATA.installments.filter(i=>i.id!==b.dataset.id); saveData(); renderPlata(); });
}

}

function openTopesModal(){

function openSuscripcionModal(existente){

    <div class="field"><label>¿Qué es?</label><input type="text" id="f_sname" value="${esc(x.nombre)}" placeholder="Ej: Datos, Claude"></div>
    <div class="field-row">
      <div class="field"><label>Cuánto</label><input type="number" id="f_smonto" inputmode="decimal" value="${x.monto}"></div>
      <div class="field"><label>Moneda</label><select id="f_smoneda">
        <option value="COP" ${x.moneda!=='USD'?'selected':''}>Pesos</option>
        <option value="USD" ${x.moneda==='USD'?'selected':''}>Dólares</option>
      </select></div>
    </div>

    </div>

    <div class="field"><label>Nota (opcional)</label><input type="text" id="f_snota" value="${esc(x.nota||'')}" placeholder="Ej: llega el 8, la pago el 15"></div>
    <div class="sheet-actions">
      ${existente?`<button class="btn btn-ghost" id="delSus">Borrar</button>`:''}
      <button class="btn btn-primary" id="saveSus">Guardar</button>
    </div>`);
  const del = document.getElementById('delSus');
  if(del) del.onclick = ()=>{ DATA.suscripciones = DATA.suscripciones.filter(s=>s.id!==existente.id); saveData(); closeSheet(); renderPlata(); };
  document.getElementById('f_smoneda').onchange = (ev)=>{ document.getElementById('copField').style.display = ev.target.value==='USD' ? 'block' : 'none'; };
  document.getElementById('saveSus').onclick = ()=>{
    const datos = {
      nombre: document.getElementById('f_sname').value.trim(),
      monto: Number(document.getElementById('f_smonto').value)||0,

    else DATA.suscripciones.push(Object.assign({id:uid()}, datos));
    saveData(); closeSheet(); renderPlata();
  };
}

    <div class="field"><label>Sentido</label><select id="f_dsentido">

    </div>`);
  const mov = document.getElementById('addMov');

    saveData(); closeSheet(); renderPlata();
  };

}
/* Cerrar una deuda: se marca saldada y, si quiere, el resto queda anotado
   como movimiento para que las cuentas del mes cuadren (D96). */
function openSaldarModal(d){
  const resta = saldoDeuda(d);
  const debo = d.sentido!=='meDeben';
  openSheet(`<h3>¿${esc(d.nombre)} ya quedó paga?</h3>
    <div class="helptext" style="margin:-4px 0 14px;">${debo?'Le debías':'Te debía'} ${money(resta)}.</div>
    <div class="field"><label>Cuándo se cerró</label><input type="date" id="s_fecha" value="${todayStr()}"></div>
    ${resta>0?`<label class="field-check"><input type="checkbox" id="s_anotar" checked>
      <span>Anotarlo en los movimientos<br><span class="helptext" style="margin:2px 0 0;">Queda ${money(resta)} ${debo?'saliendo':'entrando'} en este mes. Quítale el visto si ya lo registraste aparte.</span></span></label>`:''}
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="s_volver">Volver</button>
      <button class="btn btn-primary" id="s_saldar">Sí, ya quedó paga</button>
    </div>`);
  document.getElementById('s_volver').onclick = ()=>openDeudaModal(d);
  document.getElementById('s_saldar').onclick = ()=>{
    const fecha = document.getElementById('s_fecha').value || todayStr();
    const anotar = document.getElementById('s_anotar');
    if(resta>0 && anotar && anotar.checked){
      DATA.events.push({ id:uid(), cat:'finanzas', type: debo?'gasto':'ingreso', amount:resta, moneda:'COP',
        categoria: debo?'Otros':'', persona:d.nombre, title:(debo?'Pago de ':'Me pagó ')+d.nombre,
        date:fecha, notes:'Cierre del préstamo', start:'', end:'', status:'hecho' });
    }
    d.movs = d.movs || [];
    if(resta !== 0) d.movs.push({ id:uid(), sentido: resta>0?'abono':'suma', monto:Math.abs(resta), fecha, nota:'cierre', cierre:true });
    d.saldada = true; d.saldadaFecha = fecha;
    saveData(); closeSheet(); renderPlata();
  };
}

/* Marcar el cobro del mes como pagado, y de paso dejarlo en los movimientos. */
function openPagarSuscripcion(x){
  const mes = todayStr().slice(0,7);
  const pesos = x.moneda==='USD' ? (Number(x.montoCOP) || enPesos(x.monto,'USD')) : Number(x.monto);
  openSheet(`<h3>¿Ya pagaste ${esc(x.nombre)}?</h3>
    <div class="helptext" style="margin:-4px 0 14px;">El cobro de este mes.</div>
    <div class="field"><label>Cuánto te descontaron</label><input type="number" id="p_monto" inputmode="numeric" value="${pesos||''}"></div>
    <div class="field"><label>Cuándo</label><input type="date" id="p_fecha" value="${todayStr()}"></div>
    <label class="field-check"><input type="checkbox" id="p_anotar" checked>
      <span>Anotarlo en los movimientos<br><span class="helptext" style="margin:2px 0 0;">Cuenta contra el tope de Datos y celular.</span></span></label>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="p_volver">Volver</button>
      <button class="btn btn-primary" id="p_pagar">Ya lo pagué</button>
    </div>`);
  document.getElementById('p_volver').onclick = closeSheet;
  document.getElementById('p_pagar').onclick = ()=>{
    const monto = Number(document.getElementById('p_monto').value)||0;
    const fecha = document.getElementById('p_fecha').value || todayStr();
    if(document.getElementById('p_anotar').checked && monto){

/* ============================================================
   EL DIA: LO OCUPADO Y LO LIBRE
   Los huecos entre bloques son tiempo utilizable, no "ocupada todo el dia"
   (D26), y se ven como espacio entre los bloques (D108). Sirve igual para
   Hoy y para cualquier dia que toque en el calendario.
============================================================ */
const DIA_DESDE = 6 * 60;    // 6 de la mañana
const DIA_HASTA = 23 * 60;   // 11 de la noche, donde arranca su silencio

/* Todo lo que ocupa ese dia, junto y en orden. */
function bloquesDeFecha(fecha){
  const d = parseDate(fecha), dow = d.getDay();
  const out = [];
  weekdayItems(dow).forEach(c=>{
    if(!c.start) return;
    out.push({ titulo:c.name, start:c.start, end:c.end, color:c.color,
      lugar:(c.ref && c.ref.notes) || '', rutina:c.ref, materia:c.materia });
  });
  DATA.events.filter(e=>e.date===fecha && e.start).forEach(e=>{
    out.push({ titulo:e.title, start:e.start, end:e.end,
      color:CATS[e.cat]?CATS[e.cat].color:'var(--text-dim)', lugar:e.lugar||'', ev:e });
  });
  return out.sort(porHora);
}

/* Dos bloques encimados no ocupan el doble: se unen antes de contar. */
function ocupadoDelDia(bloques){
  const tramos = bloques
    .map(b=>({ desde: minutosDe(b.start), hasta: finEnMinutos(b.start, b.end || b.start) }))
    .filter(t=>t.desde !== null && t.hasta !== null && t.hasta > t.desde)
    .sort((a,b)=>a.desde - b.desde);
  const unidos = [];
  tramos.forEach(t=>{
    const ultimo = unidos[unidos.length-1];
    if(ultimo && t.desde <= ultimo.hasta) ultimo.hasta = Math.max(ultimo.hasta, t.hasta);
    else unidos.push({ ...t });
  });
  return unidos;
}

/* Lo que queda libre dentro del dia despierto. */
function huecosDelDia(bloques){
  const ocupado = ocupadoDelDia(bloques);
  const huecos = [];
  let cursor = DIA_DESDE;
  ocupado.forEach(t=>{
    const desde = Math.max(cursor, DIA_DESDE);
    const hasta = Math.min(t.desde, DIA_HASTA);
    if(hasta - desde >= 30) huecos.push({ desde, hasta });
    cursor = Math.max(cursor, t.hasta);
  });
  if(DIA_HASTA - Math.max(cursor, DIA_DESDE) >= 30){
    huecos.push({ desde: Math.max(cursor, DIA_DESDE), hasta: DIA_HASTA });
  }
  return huecos;
}

function resumenDelDia(fecha){
  const bloques = bloquesDeFecha(fecha);
  const ocupado = ocupadoDelDia(bloques).reduce((a,t)=>
    a + Math.max(0, Math.min(t.hasta, DIA_HASTA) - Math.max(t.desde, DIA_DESDE)), 0);
  const huecos = huecosDelDia(bloques);
  const libre = huecos.reduce((a,h)=>a + (h.hasta - h.desde), 0);
  return { bloques, huecos, ocupado, libre };
}

/* La tira del dia: los bloques con los huecos entre ellos. */
function tiraDelDia(fecha, opciones){
  const o = opciones || {};
  const { bloques, huecos } = resumenDelDia(fecha);
  if(!bloques.length && !huecos.length) return '';

  /* el hueco mas grande es donde tiene sentido sugerir algo (D19) */
  let mejor = null;
  huecos.forEach(h=>{ if(!mejor || (h.hasta-h.desde) > (mejor.hasta-mejor.desde)) mejor = h; });
  const cabe = o.sugerir
    ? (DATA.pendientes||[]).filter(p=>!p.hecho)
        .sort((a,b)=>(a.urgencia==='urgente'?0:1)-(b.urgencia==='urgente'?0:1))[0]
    : null;

  /* se intercalan por hora para que se lea como el dia de verdad */
  const filas = [
    ...bloques.map(b=>({ orden: minutosDe(b.start), tipo:'bloque', b })),
    ...huecos.map(h=>({ orden: h.desde, tipo:'hueco', h }))
  ].sort((x,y)=> x.orden - y.orden);

  return filas.map(f=>{
    if(f.tipo === 'hueco'){
      const min = f.h.hasta - f.h.desde;
      const esElMejor = mejor && f.h.desde === mejor.desde;
      return `<div class="hueco">
        <span class="rango mono">${hhmm(f.h.desde)}–${hhmm(f.h.hasta)}</span>
        <span>${libres(min)}</span>
        ${esElMejor && cabe && min >= 60 ? `<span class="cabe">cabe: ${esc(cabe.titulo)}</span>` : ''}
      </div>`;
    }
    const b = f.b;
    const hecho = b.ev && b.ev.status==='hecho';
    const progreso = b.ev && b.ev.status==='progreso';
    const marca = b.ev ? `data-id="${b.ev.id}" data-sel-tipo="evento" data-sel-id="${b.ev.id}"`
      : b.rutina ? `data-rutina="${b.rutina.id}" data-sel-tipo="rutina" data-sel-id="${b.rutina.id}"`
      : b.materia ? `data-materia="${b.materia.id}" data-sel-tipo="materia" data-sel-id="${b.materia.id}"` : '';
    return `<div class="bloque${hecho?' hecho':''}" ${marca}>
      <div class="hora mono">${esc(b.start)}${b.end?`<span class="hasta">${esc(b.end)}</span>`:''}</div>
      <div class="raya" style="background:${b.color};"></div>
      <div class="cuerpo">
        <div class="nombre">${esc(b.titulo)}</div>
        ${b.lugar && b.lugar.trim() !== b.titulo.trim() ? `<div class="sitio">${esc(b.lugar)}</div>` : ''}
      </div>
      ${b.ev ? `<button class="status-btn ${hecho?'hecho':progreso?'progreso':''}" data-action="cyclestatus" data-id="${b.ev.id}"></button>` : ''}
    </div>`;
  }).join('');
}

/* Los bloques y huecos de un dia se tocan igual en todos lados. */
function engancharTira(caja){
  caja.querySelectorAll('[data-rutina]').forEach(el=>{

/* ============================================================
   SELECCIONAR Y BORRAR
   Como en WhatsApp: se mantiene presionado lo que se quiere botar, se tocan
   los demas para sumarlos, y abajo aparece la barra para eliminarlos.
============================================================ */
const SELECCION = { tipo:null, ids:new Set() };
let sinClic = false;          // tras un mantenido, el clic que viene no cuenta

/* Cada tipo dice como se llama y como se borra. Agregar una lista nueva es
   ponerle data-sel-tipo y data-sel-id, y una entrada aca. */
const BORRABLES = {
  pendiente: {
    uno:'pendiente', varios:'pendientes',
    borrar: ids => { DATA.pendientes = (DATA.pendientes||[]).filter(p=>!ids.has(p.id)); }
  },
  evento: {
    uno:'cosa agendada', varios:'cosas agendadas',
    borrar: ids => {
      ids.forEach(id=>{
        const e = (DATA.events||[]).find(x=>x.id===id);
        if(e && e.linkedType==='turno') DATA.turnos = DATA.turnos.filter(t=>t.id!==e.linkedId);
      });
      DATA.events = (DATA.events||[]).filter(e=>!ids.has(e.id));
    }
  },
  rutina: {
    uno:'cosa que se repite', varios:'cosas que se repiten',
    borrar: ids => { DATA.routines = (DATA.routines||[]).filter(r=>!ids.has(r.id)); }
  },
  turno: {
    uno:'turno', varios:'turnos',
    borrar: ids => {
      ids.forEach(id=>removeLinkedEvent('turno', id));
      DATA.turnos = (DATA.turnos||[]).filter(t=>!ids.has(t.id));
    }
  },
  movimiento: {
    uno:'movimiento', varios:'movimientos',
    borrar: ids => { DATA.events = (DATA.events||[]).filter(e=>!ids.has(e.id)); }
  },
  idea: {
    uno:'idea', varios:'ideas',
    borrar: ids => { marcaData().ideas = marcaData().ideas.filter(i=>!ids.has(i.id)); }
  },
  publicacion: {
    uno:'publicación', varios:'publicaciones',
    borrar: ids => { marcaData().publicaciones = marcaData().publicaciones.filter(p=>!ids.has(p.id)); }
  },
  suscripcion: {
    uno:'cobro', varios:'cobros',
    borrar: ids => { DATA.suscripciones = (DATA.suscripciones||[]).filter(s=>!ids.has(s.id)); }
  },
  deuda: {
    uno:'préstamo', varios:'préstamos',
    borrar: ids => { DATA.deudas = (DATA.deudas||[]).filter(d=>!ids.has(d.id)); }
  },
  materia: {
    uno:'materia', varios:'materias',
    borrar: ids => { DATA.subjects = (DATA.subjects||[]).filter(m=>!ids.has(m.id)); }
  }
};

function seleccionando(){ return SELECCION.tipo !== null; }

function entrarSeleccion(tipo, id){
  SELECCION.tipo = tipo;
  SELECCION.ids = new Set([id]);
  try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
  pintarSeleccion();
}
function salirSeleccion(){
  SELECCION.tipo = null;
  SELECCION.ids.clear();
  pintarSeleccion();
}
function alternar(id){
  if(SELECCION.ids.has(id)) SELECCION.ids.delete(id); else SELECCION.ids.add(id);
  if(!SELECCION.ids.size) salirSeleccion(); else pintarSeleccion();
}

function pintarSeleccion(){
  document.querySelectorAll('[data-sel-id]').forEach(el=>{
    const suyo = seleccionando() && el.dataset.selTipo === SELECCION.tipo;
    el.classList.toggle('seleccionable', suyo);
    el.classList.toggle('elegido', suyo && SELECCION.ids.has(el.dataset.selId));
  });

  let barra = document.getElementById('barraSel');
  if(!seleccionando()){ if(barra) barra.remove(); document.body.classList.remove('con-barra'); return; }

  const n = SELECCION.ids.size;
  const meta = BORRABLES[SELECCION.tipo] || { uno:'cosa', varios:'cosas' };
  if(!barra){
    barra = document.createElement('div');
    barra.id = 'barraSel';
    barra.className = 'barra-sel';
    document.body.appendChild(barra);
  }
  barra.innerHTML = `
    <button class="cancelar" id="selCancelar" aria-label="Cancelar">✕</button>
    <span class="cuantos">${n} ${n===1 ? meta.uno : meta.varios}</span>
    <button class="borrar" id="selBorrar">Eliminar</button>`;
  document.body.classList.add('con-barra');
  document.getElementById('selCancelar').onclick = salirSeleccion;
  document.getElementById('selBorrar').onclick = borrarSeleccionados;
}

function borrarSeleccionados(){
  const meta = BORRABLES[SELECCION.tipo];
  if(!meta) return salirSeleccion();
  const n = SELECCION.ids.size;
  const que = n===1 ? ('este ' + meta.uno) : (n + ' ' + meta.varios);
  if(!confirm(`¿Eliminar ${que}? No se puede deshacer.`)) return;
  meta.borrar(new Set(SELECCION.ids));
  salirSeleccion();
  saveData();
  renderAll();
  if(document.getElementById('view-calendario').classList.contains('active')) renderCalDayList();
}

/* El gesto: mantener presionado abre la seleccion; despues, un toque suma o quita. */
(function engancharGesto(){
  let reloj = null, desde = null;

  const cancelar = ()=>{ clearTimeout(reloj); reloj = null; desde = null; };

  document.addEventListener('pointerdown', (ev)=>{
    /* si el mantenido anterior no termino en clic, la bandera no puede quedarse
       prendida: se comeria el toque siguiente */
    sinClic = false;
    const el = ev.target.closest('[data-sel-id]');
    if(!el) return;
    /* si ya esta seleccionando otra cosa, el mantenido no aplica */
    if(seleccionando() && el.dataset.selTipo !== SELECCION.tipo) return;
    desde = { x: ev.clientX, y: ev.clientY };
    reloj = setTimeout(()=>{
      reloj = null;
      sinClic = true;
      if(seleccionando()) alternar(el.dataset.selId);
      else entrarSeleccion(el.dataset.selTipo, el.dataset.selId);
    }, 420);
  }, { passive:true });

  document.addEventListener('pointermove', (ev)=>{
    if(!reloj || !desde) return;
    /* si arrastra para desplazar la pantalla, no era un mantenido */
    if(Math.abs(ev.clientX - desde.x) > 10 || Math.abs(ev.clientY - desde.y) > 10) cancelar();
  }, { passive:true });

  ['pointerup','pointercancel','pointerleave'].forEach(t=>
    document.addEventListener(t, cancelar, { passive:true }));

  /* En modo seleccion, el toque elige en vez de abrir. Va en captura para
     ganarle a los clics que ya tiene cada lista. */
  document.addEventListener('click', (ev)=>{
    const el = ev.target.closest('[data-sel-id]');
    if(sinClic){
      sinClic = false;
      if(el){ ev.preventDefault(); ev.stopPropagation(); }
      return;
    }
    if(!seleccionando() || !el) return;
    if(el.dataset.selTipo !== SELECCION.tipo) return;
    ev.preventDefault(); ev.stopPropagation();
    alternar(el.dataset.selId);
  }, true);

  /* El menu del navegador al mantener presionado estorba el gesto. */
  document.addEventListener('contextmenu', (ev)=>{
    if(ev.target.closest('[data-sel-id]')) ev.preventDefault();
  });

  addEventListener('keydown', (ev)=>{ if(ev.key==='Escape' && seleccionando()) salirSeleccion(); });
})();

/* ============================================================
   RENDER ALL
============================================================ */
function renderAll(){
  asegurarListas();
  sembrarCompromisos();
  sembrarPlata();
  renderHeader();
  const active = views.find(v=>document.getElementById('view-'+v).classList.contains('active'));
  if(active==='hoy') renderHoy();
  if(active==='calendario'){ renderCalendar(); renderChoquesSemana(); renderTurnos(); renderRutinas(); }
  if(active==='pendientes'){ renderTareasView(); renderMaterias(); renderMarca(); renderNexxaGestion(); renderTrabajo(); }
  if(active==='plata') renderPlata();
  if(active==='yo'){ renderYo(); renderAvisos(); renderPersonalGestion(); }
  pintarSeleccion();
}

(async function init(){
  await loadData();
  renderAll();
  document.querySelectorAll('.view.active .subtabs').forEach(marcarBordes);
  engancharAvisos();

  const temaBtn = document.getElementById('temaBtn');
  function pintarTema(){
    const oscuro = document.documentElement.dataset.tema === 'oscuro';
    temaBtn.textContent = oscuro ? '☀' : '☾';
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', oscuro ? '#101218' : '#F5F5F7');
  }
  pintarTema();
  temaBtn.onclick = ()=>{
    const nuevo = document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    document.documentElement.dataset.tema = nuevo;
    lsSet('bitacora:tema', nuevo);
    pintarTema();
  };

  document.getElementById('syncBtn').onclick = ()=>{
    if(SYNC_STATE==='lock' && !askPass()) return;
    syncNow();
  };
  window.addEventListener('online', syncNow);
  window.addEventListener('offline', ()=>setSync('off'));
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncNow(); });
})();
</script>
<script>
/* Le pide al navegador que no borre lo guardado si el telefono se queda sin
   espacio. Instalada, Chrome suele conceder esto sin preguntar nada. */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted()
    .then((ya) => (ya ? true : navigator.storage.persist()))
    .catch(() => {});
}

/* Guarda la app en el telefono para que abra sin internet (ver sw.js).
   Si mientras tanto se publico una version nueva, se recarga sola una vez. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const habiaControlador = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (habiaControlador && !window.__recargando) {
        window.__recargando = true;
        window.location.reload();
      }
    });
  });
}
</script>
