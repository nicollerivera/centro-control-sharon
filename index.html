<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Centro de Control — Sharon</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icono-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Centro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF9FC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9FC;
  --surface:#FFFFFF;
  --surface-2:#F3F1F8;
  --surface-3:#ECE8F3;
  --border:#E3DEED;
  --text:#221F2B;
  --text-muted:#6B6478;
  --text-dim:#9C94A8;
  --accent:#8B6CF9;
  --accent-soft:rgba(139,108,249,.12);
  --urgent:#E94BB2;
  --urgent-soft:rgba(233,75,178,.12);
  --done:#3FA372;
  --done-soft:rgba(63,163,114,.12);
  --c-uni:#3E7FC4;
  --c-nexxa:#8B6CF9;
  --c-ads:#C2559E;
  --c-work:#1EA89A;
  --c-fin:#DB4F97;
  --c-personal:#6E6B85;
  --c-ciclo:#D6467E;
  --radius:16px;
  --radius-sm:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
button{font-family:inherit;}
.app{max-width:560px; margin:0 auto; position:relative;}

/* ---------- header ---------- */
.topbar{padding:22px 18px 14px; position:sticky; top:0; z-index:20; background:linear-gradient(180deg, var(--bg) 70%, rgba(250,249,252,0));}
.topbar .greet{font-size:13px; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.08em;}
.topbar h1{font-size:26px; margin:2px 0 0; font-weight:700;}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.sync{display:inline-flex; align-items:center; gap:6px; flex:none; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:11px; font-weight:600; letter-spacing:.02em; padding:5px 10px; border-radius:999px; cursor:pointer;}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--text-dim); flex:none;}
.sync[data-state="ok"]{color:var(--done); background:var(--done-soft); border-color:transparent;}
.sync[data-state="ok"] .sync-dot{background:var(--done);}
.sync[data-state="sync"]{color:var(--accent); background:var(--accent-soft); border-color:transparent;}
.sync[data-state="sync"] .sync-dot{background:var(--accent); animation:pulse 1s ease-in-out infinite;}
.sync[data-state="off"],.sync[data-state="lock"]{color:var(--urgent); background:var(--urgent-soft); border-color:transparent;}
.sync[data-state="off"] .sync-dot,.sync[data-state="lock"] .sync-dot{background:var(--urgent);}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
.linework{width:100%; height:14px; margin-top:10px; opacity:.6;}

/* ---------- view container ---------- */
.view{padding:4px 18px 20px; display:none; animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-dim); font-weight:700; margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.section-title:first-child{margin-top:4px;}
.section-title .count{color:var(--accent); font-weight:700;}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
.empty-card{background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); padding:20px 16px; text-align:center; color:var(--text-dim); font-size:13.5px;}

.item{display:flex; align-items:flex-start; gap:11px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; cursor:pointer;}
.item:active{background:var(--surface-2);}
.item .body{flex:1; min-width:0;}
.item .row1{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.item .title{font-size:14.5px; font-weight:600; line-height:1.3;}
.item.done .title{color:var(--text-dim); text-decoration:line-through;}
.item .meta{font-size:12px; color:var(--text-dim); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
.tag{font-size:10.5px; padding:2px 7px; border-radius:20px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
.status-btn{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border); background:transparent; flex-shrink:0; margin-top:1px;}
.status-btn.progreso{border-color:var(--accent); background:conic-gradient(var(--accent) 50%, transparent 0);}
.status-btn.hecho{border-color:var(--done); background:var(--done);}

/* ---------- bottom nav ---------- */
.bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(255,255,255,.9); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:space-around;}
.navbtn{background:none; border:none; color:var(--text-dim); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:700; padding:4px 6px; border-radius:10px; flex:1; max-width:90px; position:relative;}
.navbtn.active{color:var(--accent);}
.navbtn svg{width:21px; height:21px;}
.navbtn .badge{position:absolute; top:0; right:12px; background:var(--urgent); color:#fff; font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;}

/* ---------- FAB ---------- */
.fab{position:fixed; right:20px; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:25; width:54px; height:54px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:26px; line-height:1; box-shadow:0 8px 22px rgba(139,108,249,.4); display:flex; align-items:center; justify-content:center;}
.fab:active{transform:scale(.94);}

/* ---------- chips ---------- */
.chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:2px; scrollbar-width:none;}
.chiprow::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:13px; font-weight:600;}
.chip.active{border-color:var(--chip-color, var(--accent)); background:var(--chip-color-soft, var(--accent-soft)); color:var(--text);}

/* ---------- subtabs ---------- */
.subtabs{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none;}
.subtabs::-webkit-scrollbar{display:none;}
.subtab{flex-shrink:0; border:none; background:none; color:var(--text-dim); font-weight:700; font-size:12.5px; padding:9px 12px; border-radius:9px; white-space:nowrap;}
.subtab.active{background:var(--accent); color:#fff;}

/* ---------- week/subject rows ---------- */
.subject-row{display:flex; align-items:center; gap:10px; padding:11px 12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-uni); border-radius:var(--radius-sm); margin-bottom:8px;}
.subject-row.ads{border-left-color:var(--c-ads);}
.subject-row .info{flex:1;}
.subject-row .name{font-weight:600; font-size:14px;}
.subject-row .time{font-size:12px; color:var(--text-dim); margin-top:2px;}
.period-pill{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; padding:6px 12px; border-radius:20px; margin-bottom:14px;}
.subject-group{margin-bottom:14px;}
.subject-group-head{font-weight:700; font-size:13.5px; margin:4px 0 6px; padding-left:2px; color:var(--text);}

/* ---------- curso ---------- */
.module-row{display:flex; align-items:center; gap:11px; padding:12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-ads); border-radius:var(--radius-sm); margin-bottom:8px;}
.module-check{width:24px; height:24px; border-radius:7px; border:1.5px solid var(--border); background:transparent; flex-shrink:0;}
.module-check.done{background:var(--c-ads); border-color:var(--c-ads); position:relative;}
.module-check.done::after{content:'✓'; color:#fff; font-size:14px; font-weight:900; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.module-row .mname{font-size:14px; font-weight:600; flex:1;}
.module-row.done .mname{color:var(--text-dim); text-decoration:line-through;}

/* ---------- nexxa events ---------- */
.nexxa-card{padding:13px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-nexxa); border-radius:var(--radius); margin-bottom:9px;}
.nexxa-card .head{display:flex; justify-content:space-between; align-items:flex-start;}
.nexxa-card .name{font-weight:700; font-size:14.5px;}
.nexxa-card .meta{font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.5;}
.status-pill{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; flex-shrink:0;}
.status-pill.cotizado{background:var(--surface-3); color:var(--text-muted);}
.status-pill.confirmado{background:rgba(139,108,249,.16); color:var(--c-nexxa);}
.status-pill.realizado{background:var(--done-soft); color:var(--done);}
.mini-tag{display:inline-block; font-size:11px; background:var(--surface-3); color:var(--text-muted); padding:2px 8px; border-radius:8px; margin-top:6px; margin-right:5px;}

/* ---------- trabajo ---------- */
.client-card{padding:14px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c-work); border-radius:var(--radius); margin-bottom:10px;}
.client-card .head{display:flex; justify-content:space-between; align-items:flex-start;}
.client-card .name{font-weight:700; font-size:15px;}
.client-card .rate{font-size:12px; color:var(--text-dim); margin-top:2px;}
.client-card .stats{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;}
.client-card .stat b{display:block; font-size:16px; font-family:'Space Grotesk',sans-serif;}
.client-card .stat span{font-size:11px; color:var(--text-dim);}
.small-btn{background:var(--surface-3); border:1px solid var(--border); color:var(--text); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:9px;}

/* ---------- finanzas ---------- */
.progress-track{height:7px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:9px;}
.progress-fill{height:100%; background:var(--c-fin); border-radius:6px;}
.money{font-family:'Space Grotesk',sans-serif; font-weight:700;}
.summary-row{display:flex; gap:10px; margin-bottom:16px;}
.summary-box{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px;}
.summary-box .lbl{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
.summary-box .val{font-size:18px; margin-top:4px;}
.installment-card{border-left:4px solid var(--c-fin) !important;}

/* ---------- personal ---------- */
.item.personal-row{border-left-color:var(--c-personal);}

/* ---------- reminders ---------- */
.reminder-row{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--urgent); border-radius:var(--radius-sm); margin-bottom:7px;}
.reminder-row.done{opacity:.55;}
.reminder-row .txt{flex:1; font-size:13.5px; font-weight:500;}
.reminder-row.done .txt{text-decoration:line-through; color:var(--text-dim);}
.addbar{display:flex; gap:8px; margin-bottom:14px;}
.addbar input{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:14px; font-family:inherit; color:var(--text);}
.addbar button{background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px; font-weight:700; font-size:13px;}

/* ---------- calendar month ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-nav button{background:var(--surface); border:1px solid var(--border); color:var(--text); width:36px; height:36px; border-radius:10px; font-size:16px;}
.cal-nav h2{margin:0; font-size:18px; text-transform:capitalize;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-dow{text-align:center; font-size:10.5px; color:var(--text-dim); font-weight:700; padding-bottom:4px;}
.cal-cell{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:13px; color:var(--text-muted); position:relative; border:1px solid transparent; background:var(--surface);}
.cal-cell.blank{visibility:hidden;}
.cal-cell.today{border-color:var(--accent); color:var(--text); font-weight:700;}
.cal-cell.selected{background:var(--surface-3); color:var(--text);}
.cal-cell .dots{display:flex; gap:2px; margin-top:3px; height:5px;}
.cal-cell .dots span{width:4.5px; height:4.5px; border-radius:50%;}
.cal-cell.ciclo-range{background:rgba(214,70,126,.10);}
.cal-cell.ciclo-log{background:rgba(214,70,126,.28); color:#3A0F26; font-weight:700;}
.cal-daylist{margin-top:18px;}

/* ---------- Yo tab ---------- */
.cycle-hero{background:linear-gradient(135deg, rgba(214,70,126,.14), rgba(139,108,249,.07)); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
.cycle-hero .big{font-size:26px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--c-ciclo);}
.cycle-hero .sub{font-size:13px; color:var(--text-muted); margin-top:4px;}
.ring-row{display:flex; gap:10px; margin-top:14px;}
.ring-box{flex:1; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 4px;}
.ring-box b{display:block; font-size:16px; font-family:'Space Grotesk',sans-serif;}
.ring-box span{font-size:10.5px; color:var(--text-dim);}
.bar-chart{display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:6px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar-col .bar{width:100%; border-radius:6px 6px 3px 3px; min-height:3px;}
.bar-col .lbl{font-size:10px; color:var(--text-dim); margin-top:6px;}
.insight{display:flex; gap:10px; align-items:flex-start; padding:12px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); margin-bottom:8px;}
.insight .ico{font-size:16px;}
.insight .txt{font-size:13px; color:var(--text-muted); line-height:1.4;}
.insight .txt b{color:var(--text);}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,17,26,.55); backdrop-filter:blur(3px); z-index:50; display:none; align-items:flex-end;}
.overlay.active{display:flex;}
.sheet{background:var(--surface); width:100%; max-width:560px; margin:0 auto; border-radius:22px 22px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:slideup .28s cubic-bezier(.2,.9,.3,1); border-top:3px solid var(--accent);}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:6px auto 14px;}
.sheet h3{margin:0 0 16px; font-size:18px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea{width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:14.5px; font-family:inherit;}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.field-check{display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 12px; margin-bottom:14px;}
.field-check input{width:18px; height:18px;}
.field-check label{margin:0; font-size:13.5px; font-weight:600; color:var(--text); text-transform:none;}
.sheet-actions{display:flex; gap:10px; margin-top:6px;}
.btn{flex:1; border:none; padding:13px; border-radius:12px; font-weight:700; font-size:14.5px;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-ghost{background:var(--surface-2); color:var(--text-muted);}
.btn-danger{background:var(--urgent-soft); color:var(--urgent);}
.close-x{position:absolute; top:16px; right:16px; background:var(--surface-2); border:none; color:var(--text-muted); width:30px; height:30px; border-radius:50%; font-size:15px;}
.helptext{font-size:11.5px; color:var(--text-dim); margin:-8px 0 14px; line-height:1.4;}

::selection{background:var(--accent-soft);}

/* ---------- listas de pendientes (sin fecha, por seccion) ---------- */
.lista-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:20px 0 9px;}
.lista-head .nombre{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700;}
.lista-head .punto{width:9px; height:9px; border-radius:50%; flex:none;}
.lista-head .acciones{display:flex; gap:6px; flex:none;}
.pend{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius-sm); padding:11px 12px; margin-bottom:7px;}
.pend.hecho{opacity:.5;}
.pend.hecho .txt{text-decoration:line-through;}
.pend .txt{flex:1; font-size:14px; line-height:1.35; cursor:pointer;}
.urg{flex:none; font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:5px 9px; border-radius:20px; border:none; font-family:inherit;}
.urg[data-nivel="normal"]{background:var(--surface-3); color:var(--text-dim);}
.urg[data-nivel="importante"]{background:var(--accent-soft); color:var(--accent);}
.urg[data-nivel="urgente"]{background:var(--urgent-soft); color:var(--urgent);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="topbar-row">
      <div class="greet" id="greetLabel">Hoy</div>
      <button class="sync" id="syncBtn" type="button" data-state="sync" aria-live="polite" title="Estado de sincronización — tocar para sincronizar ahora"><span class="sync-dot"></span><span id="syncText">Conectando…</span></button>
    </div>
    <h1 id="dateLabel">—</h1>
    <svg class="linework" viewBox="0 0 400 14" preserveAspectRatio="none"><path d="M0 7 Q 20 1, 40 7 T 80 7 T 120 7 T 160 7 T 200 7 T 240 7 T 280 7 T 320 7 T 360 7 T 400 7" stroke="#8B6CF9" stroke-width="1.2" fill="none" opacity="0.6"/></svg>
  </div>

  <!-- ===== HOY ===== -->
  <div class="view active" id="view-hoy">
    <div id="hoyUrgent"></div>
    <div id="hoyClasses"></div>
    <div class="section-title">Bloques de hoy</div>
    <div id="hoyList"></div>
    <div class="section-title">Próximos 14 días</div>
    <div id="hoyUpcoming"></div>
    <div id="hoyUrgentListas"></div>
  </div>

  <!-- ===== MES ===== -->
  <div class="view" id="view-mes">
    <div class="cal-nav">
      <button id="calPrev">‹</button>
      <h2 id="calTitle">—</h2>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-daylist" id="calDayList"></div>
  </div>

  <!-- ===== TAREAS (listas propias + lo agendado) ===== -->
  <div class="view" id="view-tareas">
    <div class="section-title">Agregar a</div>
    <div class="chiprow" id="listaChips"></div>
    <div class="addbar" style="margin-top:10px;">
      <input type="text" id="pendienteInput" placeholder="¿Qué hay que hacer?">
      <button id="addPendienteBtn">Añadir</button>
    </div>
    <div class="helptext">Esto se queda en su lista, sin fecha, hasta que lo marques. Si querés agendarlo para un día, tocá el texto y ponele fecha.</div>
    <div id="listasBody"></div>

    <div class="section-title" style="margin-top:28px;">
      <span>Agendado pendiente</span>
      <button class="small-btn" id="markDoneBtn" style="background:var(--done-soft); color:var(--done); border-color:transparent;">✓ Ya lo hice</button>
    </div>
    <div id="checklistBody"></div>
  </div>

  <!-- ===== GESTIÓN ===== -->
  <div class="view" id="view-gestion">
    <div class="subtabs">

<script>
/* ============================================================
   STORAGE
   Fuente de verdad: un JSON en Vercel Blob, vía /api/data.
   localStorage queda como caché local (arranque instantáneo y offline).
============================================================ */
const STORAGE_KEY = 'centro-control-sharon';
const DIRTY_KEY   = 'centro-control-sharon:pendiente';
const PASS_KEY    = 'centro-control-sharon:pin';
const API_URL     = '/api/data';
let DATA = {
  events: [],
  subjects: [],
  period: '',
  academicTasks: [],
  courseSchedule: [],
  courseTasks: [],
  courseModules: [],
  courseNotes: '',
  nexxaEvents: [],
  workClients: [],
  workSessions: [],
  installments: [],
  personalItems: [],
  reminders: [],
  routines: [], // {id,cat,title,days:[0..6],start,end,notes}
  listas: [],      // {id,nombre,color} — las secciones que arma Sharon
  pendientes: [],  // {id,listaId,titulo,urgencia,hecho,creado} — sin fecha a proposito
  cycle: { starts: [], avgLen: 28, periodLen: 5 }
};
let saveTimer=null;
let dirty=false;        // hay cambios locales que todavía no subieron
let pushing=false;      // hay un guardado en vuelo
let pendingPush=false;  // llegó otro cambio mientras subíamos
let SYNC_STATE='sync';
const SYNC_LABELS = { ok:'Sincronizado', sync:'Sincronizando…', off:'Sin conexión', lock:'Bloqueado' };

function setSync(state){
  SYNC_STATE = state;
  const btn = document.getElementById('syncBtn');
  const txt = document.getElementById('syncText');
  if(!btn || !txt) return;
  btn.dataset.state = state;
  txt.textContent = SYNC_LABELS[state] || '';
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function setDirty(v){
  dirty = v;
  if(v) lsSet(DIRTY_KEY,'1'); else lsDel(DIRTY_KEY);
}
function cacheLocal(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
  catch(e){ console.warn('No se pudo guardar la copia local', e); }
}
/* Copia solo las claves que la app conoce: ignora basura y campos viejos. */
function mergeInto(src){
  if(!src || typeof src!=='object') return false;
  Object.keys(DATA).forEach(k=>{ if(k in src && src[k]!=null) DATA[k] = src[k]; });
  return true;
}
function hasLocalData(){
  return !!(DATA.events.length || DATA.subjects.length || DATA.routines.length || DATA.reminders.length ||
    DATA.academicTasks.length || DATA.courseSchedule.length || DATA.courseTasks.length || DATA.courseModules.length ||
    DATA.nexxaEvents.length || DATA.workClients.length || DATA.workSessions.length || DATA.installments.length ||
    DATA.personalItems.length || (DATA.cycle && DATA.cycle.starts.length) || DATA.period || DATA.courseNotes);
}

function askPass(){
  const p = prompt('PIN de acceso del Centro de Control:');
  if(p===null) return false;
  lsSet(PASS_KEY, p.trim());
  return true;
}
async function apiRequest(method, body, retry){
  const headers = { 'Content-Type':'application/json' };
  const pass = lsGet(PASS_KEY);
  if(pass) headers['x-app-password'] = pass;
  const res = await fetch(API_URL, { method, headers, cache:'no-store', body: body ? JSON.stringify(body) : undefined });
  if(res.status===401){
    if(retry!==false && askPass()) return apiRequest(method, body, false);
    const err = new Error('PIN incorrecto'); err.code = 401; throw err;
  }
  if(!res.ok){
    let detail=''; try{ detail = (await res.json()).error || ''; }catch(e){}
    throw new Error(detail || ('HTTP '+res.status));
  }
  return res.json();
}

/* Baja el estado remoto y pisa el local. Solo se llama cuando no hay cambios pendientes. */
async function pullRemote(){
  setSync('sync');
  try{
    const out = await apiRequest('GET');
    if(out && out.data){ mergeInto(out.data); cacheLocal(); }
    else if(hasLocalData()){ setDirty(true); }  // primera vez en la nube: sube lo que ya había acá
    setSync(dirty ? 'sync' : 'ok');
    return true;
  }catch(e){
    console.warn('No se pudo leer desde Vercel Blob', e);
    setSync(e.code===401 ? 'lock' : 'off');
    return false;
  }
}

/* Sube el estado completo (último que escribe, gana). */
async function pushRemote(){
  if(!dirty) return true;
  if(pushing){ pendingPush = true; return false; }
  pushing = true; setSync('sync');
  const before = JSON.stringify(DATA);
  try{
    await apiRequest('POST', { data: DATA });
    if(JSON.stringify(DATA)===before){ setDirty(false); setSync('ok'); }
    else { pendingPush = true; }
    return true;
  }catch(e){
    console.warn('No se pudo guardar en Vercel Blob', e);
    setSync(e.code===401 ? 'lock' : 'off');
    return false;
  }finally{
    pushing = false;
    if(pendingPush){ pendingPush = false; setTimeout(pushRemote, 0); }
  }
}

async function loadData(){
  try{
    const raw = lsGet(STORAGE_KEY);
    if(raw) mergeInto(JSON.parse(raw));
  }catch(e){ console.warn('No se pudieron leer los datos locales', e); }

  if(lsGet(DIRTY_KEY)==='1'){
    /* Quedó algo sin subir de la sesión anterior: no lo pisamos con lo remoto. */
    dirty = true;
    await pushRemote();
  }else{
    await pullRemote();
    if(dirty) await pushRemote();
  }
}

function saveData(){
  setDirty(true);
  cacheLocal();
  setSync('sync');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 600);
}

/* Sincroniza al volver a la app / recuperar red. */
async function syncNow(){
  if(dirty) return pushRemote();
  const ok = await pullRemote();
  if(ok) renderAll();
  return ok;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* Todo lo que escribe el usuario pasa por acá antes de entrar al HTML.
   Sin esto una comilla en un título corta el atributo value y el dato se
   trunca al editarlo, y un < se traga el resto del texto. */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function esc(v){
  if(v===null || v===undefined) return '';
  return String(v).replace(/[&<>"']/g, c=>ESC_MAP[c]);
}

/* ============================================================
   DATE HELPERS
============================================================ */
const DOW = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOW_SHORT = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function niceDate(s){ const d=parseDate(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function niceDateShort(s){ if(!s) return ''; const d=parseDate(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; }
function money(n){ return '$' + Math.round(Number(n||0)).toLocaleString('es-CO'); }
function horasFromRange(start,end){
  if(!start||!end) return 0;
  const [h1,m1]=start.split(':').map(Number), [h2,m2]=end.split(':').map(Number);
  let mins = (h2*60+m2)-(h1*60+m1);
  if(mins<=0) mins += 24*60; // cruza medianoche
  return Math.round((mins/60)*100)/100;
}
function weekdayItems(dayIdx){
  const items=[];
  DATA.subjects.filter(s=>s.day===dayIdx).forEach(s=>items.push({name:s.name, start:s.start, end:s.end, color:'var(--c-uni)', tag:'clase'}));
  DATA.courseSchedule.filter(s=>s.day===dayIdx).forEach(s=>items.push({name:s.name, start:s.start, end:s.end, color:'var(--c-ads)', tag:'curso'}));
  DATA.routines.filter(r=>r.days.includes(dayIdx)).forEach(r=>items.push({name:r.title, start:r.start, end:r.end, color:CATS[r.cat].color, tag:CATS[r.cat].label.toLowerCase()}));
  return items;
}

/* ============================================================
   CATEGORY META
============================================================ */
const CATS = {
  universidad:{label:'Universidad', color:'var(--c-uni)', emoji:'🎓'},
  nexxa:{label:'Nexxa', color:'var(--c-nexxa)', emoji:'🎈'},
  ads:{label:'Curso Ads', color:'var(--c-ads)', emoji:'📈'},
  trabajo:{label:'Trabajo', color:'var(--c-work)', emoji:'💼'},
  finanzas:{label:'Finanzas', color:'var(--c-fin)', emoji:'💰'},
  personal:{label:'Personal', color:'var(--c-personal)', emoji:'🩺'},
};

/* ============================================================
   LINKED EVENTS (sync entre secciones y calendario)
============================================================ */
function addLinkedEvent(cat,title,date,start,end,linkedType,linkedId,extra){
  if(!date) return null;
  const ev = Object.assign({ id:uid(), cat, title, date, start:start||'', end:end||'', status:'pendiente', estMin:null, actualMin:null, notes:'', linkedType, linkedId }, extra||{});
  DATA.events.push(ev);
  return ev;
}
function findLinkedEvent(type,id){ return DATA.events.find(e=>e.linkedType===type && e.linkedId===id); }
function removeLinkedEvent(type,id){ DATA.events = DATA.events.filter(e=>!(e.linkedType===type && e.linkedId===id)); }
function setLinkedEventStatus(type,id,status){ const ev=findLinkedEvent(type,id); if(ev) ev.status=status; }
function syncSourceFromEvent(e){
  if(!e.linkedType) return;
  if(e.linkedType==='academicTask'){ const t=DATA.academicTasks.find(x=>x.id===e.linkedId); if(t) t.done = e.status==='hecho'; }
  if(e.linkedType==='courseTask'){ const t=DATA.courseTasks.find(x=>x.id===e.linkedId); if(t) t.done = e.status==='hecho'; }
  if(e.linkedType==='personalItem'){ const p=DATA.personalItems.find(x=>x.id===e.linkedId); if(p) p.status = e.status==='hecho' ? 'hecho' : 'pendiente'; }
  if(e.linkedType==='nexxaEvent'){ const n=DATA.nexxaEvents.find(x=>x.id===e.linkedId); if(n) n.status = e.status==='hecho' ? 'realizado' : e.status==='progreso' ? 'confirmado' : 'cotizado'; }
}

/* ============================================================
   NAVIGATION
============================================================ */
const views = ['hoy','mes','tareas','gestion','yo'];
function showView(v){
  views.forEach(x=>{ document.getElementById('view-'+x).classList.toggle('active', x===v); });
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  document.getElementById('fabAdd').style.display = (v==='gestion') ? 'none' : 'flex';
  renderAll();
}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));

document.querySelectorAll('.subtab').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    ['materias','curso','nexxa','trabajo','finanzas','personal','rutinas'].forEach(s=>{
      document.getElementById('sub-'+s).style.display = (s===b.dataset.sub)?'block':'none';
    });
    renderGestion();
  });
});

/* ============================================================
   HEADER
============================================================ */
function renderHeader(){
  const now = new Date();
  document.getElementById('greetLabel').textContent = DOW[now.getDay()].toUpperCase() + ' · ' + now.getDate() + ' ' + MONTHS[now.getMonth()].toUpperCase();
  const h = now.getHours();
  document.getElementById('dateLabel').textContent = h<12 ? 'Buenos días, Sharon' : h<19 ? 'Buenas tardes, Sharon' : 'Buenas noches, Sharon';
  const urgentesListas = (DATA.pendientes||[]).filter(p=>!p.hecho && p.urgencia==='urgente').length;
  const pendingCount = DATA.events.filter(e=>e.status!=='hecho' && e.date<=todayStr()).length + urgentesListas;
  const badge = document.getElementById('tareasBadge');
  if(pendingCount>0){ badge.style.display='flex'; badge.textContent = pendingCount>99?'99+':pendingCount; } else { badge.style.display='none'; }
}

/* ============================================================
   ITEM RENDER (genérico, usado en Hoy / Mes / Tareas)
============================================================ */
function itemHTML(e){
  const cat = CATS[e.cat];
  const isUrgent = e.status!=='hecho' && daysBetween(todayStr(), e.date)>=0 && daysBetween(todayStr(), e.date)<=2;
  let metaParts = [];
  if(e.start) metaParts.push(e.start + (e.end? '–'+e.end : ''));
  if(e.date !== todayStr()) metaParts.push(niceDateShort(e.date));
  if(e.cat==='finanzas' && e.amount) metaParts.push((e.type==='ingreso'||e.type==='prestamo_recibido' ?'+':'-') + money(e.amount));
  if(e.persona) metaParts.push('con ' + e.persona);
  return `<div class="item ${e.status==='hecho'?'done':''}" data-id="${e.id}" style="border-left-color:${cat.color}">
    <button class="status-btn ${e.status==='progreso'?'progreso':e.status==='hecho'?'hecho':''}" data-action="cyclestatus" data-id="${e.id}"></button>
    <div class="body">
      <div class="row1">
        <div class="title">${esc(e.title)}</div>
        <span class="tag" style="background:color-mix(in srgb, ${cat.color} 20%, transparent); color:${cat.color};">${cat.emoji}</span>
      </div>
      <div class="meta">${metaParts.map(m=>`<span>${esc(m)}</span>`).join('')} ${isUrgent?'<span style="color:var(--urgent); font-weight:700;">· pronto</span>':''}</div>
    </div>
  </div>`;
}
function bindItemClicks(){
  document.querySelectorAll('[data-action="cyclestatus"]').forEach(b=>{
    b.onclick = (ev)=>{
      ev.stopPropagation();
      const e = DATA.events.find(x=>x.id===b.dataset.id);
      if(!e) return;
      if(e.status==='pendiente'||!e.status) e.status='progreso';
      else if(e.status==='progreso'){
        const actual = prompt('¿Cuántos minutos reales te tomó? (opcional, Cancelar para omitir)');
        if(actual && !isNaN(actual)) e.actualMin = Number(actual);
        e.status='hecho';
      } else { e.status='pendiente'; }
      syncSourceFromEvent(e);
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('.item[data-id]').forEach(it=>{
    it.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-action="cyclestatus"]')) return;
      const e = DATA.events.find(x=>x.id===it.dataset.id);
      if(!e) return;
      if(e.linkedType){
        const map={academicTask:'Gestión → Universidad', courseTask:'Gestión → Curso', nexxaEvent:'Gestión → Nexxa', personalItem:'Gestión → Personal'};
        alert('Esto se edita desde: ' + (map[e.linkedType]||'su sección'));
        return;
      }
      openEventModal(e);
    });
  });
}

/* ============================================================
   RENDER: HOY
============================================================ */
function renderHoy(){
  const t = todayStr();
  const now = new Date();
  const classesToday = weekdayItems(now.getDay());
  const clsBox = document.getElementById('hoyClasses');
  if(classesToday.length){
    clsBox.innerHTML = `<div class="section-title">Tu rutina de hoy</div>` + classesToday.map(c=>`
      <div class="item" style="border-left-color:${c.color}; cursor:default;">
        <div class="body"><div class="row1"><div class="title">${esc(c.name)}</div><span class="tag" style="background:color-mix(in srgb, ${c.color} 20%, transparent); color:${c.color};">${esc(c.tag)}</span></div>
        <div class="meta"><span>${esc(c.start||'')}${c.end?'–'+esc(c.end):''}</span></div></div>
      </div>`).join('');
  } else { clsBox.innerHTML=''; }

  const todays = DATA.events.filter(e=>e.date===t).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
  const urgentBox = document.getElementById('hoyUrgent');
  const overdue = DATA.events.filter(e=>e.status!=='hecho' && e.date < t);
  if(overdue.length){
    urgentBox.innerHTML = `<div class="card" style="border-left-color:var(--urgent); background:var(--urgent-soft);">
      <div style="font-weight:700; font-size:13px; color:var(--urgent); margin-bottom:6px;">⚠ ${overdue.length} pendiente${overdue.length>1?'s':''} atrasado${overdue.length>1?'s':''}</div>
      ${overdue.slice(0,3).map(e=>`<div style="font-size:13px; color:var(--text-muted); margin-top:2px;">${CATS[e.cat].emoji} ${esc(e.title)} — ${niceDateShort(e.date)}</div>`).join('')}
    </div>`;
  } else { urgentBox.innerHTML=''; }

  const list = document.getElementById('hoyList');
  list.innerHTML = todays.length ? todays.map(itemHTML).join('') : `<div class="empty-card">Nada agendado para hoy. Toca + para agregar algo.</div>`;

  const upcoming = DATA.events.filter(e=>e.status!=='hecho' && e.date>t && daysBetween(t,e.date)<=14).sort((a,b)=>a.date.localeCompare(b.date));
  const up = document.getElementById('hoyUpcoming');
  up.innerHTML = upcoming.length ? upcoming.map(itemHTML).join('') : `<div class="empty-card">Sin nada próximo en 2 semanas.</div>`;

  /* (decision de Sharon) Hoy sigue siendo el día agendado, pero abajo asoma
     lo urgente de las listas para que no se le escape. */
  const urgentes = (DATA.pendientes||[]).filter(p=>!p.hecho && p.urgencia==='urgente');
  document.getElementById('hoyUrgentListas').innerHTML = urgentes.length
    ? `<div class="section-title">Urgente de tus listas</div>` + urgentes.map(p=>{
        const l = (DATA.listas||[]).find(x=>x.id===p.listaId);
        return `<div class="pend" style="border-left-color:var(--urgent)">
          <button class="status-btn" data-action="togglePend" data-pid="${p.id}"></button>
          <div class="txt">${esc(p.titulo)}</div>
          <span class="urg" data-nivel="urgente">${l?esc(l.nombre):'lista'}</span>
        </div>`;
      }).join('')
    : '';

  bindItemClicks();
  bindPendClicks();
}

/* ============================================================
   RENDER: MES
============================================================ */
let calDate = new Date();
let calSelected = null;
function renderCalendar(){
  document.getElementById('calTitle').textContent = MONTHS[calDate.getMonth()] + ' ' + calDate.getFullYear();
  const first = new Date(calDate.getFullYear(), calDate.getMonth(), 1);
  const lastDay = new Date(calDate.getFullYear(), calDate.getMonth()+1, 0).getDate();
  const startBlank = first.getDay();
  let cells = DOW_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startBlank;i++) cells += `<div class="cal-cell blank"></div>`;
  const t = todayStr();
  const cyclePreds = predictCycle();
  for(let day=1; day<=lastDay; day++){
    const d = new Date(calDate.getFullYear(), calDate.getMonth(), day);
    const ds = fmtDate(d);
    const dayEvents = DATA.events.filter(e=>e.date===ds);
    const wdItems = weekdayItems(d.getDay());
    let dotColors = [...new Set(dayEvents.map(e=>CATS[e.cat].color))];
    wdItems.forEach(it=>{ if(!dotColors.includes(it.color)) dotColors.push(it.color); });
    dotColors = dotColors.slice(0,3);
    const isCycleLog = DATA.cycle.starts.some(s=>{ const diff = daysBetween(s, ds); return diff>=0 && diff < DATA.cycle.periodLen; });
    const isPredicted = cyclePreds.some(p=> ds>=p.start && ds<=p.end);
    let cls = 'cal-cell';
    if(ds===t) cls+=' today';
    if(ds===calSelected) cls+=' selected';
    if(isCycleLog) cls+=' ciclo-log'; else if(isPredicted) cls+=' ciclo-range';
    cells += `<div class="${cls}" data-date="${ds}"><span>${day}</span><div class="dots">${dotColors.map(c=>`<span style="background:${c}"></span>`).join('')}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML = cells;
  document.querySelectorAll('.cal-cell:not(.blank)').forEach(c=>{ c.onclick = ()=>{ calSelected = c.dataset.date; renderCalendar(); renderCalDayList(); }; });
  if(!calSelected) calSelected = t;
  renderCalDayList();
}
function renderCalDayList(){
  const box = document.getElementById('calDayList');
  if(!calSelected){ box.innerHTML=''; return; }
  const ds = calSelected;
  const dayEvents = DATA.events.filter(e=>e.date===ds).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
  const d = parseDate(ds);
  const wdItems = weekdayItems(d.getDay());
  box.innerHTML = `<div class="section-title">${niceDate(ds)}</div>` +
    (wdItems.map(it=>`<div class="item" style="border-left-color:${it.color}; cursor:default;"><div class="body"><div class="title">${esc(it.name)}</div><div class="meta"><span>${esc(it.start||'')}${it.end?'–'+esc(it.end):''} · ${esc(it.tag)}</span></div></div></div>`).join('')) +
    (dayEvents.length ? dayEvents.map(itemHTML).join('') : (wdItems.length?'':'<div class="empty-card">Sin nada este día.</div>'));

}

/* ============================================================
   CYCLE
============================================================ */
function computeAvgCycle(){
  const starts = [...DATA.cycle.starts].sort();
  if(starts.length<2) return DATA.cycle.avgLen || 28;
  let diffs=[]; for(let i=1;i<starts.length;i++) diffs.push(daysBetween(starts[i-1], starts[i]));
  diffs = diffs.slice(-6);
  return Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);
}
function predictCycle(){
  const starts = [...DATA.cycle.starts].sort();
  if(!starts.length) return [];
  const avg = computeAvgCycle(); const plen = DATA.cycle.periodLen || 5;
  let cursor = parseDate(starts[starts.length-1]); let preds=[];
  for(let i=0;i<4;i++){ cursor = addDays(cursor, avg); preds.push({start:fmtDate(cursor), end:fmtDate(addDays(cursor, plen-1))}); }
  return preds;
}

/* ============================================================
   LISTAS DE PENDIENTES
   Decision de Sharon (14 sep 2026): lo que se agrega acá NO es "para hoy".
   Se queda en su lista, sin fecha, hasta que ella lo marque; si lo quiere
   en un día concreto se lo pone a mano y recién ahí pasa a la agenda.
============================================================ */
const URGENCIAS = ['normal','importante','urgente'];
const URG_ORDEN = { urgente:0, importante:1, normal:2 };
const URG_COLOR = { normal:'var(--text-dim)', importante:'var(--accent)', urgente:'var(--urgent)' };
const COLORES_LISTA = ['var(--c-uni)','var(--c-nexxa)','var(--c-ads)','var(--c-work)','var(--c-fin)','var(--c-ciclo)','var(--c-personal)'];
/* Tres para arrancar, con los ejemplos que ella misma dio. Puede renombrarlas. */
const LISTAS_SEMILLA = [
  { nombre:'Universidad', color:'var(--c-uni)' },
  { nombre:'Aseo', color:'var(--c-work)' },
  { nombre:'Compras', color:'var(--c-fin)' },
];
let listaActiva = null;

function asegurarListas(){
  if(!Array.isArray(DATA.listas)) DATA.listas = [];
  if(!Array.isArray(DATA.pendientes)) DATA.pendientes = [];
  if(!DATA.listas.length){
    LISTAS_SEMILLA.forEach(l=> DATA.listas.push({ id:uid(), nombre:l.nombre, color:l.color }));
    saveData();
  }
  if(!listaActiva || !DATA.listas.some(l=>l.id===listaActiva)) listaActiva = DATA.listas[0].id;
}
function chipColor(color){ return `--chip-color:${color}; --chip-color-soft:color-mix(in srgb, ${color} 16%, transparent);`; }
function pendientesDe(listaId){
  return DATA.pendientes.filter(p=>p.listaId===listaId).sort((a,b)=>
    (a.hecho?1:0)-(b.hecho?1:0) ||
    URG_ORDEN[a.urgencia||'normal']-URG_ORDEN[b.urgencia||'normal'] ||
    (a.creado||'').localeCompare(b.creado||''));
}
function pendienteHTML(p, color){
  const urg = p.urgencia || 'normal';
  return `<div class="pend ${p.hecho?'hecho':''}" style="border-left-color:${p.hecho?'var(--border)':color}">
    <button class="status-btn ${p.hecho?'hecho':''}" data-action="togglePend" data-pid="${p.id}"></button>
    <div class="txt" data-action="editPend" data-pid="${p.id}">${esc(p.titulo)}</div>
    <button class="urg" data-nivel="${urg}" data-action="cicloUrg" data-pid="${p.id}" title="Tocar para cambiar la urgencia">${urg}</button>
  </div>`;
}

function renderListas(){
  asegurarListas();
  document.getElementById('listaChips').innerHTML =
    DATA.listas.map(l=>`<div class="chip ${l.id===listaActiva?'active':''}" data-action="activarLista" data-lista="${l.id}" style="${chipColor(l.color)}">${esc(l.nombre)}</div>`).join('') +
    `<div class="chip" data-action="nuevaLista">+ Lista</div>`;

  document.getElementById('listasBody').innerHTML = DATA.listas.map(l=>{
    const items = pendientesDe(l.id);
    const faltan = items.filter(p=>!p.hecho).length;
    const hechas = items.length - faltan;
    return `<div class="lista-head">
        <span class="nombre"><span class="punto" style="background:${l.color}"></span>${esc(l.nombre)}<span style="color:var(--text-dim); font-weight:500;">· ${faltan}</span></span>
        <span class="acciones">
          ${hechas ? `<button class="small-btn" data-action="limpiarLista" data-lista="${l.id}">Limpiar ${hechas} hecha${hechas>1?'s':''}</button>` : ''}
          <button class="small-btn" data-action="editarLista" data-lista="${l.id}">✎</button>
        </span>
      </div>` +
      (items.length ? items.map(p=>pendienteHTML(p, l.color)).join('')
                    : `<div class="empty-card" style="padding:14px;">Nada acá. Escribí arriba para agregar.</div>`);
  }).join('');

  bindPendClicks();
}

function bindPendClicks(){
  document.querySelectorAll('[data-action="activarLista"]').forEach(c=>{
    c.onclick = ()=>{ listaActiva = c.dataset.lista; renderListas(); document.getElementById('pendienteInput').focus(); };
  });
  document.querySelectorAll('[data-action="nuevaLista"]').forEach(c=>{ c.onclick = ()=>openListaModal(null); });
  document.querySelectorAll('[data-action="editarLista"]').forEach(b=>{
    b.onclick = ()=>openListaModal(DATA.listas.find(l=>l.id===b.dataset.lista));
  });
  document.querySelectorAll('[data-action="limpiarLista"]').forEach(b=>{
    b.onclick = ()=>{
      DATA.pendientes = DATA.pendientes.filter(p=>!(p.listaId===b.dataset.lista && p.hecho));
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('[data-action="togglePend"]').forEach(b=>{
    b.onclick = ()=>{
      const p = DATA.pendientes.find(x=>x.id===b.dataset.pid);
      if(!p) return;
      p.hecho = !p.hecho;
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('[data-action="cicloUrg"]').forEach(b=>{
    b.onclick = ()=>{
      const p = DATA.pendientes.find(x=>x.id===b.dataset.pid);
      if(!p) return;
      p.urgencia = URGENCIAS[(URGENCIAS.indexOf(p.urgencia||'normal') + 1) % URGENCIAS.length];
      saveData(); renderAll();
    };
  });
  document.querySelectorAll('[data-action="editPend"]').forEach(t=>{
    t.onclick = ()=>{
      const p = DATA.pendientes.find(x=>x.id===t.dataset.pid);
      if(p) openPendienteModal(p);
    };
  });
}

/* Crear, renombrar o borrar una lista. */
function openListaModal(lista){
  const esNueva = !lista;
  const actual = lista || { nombre:'', color:COLORES_LISTA[DATA.listas.length % COLORES_LISTA.length] };
  openSheet(`<h3>${esNueva?'Nueva lista':'Editar lista'}</h3>
    <div class="field"><label>Nombre</label><input type="text" id="f_lnombre" value="${esc(actual.nombre)}" placeholder="Ej: Compras, Aseo, U de mañana"></div>

      ${COLORES_LISTA.map(c=>`<div class="chip ${c===actual.color?'active':''}" data-color="${c}" style="${chipColor(c)}"><span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${c}; vertical-align:-1px;"></span></div>`).join('')}
    </div></div>
    <div class="sheet-actions">
      ${esNueva?'':`<button class="btn btn-danger" id="delLista">Eliminar lista</button>`}
      <button class="btn btn-primary" id="saveLista">Guardar</button>
    </div>`);
  let lcolor = actual.color;
  document.querySelectorAll('#chipsColor .chip').forEach(c=>{
    c.onclick = ()=>{ document.querySelectorAll('#chipsColor .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); lcolor = c.dataset.color; };
  });
  const btnDel = document.getElementById('delLista');
  if(btnDel) btnDel.onclick = ()=>{
    const cuantos = DATA.pendientes.filter(x=>x.listaId===lista.id).length;
    if(cuantos && !confirm(`La lista tiene ${cuantos} cosa${cuantos>1?'s':''} adentro. ¿Borrar la lista y todo lo que tiene?`)) return;
    DATA.pendientes = DATA.pendientes.filter(x=>x.listaId!==lista.id);
    DATA.listas = DATA.listas.filter(x=>x.id!==lista.id);
    if(listaActiva===lista.id) listaActiva = null;
    saveData(); closeSheet(); renderAll();
  };
  document.getElementById('saveLista').onclick = ()=>{
    const nombre = document.getElementById('f_lnombre').value.trim();
    if(!nombre){ alert('Ponele un nombre a la lista'); return; }
    if(esNueva){
      const nueva = { id:uid(), nombre, color:lcolor };
      DATA.listas.push(nueva);
      listaActiva = nueva.id;
    }else{
      lista.nombre = nombre; lista.color = lcolor;
    }
    saveData(); closeSheet(); renderAll();
  };
}

/* ---- Trabajo ---- */
function clientOwed(c){
  const sessions = DATA.workSessions.filter(s=>s.clientId===c.id);
  if(c.payType==='hora'){ const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0); return {qty:h, unit:'h', amount:h*Number(c.rate||0)}; }
  if(c.payType==='salario_min'){
    const hourly = Number(c.baseSalario||1750000)/240;
    let total=0, h=0;
    sessions.forEach(s=>{
      const horas=Number(s.horas||0); h+=horas;
      let mult=1;
      if(s.domingo) mult += Number(c.recargoDominical||75)/100;
      if(s.noche) mult += Number(c.recargoNocturno||35)/100;
      total += horas*hourly*mult;
    });
    return {qty:h, unit:'h', amount:total};
  }
  if(c.payType==='dia'){ const d = sessions.reduce((a,s)=>a+Number(s.dias||0),0); return {qty:d, unit:'días', amount:d*Number(c.rate||0)}; }
  const h = sessions.reduce((a,s)=>a+Number(s.horas||0),0);
  return {qty:h, unit:'h', amount:Number(c.rate||0)};
}
const PAYTYPE_LABEL = {hora:'Por hora', salario_min:'Salario mínimo por horas', dia:'Por día', proyecto:'Por proyecto', fijo:'Fijo'};
function renderTrabajo(){
  const box = document.getElementById('sub-trabajo');
  const clients = DATA.workClients;
  box.innerHTML = (clients.length ? clients.map(c=>{
    const o = clientOwed(c);
    const sessions = DATA.workSessions.filter(s=>s.clientId===c.id);
    let rateInfo = c.payType==='salario_min' ? `Base ${money(c.baseSalario||1750000)} + aux ${money(c.auxTransporte||250000)} · dom/fest +${c.recargoDominical||75}% · nocturno +${c.recargoNocturno||35}%` : c.payType==='hora' ? money(c.rate)+' /hora' : c.payType==='dia' ? money(c.rate)+' /día' : PAYTYPE_LABEL[c.payType]+' — '+money(c.rate);
    return `<div class="client-card" data-id="${c.id}">
      <div class="head"><div><div class="name">${esc(c.name)}</div><div class="rate">${esc(rateInfo)}</div></div><button class="small-btn" data-action="logSession" data-id="${c.id}">+ Registrar</button></div>
      <div class="stats">
        <div class="stat"><b>${o.qty}${o.unit}</b><span>${o.unit==='h'?'trabajadas':'trabajados'}</span></div>
        <div class="stat"><b>${money(o.amount)}</b><span>generado</span></div>
        <div class="stat"><b>${sessions.length}</b><span>registros</span></div>
      </div>
      <button class="small-btn" data-action="delClient" data-id="${c.id}" style="margin-top:10px; color:var(--urgent);">Eliminar cliente</button>
    </div>`;
  }).join('') : '<div class="empty-card">Aún no registras clientes o empresas.</div>') +
  `<button class="btn btn-primary" style="width:100%; margin-top:6px;" id="addClientBtn">+ Agregar cliente/empresa</button>`;
  document.getElementById('addClientBtn').onclick = openClientModal;
  box.querySelectorAll('[data-action="logSession"]').forEach(b=>{ b.onclick=()=>openSessionModal(b.dataset.id); });
  box.querySelectorAll('[data-action="delClient"]').forEach(b=>{ b.onclick=()=>{ DATA.workClients = DATA.workClients.filter(x=>x.id!==b.dataset.id); DATA.workSessions = DATA.workSessions.filter(x=>x.clientId!==b.dataset.id); saveData(); renderTrabajo(); }; });
}

  html += `<div class="section-title">Compras a cuotas</div>`;
  if(DATA.installments.length){
    html += DATA.installments.map(inst=>{
      const paid = inst.payments.reduce((a,p)=>a+Number(p.amount),0);

function renderYo(){
  const box = document.getElementById('cycleBox');
  const starts = [...DATA.cycle.starts].sort();
  if(!starts.length){
    box.innerHTML = `<div class="empty-card">Aún no registras tu ciclo. <br><button class="btn btn-primary" style="margin-top:10px;" id="setupCycleBtn">Configurar ciclo</button></div>`;
    document.getElementById('setupCycleBtn').onclick = openCycleSetup;
  } else {
    const last = starts[starts.length-1]; const avg = computeAvgCycle();
    const nextStart = fmtDate(addDays(parseDate(last), avg));
    const diff = daysBetween(todayStr(), nextStart);
    const inPeriodNow = daysBetween(last, todayStr()) < (DATA.cycle.periodLen||5) && daysBetween(last, todayStr())>=0;
    box.innerHTML = `<div class="cycle-hero">
        <div class="big">${inPeriodNow ? 'En curso' : (diff>=0 ? 'En ' + diff + ' días' : 'Atrasado ' + Math.abs(diff) + ' días')}</div>
        <div class="sub">${inPeriodNow ? 'Tu período está activo' : 'Próximo período estimado: ' + niceDate(nextStart)}</div>
        <div class="ring-row">
          <div class="ring-box"><b>${avg}</b><span>días de ciclo</span></div>
          <div class="ring-box"><b>${esc(DATA.cycle.periodLen)}</b><span>días de duración</span></div>
          <div class="ring-box"><b>${starts.length}</b><span>registrados</span></div>
        </div>
      </div>
      <div style="display:flex; gap:10px;"><button class="btn btn-primary" id="logPeriodBtn">Registrar inicio hoy</button><button class="btn btn-ghost" id="editCycleBtn">Ajustar</button></div>`;
    document.getElementById('logPeriodBtn').onclick = ()=>{ if(!DATA.cycle.starts.includes(todayStr())){ DATA.cycle.starts.push(todayStr()); saveData(); renderAll(); } };
    document.getElementById('editCycleBtn').onclick = openCycleSetup;
  }
  const now = new Date();
  const weekStart = addDays(now, -now.getDay());
  const weekDates = [...Array(7)].map((_,i)=>fmtDate(addDays(weekStart,i)));
  const weekEvents = DATA.events.filter(e=>weekDates.includes(e.date) && e.status==='hecho' && e.actualMin);
  const byCat = {}; weekEvents.forEach(e=>{ byCat[e.cat] = (byCat[e.cat]||0) + Number(e.actualMin); });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxMin = Math.max(1, ...catEntries.map(c=>c[1]));
  const tsBox = document.getElementById('timeSummary');
  if(catEntries.length){
    tsBox.innerHTML = `<div class="bar-chart">${catEntries.map(([cat,min])=>`<div class="bar-col"><div class="bar" style="height:${Math.max(6,(min/maxMin)*95)}px; background:${CATS[cat].color}"></div><div class="lbl">${CATS[cat].emoji}</div></div>`).join('')}</div>
    <div style="margin-top:12px; font-size:13px; color:var(--text-muted);">Total registrado: <b style="color:var(--text)">${Math.round(weekEvents.reduce((a,e)=>a+Number(e.actualMin),0)/60*10)/10}h</b> esta semana</div>`;
  } else {
    tsBox.innerHTML = `<div style="font-size:13px; color:var(--text-dim); text-align:center; padding:10px 0;">Marca cosas como "hechas" y registra minutos (o usa "Registrar tiempo" en Personal) para ver aquí en qué se te va el tiempo.</div>`;
  }
  const insightsBox = document.getElementById('insights');
  let insights = [];
  if(catEntries.length){ const top = CATS[catEntries[0][0]]; insights.push(`<div class="insight"><div class="ico">${top.emoji}</div><div class="txt">Esta semana, la mayoría de tu tiempo se fue en <b>${top.label}</b>.</div></div>`); }
  const overEst = DATA.events.filter(e=>e.status==='hecho' && e.estMin && e.actualMin && e.actualMin > e.estMin*1.3);
  if(overEst.length){ insights.push(`<div class="insight"><div class="ico">⏱</div><div class="txt">Sueles subestimar tareas de <b>${CATS[overEst[overEst.length-1].cat].label}</b> — tomaron más tiempo del planeado.</div></div>`); }
  const overdueCount = DATA.events.filter(e=>e.status!=='hecho' && e.date<todayStr()).length;
  if(overdueCount>0){ insights.push(`<div class="insight"><div class="ico">📌</div><div class="txt">Tienes <b>${overdueCount}</b> pendiente${overdueCount>1?'s':''} atrasado${overdueCount>1?'s':''}. Revísalos en Tareas.</div></div>`); }
  insightsBox.innerHTML = insights.length ? insights.join('') : '<div class="empty-card">Aún no hay suficientes datos para mostrar patrones.</div>';
}

    <div class="field-row"><div class="field"><label>Duración del ciclo (días)</label><input type="number" id="f_cyclen" value="${esc(DATA.cycle.avgLen||28)}"></div><div class="field"><label>Duración del período (días)</label><input type="number" id="f_perlen" value="${esc(DATA.cycle.periodLen||5)}"></div></div>

<script>
/* Le pide al navegador que no borre lo guardado si el telefono se queda sin
   espacio. Instalada, Chrome suele conceder esto sin preguntar nada. */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted()
    .then((ya) => (ya ? true : navigator.storage.persist()))
    .catch(() => {});
}

/* Guarda la app en el telefono para que abra sin internet (ver sw.js).
   Si mientras tanto se publico una version nueva, se recarga sola una vez. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const habiaControlador = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (habiaControlador && !window.__recargando) {
        window.__recargando = true;
        window.location.reload();
      }
    });
  });
}
</script>
